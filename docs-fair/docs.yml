  - title: 5. How to get your repository FAIR certified?
    id: how-to
    descriptionAbout: >
      The sections below describe how to apply, the administrative fee, how the
      assessment works, which repositories can apply, what you receive, and how
      to upgrade your certificate.
    images: null
    subTitle: null
    subDescription: null
    divider: true
  - title: 5.1. How to apply?
    id: how-to-apply
    descriptionAbout: >
      1. **Apply for FAIR certification.** Register your interest on the website
      or apply for FAIR Certification via your CORE Dashboard account (FAIR
      certification tab).

      2. **Arrange payment.** See the administrative fee table below.

      3. **Submit the form.** CORE will run automated checks for your repository and produce a report containing results and recommendations against the certification criteria. Review the recommendations, complete the report and submit when ready.

      4. **CORE team assesses the submission.** We will evaluate your repository and inform you if you qualify for the certificate. In case you don’t qualify yet, we will offer technical advice on how to satisfy the requirements. You are free to resubmit your application as many times as needed during a 365 days period.

      5. **Get your FAIR certificate.** Once your repository gets FAIR certification you will get your certificate via email and your organisation will appear in the FAIR certified repositories list. You can now display your certificate in your repository. A CORE FAIR Repository Certificate remains valid for 3 years.
    images: null
    subTitle: null
    subDescription: null
  - title: 5.2. Administrative fee
    id: administrative-fee
    descriptionAbout: The administrative fee for FAIR Repository Certification
      varies based on the repository's size and country of origin. This
      certification is included with Sustaining Membership, and Supporting
      Members are eligible for a 50% discount. Supporting Members pay 50% of the
      fee for their band and country group.
    images: null
    subTitle: null
    subDescription: null
  - title: 5.3. Assessment Methodology and Timeline
    id: assessment
    descriptionAbout: >
      The FAIR Repository Certification process is a comprehensive, multi-stage
      evaluation typically completed within one year. The timeline is flexible,
      accommodating the time required for repository managers to implement
      improvements and for CORE to reindex content.


      **Assessment timeline**


      * **Submission and initial review.** Upon submission, the CORE team conducts a primary review, typically providing feedback within 3–5 weeks.

      * **Improvement phase.** Following feedback, repository managers implement necessary technical or policy adjustments. This usually takes between 1 month and 6 months.

      * **Reindexing and final verification.** Once improvements are integrated, CORE reindexes the repository to verify compliance. This usually takes 3–5 weeks, and the total duration often depends on the repository's size and the scale of required adjustments.


      **Methodology**


      Our certification employs a hybrid assessment model to ensure a robust evaluation of FAIR principles:


      1. **Data-driven assessment (80%).** This data-driven component utilizes automated scripts to evaluate infrastructure and metadata practices. It objectively verifies critical criteria such as identifier persistence, metadata richness, and licence adherence, ensuring high-speed, consistent, and scalable screening.

      2. **Qualitative review (20%).** This stage involves the manual assessment of open-ended responses addressing areas requiring human context, including:
         * Governance and long-term preservation strategies.
         * Community engagement and ethical considerations.
         * Institutional policies supporting technical implementations.

      This combined methodology ensures that the certification process is both efficient and deeply reflective of the repository's actual commitment to the principles of good data stewardship, leading to a comprehensive and authoritative certification outcome.
    images: null
    subTitle: null
    subDescription: null
  - title: 5.4. Eligible repositories
    id: eligible-repositories
    descriptionAbout: >
      The CORE FAIR Certification programme is primarily designed for
      publication repositories. However, its flexible framework can also be
      applied to data repositories looking to evidence their FAIR maturity.
    images: null
    subTitle: null
    subDescription: null
  - title: 5.5. Certification Deliverables
    id: deliverables
    descriptionAbout: >
      Upon successful completion of the FAIR certification process, your
      repository will receive the following assets to showcase your commitment
      to open science:


      * **Official PDF certificate.** A high-resolution, verifiable digital certificate confirming your repository's FAIR compliance level (Bronze, Silver, or Gold). Each certificate includes a unique, persistent link to CORE, ensuring authenticity and providing external verification for researchers, funders, and other stakeholders.

      * **Comprehensive assessment report.** A detailed, downloadable PDF report that synthesizes your repository’s performance. This report outlines your current FAIR maturity score, identifies specific strengths, and provides actionable, data-driven recommendations to guide your future improvements.

      * **Verified FAIR status badge.** A high-quality “FAIR Certified” web badge that can be embedded directly onto your repository’s homepage. This acts as an immediate trust signal, clearly communicating your dedication to high-quality data stewardship and standardized FAIR practices to your users.
    images: null
    subTitle: null
    subDescription: null
  - title: 5.6. Upgrading your certification
    id: upgrading
    descriptionAbout: >
      Repositories can advance their FAIR maturity over time. If you wish to
      upgrade your existing certification level (for example, from Bronze to
      Silver, or Silver to Gold):


      * **Process.** You must resubmit your application via the CORE Dashboard.

      * **Free upgrade window.** Holders of current Bronze or Silver certificates are eligible for a free-of-charge upgrade if applied for and completed within one year of their original application date.

      * **Standard fees.** After this one-year period, any request to upgrade your certification level will be subject to the standard administrative fees associated with your repository’s band and income level.
    images: null
    subTitle: null
    subDescription: null

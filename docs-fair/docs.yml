  - title: 4.2. Requirements guidance
    id: requirements-guidance
    descriptionAbout: >
      **1. Findable**


      **R(1.1) Does your repository support OAI-PMH? (DD)**


      **Description**


      The Open Archives Initiative Protocol for Metadata Harvesting (referred to as the OAI-PMH in the remainder of this document) provides an application-independent interoperability framework based on metadata harvesting. This provides the basic building block to provide an interoperable digital publications repository.


      **Recommendations**


      OAI-PMH is the most widely used protocol for exchanging information between repositories. It is the standard used by CERN, by arXiv, by Wikipedia, by repository software tools such as DSpace and ePrints, and by CORE. It reduces network traffic because it can do incremental harvesting.


      Repository managers can check their OAI-PMH endpoint using the [OAI-PMH Validator](https://www.openarchives.org/Register/ValidateSite) tool. A valid OAI-PMH endpoint is not enough, the endpoint also needs to be accessible for machines. You can use the [Repository Indexability Diagnostics](https://core.ac.uk/blocking-diagnostic) tool to quickly check your accessibility level.


      **Compliance criteria**


      * **Bronze:** Yes

      * **Silver:** Yes

      * **Gold:** Yes


      **R(1.2) Does your repository metadata support a widely used Application Profile? (DD)**


      **Description**


      An application profile is a set of policies and metadata guidelines for describing scholarly documents. Examples include Dublin Core, OpenAIRE Guidelines and RIOXX. However, these application profiles are not equally detailed.


      Ensuring the usage of a well-known application profile means that the metadata of the publication is described in a less ambiguous and more accurate way. Most used publications profiles are the OpenAIRE Guidelines 3.0+ and the RIOXX metadata application profile.


      Apart from matching an application profile, it is also important that your content supports at least the minimal set of metadata to give it the rights to be a scholarly record. We define the minimal set as title, abstract, authors, publication year (or year of first visibility). This list is in no way complete but it helps us establish a minimal compliance of your records.


      **Recommendations**


      CORE metadata indexing requires Dublin Core as a minimum; it supports OpenAIRE Guidelines; and it recommends RIOXX version 3. CORE recommends that repositories use [RIOXX v3](https://rioxx.net/profiles/v3-0-final/), which we consider to be the most suitable metadata application profile for describing scholarly research outputs. Rioxx: The Research Outputs Metadata Schema was developed for institutional repositories to share metadata about the scholarly resources they contain.


      Information about how to comply with metadata recommendations is provided in the [CORE Data Provider’s Guide](https://core.ac.uk/documentation/data-providers-guide#meta-configuration).


      **Compliance criteria**


      * **Bronze:** Yes, (80%) Minimal set of metadata available: title, authors, abstracts, publication date, link.

      * **Silver:** Yes, (80%) As bronze criteria, plus supporting an advanced metadata profile and having partial compliance.

      * **Gold:** Yes, (50%) As silver plus and complete compliance with the metadata profile.


      **R(1.3) How many metadata records are there in your repository? (DD)**


      **Description**


      It is not always easy to extract this information from your repository platform, so some estimation is good to enable us to compare what we see in the public to your expectations. We compare your number with the number of records CORE is able to index from your repository. If this number doesn't match your records it might mean you have issues in exposing your records in an interoperable way.


      **Recommendations**


      The Indexing status tab provides a summary of any issue CORE finds while indexing your repository. A common issue is when institutions have more than one repository. CORE identifies some but not all of the repositories, which means the total number it identifies is less than the total in the repositories.


      **Compliance criteria**


      * **Bronze:** Yes, (90%+ of all metadata)

      * **Silver:** Yes, (95%+ of all metadata)

      * **Gold:** Yes, (100% of all metadata)


      **2. Accessible**


      **R(2.1) Do you provide access to full texts of research papers for your content? (DD)**


      **Description**


      The number of full text CORE is able to discover from your digital repository.


      **Recommendations**


      You can check the Indexing tab where we collect issues CORE discovered while indexing your repository. If this number doesn't match your records it might mean you have issues in exposing your records in an interoperable way. The Indexing status tab provides a summary of any issue CORE finds while indexing your repository. CORE requires that full text must be hosted on the same domain or subdomains as the OAI-PMH endpoint, unless we are informed by the institution about other owned domains containing full text.


      Also, we highly recommend checking your repository for compliance with the [CORE Data Provider’s Guide](https://core.ac.uk/documentation/data-providers-guide) requirements, where you will find detailed information about how to configure your repository so it can be indexed to the maximum effect to get more accurate results in the CORE dashboard and to enhance visibility and interoperability beyond CORE.


      **Compliance criteria**


      * **Bronze:** Yes (repository is configured to expose full texts; we have at least, for example, 1% full texts indexed)

      * **Silver:** Yes (>25% of represented manuscripts have full texts)

      * **Gold:** Yes (>50% of represented manuscripts have full texts)


      **R(2.2) Do you label embargoed documents in a machine-readable way? (DD)**


      **Description**


      Embargoed documents are articles that can only be made available open access after a stated interval, such as 90 days or six months. These delays are best managed when the embargo is tagged in a machine-readable way to ensure that machines can access and understand the policy.


      **Recommendations**


      There are various supported ways of tagging an embargo document. CORE recognises only a few of them. The [Rioxx specification](https://rioxx.net/profiles/v3-0-final/) recommends that they are tagged using “HTTP status 451 Unavailable For Legal Reasons”. If this number doesn't match the one in your records please review your system.


      Another common case is reporting 401 when a record is not available. We recognise both of these cases to be valid.


      Many platforms report embargoed documents through a redirect to a login page or external links. These solutions, although effective for humans, are extremely difficult to catch for a machine, and we recommend against it.


      **Compliance criteria**


      * **Bronze:** No

      * **Silver:** No

      * **Gold:** Yes


      **R(2.3) Do you support machine-readable licensing? (DD)**


      **Description**


      This requirement assesses whether licensing information is provided in a machine-readable format, such as a standardized licence URL that software can automatically recognize and interpret.


      **Recommendations**


      Licensing and copyright information may be displayed in a machine-readable way or by a text description. However, text descriptions such as “all rights reserved” may not be specific enough for other users to interpret. Much better is to provide a URL to the relevant Creative Commons licence, for example, for the non-commercial CC-BY licence, [https://creativecommons.org/licenses/by-nc/4.0/](https://creativecommons.org/licenses/by-nc/4.0/). By clicking on this link, a human can see the precise meaning of this licence. Any machine can identify immediately and unambiguously what kind of licence is stated.


      CORE promotes and advocates for the use of machine-readable licencing descriptions. In particular, we advise the use of the [NISO Access License and Indicators (ALI) Schema](https://www.niso-sts.org/TagLibrary/niso-sts-TL-1-0-html/element/ali-license_ref.html).


      Institutions may have a blanket policy that covers all content with a specific publisher, which usually means that individual documents contain no licensing information. However, a specific CC-BY licence enables exceptions to be made for individual documents and reduces ambiguity.


      The CORE Rights Retention Statement tracker identifies with reasonable accuracy any specific licence conditions that are stated within an article or text file.


      **Compliance criteria**


      * **Bronze:** No

      * **Silver:** Yes (you have it for 25% of your manuscript metadata records)

      * **Gold:** Yes (you have it for 50% of your manuscript metadata records)


      **R(2.4) Do you support any tool for tracking COUNTER-compliant downloads in your system? (DD)**


      **Description**


      Tools for tracking COUNTER-compliant downloads allow you to demonstrate the value and impact of your institutional repository (IR) by enabling institutional repositories to share and compare usage statistics based on the COUNTER standard.


      **Recommendations**


      By using a standard set of statistics, it becomes possible to provide meaningful stats to compare downloads across several repositories.


      **Compliance criteria**


      * **Bronze:** No

      * **Silver:** No

      * **Gold:** Yes


      **3. Interoperable**


      **R(3.1) Do you support FAIR Signposting to signpost full text and other related resources from article landing pages? (DD)**


      **Description**


      FAIR Signposting is a technical approach designed to enhance the discoverability and interoperability of scholarly resources on the web. It involves using standardized HTTP link relations to expose key information about web resources, particularly in the context of scholarly communication. This approach aligns with the broader FAIR principles, which aim for data to be Findable, Accessible, Interoperable and Reusable.


      **Recommendations**


      FAIR signposting can be done by adding information to HTTP headers. Specifically, the HTTP header can contain an element to describe the type of content resource, for example, “author”, or “collection”. Find more information in the [CORE Data Provider’s Guide](https://core.ac.uk/documentation/data-providers-guide#fair-signposting).


      **Compliance criteria**


      * **Bronze:** No

      * **Silver:** No

      * **Gold:** Yes


      **R(3.2) Do your metadata use COAR vocabularies? (DD)**


      **Description**


      COAR (Confederation of Open Access Repositories) vocabularies are structured sets of terms organized to provide a common framework for the sharing and integration of data across different systems. They comprise three types: Access rights, resource types and version types.


      **Recommendations**


      A metadata profile such as RIOXX can provide an easy way to share and use COAR vocabularies in your metadata.


      * **Access rights:** describe the access status of a resource, such as “embargoed access” or “restricted access”.

      * **Resource type:** describe the type of resource, such as “patent”, “bibliography” or “conference presentation”.

      * **Version type:** distinguish the various states of an academic article, including the version of record (VOR), the Author’s Original (AO) and the Author’s Accepted Manuscript (AM).


      **Compliance criteria**


      * **Bronze:** No

      * **Silver:** Yes. Repository supports at least the COAR types vocabularies for Resource Types (more than 10%). Vocabularies for Access Rights (COAR or info:repo recommended) and JAV are also recommended but not required (we can still test for that presence).

      * **Gold:** Yes


      **R(3.3) Does your repository support persistent management of records? (DD)**


      **Description**


      A repository with persistent management ensures that metadata and content are not lost, that links remain valid and that researchers can reliably cite and access resources over time.


      **Recommendations**


      It is recommended that the repository implements a recognized system for persistent identifiers like DOI or ROR. Clear policies should be in place for record versioning, updates and withdrawal, ensuring transparency and trustworthiness. Documentation of these policies should be openly available to users.


      **Compliance criteria**


      * **Bronze:** No

      * **Silver:** Yes

      * **Gold:** Yes


      **R(3.4) Is your repository configured for the OAI resolver and does it work? (DD)**


      **Description**


      An OAI (Open Archives Initiative) identifier is a unique identifier of a metadata record. CORE can resolve any OAI identifier directly to your repository page.


      **Recommendations**


      To register your OAI mapping, navigate to the Settings tab in the CORE Dashboard. To route directly to the repository, it is necessary to provide mapping in the CORE Repository page between the OAI prefix of a repository and the currently used URL for the repository metadata record display page. The redirection will change instantly. More information about the OAI resolver and its configuration can be found in the:


      * [CORE Data Provider’s Guide: OAI identifiers](https://core.ac.uk/documentation/data-providers-guide#oai-identifier)

      * [Membership documentation: Get your OAI identifiers resolved to your repository](https://core.ac.uk/documentation/membership-documentation#OAI-identifiers)

      * [OAI Identifier documentation](https://core.ac.uk/documentation/oai-resolver)


      **Compliance criteria**


      * **Bronze:** Yes

      * **Silver:** Yes

      * **Gold:** Yes


      **R(3.5) Persistable identifiers (DD)**


      **Description**


      Does your repository support identifiers for your content that can be made persistent, such as ARKs or DOIs, etc? Persistent identifiers (PIDs) are essential for the long-term discoverability and citability of research. They provide a stable, unique, and permanent link to digital objects, ensuring that even if the underlying storage location changes, the resource remains accessible.


      **Recommendations**


      Ensure that your repository assigns and exposes persistent identifiers (PIDs) for all content objects, such as DOIs or ARKs.


      To enrich your metadata with more DOIs, you can go to the DOI tab. It provides a checklist of the number of content objects in your repository which have a DOI. It also identifies (and counts) the number of DOIs that it finds from articles held in other repositories relating to research in your institution.


      **Compliance criteria**


      * **Bronze:** Yes

      * **Silver:** Yes (75% of content from last year has an identifier)

      * **Gold:** Yes (75% of content from last year has an identifier)


      **R(3.6) Does your repository metadata contain ORCID identifiers? (DD)**


      **Description**


      ORCID (Open Researcher and Contributor Identifier) is a non-proprietary alphanumeric code that uniquely identifies scientific authors. ORCID is an essential metadata tool that enables researchers to claim credit for their own research, without ambiguity. For example, there are many researchers with the common name “John Smith” or “Zhang Wei”. ORCID enables these names to be disambiguated.


      **Recommendations**


      The repository should support integration with ORCID IDs in its metadata schema. Metadata records should expose ORCID identifiers in a standardised way using DataCite or Dublin Core fields. If possible, the repository should support ORCID authentication during deposit, allowing researchers to connect their ORCID profile directly and authorise the repository to update their ORCID record with new works.


      The CORE ORCID dashboard tab enables repository managers both to identify missing ORCID IDs, and to enrich their data with ORCID IDs found from elsewhere. Find more information in the [ORCID membership documentation](https://core.ac.uk/documentation/membership-documentation#orcid).


      **Compliance criteria**


      * **Bronze:** Yes

      * **Silver:** Yes, for metadata records with a publication date of 2020 onwards, ORCID IDs are present in at least 10% of records.

      * **Gold:** Yes, for metadata records with a publication date of 2020 onwards, ORCID IDs are present in at least 50% of records.


      **R(3.7) ROR (DD)**


      **Description**


      ROR (Research Organisation Registry) identifies institutions and organisations: universities, research centres, funders, etc.


      **Recommendations**


      The CORE Dashboard enables you to specify your ROR ID. You should check the details to make sure your institution is identified correctly. If the ROR ID is missing or incorrect, you can correct it on the dashboard. The ROR ID can be obtained from the [Research Organisation Registry](https://ror.org/).


      **Compliance criteria**


      * **Bronze:** Yes

      * **Silver:** Yes

      * **Gold:** Yes


      **4. Reusable**


      **R(4.1) Do you have an institutional policy on data sharing? (OQ)**


      **Description**


      A data availability statement, also sometimes called a “data access statement”, is a short, mandatory section in a paper that tells the reader where the research data associated with a paper is available and under what conditions the data can be accessed.


      **Recommendations**


      Here are some recommendations on how to increase the number of data availability statements in your repository:


      1. Include links where applicable to the data set. For example, the paper may state “The data that support the findings of this study are openly available in [repository name] at https://doi.org/[doi]”.

      2. Provide a dedicated metadata field for the data availability statement, not just full text in the description.

      3. Provide researchers with approved, compliant data availability statement text for all scenarios, such as “Data are openly available in [Repository Name] at [DOI].” and “Data are available upon request due to ethical restrictions. Contact [Email/Data Access Committee].”

      4. CORE provides several tools under the [Data Availability Statement identification](https://core.ac.uk/documentation/membership-documentation#das-identification) tab:
         * monitoring statistics about data availability statements in your repository
         * Data Availability Statement checker

      **Compliance criteria**


      * **Bronze:** No

      * **Silver:** No

      * **Gold:** Yes


      **R(4.2) Do you have an institutional policy on sharing software? (OQ)**


      **Description**


      Providing links to source means that the repository includes references to the software that was used in the research.


      **Recommendations**


      We are working on making software mentions a first-class citation object. The most common place to store this information in the metadata is `dc:relation`. See the [CORE Data Provider’s Guide](https://core.ac.uk/documentation/data-providers-guide#linking-full-text) for the recommended ways of linking related resources. CORE also supports a machine learning tool to recognise software mentions directly inside the paper. Using this feedback loop, the repository can track more citations and integrate them in the global scholarly graph.


      **Compliance criteria**


      * **Bronze:** No

      * **Silver:** No

      * **Gold:** Yes


      **R(4.3) Do you have an Institutional RRS or do your papers contain an RRS section? (OQ)**


      **Description**


      Rights Retention Strategy (RRS) enables authors to exercise the authorship rights they have on their manuscripts to deposit a copy of the Author Accepted Manuscript (AAM) in a repository on publication and provide open access to it. RRS is typically implemented by means of authors inserting a rights retention statement in their manuscript.


      **Recommendations**


      CORE provides functionality to automatically identify papers with these Rights Retention Strategy statements, by means of testing if the rights retention statement is present in the paper's full text. You can find more details on the [RRS Policy](https://core.ac.uk/documentation/membership-documentation#rrs-identification) tab.


      **Compliance criteria**


      * **Bronze:** No

      * **Silver:** No

      * **Gold:** No


      **5. Fit for funders**


      **R(5.1) Is your research identifiable by funding bodies? (OQ)**


      **Description**


      Applies only to UK repositories. Only a recommendation for everybody else.


      The repository records and exposes details about the organizations or agencies that financially supported the research.


      **Recommendations**


      This typically includes the funder name, grant number or project ID and ideally a persistent identifier for the funder, a ROR ID or Crossref Funder Registry ID.


      **Compliance criteria**


      * **Bronze:** No

      * **Silver:** Yes, there is a policy but it is not widely used

      * **Gold:** Yes, the policy is used for most of the recent records


      **R(5.2) Do you expose metadata about dates of deposit? (OQ)**


      **Description**


      Exposing metadata about dates of deposit means that the repository clearly records and makes available the date an item was first deposited into the system.


      **Recommendations**


      This provides provenance information and helps users and aggregators know when the record entered the repository. It is also useful for version control, compliance checking and tracking the research lifecycle. The compliance percentage is reported here just for the sake of completeness, it won’t be used in evaluating your certification submission.


      * Configure the repository to automatically capture deposit dates during submission.

      * Ensure the deposit date is included in all exposed metadata formats (OAI-PMH, DataCite, Dublin Core).

      * Regularly audit metadata records to check completeness and identify missing dates.


      **Compliance criteria**


      * **Bronze:** No

      * **Silver:** Yes. Applies only to UK repositories. Only a recommendation for everybody else. At least 50% of papers deposited after 2025.

      * **Gold:** Yes


      **R(5.3) Do you provide information about funding bodies for the research outputs? (OQ)**


      **Description**


      The repository records and exposes details about the organizations or agencies that financially supported the research.


      **Recommendations**


      This typically includes the funder name, grant number or project ID and ideally a persistent identifier for the funder, a ROR ID or Crossref Funder Registry ID.


      **Compliance criteria**


      * **Bronze:** No

      * **Silver:** No

      * **Gold:** Yes. For 2020 onwards manuscripts, at least 10% have grant IDs.


      **R(5.4) Do you provide in the metadata information about project IDs? (OQ)**


      **Description**


      The repository records and exposes identifiers of funded projects associated with research outputs.


      **Recommendations**


      * Implement a dedicated metadata field for project IDs alongside funding body details.

      * Support standard formats and schemas like OpenAIRE Guidelines or DataCite metadata that include fields for project identifiers.

      * Encourage depositors to enter official grant or project IDs at the time of submission.

      * Where possible, use persistent identifiers for projects: OpenAIRE project IDs, DOIs.

      * Ensure the information is machine-readable and harvestable through OAI-PMH.


      **Compliance criteria**


      * **Bronze:** No

      * **Silver:** No

      * **Gold:** Yes. For 2020 onwards manuscripts, at least 10% have project information filled in metadata.


      **6. Fit for the future**


      **R(6.1) Do you support ResourceSync? (OQ)**


      **Description**


      [ResourceSync](https://www.openarchives.org/rs/1.1/resourcesync) allows repositories to expose changes to their content and metadata in a structured, machine-readable way. With ResourceSync, external services (such as aggregators, harvesters and preservation systems) can keep their records in sync with the repository by automatically detecting new, updated or deleted items. Unlike OAI-PMH, which focuses on metadata harvesting, ResourceSync provides a more efficient and scalable way to track repository content changes in real time.


      **Recommendations**


      * Assess whether your repository platform supports ResourceSync, for example DSpace, EPrints or Invenio.

      * Provide a Resource List (all available items) and Change Lists (new, updated or deleted items) to support synchronisation.

      * Ensure ResourceSync feeds include persistent identifiers (DOIs, Handles) and standard metadata formats.

      * Document the repository’s ResourceSync base URL in public documentation for service providers.


      **Compliance criteria**


      * **Bronze:** No

      * **Silver:** No

      * **Gold:** Yes


      **R(6.2) Do you support COAR Notify? (OQ)**


      **Description**


      COAR Notify is a protocol developed by the Confederation of Open Access Repositories (COAR) to enable interoperable, event-based communication between repositories, publishers and other scholarly services. It is built on the Linked Data Notifications (LDN) standard and allows repositories to send and receive notifications about research objects. For example, a repository can notify a publisher when a preprint has been deposited or receive a notification when a peer review has been linked to one of its records.


      **Recommendations**


      * Ensure that your repository can send notifications, for example about deposits, updates or withdrawals, and receive notifications, for example about reviews, endorsements or citations.

      * Align metadata and identifiers used in notifications with persistent identifiers (DOIs, ORCIDs, RORs) to maximize interoperability.

      * Document your repository COAR Notify endpoints and policies for external partners.


      **Compliance criteria**


      * **Bronze:** No

      * **Silver:** No

      * **Gold:** Yes


      **R(6.3) Do you support FAIRiCat? (OQ)**


      **Description**


      FAIRiCat (FAIR Implementation Profile Catalog) is an international initiative led by GO FAIR that provides a registry of FAIR Implementation Profiles (FIPs). Read more at [https://signposting.org/FAIRiCat/](https://signposting.org/FAIRiCat/).


      **Recommendations**


      * Prepare a FAIR Implementation Profile (FIP) for your repository, describing identifiers (DOI, ORCID, ROR), metadata schemas (DataCite, Dublin Core), protocols (OAI-PMH, ResourceSync) and vocabularies in use.

      * Submit your FIP to the FAIRiCat registry so it is visible and reusable by the wider community.

      * Regularly update the FIP as your repository adopts new standards or technologies.

      * Reference your published FIP in the repository documentation to demonstrate compliance and transparency.


      **Compliance criteria**


      * **Bronze:** No

      * **Silver:** No

      * **Gold:** Yes


      **7. Operational / Environmental considerations**


      **R(7.1) How do you manage deposits? Is there someone to check them? (OQ)**


      **Description**


      Deposit management refers to the process the repository uses to handle new submissions of research outputs.


      **Recommendations**


      Define a clear deposit workflow: self-deposit, mediated deposit or curated. Assign repository staff (curators or managers) to review submissions for metadata quality, copyright, licensing and compliance with institutional and funder policies. Provide guidance for depositors: templates, checklists, FAQs.


      * **Self-deposited** — by researchers, authors or administrative staff.

      * **Mediated** — by librarians or repository managers on behalf of authors.

      * **Curated** — before publication to ensure metadata quality, copyright compliance and adherence to repository policies.


      **Compliance criteria**


      * **Bronze:** Yes

      * **Silver:** Yes

      * **Gold:** Yes


      **R(7.2) Deposits are checked before made available. (OQ)**


      **Description**


      This requirement evaluates whether the repository implements a curation step prior to publishing new submissions. In a curated workflow, trained repository staff systematically check self-deposited or mediated submissions to ensure metadata quality, licensing validity, copyright compliance, and strict adherence to institutional and funder policies. Checking deposits before they go live ensures the overall consistency, completeness, and long-term reliability of the repository's collections.


      **Recommendations**


      * Establish a curated workflow. Transition from instant publication to a holding queue where submissions are reviewed by librarians or repository managers before becoming publicly visible.

      * Review metadata quality and completeness. Train repository curators to verify that all mandatory scholarly fields (such as titles, author names, abstracts, and publication dates) are correctly and consistently formatted.

      * Ensure copyright and licensing compliance. Check that appropriate Creative Commons or standardized licenses are specified, and that rights retention statements or publisher embargoes are legally respected and correctly tagged.

      * Verify cross-linking of outputs. Ensure curation guidelines prompt staff to check for the presence of Data Availability Statements and verify that research papers are properly linked to their underlying research data and software repositories.

      * Provide support resources. Equip depositors with clear guidance materials including templates, metadata checklists, and FAQs to help them prepare compliant submissions and reduce the curation burden on staff.


      **Compliance criteria**


      * **Bronze:** Yes

      * **Silver:** Yes

      * **Gold:** Yes


      **R(7.3) How do you handle take-down notices? (OQ)**


      **Description**


      Handling take-down notices refers to the repository’s process for managing requests to remove or restrict access to deposited content.


      **Recommendations**


      * Establish a publicly available take-down policy, outlining when and how content may be removed.

      * Designate a contact point (repository manager or legal office) for receiving and handling take-down requests.

      * Acknowledge requests promptly and investigate validity in consultation with legal or policy experts if needed.

      * If the request is justified, withdraw or restrict access to the item, but preserve the metadata record with a clear note explaining the reason for removal.


      **Compliance criteria**


      * **Bronze:** No

      * **Silver:** Yes. We want to hear that the metadata record is not deleted, but only marked as deleted in OAI-PMH. Also we want to hear that updates are marked as updated.

      * **Gold:** Yes


      **R(7.4) How do you manage the preservation of content in your repository? (OQ)**


      **Description**


      Preservation of content in a repository refers to the set of policies, workflows and technical measures that ensure digital objects remain:


      * **Available** — can be found and opened.

      * **Authentic** — guaranteed to be original.

      * **Usable** — can be realistically reused.


      **Recommendations**


      * Define and publish a preservation policy that outlines the repository’s commitment to long-term access and specifies responsibilities.

      * Implement redundant storage and backup strategies: multiple servers, offsite copies, cloud storage.

      * Use fixity checks (checksums, hashes) to regularly verify file integrity and detect corruption.

      * Prefer open and widely used file formats (PDF, TXT, CSV) for better long-term sustainability.

      * Record and expose technical metadata (file format, size, checksum) to support digital preservation workflows.


      **Compliance criteria**


      * **Bronze:** No

      * **Silver:** Yes. We just want to hear that they are aware.

      * **Gold:** Yes


      **R(7.5) How do you encourage researchers to get their ORCID? (OQ)**


      **Description**


      Encouraging researchers to obtain an ORCID (Open Researcher and Contributor ID) ensures that their work is uniquely identifiable and correctly attributed, regardless of name variations, institutional changes or publication platforms. ORCID adoption strengthens the quality of repository metadata, improves interoperability with publishers and funders and helps researchers gain recognition for their contributions.


      **Recommendations**


      * Promote ORCID awareness through training sessions, repository guides and onboarding materials.

      * Provide step-by-step instructions and links for registering an ORCID ID.

      * Enable ORCID authentication and login in the repository so researchers can connect their profile during deposit.

      * Encourage depositors to include their ORCID in the metadata of every submission.

      * Where possible, set ORCID as a mandatory or strongly recommended field in deposit workflows.

      * Integrate with the ORCID API to push publications and datasets from the repository directly to a researcher’s ORCID profile.


      **Compliance criteria**


      * **Bronze:** No

      * **Silver:** No

      * **Gold:** Yes. We just want to hear that they are making it possible to provide ORCID within their repository systems.


      **R(7.6) What are you doing to promote FAIR principles? (OQ)**


      **Description**


      The repository actively implements policies, technologies and community practices to make research outputs more discoverable, usable and sustainable.


      **Recommendations**


      * **Clear policies** — Publish policies that explicitly reference FAIR principles (metadata quality, licensing, preservation).

      * **Metadata standards** — Require rich, standardized metadata (DataCite, Dublin Core, OpenAIRE Guidelines).

      * **Persistent identifiers** — Support DOIs, ORCIDs, RORs and project IDs to ensure proper linking and attribution.

      * **Infrastructure support** — Provide OAI-PMH, ResourceSync and APIs to enable interoperability with aggregators.

      * **Licensing and reuse** — Encourage open licenses (CC-BY, CC0) to maximize reusability.

      * **Data linking** — Promote inclusion of Data Availability Statements, links to datasets and source code where relevant.

      * **Quality control** — Ensure deposits are reviewed for metadata completeness and compliance with FAIR.

      * **Awareness and training** — Organize workshops, training sessions and guidance materials for researchers on FAIR data management.

      * **Community engagement** — Participate in FAIR-related initiatives (GO FAIR, COAR) and align with best practices.


      **Compliance criteria**


      * **Bronze:** No

      * **Silver:** No

      * **Gold:** Yes


      **R(7.7) What are you doing to promote research reproducibility? (OQ)**


      **Description**


      Promoting research reproducibility means ensuring that other researchers can verify, replicate and build upon the results deposited in the repository. This goes beyond simply storing outputs: it requires linking publications with their underlying datasets, methods and documentation, as well as providing transparent metadata and persistent identifiers.


      **Recommendations**


      * Require or encourage Data Availability Statements linking publications to underlying datasets.

      * Enable persistent identifiers (DOIs for publications and datasets, ORCID for authors, ROR for institutions) to ensure reliable attribution and referencing.

      * Support versioning so users can access previous iterations of datasets or papers.

      * Provide metadata fields for methods and protocols, ensuring research processes are documented.

      * Encourage open licenses (CC-BY, MIT, GPL) so that others can reuse data and code legally.

      * Facilitate interoperability by using standard metadata schemas (DataCite, OpenAIRE Guidelines) so outputs can be linked across systems.

      * Promote best practices through guidance, training, FAQs and templates for researchers on how to deposit reproducible outputs.

      * Integrate with external registries (Protocols.io for methods, OpenAIRE for projects) to enhance traceability.

      * Provide transparency in curation. Ensure deposits are checked for completeness and proper linking of data, code and publications.


      **Compliance criteria**


      * **Bronze:** No

      * **Silver:** No

      * **Gold:** Yes. Are you making it possible for depositors in the repository to specify and link the research data and research software?


      **R(7.8) How do you support Open Science at your institution? (OQ)**


      **Description**


      Implementing policies, infrastructure and cultural practices that make research outputs more transparent, accessible and reusable. This includes promoting open access to publications, sharing research data, supporting reproducibility and enabling collaboration across disciplines and communities.


      **Recommendations**


      * Adopt an institutional Open Science policy aligned with national and European guidelines (EOSC, Plan S).

      * Provide infrastructure such as institutional repositories, data archives and integration with ORCID, DOI and ROR identifiers.

      * Promote FAIR data practices by training researchers in data management, metadata standards and reproducibility.

      * Support Open Access publishing through funding, agreements with publishers or institutional repositories (Green/Gold OA).

      * Encourage Data and Code Availability Statements in research outputs.

      * Offer training and guidance on open research practices, licensing (Creative Commons, Open Source) and copyright.

      * Recognize and reward Open Science practices in research evaluation, hiring and promotion.

      * Collaborate with external infrastructures (OpenAIRE, EOSC, COAR) to increase global visibility and interoperability.

      * Provide long-term preservation services to ensure open research remains accessible and trustworthy over time.

      * Engage the community by organizing workshops, awareness campaigns and incentives for adopting Open Science practices.


      **Compliance criteria**


      * **Bronze:** No

      * **Silver:** No

      * **Gold:** Yes. We want to hear that there is a programme within the institution to support Open Science in research papers.

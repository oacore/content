items:
  - title: 1. What is FAIR Repository Certification?
    id: what-is
    descriptionAbout: >
      FAIR Certification offers an opportunity for data providers (publisher
      repositories, journals, data repositories, etc.) to demonstrate and
      evidence their adherence to the widely recognised FAIR (Findable,
      Accessible, Interoperable, Reusable) principles. A FAIR-compliant
      repository becomes a dynamic, machine-actionable component of the global
      research infrastructure, maximising the impact and reusability of the
      research it hosts.


      Aligning with FAIR is crucial for ensuring that repository content is easily discoverable, accessible, interoperable and reusable within scholarly infrastructures. Our FAIR Certification programme consists of a set of objective, data-driven automated checks of your platform, directly assessing FAIRness. Our easy-to-navigate certification process is fully technology-supported, objective and provides specific guidance and recommendations leading to tangible improvements, ensuring that your platform aligns with best technology and content management practices.
    images: null
    subTitle: null
    subDescription: null
  - title: 2. Certification types
    id: certification-types
    descriptionAbout: >
      **Bronze** — Guarantees a foundational level of compliance. Repository
      metadata and content is indexable, records are assigned identifiers, and
      metadata have been populated to at least a minimum level.


      **Silver** — Demonstrates strong compliance with FAIR. Metadata are exposed using industry-leading application profiles and vocabularies, contain machine-readable licence information and have been sufficiently populated.


      **Gold** — Achieves full machine-actionability. Metadata has been richly populated and supports linking of research papers and datasets. Repository supports industry-leading protocols and interoperability standards.
    images: null
    subTitle: null
    subDescription: null
    divider: true
  - title: 3. FAIR Repository Certificate benefits
    id: benefits
    descriptionAbout: >
      **1. The only FAIR certification service**


      CORE FAIR certification stands out as the only available certification service specifically designed to assess repositories against the established criteria of the FAIR Principles (Findable, Accessible, Interoperable, and Reusable). This unique focus addresses a critical need within the scholarly communications and data management landscape, providing a standardized, rigorous method for repository owners and stakeholders to verify and demonstrate their commitment to open science and high-quality data stewardship.


      **2. Certification of publication repositories**


      CORE FAIR Certification is the only certification service designed specifically for publication repositories, addressing the unique FAIR challenges of articles, metadata, and scholarly content rather than generic data repositories.


      **3. Evidence-based, quantitative assessment**


      The certification process relies heavily on measurable, quantitative evaluation supported by hard evidence and data-driven assessment, rather than mere narrative self-assessment. This approach guarantees objective, verifiable, and repeatable results.


      **4. Technology-supported, fast feedback**


      Most assessment criteria are evaluated using technology-supported validation, providing rapid feedback and eliminating the need to wait for lengthy human peer review for the majority of checks.


      **5. Direct alignment with FAIR Principles**


      Each component of Findable, Accessible, Interoperable, and Reusable (FAIR) is:


      * Explicitly addressed

      * Quantitatively measured

      * Linked to actionable improvements


      The certification actively drives FAIR maturity, not just compliance.


      **6. High-reliability, data-driven results**


      The assessment is characterised by high data-driven reliability, providing demonstrable evidence that those who possess the certificate are FAIR repositories.


      **7. Resistant to cheating and over-reporting**


      By relying on external validation and machine-verifiable indicators, the certification is resistant to inflated or unreliable self-reporting and significantly reduces the risk of gaming the system.


      **8. Continuously updated best-practice alignment**


      The assessment framework is designed to remain aligned with the latest international best practices for open repositories, FAIR implementation, and scholarly infrastructure management.


      **9. Easy application**


      The application process is simple, lightweight, and intuitive. Repositories spend minimal time on paperwork and maximum time improving FAIRness, guided by clear, actionable feedback.


      **10. Tiered certification levels**


      Repositories are recognised according to their FAIR maturity through three certification levels:


      * **Bronze** — foundational FAIR readiness

      * **Silver** — strong FAIR implementation

      * **Gold** — advanced FAIR excellence


      This allows repositories to progress over time.


      **11. Affordable and accessible**


      * Free of charge for CORE Sustaining Members

      * 50% discount for CORE Supporting Members

      * Making FAIR certification accessible to repositories of all sizes


      **12. Community-endorsed and growing**


      The certification is designed to incorporate future endorsements from trusted organisations and CORE Advisory Board members, strengthening credibility and long-term community recognition.

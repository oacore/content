  - title: 4.1. List of requirements
    id: list-of-requirements
    descriptionAbout: >
      Categorizing questions under a specific letter of FAIR can be somewhat
      arbitrary, as many points naturally span multiple aspects of the
      principles. This structure is simply a practical way to distribute them,
      though we recognize there is significant overlap and that alternative
      configurations are certainly possible.


      There are two types of requirements:


      * **Data-driven indicators (DD)** — data-driven assessment based on the data available and visible to the wide world from your repository (this data exposed via OAI-PMH URL).

      * **Open questions (OQ)** — requirements that need manually written answers from a repository representative.


      **1. Findable**


      * 1.1. Does your repository support OAI-PMH? (DD)

      * 1.2. Your repository metadata supports a widely used Application Profile (DD)

      * 1.3. How many metadata records are there in your repository? (DD)


      **2. Accessible**


      * 2.1. Do you provide access to full texts of research papers for your content? (DD)

      * 2.2. Do you label embargoed documents in a machine-readable way? (DD)

      * 2.3. Do you support machine-readable licensing? (DD)

      * 2.4. Do you support any tool for tracking COUNTER-compliant downloads in your system? (DD)


      **3. Interoperable**


      * 3.1. Do you support FAIR Signposting? (DD)

      * 3.2. Do your metadata use COAR vocabularies? (DD)

      * 3.3. Does your repository support persistent management of records? (DD)

      * 3.4. Is your repository configured for the OAI resolver, and does it work? (DD)

      * 3.5. Persistable identifiers (DD)

      * 3.6. ORCID (DD)

      * 3.7. ROR (DD)


      **4. Reusable**


      * 4.1. Do you have an institutional policy on data sharing? (OQ)

      * 4.2. Do you have an institutional policy on sharing software? (OQ)

      * 4.3. Do you have an Institutional RRS, and do your papers contain an RRS section? (OQ)


      **5. Fit for funders**


      * 5.1. Is your research identifiable by funding bodies? (OQ)

      * 5.2. Do you expose metadata about dates of deposit? (OQ)

      * 5.3. Do you provide information about funding bodies for the research outputs? (OQ)

      * 5.4. Do you provide in the metadata information about project IDs? (OQ)


      **6. Fit for the future**


      * 6.1. Do you support ResourceSync? (OQ)

      * 6.2. Do you support COAR Notify? (OQ)

      * 6.3. Do you support [FAIRiCat](https://signposting.org/FAIRiCat/)? (OQ)


      **7. Operational / Environmental considerations**


      * 7.1. How do you manage deposits? Is there someone to check them? (OQ)

      * 7.2. Deposits are checked before made available. (OQ)

      * 7.3. How do you handle take-down notices? (OQ)

      * 7.4. How do you manage the preservation of content in your repository? (OQ)

      * 7.5. How do you encourage researchers to get their ORCID? (OQ)

      * 7.6. What are you doing to promote FAIR principles? (OQ)

      * 7.7. What are you doing to promote research reproducibility? (OQ)

      * 7.8. How do you support Open Science at your institution? (OQ)

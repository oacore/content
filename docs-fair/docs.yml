  - title: 4. Requirements and guidelines for getting FAIR Repository Certificate
    id: requirements
    descriptionAbout: >
      This section lists all requirements with which a repository should comply
      to get FAIR Repository Certification, along with guidelines for best
      practices of FAIR repositories. All requirements are divided into 7
      topics, which allows us to better estimate how your repository aligns with
      FAIR principles:


      1. **Findable** — The first step in (re)using data is to find them. Metadata and data should be easy to find for both humans and computers. Machine-readable metadata are essential for automatic discovery of datasets and services, so this is an essential component of the FAIRification process.


      2. **Accessible** — Once the data or its metadata is found, users need to know precisely how they can be accessed. This includes clear protocols for retrieval and, where necessary, information on authentication and authorisation requirements. The goal is to ensure the repository supports open, free, and universally implementable communication protocols that allow as many users and systems as possible to retrieve the data.


      3. **Interoperable** — This section assesses how well the data within the repository can be integrated with other datasets and how effectively it can be used with various applications or workflows for analysis, storage, and processing.


      4. **Reusable** — The ultimate goal of FAIR is to optimise the reuse of data. To achieve this, metadata and data should be well-described so that they can be replicated and/or combined in different settings.


      5. **Fit for funders** — The repository is designed to meet the requirements of funders by ensuring that metadata includes key information for compliance, monitoring and accountability.


      6. **Fit for the future** — The repository is committed to adopting emerging standards and technologies that ensure long-term sustainability, scalability and interoperability within the global research ecosystem.


      7. **Operational / Environmental considerations** — The repository operates under clear policies and workflows that ensure trustworthiness, sustainability and alignment with best practices in scholarly communication. Deposits are managed through a defined submission workflow, where researchers can self-deposit their outputs and trained staff check submissions for metadata quality, copyright compliance and adherence to institutional policies.

title: How to download the latest dataset (2026-09)
id: latest
recommended: >-
  We recommend you download the dataset using **AZCOPY**.


  You can download the dataset to your local machine. 
  Alternatively, if you already have an Azure Storage Account, 
  you can transfer the dataset folder directly to your container.


  Required credentials to gain access to the latest dataset:
    * **https://[core-storage-account].blob.core.windows.net/[core-container]/Metadata-Dataset-2026-09** (URL to the dataset folder)
    * **SAS** (Shared Access Signature) token


  **The link and the token will be shared with you via email.**
reminder:
  title: "Example:"
  description: >
    Example to download one single Dataset archive:


    * **azcopy** copy "https://[core-storage-account].blob.core.windows.net/[core-container]/Metadata-Dataset-2026-09?[SAS]" "/path/to/dir" --recursive

    * **azcopy** copy "https://[core-storage-account].blob.core.windows.net/[core-container]/Metadata-Dataset-2026-09?[SAS]" "https://[storage-account-name].blob.core.windows.net/[container-name]?[SAS]" --recursive

main:
  - title: 1. Our commitment
    id: commitment
    content: >
      CORE: COnnecting REpositories Ltd ("CORE") is committed to conducting its
      activities responsibly and ethically and to respecting the dignity and
      fundamental rights of people who work for, with, or in the supply chains
      of the company.


      CORE does not tolerate slavery, servitude, forced or compulsory labour,
      human trafficking, child labour, or other forms of exploitation ("modern
      slavery") in its own operations or, to the extent reasonably within its
      influence, in its supply chains.


      This policy reflects CORE's commitment to the principles of the Modern
      Slavery Act 2015.
  - title: 2. About CORE
    id: about
    content: >
      CORE is a UK-based technology company providing digital infrastructure,
      data and software services supporting access to scholarly and research
      information.


      As a technology and knowledge-based organisation, CORE's principal
      suppliers and service providers are primarily providers of digital
      services, software developers, cloud and IT infrastructure providers,
      professional and business services, equipment, and specialist technical
      or professional support.


      CORE considers the risk of modern slavery within its direct operations to
      be relatively low given the nature of its activities. Nevertheless, we
      recognise that risks of exploitation can arise in any organisation or
      supply chain and that appropriate attention should be given to them.
  - title: 3. Our approach
    id: approach
    content: >
      CORE seeks to conduct its business in a manner that helps prevent modern
      slavery and exploitation. In particular, we:


      * do not knowingly engage with organisations or individuals involved in
        modern slavery, forced labour, human trafficking or other serious
        labour exploitation;

      * expect suppliers, contractors and other business partners to comply
        with applicable employment, labour and human rights laws;

      * seek to use suppliers and service providers, taking into account the
        nature, location and risk profile of the goods or services being
        supplied;

      * may make proportionate enquiries or request appropriate assurances from
        suppliers where the nature of a supplier, service or jurisdiction gives
        rise to a material concern;

      * expect people working for CORE to be engaged voluntarily and under
        transparent terms, and not to be subject to unlawful recruitment fees,
        coercion or restrictions on their freedom to leave employment or
        engagement; and

      * will take concerns about possible modern slavery seriously and respond
        in a manner proportionate to the circumstances.


      CORE does not consider that a blanket requirement to audit every supplier
      would be proportionate to the nature and scale of its business. Our
      approach is therefore risk-based.
  - title: 4. Suppliers and business partners
    id: suppliers
    content: >
      CORE expects its suppliers, contractors and other business partners to
      share our commitment to preventing modern slavery.


      Where CORE becomes aware of credible evidence or a significant concern
      regarding modern slavery or serious labour exploitation within a supplier
      or business partner, we will consider appropriate action. Depending on
      the circumstances, this may include seeking further information, requiring
      remedial action, suspending new work, or terminating the relationship
      where appropriate.


      In determining the appropriate response, CORE will take account of the
      seriousness of the issue, the ability of the organisation concerned to
      remedy it, and the interests of any people who may be affected.
  - title: 5. Reporting concerns
    id: reporting
    content: >
      Employees, contractors, suppliers and others working with CORE are
      encouraged to raise any genuine concern that modern slavery or serious
      labour exploitation may be occurring in connection with CORE's activities
      or supply chains.


      Concerns may be raised with a Director of CORE or through the usual
      contact channels published on the CORE website.


      No person should suffer detrimental treatment for raising a genuine
      concern in good faith.
  - title: 6. Responsibility
    id: responsibility
    content: >
      CORE may review suppliers, contractual arrangements or working practices
      where circumstances indicate that additional action concerning modern
      slavery risks may be appropriate.
  - title: 7. Status and review of this policy
    id: status
    content: >
      CORE's current annual turnover is below the threshold at which section 54
      of the Modern Slavery Act 2015 requires a commercial organisation to
      prepare and publish an annual slavery and human trafficking statement.
      This policy is therefore published voluntarily as a statement of CORE's
      continuing approach and commitment.


      It is intended to operate as an ongoing policy rather than as an annual
      modern slavery statement.


      CORE will review and update this policy when reasonably necessary,
      including where there is a material change in the nature or scale of our
      activities, our supply-chain risk profile, or applicable legal
      requirements.


      If CORE becomes subject to a statutory obligation to publish an annual
      modern slavery statement, it will comply with the applicable reporting
      requirements.
  - title: Approval
    id: approval
    content: >
      Approved by the Director of CORE: COnnecting REpositories Ltd.


      Effective from: **1 September 2026**

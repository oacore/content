header:
  title: Environmental Impact Statement
  description: This page sets out the environmental impact assessment.
main:
  - content: >
      CORE is a micro-company providing predominantly digital services and does not operate manufacturing facilities or other environmentally intensive physical operations. We seek to minimise our environmental impact through remote and flexible working, minimising business travel and paper-based processes, and making efficient use of computing and cloud infrastructure.
     
     
      Where practicable, we select established infrastructure and service providers that have their own environmental and carbon-reduction commitments. As the company grows, we will keep our environmental impact under review and adopt proportionate measures to monitor and reduce emissions and resource consumption.

pages:
  - id: authorships-api
    title: Authorship Graph API documentation
    content: |
      This section documents the Authorship Graph API endpoints for retrieving and searching Authorship records in the CORE Graph.

      Use the sidebar to navigate to specific topics including data structure, field operations, query syntax, and individual endpoint reference pages.

  - id: authorships-api-introduction
    title: Introduction
    content: |
      An Authorship record describes how an Author appears on a particular scholarly Work. It contains Work-specific information such as the Author's position in the author list, numeric rank, corresponding-Author status, and source-provided name. Affiliations used by the Author on the Work are connected to the Authorship through the Authorship_Affiliation bridge entity.

      Unlike the Author entity, which represents a persistent researcher identity across multiple works, Authorship represents an author's association with one specific Work. The diagram below represents the entity relationships between Works, Authorships and Authors.

      ![Entity relationships between Works, Authorships and Authors](/docs-graph/img/works-citations-outputs1.png)

      A Work may have multiple Authorship records, and an Author may appear in multiple Authorship records. Each Authorship record links exactly one Work to exactly one Author. An Authorship may be linked to zero or more Affiliation records through `authorship_affiliation`.

  - id: authorships-api-data-structure
    title: Data structure
    content: |
      The table below describes the top-level fields in the CORE Graph metadata schema for the Authorship entity, including their types, example values, descriptions, and sources.

      | Property | Type | Example value | Description | Source |
      | --- | --- | --- | --- | --- |
      | authorshipId | integer | 234 | CORE identifier for the authorship | CORE |
      | workId | integer | 23456 | CORE identifier of the associated work. | CORE |
      | authorId | integer | 12 | CORE identifier of the associated author. | CORE |
      | rawName | string \| null | Smith, Alice | Verbatim author name string as supplied in the source metadata for this work. | OAI-PMH / Crossref |
      | sequence* | string \| null | first | Author order classification within the work, such as first or additional. | Crossref / OpenAlex |
      | rank* | integer \| null | 1 | Numeric rank of the author in the author list. | OpenAIRE / OpenAlex |
      | isFirstNamedAuthor* | boolean \| null | true | Indicates whether the author is the first-listed author on the work. | Derived by CORE |
      | isCorresponding | boolean \| null | false | Indicates whether the author is the corresponding author or not. **true:** the author is explicitly identified as a corresponding author. **false:** the source explicitly indicates that the author is not a corresponding author. **null:** the source does not provide sufficient information to determine corresponding-author status. | |
      | sourceOutputIds | integer[] \| null | [216874849, 216874850] | CORE Output identifiers from which evidence for this Authorship was derived. | CORE |
      | createdDate | string \| null | "2026-06-15T10:30:00Z" | Date and time when the authorship record was created in CORE. | CORE |
      | updatedDate | string \| null | 2023-11-07T05:31:56Z | Date and time when the authorship record was last updated in CORE. | CORE |

      \* - See the Author position section below.

  - id: authorships-api-author-position
    title: Author position
    content: |
      The fields `rank`, `sequence`, and `isFirstNamedAuthor` describe the Author's position in the author list for the specific work.

      For example:

      | Author position | rank | sequence | isFirstNamedAuthor |
      | --- | --- | --- | --- |
      | First author | 1 | "first" | true |
      | Middle author | 2 | "additional" | false |
      | Final author | 5 | "last" | false |

      The `rank` property provides the exact numeric position of the Author.

      The `sequence` property provides a simplified classification of that position.

      For a single-author Work, the recommended representation is:

      ```json
      {
        "rank": 1,
        "sequence": "first",
        "isFirstNamedAuthor": true
      }
      ```

  - id: authorships-api-example-authorship-record
    title: Example Authorship record
    content: |
      ```json
      {
        "authorshipId": 987654,
        "workId": 12345,
        "authorId": 67890,
        "rawName": "Smith, Alice",
        "sequence": "first",
        "rank": 1,
        "isFirstNamedAuthor": true,
        "isCorresponding": true,
        "sourceOutputIds": [
          216874849,
          216874850
        ],
        "createdDate": "2026-06-15T10:30:00Z",
        "updatedDate": "2026-07-01T14:20:00Z"
      }
      ```

  - id: authorships-api-authorship-affiliation-relationship
    title: Authorship–Affiliation relationship
    content: |
      Affiliations used by an Author on a particular Work are represented through the `authorship_affiliation` bridge entity. The bridge contains the identifiers of the connected Authorship and Affiliation records.

      ![Authorship–Affiliation relationship diagram](/docs-graph/img/works-citations-outputs2.png)

      | Property | Type | Example value | Description | Source |
      | --- | --- | --- | --- | --- |
      | authorshipId | integer | 987654 | CORE identifier of the Authorship participating in the relationship. | CORE |
      | affiliationId | integer | 901 | CORE identifier of the Affiliation participating in the relationship. | CORE |

      Example bridge records:

      ```json
      [
        {
          "authorshipId": 987654,
          "affiliationId": 901
        },
        {
          "authorshipId": 987654,
          "affiliationId": 902
        }
      ]
      ```

      These records indicate that Authorship 987654 is associated with Affiliations 901 and 902.

      The bridge is used because:

      - one Authorship may be linked to multiple Affiliations;
      - one Affiliation may be linked to multiple Authorship records representing different Works;
      - Authorship contains only Work-specific Author information;
      - Affiliation remains an independently addressable and reusable entity.

  - id: authorships-api-supported-field-operations
    title: Supported field operations
    content: |
      The table below describes which Authorship properties can be searched, queried through field lookups, ordered, or used as facets.

      | Attribute | Searchable | Filterable | Sortable | Facetable |
      | --- | --- | --- | --- | --- |
      | authorshipId | No | Yes | No | No |
      | workId | No | Yes | Yes | No |
      | authorId | No | Yes | Yes | No |
      | rawName | Yes | No | No | No |
      | sequence | No | Yes | Yes | Yes |
      | rank | No | Yes | Yes | Yes |
      | isFirstNamedAuthor | No | Yes | No | Yes |
      | isCorresponding | No | Yes | No | Yes |
      | sourceOutputIds | No | Yes | No | No |
      | createdDate | No | Yes | Yes | No |
      | updatedDate | No | Yes | Yes | No |

      The field-operation settings have the following meanings:

      - **Searchable** fields can participate in textual queries through `q`.
      - **Filterable** fields can be used in field lookups, Boolean conditions, range expressions, and existence queries through `q`.
      - **Sortable** fields can be used with `orderby`.
      - **Facetable** fields can be used with `facets`.

      Refer to the common CORE API Query Language documentation for the complete query syntax.

  - id: authorships-api-boolean-query-syntax
    title: Boolean query syntax
    content: |
      The examples in this document use explicit Boolean operators:

      ```
      workId:12345 AND isCorresponding:true
      ```

      Commas are not used as an alternative to `AND` inside `q`.

      In executable URLs, spaces should be URL-encoded:

      ```
      workId:12345%20AND%20isCorresponding:true
      ```

      Readable examples may show the unencoded form for clarity.

  - id: authorships-api-endpoints
    title: Authorship endpoints
    content: |
      This section documents the Authorship Graph API endpoints.

      Authorship records may also be retrieved through relationship-oriented endpoints:

      - `GET /v4/works/{workId}/authorships`
      - `GET /v4/authors/{authorId}/authorships`
      - `GET /v4/authorships/{authorshipId}/affiliations`
      - `GET /v4/affiliations/{affiliationId}/authorships`

      The Author relationship endpoint should only be exposed in a version that provides the Author entity.

  - id: authorships-api-available-endpoints
    title: Available endpoints
    content: |
      | Operation | Method | Endpoint |
      | --- | --- | --- |
      | Get a single Authorship | GET | `/v4/authorships/{authorshipId}` |
      | Search Authorships using URL parameters | GET | `/v4/search/authorships` |
      | Search Authorships using a JSON request body | POST | `/v4/search/authorships` |
      | Retrieve Affiliations for an Authorship | GET | `/v4/authorships/{authorshipId}/affiliations` |

      Authorship records may also be retrieved through relationship-oriented endpoints:

      - `GET /v4/works/{workId}/authorships`
      - `GET /v4/authors/{authorId}/authorships`

      The Author relationship endpoint should only be exposed in a version that provides the Author entity.

  - id: authorships-api-get-single-authorship
    title: Get a single Authorship
    content: |
      Retrieves a single Authorship record using its unique CORE Authorship identifier.

      The POST search method is not an alternative single-record retrieval endpoint. It searches the Authorship collection using a JSON request body.

  - id: authorships-api-get-single-api-endpoint
    title: API endpoint
    content: |
      ```
      GET https://api.core.ac.uk/v4/authorships/{authorshipId}
      ```

      The POST search method is not an alternative single-record retrieval endpoint. It searches the Authorship collection using a JSON request body.

  - id: authorships-api-get-single-authorization
    title: Authorization
    content: |
      | Parameter | Location | Type | Required | Description |
      | --- | --- | --- | --- | --- |
      | Authorization | Header | string | Yes | CORE API authentication token supplied as a Bearer token. |

  - id: authorships-api-get-single-path-parameters
    title: Path parameters
    content: |
      | Parameter | Type | Required | Description |
      | --- | --- | --- | --- |
      | authorshipId | integer | Yes | Unique CORE identifier of the Authorship record. |

  - id: authorships-api-get-single-query-parameters
    title: Query parameters
    content: |
      | Parameter | Type | Required | Description |
      | --- | --- | --- | --- |
      | select | string | No | Comma-separated list of top-level Authorship fields to return. Example: `select=authorshipId,workId,authorId`. |

  - id: authorships-api-get-single-example-request
    title: Example request
    content: |
      ```bash
      curl --request GET \
        --url "https://api.core.ac.uk/v4/authorships/987654" \
        --header "Authorization: Bearer YOUR_API_KEY"
      ```

  - id: authorships-api-get-single-example-response
    title: Example response
    content: |
      ```json
      {
        "authorshipId": 987654,
        "workId": 12345,
        "authorId": 67890,
        "rawName": "Smith, Alice",
        "sequence": "first",
        "rank": 1,
        "isFirstNamedAuthor": true,
        "isCorresponding": true,
        "sourceOutputIds": [
          216874849,
          216874850
        ],
        "createdDate": "2026-06-15T10:30:00Z",
        "updatedDate": "2026-07-01T14:20:00Z"
      }
      ```

  - id: authorships-api-get-single-example-request-select
    title: Example request using select
    content: |
      ```bash
      curl --request GET \
        --url "https://api.core.ac.uk/v4/authorships/987654?select=authorshipId,workId,authorId,rank,isCorresponding" \
        --header "Authorization: Bearer YOUR_API_KEY"
      ```

  - id: authorships-api-get-single-example-response-select
    title: Example response using select
    content: |
      ```json
      {
        "authorshipId": 987654,
        "workId": 12345,
        "authorId": 67890,
        "rank": 1,
        "isCorresponding": true
      }
      ```

  - id: authorships-api-search-authorships
    title: Search Authorships
    content: |
      Searches, filters, orders, facets, counts, and paginates Authorship records.

      Authorship search is available through GET and POST:

      - `GET https://api.core.ac.uk/v4/search/authorships`
      - `POST https://api.core.ac.uk/v4/search/authorships`

      Both methods use the same CORE query language and return the same response structure.

      ## GET and POST search parameters

      ### GET query parameters

      | Parameter | Type | Required | Default | Description |
      | --- | --- | --- | --- | --- |
      | q | string | No | * | CORE query expression supporting free-text search, field lookup, Boolean operators, grouping, range queries, and existence queries. |
      | orderby | string | No | Relevance for textual queries | Comma-separated ordering directives in `field:direction` format. |
      | select | string | No | All retrievable fields | Comma-separated list of fields to include in each result. |
      | facets | string | No | — | Comma-separated list of facetable fields for which value buckets and counts should be returned. |
      | count | boolean | No | false | Indicates whether the total number of matching Authorship records should be included. |
      | limit | integer | No | 10 | Maximum number of Authorship records to return. |
      | offset | integer | No | 0 | Number of matching Authorship records to skip. |

      ### POST request body

      | Property | Type | Required | Default | Description |
      | --- | --- | --- | --- | --- |
      | q | string | No | * | CORE query expression supporting free-text search, field lookup, Boolean operators, grouping, range queries, and existence queries. |
      | orderby | string[] | No | Relevance for textual queries | Ordered list of sorting directives in `field:direction` format. |
      | select | string[] | No | All retrievable fields | List of fields to include in each result. |
      | facets | string[] | No | — | List of facetable fields for which value buckets and counts should be returned. |
      | count | boolean | No | false | Indicates whether the total number of matching Authorship records should be included. |
      | limit | integer | No | 10 | Maximum number of Authorship records to return. |
      | offset | integer | No | 0 | Number of matching Authorship records to skip. |

      ### GET and POST parameter mapping

      | GET query parameter | POST body property |
      | --- | --- |
      | `q=workId:12345` | `"q": "workId:12345"` |
      | `orderby=rank:asc` | `"orderby": ["rank:asc"]` |
      | `select=authorshipId,authorId,rank` | `"select": ["authorshipId", "authorId", "rank"]` |
      | `facets=sequence,isCorresponding` | `"facets": ["sequence", "isCorresponding"]` |
      | `count=true` | `"count": true` |
      | `limit=10` | `"limit": 10` |
      | `offset=0` | `"offset": 0` |

      ## Search examples

      ### Search by raw Author name

      The `rawName` property is the principal searchable field in the Authorship entity.

      **GET**

      ```bash
      curl --request GET \
        --url 'https://api.core.ac.uk/v4/search/authorships?q=rawName:"Smith"' \
        --header "Authorization: Bearer YOUR_API_KEY"
      ```

      A broader free-text query may also be used:

      ```bash
      curl --request GET \
        --url "https://api.core.ac.uk/v4/search/authorships?q=Smith" \
        --header "Authorization: Bearer YOUR_API_KEY"
      ```

      **Equivalent POST**

      ```bash
      curl --request POST \
        --url "https://api.core.ac.uk/v4/search/authorships" \
        --header "Authorization: Bearer YOUR_API_KEY" \
        --header "Content-Type: application/json" \
        --data '{
          "q": "rawName:\"Smith\""
        }'
      ```

      Because `rawName` is the principal searchable Authorship field, a broad textual query will primarily search source-provided Author names.

      When a textual query is supplied and `orderby` is omitted, matching results are ordered by relevance.

      ### Retrieve Authorships for a Work

      **GET**

      ```bash
      curl --request GET \
        --url "https://api.core.ac.uk/v4/search/authorships?q=workId:12345&orderby=rank:asc" \
        --header "Authorization: Bearer YOUR_API_KEY"
      ```

      **Equivalent POST**

      ```bash
      curl --request POST \
        --url "https://api.core.ac.uk/v4/search/authorships" \
        --header "Authorization: Bearer YOUR_API_KEY" \
        --header "Content-Type: application/json" \
        --data '{
          "q": "workId:12345",
          "orderby": [
            "rank:asc"
          ]
        }'
      ```

      This retrieves Authorship records associated with Work 12345, ordered by Author rank.

      It is also functionally equivalent to:

      ```
      GET /v4/works/12345/authorships
      ```

      ### Retrieve Authorships for an Author

      **GET**

      ```bash
      curl --request GET \
        --url "https://api.core.ac.uk/v4/search/authorships?q=authorId:67890" \
        --header "Authorization: Bearer YOUR_API_KEY"
      ```

      **Equivalent POST**

      ```bash
      curl --request POST \
        --url "https://api.core.ac.uk/v4/search/authorships" \
        --header "Authorization: Bearer YOUR_API_KEY" \
        --header "Content-Type: application/json" \
        --data '{
          "q": "authorId:67890"
        }'
      ```

      This retrieves Authorship records associated with Author 67890.

      When the Author entity and relationship endpoint are available, it is also functionally equivalent to:

      ```
      GET /v4/authors/67890/authorships
      ```

      ### Retrieve corresponding Authorships for a Work

      **GET**

      ```bash
      curl --request GET \
        --url "https://api.core.ac.uk/v4/search/authorships?q=workId:12345%20AND%20isCorresponding:true" \
        --header "Authorization: Bearer YOUR_API_KEY"
      ```

      Readable form:

      ```
      GET /v4/search/authorships?q=workId:12345 AND isCorresponding:true
      ```

      **Equivalent POST**

      ```bash
      curl --request POST \
        --url "https://api.core.ac.uk/v4/search/authorships" \
        --header "Authorization: Bearer YOUR_API_KEY" \
        --header "Content-Type: application/json" \
        --data '{
          "q": "workId:12345 AND isCorresponding:true",
          "orderby": [
            "rank:asc"
          ]
        }'
      ```

      A Work may have more than one corresponding Author, so the response may contain multiple Authorship records.

      ### Retrieve first or last Authorships

      **GET**

      ```bash
      curl --request GET \
        --url "https://api.core.ac.uk/v4/search/authorships?q=(sequence:first%20OR%20sequence:last)" \
        --header "Authorization: Bearer YOUR_API_KEY"
      ```

      Readable form:

      ```
      GET /v4/search/authorships?q=(sequence:first OR sequence:last)
      ```

      **Equivalent POST**

      ```json
      {
        "q": "(sequence:first OR sequence:last)"
      }
      ```

      This returns Authorship records where `sequence` is either `first` or `last`.

      ### Combined search, selection, and ordering

      The following request:

      - searches for Smith in `rawName`;
      - restricts results to Work 12345;
      - orders matching records by rank;
      - returns only selected fields;
      - includes the total result count;
      - returns a maximum of ten records.

      **GET**

      ```bash
      curl --request GET \
        --url 'https://api.core.ac.uk/v4/search/authorships?q=rawName:"Smith"%20AND%20workId:12345&orderby=rank:asc&select=authorshipId,authorId,rawName,rank,isCorresponding&count=true&limit=10&offset=0' \
        --header "Authorization: Bearer YOUR_API_KEY"
      ```

      Readable form:

      ```
      GET /v4/search/authorships
          ?q=rawName:"Smith" AND workId:12345
          &orderby=rank:asc
          &select=authorshipId,authorId,rawName,rank,isCorresponding
          &count=true
          &limit=10
          &offset=0
      ```

      **Equivalent POST**

      ```bash
      curl --request POST \
        --url "https://api.core.ac.uk/v4/search/authorships" \
        --header "Authorization: Bearer YOUR_API_KEY" \
        --header "Content-Type: application/json" \
        --data '{
          "q": "rawName:\"Smith\" AND workId:12345",
          "orderby": [
            "rank:asc"
          ],
          "select": [
            "authorshipId",
            "authorId",
            "rawName",
            "rank",
            "isCorresponding"
          ],
          "count": true,
          "limit": 10,
          "offset": 0
        }'
      ```

      ### Example search response

      ```json
      {
        "totalHits": 2,
        "results": [
          {
            "authorshipId": 987654,
            "authorId": 67890,
            "rawName": "Smith, Alice",
            "rank": 1,
            "isCorresponding": true
          },
          {
            "authorshipId": 987655,
            "authorId": 67891,
            "rawName": "Smith, Robert",
            "rank": 2,
            "isCorresponding": false
          }
        ]
      }
      ```

      ## Ordering Authorship results

      ### Order by Author rank

      ```
      GET /v4/search/authorships?q=workId:12345&orderby=rank:asc
      ```

      POST representation:

      ```json
      {
        "q": "workId:12345",
        "orderby": [
          "rank:asc"
        ]
      }
      ```

      ### Order by multiple fields

      ```
      GET /v4/search/authorships?orderby=workId:asc,rank:asc
      ```

      POST representation:

      ```json
      {
        "orderby": [
          "workId:asc",
          "rank:asc"
        ]
      }
      ```

      Results are first ordered by `workId`. Authorship records associated with the same Work are then ordered by rank.

      ### Order by update date

      ```
      GET /v4/search/authorships?orderby=updatedDate:desc
      ```

      POST representation:

      ```json
      {
        "orderby": [
          "updatedDate:desc"
        ]
      }
      ```

      This returns the most recently updated Authorship records first.

      ## Facets

      The `facets` option returns value buckets and counts for fields configured as facetable.

      **GET**

      ```bash
      curl --request GET \
        --url "https://api.core.ac.uk/v4/search/authorships?q=workId:12345&facets=sequence,isCorresponding&count=true&limit=0" \
        --header "Authorization: Bearer YOUR_API_KEY"
      ```

      **Equivalent POST**

      ```bash
      curl --request POST \
        --url "https://api.core.ac.uk/v4/search/authorships" \
        --header "Authorization: Bearer YOUR_API_KEY" \
        --header "Content-Type: application/json" \
        --data '{
          "q": "workId:12345",
          "facets": [
            "sequence",
            "isCorresponding"
          ],
          "count": true,
          "limit": 0
        }'
      ```

      ### Example facet response

      ```json
      {
        "totalHits": 4,
        "facets": {
          "sequence": [
            {
              "value": "first",
              "count": 1
            },
            {
              "value": "additional",
              "count": 2
            },
            {
              "value": "last",
              "count": 1
            }
          ],
          "isCorresponding": [
            {
              "value": true,
              "count": 1
            },
            {
              "value": false,
              "count": 3
            }
          ]
        },
        "results": []
      }
      ```

      Facet counts describe the complete matching result set, not only the records returned in the current page.

      Setting the `limit` to `0` returns facet buckets and counts without returning Authorship records.

      A separate endpoint such as the following is not required:

      ```
      POST /v4/search/authorships/aggregate
      ```

      ## Result count

      Set `count=true` to include the total number of matching Authorship records.

      **GET**

      ```
      GET /v4/search/authorships?q=authorId:67890&count=true
      ```

      **Equivalent POST**

      ```json
      {
        "q": "authorId:67890",
        "count": true
      }
      ```

      When `count` is omitted or set to `false`, `totalHits` may be omitted from the response.

      ## Pagination

      Use `limit` and `offset` to paginate through Authorship results.

      A deterministic `orderby` expression should be used when retrieving multiple pages.

      **First page using GET**

      ```
      GET /v4/search/authorships?q=authorId:67890&orderby=workId:asc&limit=20&offset=0
      ```

      **Second page using GET**

      ```
      GET /v4/search/authorships?q=authorId:67890&orderby=workId:asc&limit=20&offset=20
      ```

      **First page using POST**

      ```json
      {
        "q": "authorId:67890",
        "orderby": [
          "workId:asc"
        ],
        "limit": 20,
        "offset": 0
      }
      ```

      **Second page using POST**

      ```json
      {
        "q": "authorId:67890",
        "orderby": [
          "workId:asc"
        ],
        "limit": 20,
        "offset": 20
      }
      ```

      The offset is calculated as:

      ```
      offset = page size × number of previous pages
      ```

  - id: authorships-api-retrieve-affiliations
    title: Retrieve Affiliations for an Authorship
    content: |
      Retrieves the Affiliation records connected to an Authorship through the `authorship_affiliation` bridge.

      ## API endpoint

      ```
      GET https://api.core.ac.uk/v4/authorships/{authorshipId}/affiliations
      ```

      ## Path parameters

      | Parameter | Type | Required | Description |
      | --- | --- | --- | --- |
      | authorshipId | integer | Yes | CORE identifier of the Authorship whose Affiliations should be retrieved. |

      ## Example request

      ```bash
      curl --request GET \
        --url "https://api.core.ac.uk/v4/authorships/987654/affiliations" \
        --header "Authorization: Bearer YOUR_API_KEY"
      ```

      ## Example response

      ```json
      {
        "totalHits": 2,
        "results": [
          {
            "affiliationId": 901,
            "authorId": 67890,
            "rawAffiliation": "Department of Computer Science, University of Oxford, UK",
            "department": "Department of Computer Science",
            "institutionId": 3201,
            "institutionName": "University of Oxford"
          },
          {
            "affiliationId": 902,
            "authorId": 67890,
            "rawAffiliation": "Oxford Internet Institute, University of Oxford, UK",
            "department": "Oxford Internet Institute",
            "institutionId": 3201,
            "institutionName": "University of Oxford"
          }
        ]
      }
      ```

      This endpoint returns Affiliation records, not `authorship_affiliation` bridge records.

  - id: authorships-api-relationship-endpoints
    title: Relationship-oriented endpoints
    content: |
      Relationship-oriented endpoints provide convenient access to Authorship records through related graph entities.

      They do not introduce a different Authorship representation. Internally, they apply the appropriate relationship condition to the Authorship collection.

      ## Authorships for a Work

      ```
      GET /v4/works/{workId}/authorships
      ```

      Retrieves the Authorship records associated with a Work.

      By default, records should be ordered by:

      ```
      rank:asc
      ```

      Equivalent GET search:

      ```
      GET /v4/search/authorships?q=workId:{workId}&orderby=rank:asc
      ```

      Equivalent POST search:

      ```json
      {
        "q": "workId:{workId}",
        "orderby": [
          "rank:asc"
        ]
      }
      ```

      This relationship endpoint is documented under the Works entity.

      ## Authorships for an Author

      ```
      GET /v4/authors/{authorId}/authorships
      ```

      Retrieves all Authorship records associated with an Author.

      Equivalent GET search:

      ```
      GET /v4/search/authorships?q=authorId:{authorId}
      ```

      Equivalent POST search:

      ```json
      {
        "q": "authorId:{authorId}"
      }
      ```

      ## Affiliations for an Authorship

      ```
      GET /v4/authorships/{authorshipId}/affiliations
      ```

      This relationship is resolved through `authorship_affiliation`.

      ## Authorships for an Affiliation

      ```
      GET /v4/affiliations/{affiliationId}/authorships
      ```

      This relationship is also resolved through `authorship_affiliation`.


            id: works-api-supported-field-operations
            title: Supported field operations
            descriptionAbout: >-
              The table below describes which Work properties can be searched,
              queried through field lookups or ranges, ordered, or used as
              facets.


              | **Attribute**                    | **Searchable** | **Filterable** | **Sortable** | **Facetable** |

              | -------------------------------- | -------------- | -------------- | ------------ | ------------- |

              | `workId`                         | No             | Yes            | No           | No            |

              | `externalIdentifiers.type`       | No             | Yes            | No           | Yes           |

              | `externalIdentifiers.identifier` | No             | Yes            | No           | No            |

              | `title`                          | Yes            | No             | Yes          | No            |

              | `abstract`                       | Yes            | No             | No           | No            |

              | `invertedAbstract`               | No             | No             | No           | No            |

              | `fullText`                       | Yes            | No             | No           | No            |

              | `doi`                            | No             | Yes            | No           | No            |

              | `yearPublished`                  | No             | Yes            | Yes          | Yes           |

              | `documentType`                   | No             | Yes            | No           | Yes           |

              | `downloadUrl`                    | No             | No             | No           | No            |

              | `coreIds`                        | No             | Yes            | No           | No            |

              | `journalIds`                     | No             | Yes            | No           | No            |

              | `dataProviderIds`                | No             | Yes            | No           | Yes           |

              | `projectIds` | No | Yes | No | No |

              | `dates.type`                     | No             | Yes            | No           | Yes           |

              | `dates.value`                    | No             | Yes            | No           | No            |

              | `references.citationId`          | No             | Yes            | No           | No            |

              | `references.citedCoreId`         | No             | Yes            | No           | No            |

              | `references.citedDoi`            | No             | Yes            | No           | No            |

              | `references.articleTitle`        | Yes            | No             | No           | No            |

              | `references.author`              | Yes            | No             | No           | No            |

              | `references.journalTitle`        | Yes            | No             | No           | No            |

              | `references.volume`              | No             | No             | No           | No            |

              | `references.issue`               | No             | No             | No           | No            |

              | `references.startPage`           | No             | No             | No           | No            |

              | `references.endPage`             | No             | No             | No           | No            |

              | `references.unstructured`        | Yes            | No             | No           | No            |

              | `contributors.name`              | Yes            | No             | No           | No            |

              | `contributors.type`              | No             | Yes            | No           | Yes           |

              | `contributors.role`              | No             | Yes            | No           | Yes           |

              | `links.type`                     | No             | No             | No           | No            |

              | `links.url`                      | No             | No             | No           | No            |

              | `links.contentType`              | No             | No             | No           | No            |

              | `sourceFulltextUrls`             | No             | No             | No           | No            |


              The field-operation settings have the following meanings:


              * **Searchable** fields can participate in textual queries through `q`.

              * **Filterable** fields can be used in field lookups, Boolean conditions, ranges, and existence queries through `q`.

              * **Sortable** fields can be used with `orderby`.

              * **Facetable** fields can be used with `facets`.


              Refer to the common CORE API Query Language documentation for the complete syntax.


              #### Complex collection queries


              The following fields are collections of structured objects:


              * `externalIdentifiers`

              * `dates`

              * `references`

              * `contributors`

              * `links`


              When several conditions refer to the same collection, they must apply to the same collection item.


              For example:


              ```text

              externalIdentifiers.type:OPENALEX_ID

              AND externalIdentifiers.identifier:"https://openalex.org/W3030303030"

              ```


              Both conditions must match a single identifier object containing both values.


              Similarly:


              ```text

              dates.type:published

              AND dates.value>="2022-01-01"

              ```


              Both conditions must match a single date object where the `type` is `published` and the `value` is on or after `2022-01-01`.
          - divider: false
            border: false
            id: works-api-works-endpoints
            title: Works endpoints
            descriptionAbout: >-
              #### Available endpoints


              | **Operation**                          | **Method** | **Endpoint**                        |

              | -------------------------------------- | ---------- | ----------------------------------- |

              | Get a single Work                      | `GET`      | `/v4/works/{workId}`                |

              | Search Works using URL parameters      | `GET`      | `/v4/search/works`                  |

              | Search Works using a JSON request body | `POST`     | `/v4/search/works`                  |

              | Retrieve Outputs for a Work            | `GET`      | `/v4/works/{workId}/outputs`        |

              | Retrieve Authorships for a Work        | `GET`      | `/v4/works/{workId}/authorships`    |

              | Retrieve Journals for a Work           | `GET`      | `/v4/works/{workId}/journals`       |

              | Retrieve Data Providers for a Work     | `GET`      | `/v4/works/{workId}/data-providers` |

              | Retrieve Projects for a Work | `GET` | `/v4/works/{workId}/projects` |


              The `POST` search method is read-only. It does not create or modify Work records.


              #### Get a single Work


              Retrieves a single canonical Work record using its CORE Work identifier.


              ##### API endpoint


              ```http

              GET https://api.core.ac.uk/v4/works/{workId}

              ```


              ##### Authorization


              | **Parameter**   | **Location** | **Type** | **Required** | **Description**                                           |

              | --------------- | ------------ | -------- | ------------ | --------------------------------------------------------- |

              | `Authorization` | Header       | string   | Yes          | CORE API authentication token supplied as a Bearer token. |


              ##### Path parameters


              | **Parameter** | **Type** | **Required** | **Description**                     |

              | ------------- | -------- | ------------ | ----------------------------------- |

              | `workId`      | integer  | Yes          | Unique CORE identifier of the Work. |


              ##### Query parameters


              | **Parameter** | **Type** | **Required** | **Description**                                                                                                         |

              | ------------- | -------- | ------------ | ----------------------------------------------------------------------------------------------------------------------- |

              | `select`      | string   | No           | Comma-separated list of top-level Work fields to return. Example: `select=workId,title,doi,yearPublished,documentType`. |


              Example request:


              ```bash

              curl --request GET \
                --url "https://api.core.ac.uk/v4/works/323030168" \
                --header "Authorization: Bearer YOUR_API_KEY"
              ```


              Example request using `select`:


              ```bash

              curl --request GET \
                --url "https://api.core.ac.uk/v4/works/323030168?select=workId,title,doi,yearPublished,documentType,coreIds" \
                --header "Authorization: Bearer YOUR_API_KEY"
              ```


              Example response using `select`:


              ```json

              {
                "workId": 323030168,
                "title": "Intelligent edge computing for scholarly infrastructures",
                "doi": "10.1109/jiot.2020.2984887",
                "yearPublished": 2022,
                "documentType": [
                  "research article"
                ],
                "coreIds": [
                  216874849,
                  216874850
                ]
              }

              ```
          - divider: false
            border: false
            id: works-api-search-works
            title: Search Works
            descriptionAbout: >-
              Searches, filters, orders, facets, counts, and paginates canonical
              Work records.


              Works search supports:


              * Keyword search

              * Vector-based semantic search

              * Hybrid search combining keyword and vector relevance

              * Structured field conditions

              * Explicit client-generated vectors

              * Field selection, ordering, faceting, counting, and pagination


              Works search is available through `GET` and `POST`:


              | **Method** | **API endpoint**                         |

              | ---------- | ---------------------------------------- |

              | `GET`      | <https://api.core.ac.uk/v4/search/works> |

              | `POST`     | <https://api.core.ac.uk/v4/search/works> |


              Both methods return the same Works search-response structure.


              #### GET and POST search parameters


              ##### GET search parameters


              | **Parameter**     | **Type** | **Required** | **Default**                                       | **Description**                                                                                                            |

              | ----------------- | -------- | ------------ | ------------------------------------------------- | -------------------------------------------------------------------------------------------------------------------------- |

              | `q`               | string   | No           | `*`                                               | CORE query expression supporting textual search, field lookup, Boolean operators, grouping, ranges, and existence queries. |

              | `searchMode`      | string   | No           | `keyword`                                         | Search strategy. Supported values are `keyword`, `vector`, and `hybrid`.                                                   |

              | `semanticRanking` | boolean  | No           | `false`                                           | Applies semantic reranking to candidate results produced by hybrid search. Supported when `searchMode=hybrid`.             |

              | `vectorTopK`      | integer  | No           | Implementation-defined                            | Number of nearest vector candidates considered during vector or hybrid retrieval.                                          |

              | `orderby`         | string   | No           | Relevance for textual, vector, and hybrid queries | Comma-separated ordering directives in `field:direction` format.                                                           |

              | `select`          | string   | No           | All retrievable fields                            | Comma-separated list of Work fields to return.                                                                             |

              | `facets`          | string   | No           | —                                                 | Comma-separated list of facetable fields for which value buckets and counts should be returned.                            |

              | `count`           | boolean  | No           | `false`                                           | Indicates whether the total number of matching Work records should be included.                                            |

              | `limit`           | integer  | No           | `10`                                              | Maximum number of Work records to return.                                                                                  |

              | `offset`          | integer  | No           | `0`                                               | Number of matching Work records to skip.                                                                                   |


              The `GET` method supports text-based vector search. Explicit embedding vectors are accepted only through `POST`.


              #### POST request body


              | **Property**      | **Type**  | **Required** | **Default**                                       | **Description**                                                                                                |

              | ----------------- | --------- | ------------ | ------------------------------------------------- | -------------------------------------------------------------------------------------------------------------- |

              | `q`               | string    | No           | `*`                                               | CORE query expression containing textual content, structured conditions, or both.                              |

              | `searchMode`      | string    | No           | `keyword`                                         | Search strategy. Supported values are `keyword`, `vector`, and `hybrid`.                                       |

              | `semanticRanking` | boolean   | No           | `false`                                           | Applies semantic reranking to candidate results produced by hybrid search. Supported when `searchMode=hybrid`. |

              | `vector`          | number\[] | No           | —                                                 | Client-generated embedding used for vector or hybrid search.                                                   |

              | `vectorTopK`      | integer   | No           | Implementation-defined                            | Number of nearest vector candidates considered during vector or hybrid retrieval.                              |

              | `orderby`         | string\[] | No           | Relevance for textual, vector, and hybrid queries | Ordered list of sorting directives in `field:direction` format.                                                |

              | `select`          | string\[] | No           | All retrievable fields                            | List of Work fields to return.                                                                                 |

              | `facets`          | string\[] | No           | —                                                 | List of facetable fields for which value buckets and counts should be returned.                                |

              | `count`           | boolean   | No           | `false`                                           | Indicates whether the total number of matching Work records should be included.                                |

              | `limit`           | integer   | No           | `10`                                              | Maximum number of Work records to return.                                                                      |

              | `offset`          | integer   | No           | `0`                                               | Number of matching Work records to skip.                                                                       |


              ##### GET and POST parameter mapping


              | **GET query parameter**             | **POST body property**                        |

              | ----------------------------------- | --------------------------------------------- |

              | `q=yearPublished:2022`              | `"q": "yearPublished:2022"`                   |

              | `searchMode=vector`                 | `"searchMode": "vector"`                      |

              | `semanticRanking=true`              | `"semanticRanking": true`                     |

              | `searchMode=hybrid`                 | `"searchMode": "hybrid"`                      |

              | `vectorTopK=100`                    | `"vectorTopK": 100`                           |

              | Not supported through `GET`         | `"vector": [0.012, -0.084, 0.031, ...]`       |

              | `orderby=yearPublished:desc`        | `"orderby": ["yearPublished:desc"]`           |

              | `select=workId,title,doi`           | `"select": ["workId", "title", "doi"]`        |

              | `facets=documentType,yearPublished` | `"facets": ["documentType", "yearPublished"]` |

              | `count=true`                        | `"count": true`                               |

              | `limit=10`                          | `"limit": 10`                                 |

              | `offset=0`                          | `"offset": 0`                                 |


              #### Keyword search


              Keyword search uses textual relevance without vector similarity.


              ##### Search by title


              GET:


              ```http

              GET /v4/search/works?q=title:"edge computing"

              ```


              Equivalent POST:


              ```json

              {
                "q": "title:\"edge computing\"",
                "searchMode": "keyword"
              }

              ```


              ##### Search across all searchable Work fields


              ```http

              GET /v4/search/works?q="text and data mining"

              ```


              A broad textual query may search fields including:


              * `title`

              * `abstract`

              * `fullText`

              * Searchable reference fields

              * Searchable contributor fields


              When `orderby` is omitted, keyword results are ordered by textual relevance.


              ##### Search full text


              GET:


              ```http

              GET /v4/search/works?q=fullText:"text and data mining"

              ```


              Equivalent POST:


              ```json

              {
                "q": "fullText:\"text and data mining\"",
                "searchMode": "keyword"
              }

              ```
          - divider: false
            border: false
            id: works-api-search-examples
            title: Search examples
            descriptionAbout: >-
              #### Retrieve a Work by DOI


              GET:


              ```http

              GET /v4/search/works?q=doi:"10.1109/jiot.2020.2984887"

              ```


              Equivalent POST:


              ```json

              {
                "q": "doi:\"10.1109/jiot.2020.2984887\""
              }

              ```


              #### Retrieve a Work by external identifier


              GET:


              ```http

              GET /v4/search/works?q=externalIdentifiers.type:OPENALEX_ID AND externalIdentifiers.identifier:"https://openalex.org/W3030303030"

              ```


              Equivalent POST:


              ```json

              {
                "q": "externalIdentifiers.type:OPENALEX_ID AND externalIdentifiers.identifier:\"https://openalex.org/W3030303030\""
              }

              ```


              Both conditions must apply to the same `externalIdentifiers` object.


              #### Retrieve Works by publication year and document type


              GET:


              ```http

              GET /v4/search/works?q=yearPublished>=2020 AND documentType:"research article"

              ```


              Equivalent POST:


              ```json

              {
                "q": "yearPublished>=2020 AND documentType:\"research article\""
              }

              ```


              #### Retrieve the Work represented by an Output


              GET:


              ```http

              GET /v4/search/works?q=coreIds:216874849

              ```


              Equivalent POST:


              ```json

              {
                "q": "coreIds:216874849"
              }

              ```


              #### Retrieve Works associated with a Journal


              GET:


              ```http

              GET /v4/search/works?q=journalIds:12345

              ```


              Equivalent POST:


              ```json

              {
                "q": "journalIds:12345"
              }

              ```


              #### Retrieve Works associated with a Data Provider


              GET:


              ```http

              GET /v4/search/works?q=dataProviderIds:86

              ```


              Equivalent POST:


              ```json

              {
                "q": "dataProviderIds:86"
              }

              ```


              #### Retrieve Works citing a DOI


              GET:


              ```http

              GET /v4/search/works?q=references.citedDoi:"10.1000/abc456"

              ```


              Equivalent POST:


              ```json

              {
                "q": "references.citedDoi:\"10.1000/abc456\""
              }

              ```


              #### Retrieve Works classified under a Topic


              GET:


              ```http

              GET /v4/search/works?q=topics.topicId:T1001

              ```


              Equivalent POST:


              ```json

              {
                "q": "topics.topicId:T1001"
              }

              ```


              #### Search Works by Topic name


              GET:


              ```http

              GET /v4/search/works?q=topics.displayName:"artificial intelligence"

              ```


              Equivalent POST:


              ```json

              {
                "q": "topics.displayName:\"artificial intelligence\""
              }

              ```


              #### Retrieve Works with at least ten references


              GET:


              ```http

              GET /v4/search/works?q=referenceCount>=10

              ```


              Equivalent POST:


              ```json

              {
                "q": "referenceCount>=10"
              }

              ```


              #### Retrieve highly cited Works


              GET:


              ```http

              GET /v4/search/works?q=citationCount>=100&orderby=citationCount:desc

              ```


              Equivalent POST:


              ```json

              {
                "q": "citationCount>=100",
                "orderby": [
                  "citationCount:desc"
                ]
              }

              ```


              #### Retrieve Works associated with a Citation record


              GET:


              ```http

              GET /v4/search/works?q=citationIds:7865

              ```


              Equivalent POST:


              ```json

              {
                "q": "citationIds:7865"
              }

              ```


              #### Find Works citing a DOI using Citation search


              GET:


              ```http

              GET /v4/search/citations?q=citedDoi:"10.1000/abc456"

              ```


              Equivalent POST:


              ```json

              {
                "q": "citedDoi:\"10.1000/abc456\""
              }

              ```


              The returned Citation records contain the `citingWorkId` values identifying the Works that cite the DOI.


              #### Retrieve Works with full text


              GET:


              ```http

              GET /v4/search/works?q=_exists_:fullText

              ```


              Equivalent POST:


              ```json

              {
                "q": "_exists_:fullText"
              }

              ```


              #### Facets with vector search


              Facets may be requested with keyword, vector, and hybrid searches.


              GET:


              ```http

              GET /v4/search/works?q="climate change"&searchMode=hybrid&facets=documentType,yearPublished&count=true&limit=0

              ```


              Equivalent POST:


              ```json

              {
                "q": "\"climate change\"",
                "searchMode": "hybrid",
                "facets": [
                  "documentType",
                  "yearPublished"
                ],
                "count": true,
                "limit": 0
              }

              ```


              The API implementation should define whether vector and hybrid facet counts are calculated over:


              * The complete filtered index

              * The vector candidate set

              * The final ranked result set


              This behaviour should be stated explicitly because it affects how clients interpret facet counts.


              #### Pagination with vector search


              Vector and hybrid results may be paginated using `limit` and `offset`.


              ##### First page


              ```json

              {
                "q": "\"artificial intelligence in education\"",
                "searchMode": "hybrid",
                "limit": 20,
                "offset": 0
              }

              ```


              ##### Second page


              ```json

              {
                "q": "\"artificial intelligence in education\"",
                "searchMode": "hybrid",
                "limit": 20,
                "offset": 20
              }

              ```


              For stable pagination, clients should use the same query, search mode, vector, candidate settings, and index version across requests.


              Because vector indexes may be updated between requests, results may change when pagination requests are made at different times.


              Example vector-search response:


              ```json

              {
                "totalHits": 245,
                "searchMode": "vector",
                "results": [
                  {
                    "workId": 323030168,
                    "title": "Text and data mining for scholarly repositories",
                    "abstract": "This study examines semantic discovery across scholarly repositories.",
                    "yearPublished": 2025,
                    "documentType": [
                      "research article"
                    ],
                    "relevanceScore": 0.873
                  },
                  {
                    "workId": 323030169,
                    "title": "Semantic retrieval for open research infrastructures",
                    "abstract": "A vector-based method for discovering related scholarly resources.",
                    "yearPublished": 2024,
                    "documentType": [
                      "research article"
                    ],
                    "relevanceScore": 0.846
                  }
                ]
              }

              ```


              Include `searchMode` and `relevanceScore` only if the implementation returns them.


              #### Search responses


              | **Status** | **Description**                                                                                                                                                                          |

              | ---------- | ---------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- |

              | `200`      | The Work search was completed successfully.                                                                                                                                              |

              | `400`      | The request contains an invalid query, unsupported search mode, invalid vector, incompatible vector dimensions, unsupported field, invalid facet, or invalid response-control parameter. |

              | `401`      | Authentication credentials are missing or invalid.                                                                                                                                       |

              | `413`      | The `POST` request body exceeds the permitted size.                                                                                                                                      |

              | `429`      | The API request limit has been exceeded.                                                                                                                                                 |

              | `500`      | An unexpected server error occurred.                                                                                                                                                     |
          - divider: false
            border: false
            id: works-api-relationship-oriented-endpoints
            title: Relationship-oriented endpoints
            descriptionAbout: >-
              
              Relationship-oriented endpoints provide convenient access to records connected to a Work.


              #### Outputs for a Work


              Retrieves the Output records represented by the canonical Work.


              ##### API endpoint


              ```http

              GET /v4/works/{workId}/outputs

              ```


              Example request:


              ```bash

              curl --request GET \
                --url "https://api.core.ac.uk/v4/works/323030168/outputs?count=true&limit=10&offset=0" \
                --header "Authorization: Bearer YOUR_API_KEY"
              ```


              Example response:


              ```json

              {
                "totalHits": 2,
                "results": [
                  {
                    "coreId": 216874849,
                    "dataProviderId": 86,
                    "title": "Intelligent edge computing for scholarly infrastructures",
                    "doi": "10.1109/jiot.2020.2984887",
                    "yearPublished": 2022
                  },
                  {
                    "coreId": 216874850,
                    "dataProviderId": 144,
                    "title": "Intelligent edge computing for scholarly infrastructures",
                    "doi": "10.1109/jiot.2020.2984887",
                    "yearPublished": 2022
                  }
                ]
              }

              ```


              Because Outputs do not contain a `workId`, this relationship endpoint is not equivalent to a simple `q=workId:{workId}` Output search.


              #### Authorships for a Work


              Retrieves the canonical Authorship records associated with the Work.


              ##### API endpoint


              ```http

              GET /v4/works/{workId}/authorships

              ```


              By default, Authorship records should be ordered by `rank:asc`.


              Equivalent GET search:


              ```http

              GET /v4/search/authorships?q=workId:{workId}&orderby=rank:asc

              ```


              Equivalent POST search:


              ```json

              {
                "q": "workId:{workId}",
                "orderby": [
                  "rank:asc"
                ]
              }

              ```


              #### Journals for a Work


              Retrieves the complete Journal records referenced by the Work's `journalIds`.


              ##### API endpoint


              ```http

              GET /v4/works/{workId}/journals

              ```


              #### Data Providers for a Work


              Retrieves the complete Data Provider records referenced by the Work's `dataProviderIds`.


              ##### API endpoint


              ```http

              GET /v4/works/{workId}/data-providers

              ```



              #### Projects for a Work


              ```http

              GET /v4/works/{workId}/projects

              ```


              Retrieves Projects records referenced by projectIds.


              Example request:


              ```GET /v4/works/323030168/projects?count=true&limit=10&offset=0

              ```


              The relationship is resolved as:


              Works.projectIds → Projects.projectId


              An existing Work with no associated Projects returns 200 OK with an empty results array.



              A reverse endpoint can remain in the Projects documentation:


              ```http

              GET /v4/projects/{projectId}/works

              ```
      - item: Outputs
        sections:
          - divider: false
            border: false
            id: outputs-api-introduction
            title: Introduction
            descriptionAbout: >-
              

              The Output entity represents a source-specific manifestation of a scholarly research item harvested by CORE.


              An Output corresponds to a record supplied by a Data Provider, such as:


              * An institutional repository

              * A subject repository

              * A preprint server

              * A Journal

              * A Publisher platform

              * Another scholarly metadata source


              Unlike a Work, which is a canonical and deduplicated representation of a research item, an Output preserves the metadata and full-text information associated with a particular source record.


              An Output may also contain information derived by CORE, including:


              * Normalised document types

              * Publication language

              * Access-rights and licence information

              * Sustainable Development Goal classifications

              * Full-text availability status
            images:
              - file: /images/docs-graph/outputs.png
            subTitle: ""
            subDescription: |-
              Each Output:

              * has exactly one CORE Output identifier;
              * is associated with one Data Provider;
              * may be associated with one Journal;
              * may be associated with one Publisher;
              * may be represented by one canonical Work.
          - divider: false
            border: false
            id: outputs-api-data-structure
            title: Data structure
            descriptionAbout: >-
              The following table describes the top-level fields in the CORE
              Graph metadata schema for the Output entity.


              | **Property**           | **Type**  | **Example value**                                                           | **Description**                                                                              | **Source**                                                     |

              | ---------------------- | --------- | --------------------------------------------------------------------------- | -------------------------------------------------------------------------------------------- | -------------------------------------------------------------- |

              | `coreId`               | integer   | `216874849`                                                                 | Unique CORE identifier for the Output.                                                       | CORE                                                           |

              | `dataProviderId`       | integer   | `86`                                                                        | CORE identifier of the Data Provider from which the Output was harvested.                    | CORE                                                           |

              | `publisherId`          | integer   | `78`                                                                        | CORE identifier of the Publisher associated with the Output, when resolved.                  | CORE / Crossref                                                |

              | `journalId`            | integer   | `12345`                                                                     | CORE identifier of the Journal associated with the Output, when resolved.                    | CORE / ISSN resolution                                         |

              | `externalIdentifiers`* | object\[] | `[{"type":"DOI","identifier":"10.1000/xyz"}]`                               | Normalised external identifiers associated with the Output.                                  | OAI-PMH / Crossref / OpenAlex / OpenAIRE / CORE                |

              | `title`                | string    | `"Sustainable Development Goals and Research"`                              | Title of the Output as supplied or selected from source metadata.                            | OAI-PMH / Source metadata                                      |

              | `invertedAbstract`*    | object    | `{"This":[0],"paper":[1],"explores":[2]}`                                   | Abstract represented as an inverted index in which each token maps to its positions.         | OAI-PMH / Derived by CORE                                      |

              | `fullText`             | string    | `"Full extracted text..."`                                                  | Full text extracted from the source document.                                                | PDF parsing / Source full text                                 |

              | `fullTextStatus`       | string    | `"enabled"`                                                                 | Status indicating the availability or processing state of the Output full text.              | CORE                                                           |

              | `yearPublished`        | integer   | `2022`                                                                      | Publication year derived from the preferred publication date.                                | Derived by CORE                                                |

              | `documentType`         | string\[] | `["research article"]`                                                      | Normalised document types associated with the Output.                                        | OAI-PMH / Crossref / OpenAlex / OpenAIRE / CORE classification |

              | `subjects`             | string\[] | `["Journal Article","PeerReviewed"]`                                        | Subject or classification labels supplied by the source.                                     | OAI-PMH / Source metadata                                      |

              | `issn`                 | string    | `"1744-9081"`                                                               | ISSN associated with the Journal or publication venue.                                       | OAI-PMH / Crossref / ISSN resolution                           |

              | `downloadUrl`          | string    | `"https://core.ac.uk/download/216874849.pdf"`                               | Preferred URL for downloading the Output full text.                                          | CORE                                                           |

              | `disabled`             | boolean   | `false`                                                                     | Indicates whether the Output has been disabled in CORE.                                      | CORE                                                           |

              | `deleted`              | string    | `"ALLOWED"`                                                                 | Source or CORE status describing whether the Output is accessible or has been removed.       | CORE                                                           |

              | `dates`*               | object\[] | `[{"type":"published","value":"2022-04-27"}]`                               | Structured publication, deposit, collection, and record-management dates.                    | OAI-PMH / Crossref / DataCite / OpenAIRE / CORE                |

              | `ids`*                 | object\[] | `[{"type":"OAI_ID","identifier":"oai:repo.org:123"}]`                       | Raw or source-specific identifier objects retained for provenance.                           | OAI-PMH / Source metadata                                      |

              | `accessRights`*        | object\[] | `[{"accessRight":"open access","isOpenAccess":true}]`                       | Structured access-right and open-access information.                                         | COAR / OpenAIRE / OpenAlex / DataCite / RIOXX                  |

              | `contributors`*        | object\[] | `[{"name":"Alice Smith","type":"Personal","role":"editor"}]`                | People or organisations contributing to the Output in roles other than canonical Authorship. | OAI-PMH / Crossref / DataCite / OpenAIRE                       |

              | `language`*            | object\[] | `[{"code":"en","name":"English"}]`                                          | Structured language information associated with the Output.                                  | OAI-PMH / Language detection                                   |

              | `sourceFulltextUrls`   | string\[] | `["https://repo.org/file.pdf"]`                                             | Source URLs at which full text is available.                                                 | OAI-PMH / Repository metadata                                  |

              | `links`*               | object\[] | `[{"type":"download","url":"https://core.ac.uk/download/216874849.pdf"}]`   | CORE-generated or structured links associated with the Output.                               | CORE                                                           |

              | `urls`                 | string\[] | `["https://repo.org/item/123"]`                                             | Related URLs supplied in source metadata.                                                    | OAI-PMH / Source metadata                                      |

              | `license`*             | object    | `{"name":"CC BY 4.0","uri":"https://creativecommons.org/licenses/by/4.0/"}` | Structured licence information associated with the Output.                                   | OAI-PMH / Crossref / OpenAIRE / OpenAlex / RIOXX               |

              | `sdg`*                 | object\[] | `[{"type":"SDG04","score":0.92}]`                                           | Sustainable Development Goal classifications assigned to the Output.                         | CORE ML model                                                  |


              \* More information is provided in the following sections.


              #### Identifiers


              ##### Normalised external identifiers


              The `externalIdentifiers` property contains normalised identifiers associated with the Output.


              ```json

              {
                "externalIdentifiers": [
                  {
                    "type": "CORE_ID",
                    "identifier": "216874849"
                  },
                  {
                    "type": "DOI",
                    "identifier": "10.1000/xyz"
                  },
                  {
                    "type": "OAI_ID",
                    "identifier": "oai:repo.org:123"
                  },
                  {
                    "type": "ARXIV_ID",
                    "identifier": "1909.00560"
                  },
                  {
                    "type": "OPENALEX_ID",
                    "identifier": "https://openalex.org/W3030303030"
                  }
                ]
              }

              ```


              | **Property** | **Type** | **Example value** | **Description**                              |

              | ------------ | -------- | ----------------- | -------------------------------------------- |

              | `type`       | string   | `"DOI"`           | Identifier scheme or classification.         |

              | `identifier` | string   | `"10.1000/xyz"`   | Identifier value associated with the Output. |


              T﻿he property, `type` can have following values:


              | **Value**     | **Description**                      |

              | ------------- | ------------------------------------ |

              | `CORE_ID`     | CORE Output identifier.              |

              | `DOI`         | Digital Object Identifier.           |

              | `OAI_ID`      | OAI-PMH identifier.                  |

              | `ARXIV_ID`    | arXiv identifier.                    |

              | `OPENALEX_ID` | OpenAlex Work identifier.            |

              | `OPENAIRE_ID` | OpenAIRE identifier.                 |

              | `MAG_ID`      | Microsoft Academic Graph identifier. |

              | `PMID`        | PubMed identifier.                   |

              | `PMCID`       | PubMed Central identifier.           |


              #### Raw identifier objects


              The ER model contains both `externalIdentifiers` and `ids`.


              The recommended distinction is:


              | **Property**          | **Purpose**                                                                                   |

              | --------------------- | --------------------------------------------------------------------------------------------- |

              | `externalIdentifiers` | Normalised identifier values using the CORE identifier model.                                 |

              | `ids`                 | Raw source-specific identifier structures retained for provenance or backwards compatibility. |


              If CORE does not require both representations, `ids` should be removed and all identifiers should be consolidated under `externalIdentifiers`.


              #### Inverted abstract


              The `invertedAbstract` property contains a position-based representation of the abstract.


              ```json

              {
                "invertedAbstract": {
                  "This": [
                    0
                  ],
                  "paper": [
                    1
                  ],
                  "explores": [
                    2
                  ]
                }
              }

              ```


              Each key represents a token. The corresponding array contains the positions at which the token occurs.


              #### Dates


              The `dates` property contains structured dates associated with the Output.


              ```json

              {
                "dates": [
                  {
                    "type": "published",
                    "value": "2022-04-27"
                  },
                  {
                    "type": "accepted",
                    "value": "2022-03-15"
                  },
                  {
                    "type": "deposited",
                    "value": "2022-04-28T11:42:34Z"
                  },
                  {
                    "type": "collected",
                    "value": "2022-05-02T09:00:00Z"
                  },
                  {
                    "type": "updated",
                    "value": "2024-08-16T00:03:23Z"
                  }
                ]
              }

              ```


              | **Property** | **Type** | **Example value** | **Description**                   |

              | ------------ | -------- | ----------------- | --------------------------------- |

              | `type`       | string   | `"published"`     | Classification of the date.       |

              | `value`      | string   | `"2022-04-27"`    | ISO 8601 date or date-time value. |


              Supported date types may include:


              | **Value**          | **Description**                                       | **Source**                                          |

              | ------------------ | ----------------------------------------------------- | --------------------------------------------------- |

              | `published`        | Preferred publication date.                           | OAI-PMH / DataCite / Crossref / OpenAlex / OpenAIRE |

              | `published_online` | Online publication date.                              | Crossref                                            |

              | `published_print`  | Print publication date.                               | Crossref                                            |

              | `issued`           | Date on which the resource was formally issued.       | Dublin Core Terms / Crossref                        |

              | `accepted`         | Date on which the resource was accepted.              | Dublin Core Terms / Crossref                        |

              | `deposited`        | Date on which metadata was deposited with the source. | Crossref                                            |

              | `created`          | Date on which the source or CORE record was created.  | CORE / Crossref / OpenAlex                          |

              | `updated`          | Date on which the Output record was last updated.     | CORE / Crossref / OpenAIRE / OpenAlex               |

              | `indexed`          | Date on which the Output was indexed by CORE.         | CORE                                                |

              | `available`        | Date on which the resource became available.          | DataCite / OAI-PMH                                  |

              | `public_release`   | Date on which the resource was publicly released.     | RIOXX                                               |

              | `collected`        | Date on which CORE collected the source record.       | CORE / OpenAIRE                                     |


              Because `dates` is a collection, the Output cannot be unambiguously ordered by `dates.value`.


              Frequently used dates should be exposed as top-level fields if direct ordering is required.


              #### Contributors


              The `contributors` property contains people or organisations that contributed to the Output in roles other than canonical Authorship.


              ```json

              {
                "contributors": [
                  {
                    "name": "CiteSeerX",
                    "type": "Organisational",
                    "role": null
                  },
                  {
                    "name": "Alice Smith",
                    "type": "Personal",
                    "role": "editor"
                  },
                  {
                    "name": "國立中興大學應用數學系",
                    "type": "Organisational",
                    "role": "hosting_institution"
                  }
                ]
              }

              ```


              | **Property** | **Type** | **Example value** | **Description**                                                | **Source**                                       |

              | ------------ | -------- | ----------------- | -------------------------------------------------------------- | ------------------------------------------------ |

              | `name`       | string   | `"Alice Smith"`   | Name of the contributing person or organisation.               | OAI-PMH / RIOXX / DataCite / Crossref / OpenAIRE |

              | `type`       | string   | `"Personal"`      | Indicates whether the contributor is a person or organisation. | DataCite / OpenAIRE                              |

              | `role`       | string   | `"editor"`        | Role performed by the contributor.                             | Crossref / DataCite / OpenAIRE                   |


              Possible roles may include:


              * `editor`

              * `translator`

              * `reviewer`

              * `hosting_institution`


              Canonical Authors are not represented through this collection.


              #### Language


              The `language` property contains structured language information.


              ```json

              {
                "language": [
                  {
                    "id": 1,
                    "code": "en",
                    "name": "English"
                  }
                ]
              }

              ```


              | **Property** | **Type** | **Example value** | **Description**                                                      | **Source**                   |

              | ------------ | -------- | ----------------- | -------------------------------------------------------------------- | ---------------------------- |

              | `id`         | integer  | `1`               | Internal identifier for the language classification, when available. | CORE                         |

              | `code`       | string   | `"en"`            | ISO 639 language code.                                               | OAI-PMH / Language detection |

              | `name`       | string   | `"English"`       | Human-readable language name.                                        | OAI-PMH / CORE               |


              An Output may contain multiple language records when more than one language is identified.


              #### Access rights


              The `accessRights` property contains structured access and open-access information.


              ```json

              {
                "accessRights": [
                  {
                    "accessRight": "open access",
                    "accessRightUri": "http://purl.org/coar/access_right/c_abf2",
                    "scheme": "COAR",
                    "isOpenAccess": true,
                    "oaStatus": "gold",
                    "openAccessRoute": "gold",
                    "freeToRead": true,
                    "accessStartDate": "2022-05-01",
                    "accessEndDate": null,
                    "embargoEndDate": null,
                    "version": "publishedVersion",
                    "oaUrl": "https://example.org/article",
                    "pdfUrl": "https://example.org/article.pdf",
                    "anyRepositoryHasFulltext": true,
                    "raw": [
                      "open access",
                      "http://purl.org/coar/access_right/c_abf2"
                    ]
                  }
                ]
              }

              ```


              | **Property**               | **Type**  | **Example value**                            | **Description**                                                               | **Source**                               |

              | -------------------------- | --------- | -------------------------------------------- | ----------------------------------------------------------------------------- | ---------------------------------------- |

              | `accessRight`              | string    | `"open access"`                              | Human-readable access-right status.                                           | COAR / OpenAIRE / OAI-PMH / DataCite     |

              | `accessRightUri`           | string    | `"http://purl.org/coar/access_right/c_abf2"` | URI identifying the access-right status.                                      | COAR / DataCite / OpenAIRE               |

              | `scheme`                   | string    | `"COAR"`                                     | Vocabulary or scheme used for the access-right value.                         | OpenAIRE                                 |

              | `isOpenAccess`             | boolean   | `true`                                       | Indicates whether the Output is considered open access.                       | OpenAlex / OpenAIRE / Derived by CORE    |

              | `oaStatus`                 | string    | `"gold"`                                     | Open-access status, such as `gold`, `green`, `bronze`, `hybrid`, or `closed`. | OpenAlex / OpenAIRE                      |

              | `openAccessRoute`          | string    | `"gold"`                                     | Open-access route, when supplied separately from the status.                  | OpenAIRE                                 |

              | `freeToRead`               | boolean   | `true`                                       | Indicates whether the Output is free to read.                                 | RIOXX / ALI                              |

              | `accessStartDate`          | string    | `"2022-05-01"`                               | Date from which access begins.                                                | RIOXX / Crossref / Qualified Dublin Core |

              | `accessEndDate`            | string    | `"2024-05-01"`                               | Date on which access ends, when supplied.                                     | RIOXX                                    |

              | `embargoEndDate`           | string    | `"2023-05-01"`                               | Date on which an embargo ends.                                                | OpenAIRE                                 |

              | `version`                  | string    | `"publishedVersion"`                         | Version associated with the accessible copy.                                  | Crossref / RIOXX / OpenAlex / OpenAIRE   |

              | `oaUrl`                    | string    | `"https://example.org/article"`              | Landing-page URL of an open-access copy.                                      | OpenAlex                                 |

              | `pdfUrl`                   | string    | `"https://example.org/article.pdf"`          | Direct PDF URL of an open-access copy.                                        | OpenAlex                                 |

              | `anyRepositoryHasFulltext` | boolean   | `true`                                       | Indicates whether any known repository provides full text.                    | OpenAlex                                 |

              | `raw`                      | string\[] | `["open access"]`                            | Raw access-right strings supplied by source metadata.                         | OAI-PMH / OpenAIRE                       |


              #### Licence


              The `license` property contains structured licence information associated with the Output.


              ```json

              {
                "license": {
                  "name": "CC BY 4.0",
                  "uri": "https://creativecommons.org/licenses/by/4.0/",
                  "startDate": "2022-05-01",
                  "delayDays": 0,
                  "contentVersion": "published",
                  "raw": [
                    "CC-BY",
                    "http://creativecommons.org/licenses/by/4.0/"
                  ]
                }
              }

              ```


              | **Property**     | **Type**  | **Example value**                                | **Description**                                  | **Source**                             |

              | ---------------- | --------- | ------------------------------------------------ | ------------------------------------------------ | -------------------------------------- |

              | `name`           | string    | `"CC BY 4.0"`                                    | Normalised licence name.                         | OAI-PMH / OpenAIRE / OpenAlex          |

              | `uri`            | string    | `"https://creativecommons.org/licenses/by/4.0/"` | URI containing or identifying the licence terms. | Crossref / OpenAIRE / OpenAlex / RIOXX |

              | `startDate`      | string    | `"2022-05-01"`                                   | Date from which the licence applies.             | Crossref / RIOXX / OpenAIRE            |

              | `delayDays`      | integer   | `365`                                            | Embargo or licence delay in days.                | Crossref                               |

              | `contentVersion` | string    | `"published"`                                    | Content version covered by the licence.          | Crossref                               |

              | `raw`            | string\[] | `["CC-BY"]`                                      | Raw licence strings supplied by source metadata. | OAI-PMH / OpenAIRE / Crossref          |


              #### Links


              The `links` property contains structured links generated or normalised by CORE.


              ```json

              {
                "links": [
                  {
                    "type": "reader",
                    "url": "https://core.ac.uk/outputs/216874849",
                    "contentType": "text/html"
                  },
                  {
                    "type": "download",
                    "url": "https://core.ac.uk/download/216874849.pdf",
                    "contentType": "application/pdf"
                  }
                ]
              }

              ```


              | **Property**  | **Type** | **Example value**                             | **Description**                        |

              | ------------- | -------- | --------------------------------------------- | -------------------------------------- |

              | `type`        | string   | `"download"`                                  | Classification of the linked resource. |

              | `url`         | string   | `"https://core.ac.uk/download/216874849.pdf"` | URL of the linked resource.            |

              | `contentType` | string   | `"application/pdf"`                           | MIME type of the linked resource.      |


              The `urls` property separately retains related URLs supplied by source metadata.


              #### Output status


              ##### Full-text status


              The `fullTextStatus` property describes the availability or processing state of the full text.


              ```json

              {
                "fullTextStatus": "enabled"
              }

              ```


              The supported vocabulary must be documented by CORE. Possible values should not be inferred solely from whether `fullText` is `null`.


              ##### Disabled status


              ```json

              {
                "disabled": false
              }

              ```


              A value of `true` indicates that CORE has disabled the Output.


              ##### Deleted status


              ```json

              {
                "deleted": "ALLOWED"
              }

              ```


              The `deleted` field is represented as a string in the ER model. Its controlled vocabulary and meaning should be defined before public release.


              If this field is intended to represent a simple deleted/not-deleted state, it should instead be modelled as:


              ```text

              boolean | null

              ```


              #### Sustainable Development Goals


              The `sdg` property contains Sustainable Development Goal classifications assigned to the Output by a CORE machine-learning model.


              ```json

              {
                "sdg": [
                  {
                    "type": "SDG04",
                    "score": 0.92
                  },
                  {
                    "type": "SDG09",
                    "score": 0.76
                  }
                ]
              }

              ```


              | **Property** | **Type** | **Example value** | **Description**                                                                                                          | **Source**    |

              | ------------ | -------- | ----------------- | ------------------------------------------------------------------------------------------------------------------------ | ------------- |

              | `type`       | string   | `"SDG04"`         | Identifier of the United Nations Sustainable Development Goal assigned to the Output.                                    | CORE ML model |

              | `score`      | number   | `0.92`            | Confidence or relevance score for the SDG classification. Higher values indicate stronger model confidence or relevance. | CORE ML model |


              Example Output record:


              ```json

              {
                "coreId": 216874849,
                "dataProviderId": 86,
                "publisherId": 78,
                "journalId": 12345,
                "externalIdentifiers": [
                  {
                    "type": "CORE_ID",
                    "identifier": "216874849"
                  },
                  {
                    "type": "DOI",
                    "identifier": "10.1000/xyz"
                  },
                  {
                    "type": "OAI_ID",
                    "identifier": "oai:repo.org:123"
                  }
                ],
                "title": "Sustainable Development Goals and Research",
                "invertedAbstract": {
                  "This": [
                    0
                  ],
                  "paper": [
                    1
                  ],
                  "explores": [
                    2
                  ]
                },
                "fullText": "Full extracted text...",
                "fullTextStatus": "enabled",
                "yearPublished": 2022,
                "documentType": [
                  "research article"
                ],
                "subjects": [
                  "Journal Article",
                  "PeerReviewed"
                ],
                "issn": "1744-9081",
                "downloadUrl": "https://core.ac.uk/download/216874849.pdf",
                "disabled": false,
                "deleted": "ALLOWED",
                "dates": [
                  {
                    "type": "published",
                    "value": "2022-04-27"
                  },
                  {
                    "type": "deposited",
                    "value": "2022-04-28T11:42:34Z"
                  },
                  {
                    "type": "updated",
                    "value": "2024-08-16T00:03:23Z"
                  }
                ],
                "ids": [
                  {
                    "type": "OAI_ID",
                    "identifier": "oai:repo.org:123"
                  }
                ],
                "accessRights": [
                  {
                    "accessRight": "open access",
                    "accessRightUri": "http://purl.org/coar/access_right/c_abf2",
                    "scheme": "COAR",
                    "isOpenAccess": true,
                    "oaStatus": "gold",
                    "openAccessRoute": "gold",
                    "freeToRead": true,
                    "accessStartDate": "2022-05-01",
                    "accessEndDate": null,
                    "embargoEndDate": null,
                    "version": "publishedVersion",
                    "oaUrl": "https://example.org/article",
                    "pdfUrl": "https://example.org/article.pdf",
                    "anyRepositoryHasFulltext": true,
                    "raw": [
                      "open access"
                    ]
                  }
                ],
                "contributors": [
                  {
                    "name": "Alice Smith",
                    "type": "Personal",
                    "role": "editor"
                  }
                ],
                "language": [
                  {
                    "id": 1,
                    "code": "en",
                    "name": "English"
                  }
                ],
                "sourceFulltextUrls": [
                  "https://repo.org/file.pdf"
                ],
                "links": [
                  {
                    "type": "reader",

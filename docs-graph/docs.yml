          }

          ```


          The vector in this example is shortened for readability. A real request must contain the complete embedding required by the configured Work vector index.


          When an explicit vector is supplied:


          * CORE uses the supplied vector instead of generating one from query text

          * `q` may contain structured conditions

          * The vector must be compatible with the Work vector index


          The public API documentation must specify:


          * The embedding model or compatible vector-generation method

          * The required number of vector dimensions

          * The accepted numeric format

          * Whether vectors must be normalised

          * The maximum request-body size


          #### Hybrid search using a user-generated vector


          A user-generated vector may be combined with keyword relevance.


          ```json

          {
            "q": "title:\"data mining\" AND yearPublished>=2020",
            "vector": [
              0.012,
              -0.084,
              0.031,
              0.107
            ],
            "searchMode": "hybrid",
            "vectorTopK": 100,
            "select": [
              "workId",
              "title",
              "abstract",
              "yearPublished"
            ],
            "limit": 10
          }

          ```


          This request combines:


          * Keyword relevance for `data mining`

          * Semantic similarity using the supplied vector

          * A publication-year restriction


          #### Explicit vector validation


          A request containing `vector` should be rejected when:


          * `searchMode` is `keyword`

          * The vector has the wrong number of dimensions

          * The vector contains invalid numeric values

          * The vector is empty

          * The vector is incompatible with the configured Work vector index


          Example invalid request:


          ```json

          {
            "searchMode": "keyword",
            "vector": [
              0.12,
              0.34
            ]
          }

          ```


          Recommended response:


          ```json

          {
            "status": 400,
            "message": "The vector property can only be used when searchMode is vector or hybrid."
          }

          ```


          #### Vector candidate count


          The optional `vectorTopK` property controls the number of nearest vector candidates considered before final result processing.


          Example:


          ```json

          {
            "q": "\"scholarly document classification\"",
            "searchMode": "vector",
            "vectorTopK": 100,
            "limit": 10
          }

          ```


          `vectorTopK` is not the number of records returned.


          In this example:


          * Up to 100 nearest vector candidates are considered

          * At most 10 records are returned


          CORE should define:


          * The default value

          * The minimum permitted value

          * The maximum permitted value

          * Whether the value can be overridden by all API plans


          #### Vector and hybrid result ordering


          When `searchMode=vector` and `orderby` is omitted, results are ordered by vector similarity.


          When `searchMode=hybrid` and `orderby` is omitted, results are ordered by combined keyword and vector relevance.


          Applying an explicit `orderby` expression may replace relevance-based ordering.


          For example:


          ```http

          GET /v4/search/works?q="machine learning"&searchMode=vector&orderby=yearPublished:desc

          ```


          This request orders the matching Works by publication year rather than vector similarity.


          API users should omit `orderby` when semantic or hybrid relevance should determine the result order.


          #### Search-result scores


          Vector and hybrid relevance scores are search-result metadata. They are not persistent Work properties and should not be included in the Work data-structure table.


          When exposed, a search result may include:


          ```json

          {
            "workId": 323030168,
            "title": "Text and data mining for scholarly repositories",
            "yearPublished": 2025,
            "relevanceScore": 0.873
          }

          ```


          The API should document whether `relevanceScore` represents:


          * Keyword relevance

          * Vector similarity

          * Combined hybrid relevance


          Scores generated by different search modes should not be assumed to be directly comparable.




          #### Facets with vector search


          Facets may be requested with keyword, vector, and hybrid searches.


          GET request:


          ```http

          GET /v4/search/works?q="climate change"&searchMode=hybrid&facets=documentType,yearPublished&count=true&limit=0

          ```


          Equivalent POST request:


          ```json

          {
            "q": "\"climate change\"",
            "searchMode": "hybrid",
            "facets": [
              "documentType",
              "yearPublished"
            ],
            "count": true,
            "limit": 0
          }

          ```


          The API implementation should define whether vector and hybrid facet counts are calculated over:


          - The complete filtered index

          - The vector candidate set

          - The final ranked result set


          This behaviour should be stated explicitly because it affects how clients interpret facet counts.


          #### Pagination with vector search


          Vector and hybrid results may be paginated using `limit` and `offset`.


          First page:


          ```json

          {
            "q": "\"artificial intelligence in education\"",
            "searchMode": "hybrid",
            "limit": 20,
            "offset": 0
          }

          ```


          Second page:


          ```json

          {
            "q": "\"artificial intelligence in education\"",
            "searchMode": "hybrid",
            "limit": 20,
            "offset": 20
          }

          ```


          For stable pagination, the same query, search mode, vector, candidate settings, and index version should be used across requests.


          Because vector indexes may be updated between requests, results may change when pagination requests are made at different times.


          Example vector-search response:


          ```json

          {
            "totalHits": 245,
            "searchMode": "vector",
            "results": [
              {
                "workId": 323030168,
                "title": "Text and data mining for scholarly repositories",
                "abstract": "This study examines semantic discovery across scholarly repositories.",
                "yearPublished": 2025,
                "documentType": [
                  "research article"
                ],
                "relevanceScore": 0.873
              },
              {
                "workId": 323030169,
                "title": "Semantic retrieval for open research infrastructures",
                "abstract": "A vector-based method for discovering related scholarly resources.",
                "yearPublished": 2024,
                "documentType": [
                  "research article"
                ],
                "relevanceScore": 0.846
              }
            ]
          }

          ```


          Include `searchMode` and `relevanceScore` only if the implementation returns them.


          #### Search responses


          | Status | Description |

          | --- | --- |

          | `200` | The Work search was completed successfully. |

          | `400` | The request contains an invalid query, unsupported search mode, invalid vector, incompatible vector dimensions, unsupported field, invalid facet, or invalid response-control parameter. |

          | `401` | Authentication credentials are missing or invalid. |

          | `413` | The POST request body exceeds the permitted size. |

          | `429` | The API request limit has been exceeded. |

          | `500` | An unexpected server error occurred. |
      - divider: false
        border: false
        id: "#works-api-relationship-oriented-endpoints"
        title: Relationship-oriented endpoints
        descriptionAbout: >-
          
          Relationship-oriented endpoints provide convenient access to records connected to a Work.


          #### Outputs for a Work


          Retrieves the Output records represented by the canonical Work.


          ##### API endpoint


          ```http

          GET /v4/works/{workId}/outputs

          ```


          Example request:


          ```bash

          curl --request GET \
            --url "https://api.core.ac.uk/v4/works/323030168/outputs?count=true&limit=10&offset=0" \
            --header "Authorization: Bearer YOUR_API_KEY"
          ```


          Example response:


          ```json

          {
            "totalHits": 2,
            "results": [
              {
                "coreId": 216874849,
                "dataProviderId": 86,
                "title": "Intelligent edge computing for scholarly infrastructures",
                "doi": "10.1109/jiot.2020.2984887",
                "yearPublished": 2022
              },
              {
                "coreId": 216874850,
                "dataProviderId": 144,
                "title": "Intelligent edge computing for scholarly infrastructures",
                "doi": "10.1109/jiot.2020.2984887",
                "yearPublished": 2022
              }
            ]
          }

          ```


          Because Outputs do not contain a `workId`, this relationship endpoint is not equivalent to a simple `q=workId:{workId}` Output search.


          #### Authorships for a Work


          Retrieves the canonical Authorship records associated with the Work.


          ##### API endpoint


          ```http

          GET /v4/works/{workId}/authorships

          ```


          By default, Authorship records should be ordered by `rank:asc`.


          Equivalent GET search:


          ```http

          GET /v4/search/authorships?q=workId:{workId}&orderby=rank:asc

          ```


          Equivalent POST search:


          ```json

          {
            "q": "workId:{workId}",
            "orderby": [
              "rank:asc"
            ]
          }

          ```


          #### Journals for a Work


          Retrieves the complete Journal records referenced by the Work's `journalIds`.


          ##### API endpoint


          ```http

          GET /v4/works/{workId}/journals

          ```


          #### Data Providers for a Work


          Retrieves the complete Data Provider records referenced by the Work's `dataProviderIds`.


          ##### API endpoint


          ```http

          GET /v4/works/{workId}/data-providers

          ```

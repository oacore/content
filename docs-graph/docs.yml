          - divider: false
            border: false
            id: publishers-api-publishers-endpoints
            title: Publishers endpoints
            descriptionAbout: >-
              #### Available endpoints


              | **Operation**                                   | **Method** | **Endpoint**                                  |

              | ----------------------------------------------- | ---------- | --------------------------------------------- |

              | Get a single Publishers record                  | `GET`      | `/v4/publishers/{publisherId}`                |

              | Search Publishers using URL parameters          | `GET`      | `/v4/search/publishers`                       |

              | Search Publishers using a JSON request body     | `POST`     | `/v4/search/publishers`                       |

              | Retrieve Outputs for a Publishers record        | `GET`      | `/v4/publishers/{publisherId}/outputs`        |

              | Retrieve Journals for a Publishers record       | `GET`      | `/v4/publishers/{publisherId}/journals`       |

              | Retrieve Data Providers for a Publishers record | `GET`      | `/v4/publishers/{publisherId}/data-providers` |

              | Retrieve child Publishers records               | `GET`      | `/v4/publishers/{publisherId}/children`       |


              #### Get a single Publishers record


              Retrieves one Publishers record using its CORE Publishers identifier.


              ```http

              GET https://api.core.ac.uk/v4/publishers/{publisherId}

              ```


              ##### Authorization


              | **Parameter**   | **Location** | **Type** | **Required** | **Description**                                           |

              | --------------- | ------------ | -------- | ------------ | --------------------------------------------------------- |

              | `Authorization` | Header       | string   | Yes          | CORE API authentication token supplied as a Bearer token. |


              ##### Path parameters


              | **Parameter** | **Type** | **Required** | **Description**                                  |

              | ------------- | -------- | ------------ | ------------------------------------------------ |

              | `publisherId` | integer  | Yes          | Unique CORE identifier of the Publishers record. |


              ##### Query parameters


              | **Parameter** | **Type** | **Required** | **Description**                                                                                                                   |

              | ------------- | -------- | ------------ | --------------------------------------------------------------------------------------------------------------------------------- |

              | `select`      | string   | No           | Comma-separated list of top-level Publishers fields to return. Example: `select=publisherId,publisherName,publisherCountryCodes`. |


              Example request:


              ```bash

              curl --request GET \
                --url "https://api.core.ac.uk/v4/publishers/8102" \
                --header "Authorization: Bearer YOUR_API_KEY"
              ```


              Example response:


              ```json

              {
                "publisherId": 8102,
                "publisherOpenalexId": "https://openalex.org/P4310319965",
                "publisherRorId": "https://ror.org/0117jxy09",
                "publisherMemberId": "297",
                "publisherName": "Springer Nature",
                "publisherCountryCodes": [
                  "DE",
                  "US"
                ],
                "publisherHomepageUrl": "https://www.springernature.com",
                "publisherWorksCount": 123456,
                "publisherCitedByCount": 987654,
                "publisherUpdatedDate": "2024-11-07T05:31:56Z"
              }

              ```


              Example request using `select`:


              ```bash

              curl --request GET \
                --url "https://api.core.ac.uk/v4/publishers/8102?select=publisherId,publisherName,publisherCountryCodes,publisherHomepageUrl" \
                --header "Authorization: Bearer YOUR_API_KEY"
              ```


              Example response using `select`:


              ```json

              {
                "publisherId": 8102,
                "publisherName": "Springer Nature",
                "publisherCountryCodes": [
                  "DE",
                  "US"
                ],
                "publisherHomepageUrl": "https://www.springernature.com"
              }

              ```


              #### Responses


              | **Status** | **Description**                                              |

              | ---------- | ------------------------------------------------------------ |

              | `200`      | The Publishers record was returned successfully.             |

              | `400`      | The Publishers identifier or `select` expression is invalid. |

              | `401`      | Authentication credentials are missing or invalid.           |

              | `404`      | No Publishers record exists for the supplied `publisherId`.  |

              | `429`      | The API request limit has been exceeded.                     |

              | `500`      | An unexpected server error occurred.                         |
          - divider: false
            border: false
            id: "#publishers-api-search-publishers"
            title: Search Publishers
            descriptionAbout: >-
              Searches, filters, orders, facets, counts, and paginates
              Publishers records.


              Publishers search is available through `GET` and `POST`:


              | **Method** | **API endpoint**                              |

              | ---------- | --------------------------------------------- |

              | `GET`      | <https://api.core.ac.uk/v4/search/publishers> |

              | `POST`     | <https://api.core.ac.uk/v4/search/publishers> |


              Both methods use the same CORE query language and return the same Publishers search-response structure.


              Publishers search supports textual keyword search and structured queries. Vector search, hybrid search, and semantic reranking are not supported for this entity.


              #### GET and POST search parameters


              ##### GET query parameters


              | **Parameter** | **Type** | **Required** | **Default**                   | **Description**                                                                                                                   |

              | ------------- | -------- | ------------ | ----------------------------- | --------------------------------------------------------------------------------------------------------------------------------- |

              | `q`           | string   | No           | `*`                           | CORE query expression supporting textual search, field lookup, Boolean operators, grouping, range queries, and existence queries. |

              | `orderby`     | string   | No           | Relevance for textual queries | Comma-separated ordering directives in `field:direction` format.                                                                  |

              | `select`      | string   | No           | All retrievable fields        | Comma-separated list of Publishers fields to include in each result.                                                              |

              | `facets`      | string   | No           | —                             | Comma-separated list of facetable fields for which value buckets and counts should be returned.                                   |

              | `count`       | boolean  | No           | `false`                       | Indicates whether the total number of matching Publishers records should be included.                                             |

              | `limit`       | integer  | No           | `10`                          | Maximum number of Publishers records to return.                                                                                   |

              | `offset`      | integer  | No           | `0`                           | Number of matching Publishers records to skip.                                                                                    |


              ##### POST request body


              | **Property** | **Type**  | **Required** | **Default**                   | **Description**                                                                                                                   |

              | ------------ | --------- | ------------ | ----------------------------- | --------------------------------------------------------------------------------------------------------------------------------- |

              | `q`          | string    | No           | `*`                           | CORE query expression supporting textual search, field lookup, Boolean operators, grouping, range queries, and existence queries. |

              | `orderby`    | string\[] | No           | Relevance for textual queries | Ordered list of sorting directives in `field:direction` format.                                                                   |

              | `select`     | string\[] | No           | All retrievable fields        | List of Publishers fields to include in each result.                                                                              |

              | `facets`     | string\[] | No           | —                             | List of facetable fields for which value buckets and counts should be returned.                                                   |

              | `count`      | boolean   | No           | `false`                       | Indicates whether the total number of matching Publishers records should be included.                                             |

              | `limit`      | integer   | No           | `10`                          | Maximum number of Publishers records to return.                                                                                   |

              | `offset`     | integer   | No           | `0`                           | Number of matching Publishers records to skip.                                                                                    |


              ##### GET and POST parameter mapping


              | **GET query parameter**                                  | **POST body property**                                                |

              | -------------------------------------------------------- | --------------------------------------------------------------------- |

              | `q=publisherCountryCodes:DE`                             | `"q": "publisherCountryCodes:DE"`                                     |

              | `orderby=publisherName:asc`                              | `"orderby": ["publisherName:asc"]`                                    |

              | `select=publisherId,publisherName,publisherCountryCodes` | `"select": ["publisherId", "publisherName", "publisherCountryCodes"]` |

              | `facets=publisherCountryCodes,publisherRoles.role`       | `"facets": ["publisherCountryCodes", "publisherRoles.role"]`          |

              | `count=true`                                             | `"count": true`                                                       |

              | `limit=10`                                               | `"limit": 10`                                                         |

              | `offset=0`                                               | `"offset": 0`                                                         |


              The `GET` method represents `orderby`, `select`, and `facets` as comma-separated strings. The `POST` method represents them as JSON arrays.
          - divider: false
            border: false
            id: publishers-api-search-examples
            title: Search examples
            descriptionAbout: >-
              #### Search by Publishers name


              GET:


              ```http

              GET /v4/search/publishers?q=publisherName:"Springer Nature"

              ```


              Equivalent POST body:


              ```json

              {
                "q": "publisherName:\"Springer Nature\""
              }

              ```


              A broader free-text query may also be used:


              ```http

              GET /v4/search/publishers?q="Springer Nature"

              ```


              A broad textual query searches the following fields:


              * `publisherName`

              * `publisherNames`

              * `publisherAlternateTitles`

              * `publisherLocation`

              * `publisherParentName`


              When a textual query is supplied and `orderby` is omitted, results are ordered by relevance.


              #### Retrieve a Publishers record by external identifier


              GET:


              ```http

              GET /v4/search/publishers?q=publisherRorId:"https://ror.org/0117jxy09"

              ```


              Equivalent POST body:


              ```json

              {
                "q": "publisherRorId:\"https://ror.org/0117jxy09\""
              }

              ```


              The structured `publisherIds` list may also be queried:


              ```http

              GET /v4/search/publishers?q=publisherIds.scheme:ror AND publisherIds.value:0117jxy09

              ```


              Both conditions must apply to the same `publisherIds` object.


              #### Retrieve Publishers records associated with a country


              GET:


              ```http

              GET /v4/search/publishers?q=publisherCountryCodes:DE

              ```


              Equivalent POST body:


              ```json

              {
                "q": "publisherCountryCodes:DE"
              }

              ```


              #### Retrieve child Publishers records


              ```http

              GET /v4/search/publishers?q=publisherParentId:"https://openalex.org/P4310319965"

              ```


              #### Retrieve Publishers records by role


              ```http

              GET /v4/search/publishers?q=publisherRoles.role:publisher

              ```


              #### Retrieve Publishers records above a Work-count threshold


              GET:


              ```http

              GET /v4/search/publishers?q=publisherWorksCount>=100000&orderby=publisherWorksCount:desc

              ```


              Equivalent POST body:


              ```json

              {
                "q": "publisherWorksCount>=100000",
                "orderby": [
                  "publisherWorksCount:desc"
                ]
              }

              ```


              #### Retrieve Publishers records with ROR identifiers


              ```http

              GET /v4/search/publishers?q=_exists_:publisherRorId

              ```


              #### Combined search, selection, and ordering


              The following request:


              * Retrieves Publishers records associated with Germany

              * Restricts results to records whose `publisherWorksCount` is at least 10,000

              * Orders results by Work count in descending order

              * Returns selected fields

              * Includes the total matching result count

              * Returns a maximum of ten records


              GET:


              ```http

              GET /v4/search/publishers
                  ?q=publisherCountryCodes:DE AND publisherWorksCount>=10000
                  &orderby=publisherWorksCount:desc
                  &select=publisherId,publisherName,publisherCountryCodes,publisherWorksCount,publisherCitedByCount
                  &count=true
                  &limit=10
                  &offset=0
              ```


              Equivalent POST request:


              ```bash

              curl --request POST \
                --url "https://api.core.ac.uk/v4/search/publishers" \
                --header "Authorization: Bearer YOUR_API_KEY" \
                --header "Content-Type: application/json" \
                --data '{
                  "q": "publisherCountryCodes:DE AND publisherWorksCount>=10000",
                  "orderby": [
                    "publisherWorksCount:desc"
                  ],
                  "select": [
                    "publisherId",
                    "publisherName",
                    "publisherCountryCodes",
                    "publisherWorksCount",
                    "publisherCitedByCount"
                  ],
                  "count": true,
                  "limit": 10,
                  "offset": 0
                }'
              ```


              Example search response:


              ```json

              {
                "totalHits": 1,
                "count": 1,
                "limit": 10,
                "offset": 0,
                "results": [
                  {
                    "publisherId": 8102,
                    "publisherName": "Springer Nature",
                    "publisherCountryCodes": [
                      "DE",
                      "US"
                    ],
                    "publisherWorksCount": 123456,
                    "publisherCitedByCount": 987654
                  }
                ]
              }

              ```


              #### Ordering Publishers results


              Only fields configured as sortable may be used with `orderby`.


              ##### Order by preferred name


              ```http

              GET /v4/search/publishers?orderby=publisherName:asc

              ```


              ##### Order by Work count


              ```http

              GET /v4/search/publishers?orderby=publisherWorksCount:desc

              ```


              ##### Order by multiple fields


              GET:


              ```http

              GET /v4/search/publishers?orderby=publisherHierarchyLevel:asc,publisherName:asc

              ```


              POST representation:


              ```json

              {
                "orderby": [
                  "publisherHierarchyLevel:asc",
                  "publisherName:asc"
                ]
              }

              ```


              Results are first ordered by hierarchy level. Records at the same level are then ordered by preferred Publishers name.


              #### Facets


              The `facets` option returns value buckets and counts for fields configured as facetable.


              GET:


              ```http

              GET /v4/search/publishers?q=*&facets=publisherCountryCodes,publisherRoles.role,publisherHierarchyLevel&count=true&limit=0

              ```


              Equivalent POST body:


              ```json

              {
                "q": "*",
                "facets": [
                  "publisherCountryCodes",
                  "publisherRoles.role",
                  "publisherHierarchyLevel"
                ],
                "count": true,
                "limit": 0
              }

              ```


              Example facet response:


              ```json

              {
                "totalHits": 25000,
                "count": 0,
                "limit": 0,
                "offset": 0,
                "facets": {
                  "publisherCountryCodes": [
                    {
                      "value": "US",
                      "count": 7100
                    },
                    {
                      "value": "GB",
                      "count": 2450
                    },
                    {
                      "value": "DE",
                      "count": 1800
                    }
                  ],
                  "publisherRoles.role": [
                    {
                      "value": "publisher",
                      "count": 22000
                    },
                    {
                      "value": "funder",
                      "count": 1200
                    },
                    {
                      "value": "institution",
                      "count": 850
                    }
                  ],
                  "publisherHierarchyLevel": [
                    {
                      "value": 0,
                      "count": 18000
                    },
                    {
                      "value": 1,
                      "count": 5200
                    }
                  ]
                },
                "results": []
              }

              ```


              Facet counts describe the complete matching result set. Setting `limit=0` returns facet buckets and counts without returning Publishers records.


              #### Result count


              Set `count=true` to include the total number of matching Publishers records.


              ```http

              GET /v4/search/publishers?q=publisherCountryCodes:GB&count=true

              ```


              When `count` is omitted or set to `false`, `totalHits` may be omitted from the response. The response-level `count` is the number of records returned on the current page.


              #### Pagination


              Use `limit` and `offset` to paginate Publishers results. A deterministic `orderby` expression should be used when retrieving multiple pages.


              First page:


              ```http

              GET /v4/search/publishers?q=publisherRoles.role:publisher&orderby=publisherName:asc,publisherId:asc&limit=20&offset=0

              ```


              Second page:


              ```http

              GET /v4/search/publishers?q=publisherRoles.role:publisher&orderby=publisherName:asc,publisherId:asc&limit=20&offset=20

              ```


              The offset is calculated as:


              ```text

              offset = page size × number of previous pages

              ```


              #### Search responses


              | **Status** | **Description**                                                                                                 |

              | ---------- | --------------------------------------------------------------------------------------------------------------- |

              | `200`      | The Publishers search was completed successfully.                                                               |

              | `400`      | The request contains an invalid query, unsupported field, invalid facet, or invalid response-control parameter. |

              | `401`      | Authentication credentials are missing or invalid.                                                              |

              | `413`      | The `POST` request body exceeds the permitted size.                                                             |

              | `429`      | The API request limit has been exceeded.                                                                        |

              | `500`      | An unexpected server error occurred.                                                                            |


              An empty search returns `200 OK` with an empty `results` array. Nullable fields remain present with a JSON `null` value unless they are omitted through `select` or the API's general response conventions specify otherwise.
          - divider: false
            border: false
            id: publishers-api-relationship-oriented-endpoints
            title: Relationship-oriented endpoints
            descriptionAbout: >-
              
              Relationship-oriented endpoints provide convenient access to entities directly connected to a Publishers record. They return related records rather than embedding those records in the Publishers response.


              The examples below assume that related entities expose a filterable `publisherId` field. This relationship field should be included in the final Output, Journal, and Data Provider schemas if these endpoints are adopted.


              #### Outputs for a Publishers record


              ```http

              GET /v4/publishers/{publisherId}/outputs

              ```


              Retrieves Outputs directly associated with the Publishers record.


              Equivalent search:


              ```http

              GET /v4/search/outputs?q=publisherId:{publisherId}

              ```


              Example request:


              ```http

              GET /v4/publishers/8102/outputs?select=outputId,title,doi,publishedDate&orderby=publishedDate:desc&count=true&limit=10&offset=0

              ```


              #### Journals for a Publishers record


              ```http

              GET /v4/publishers/{publisherId}/journals

              ```


              Retrieves Journals published or managed by the Publishers record.


              Equivalent search:


              ```http

              GET /v4/search/journals?q=publisherId:{publisherId}

              ```


              Example request:


              ```http

              GET /v4/publishers/8102/journals?select=journalId,title,issn&orderby=title:asc&count=true&limit=10&offset=0

              ```


              #### Data Providers for a Publishers record


              ```http

              GET /v4/publishers/{publisherId}/data-providers

              ```


              Retrieves Data Providers hosted or operated by the Publishers record.


              Equivalent search:


              ```http

              GET /v4/search/data-providers?q=publisherId:{publisherId}

              ```


              Example request:


              ```http

              GET /v4/publishers/8102/data-providers?select=dataProviderId,name,type&orderby=name:asc&count=true&limit=10&offset=0

              ```


              #### Child Publishers records


              ```http

              GET /v4/publishers/{publisherId}/children

              ```


              Retrieves Publishers records whose parent relationship resolves to the specified Publishers record.


              If `publisherParentId` remains an OpenAlex identifier, the equivalent search uses the selected Publishers record's `publisherOpenalexId`:


              ```http

              GET /v4/search/publishers?q=publisherParentId:"https://openalex.org/P4310319965"

              ```


              If the final model changes `publisherParentId` to a CORE identifier, the equivalent search becomes:


              ```http

              GET /v4/search/publishers?q=publisherParentId:{publisherId}

              ```


              An existing Publishers record with no related records returns `200 OK` with an empty `results` array. If the supplied Publishers record does not exist, the relationship endpoint returns `404 Not Found`.
      - item: Projects
        sections:
          - divider: false
            border: false
            id: projects-api-introduction
            title: Introduction
            descriptionAbout: >-
              The Projects entity represents a funded research activity,
              programme, or initiative associated with scholarly Works. A
              Projects record may contain identifiers, descriptive metadata,
              funding organisations and streams, grant amounts, programme
              information, temporal coverage, and open-access mandates.


              Unlike a Grant, which represents a funding award or agreement, a Projects record represents the research activity undertaken using that funding. A Projects record may be supported by one or more Grants, while a Grant may support one or more Projects. Works produced by or associated with a Projects record are connected through graph relationships rather than embedded in the Projects record.


              ## Direct entity relationships


              ![Projects direct entity relationships](/images/docs-graph/projects.png)


              | **Relationship** | **Cardinality** | **Description**                                                                                                       |

              | ---------------- | --------------- | --------------------------------------------------------------------------------------------------------------------- |

              | Projects–Works   | Many-to-many    | A Projects record may be associated with multiple Works, and a Work may acknowledge or result from multiple Projects. |

              | Projects–Grants  | Many-to-many    | A Projects record may receive support through multiple Grants, and a Grant may support multiple Projects.             |


              Funding organisations are represented in the supplied schema inside `fundings`. If funding organisations are later resolved to canonical Institution records, a direct Projects–Institutions relationship may also be added. It is not shown in the diagram because no canonical Institution identifier is currently present in the supplied Projects fields.
          - divider: false
            border: false
            id: projects-api-data-structure
            title: Data structure
            descriptionAbout: >-
              The following sections describe the top-level fields in the
              planned CORE Graph metadata schema for the Projects entity.


              #### Identifiers


              | **Property**     | **Type**      | **Example value**                                  | **Description**                                                                | **Source** |

              | ---------------- | ------------- | -------------------------------------------------- | ------------------------------------------------------------------------------ | ---------- |

              | `projectId`      | string        | `"coreproj____::001"`                              | Unique CORE internal canonical identifier for a record in the Projects entity. | CORE       |

              | `openaireId`     | string | null | `"corda__h2020::70ea22400fd890c5033cb31642c4ae68"` | OpenAIRE identifier associated with the Projects record.                       | OpenAIRE   |

              | `code`           | string | null | `"777541"`                                         | Source-supplied project code or grant agreement code.                          | OpenAIRE   |

              | `acronym`        | string | null | `"OpenAIRE-Advance"`                               | Acronym associated with the Projects record.                                   | OpenAIRE   |

              | `callIdentifier` | string | null | `"H2020-EINFRA-2017"`                              | Identifier of the funding call associated with the Projects record.            | OpenAIRE   |


              #### Descriptive metadata


              | **Property** | **Type**         | **Example value**                                                       | **Description**                                                                                | **Source** |

              | ------------ | ---------------- | ----------------------------------------------------------------------- | ---------------------------------------------------------------------------------------------- | ---------- |

              | `title`      | string           | `"OpenAIRE Advancing Open Scholarship"`                                 | Preferred title of the Projects record.                                                        | OpenAIRE   |

              | `summary`    | string | null    | `"OpenAIRE-Advance continues the mission of OpenAIRE..."`               | Short summary or abstract describing the research activity represented by the Projects record. | OpenAIRE   |

              | `keywords`   | string\[] | null | `["Open Science", "Repositories", "Open Access"]`                       | Keywords associated with the Projects record.                                                  | OpenAIRE   |

              | `subjects`   | string\[] | null | `["Data and Distributed Computing e-infrastructures for Open Science"]` | Subjects or thematic areas associated with the Projects record.                                | OpenAIRE   |

              | `websiteUrl` | string | null    | `"https://www.openaire.eu/advance/"`                                    | Public website associated with the Projects record.                                            | OpenAIRE   |


              #### Temporal coverage


              | **Property** | **Type**      | **Example value** | **Description**                                                                                        | **Source** |

              | ------------ | ------------- | ----------------- | ------------------------------------------------------------------------------------------------------ | ---------- |

              | `startDate`  | string | null | `"2018-01-01"`    | Start date of the research activity represented by the Projects record, formatted as an ISO 8601 date. | OpenAIRE   |

              | `endDate`    | string | null | `"2021-02-28"`    | End date of the research activity represented by the Projects record, formatted as an ISO 8601 date.   | OpenAIRE   |


              These dates describe the planned or recorded duration of the activity represented by the Projects record. They are not CORE record-management dates.


              #### Funding


              | **Property** | **Type**         | **Example value** | **Description**                                                                           | **Source** |

              | ------------ | ---------------- | ----------------- | ----------------------------------------------------------------------------------------- | ---------- |

              | `fundings`   | object\[] | null | See below         | Funding organisations and funding-stream information associated with the Projects record. | OpenAIRE   |

              | `granted`    | object | null    | See below         | Financial information associated with the funding award recorded for the Projects record. | OpenAIRE   |


              ##### `fundings` fields


              | **Property**    | **Type**      | **Example value**       | **Description**                                                   |

              | --------------- | ------------- | ----------------------- | ----------------------------------------------------------------- |

              | `name`          | string | null | `"European Commission"` | Name of the funding organisation.                                 |

              | `shortName`     | string | null | `"EC"`                  | Short name or acronym of the funding organisation.                |

              | `jurisdiction`  | string | null | `"EU"`                  | Jurisdiction or country associated with the funding organisation. |

              | `fundingStream` | object | null | See below               | Funding stream associated with the Projects record.               |


              ##### `fundings.fundingStream` fields


              | **Property**  | **Type**      | **Example value**                                                     | **Description**                          |

              | ------------- | ------------- | --------------------------------------------------------------------- | ---------------------------------------- |

              | `id`          | string | null | `"EC::H2020::RIA"`                                                    | Source identifier of the funding stream. |

              | `description` | string | null | `"Horizon 2020 Framework Programme - Research and Innovation action"` | Description of the funding stream.       |


              ##### `granted` fields


              | **Property**   | **Type**      | **Example value** | **Description**                                                                               |

              | -------------- | ------------- | ----------------- | --------------------------------------------------------------------------------------------- |

              | `currency`     | string | null | `"EUR"`           | ISO 4217 currency code used for the financial values.                                         |

              | `fundedAmount` | number | null | `10000000`        | Amount awarded to the activity represented by the Projects record, in the specified currency. |

              | `totalCost`    | number | null | `10000000`        | Total recorded cost associated with the Projects record, in the specified currency.           |


              Financial values should always be interpreted together with `granted.currency`. Missing values must not be treated as zero.


              #### Programme information


              | Property          | Type             | Example value | Description                                                  | Source   |

              | ----------------- | ---------------- | ------------- | ------------------------------------------------------------ | -------- |

              | `h2020Programmes` | object\[] | null | See below     | Horizon 2020 programmes associated with the Projects record. | OpenAIRE |


              ##### `h2020Programmes` fields


              | Property      | Type          | Example value                                                            | Description                   |

              | ------------- | ------------- | ------------------------------------------------------------------------ | ----------------------------- |

              | `code`        | string | null | `"H2020-EU.1.4.1.3."`                                                    | Horizon 2020 programme code.  |

              | `description` | string | null | `"Development, deployment and operation of ICT-based e-infrastructures"` | Description of the programme. |


              `h2020Programmes` is specific to Horizon 2020. If CORE later ingests structured programme information from additional funding schemes, a source-neutral property such as `programmes` may provide a more extensible representation.


              #### Open-access mandates


              | **Property**                       | **Type**       | **Example value** | **Description**                                                                         | **Source** |

              | ---------------------------------- | -------------- | ----------------- | --------------------------------------------------------------------------------------- | ---------- |

              | `openAccessMandateForDataset`      | boolean | null | `true`            | Indicates whether the Projects record includes an open-access mandate for datasets.     | OpenAIRE   |

              | `openAccessMandateForPublications` | boolean | null | `true`            | Indicates whether the Projects record includes an open-access mandate for publications. | OpenAIRE   |


              A `null` value means that the source did not provide enough information to determine whether the mandate applies. It must not be interpreted as `false`.


              Example Projects record:


              ```json

              {
                "projectId": "coreproj____::001",
                "openaireId": "corda__h2020::70ea22400fd890c5033cb31642c4ae68",
                "code": "777541",
                "acronym": "OpenAIRE-Advance",
                "title": "OpenAIRE Advancing Open Scholarship",
                "callIdentifier": "H2020-EINFRA-2017",
                "summary": "OpenAIRE-Advance continues the mission of OpenAIRE...",
                "keywords": [
                  "Open Science",
                  "Repositories",
                  "Open Access"
                ],
                "subjects": [
                  "Data and Distributed Computing e-infrastructures for Open Science"
                ],
                "websiteUrl": "https://www.openaire.eu/advance/",
                "fundings": [
                  {
                    "name": "European Commission",
                    "shortName": "EC",
                    "jurisdiction": "EU",
                    "fundingStream": {
                      "id": "EC::H2020::RIA",
                      "description": "Horizon 2020 Framework Programme - Research and Innovation action"
                    }
                  }
                ],
                "granted": {
                  "currency": "EUR",
                  "fundedAmount": 10000000,
                  "totalCost": 10000000
                },
                "h2020Programmes": [
                  {
                    "code": "H2020-EU.1.4.1.3.",
                    "description": "Development, deployment and operation of ICT-based e-infrastructures"
                  }
                ],
                "openAccessMandateForDataset": true,
                "openAccessMandateForPublications": true,
                "startDate": "2018-01-01",
                "endDate": "2021-02-28"
              }

              ```
          - divider: false
            border: false
            id: projects-api-supported-field-operations
            title: Supported field operations
            descriptionAbout: >-
              The following table describes the proposed field operations for
              the future Projects entity.


              | **Attribute**                        | **Searchable** | **Filterable** | **Sortable** | **Facetable** |

              | ------------------------------------ | -------------- | -------------- | ------------ | ------------- |

              | `projectId`                          | No             | Yes            | Yes          | No            |

              | `openaireId`                         | No             | Yes            | No           | No            |

              | `code`                               | No             | Yes            | No           | No            |

              | `acronym`                            | Yes            | Yes            | Yes          | No            |

              | `callIdentifier`                     | No             | Yes            | No           | Yes           |

              | `title`                              | Yes            | No             | Yes          | No            |

              | `summary`                            | Yes            | No             | No           | No            |

              | `keywords`                           | Yes            | Yes            | No           | Yes           |

              | `subjects`                           | Yes            | Yes            | No           | Yes           |

              | `websiteUrl`                         | No             | No             | No           | No            |

              | `startDate`                          | No             | Yes            | Yes          | No            |

              | `endDate`                            | No             | Yes            | Yes          | No            |

              | `fundings.name`                      | Yes            | No             | No           | No            |

              | `fundings.shortName`                 | Yes            | Yes            | No           | Yes           |

              | `fundings.jurisdiction`              | No             | Yes            | No           | Yes           |

              | `fundings.fundingStream.id`          | No             | Yes            | No           | Yes           |

              | `fundings.fundingStream.description` | Yes            | No             | No           | No            |

              | `granted.currency`                   | No             | Yes            | No           | Yes           |

              | `granted.fundedAmount`               | No             | Yes            | Yes          | No            |

              | `granted.totalCost`                  | No             | Yes            | Yes          | No            |

              | `h2020Programmes.code`               | No             | Yes            | No           | Yes           |

              | `h2020Programmes.description`        | Yes            | No             | No           | No            |

              | `openAccessMandateForDataset`        | No             | Yes            | No           | Yes           |

              | `openAccessMandateForPublications`   | No             | Yes            | No           | Yes           |
          - divider: false
            border: false
            id: projects-api-projects-endpoints
            title: Projects endpoints
            descriptionAbout: >-
              #### Available endpoints


              | **Operation**                             | **Method** | **Endpoint**                      |

              | ----------------------------------------- | ---------- | --------------------------------- |

              | Get a single Projects record              | `GET`      | `/v4/projects/{projectId}`        |

              | Search Projects using URL parameters      | `GET`      | `/v4/search/projects`             |

              | Search Projects using a JSON request body | `POST`     | `/v4/search/projects`             |

              | Retrieve Works for a Projects record      | `GET`      | `/v4/projects/{projectId}/works`  |

              | Retrieve Grants for a Projects record     | `GET`      | `/v4/projects/{projectId}/grants` |


              #### Get a single Projects record


              Retrieves one Projects record using its CORE identifier.


              ```http

              GET https://api.core.ac.uk/v4/projects/{projectId}

              ```


              ##### Authorization


              | **Parameter**   | **Location** | **Type** | **Required** | **Description**                                           |

              | --------------- | ------------ | -------- | ------------ | --------------------------------------------------------- |

              | `Authorization` | Header       | string   | Yes          | CORE API authentication token supplied as a Bearer token. |


              ##### Path parameters


              | **Parameter** | **Type** | **Required** | **Description**                                                                                                    |

              | ------------- | -------- | ------------ | ------------------------------------------------------------------------------------------------------------------ |

              | `projectId`   | string   | Yes          | Unique CORE identifier of the Projects record. The value must be URL-encoded when it contains reserved characters. |


              ##### Query parameters


              | **Parameter** | **Type** | **Required** | **Description**                                                                                                           |

              | ------------- | -------- | ------------ | ------------------------------------------------------------------------------------------------------------------------- |

              | `select`      | string   | No           | Comma-separated list of top-level Projects fields to return. Example: `select=projectId,title,acronym,startDate,endDate`. |


              Example request:


              The `projectId` value `coreproj____::001` is URL-encoded as `coreproj____%3A%3A001` in the request path.


              ```bash

              curl --request GET \
                --url "https://api.core.ac.uk/v4/projects/coreproj____%3A%3A001" \
                --header "Authorization: Bearer YOUR_API_KEY"
              ```


              Example response:


              ```json

              {
                "projectId": "coreproj____::001",
                "openaireId": "corda__h2020::70ea22400fd890c5033cb31642c4ae68",
                "code": "777541",
                "acronym": "OpenAIRE-Advance",
                "title": "OpenAIRE Advancing Open Scholarship",
                "callIdentifier": "H2020-EINFRA-2017",
                "fundings": [
                  {
                    "name": "European Commission",
                    "shortName": "EC",
                    "jurisdiction": "EU",
                    "fundingStream": {
                      "id": "EC::H2020::RIA",
                      "description": "Horizon 2020 Framework Programme - Research and Innovation action"
                    }
                  }
                ],
                "openAccessMandateForPublications": true,
                "startDate": "2018-01-01",
                "endDate": "2021-02-28"
              }

              ```


              Example request using `select`:


              ```bash

              curl --request GET \
                --url "https://api.core.ac.uk/v4/projects/coreproj____%3A%3A001?select=projectId,title,acronym,startDate,endDate" \
                --header "Authorization: Bearer YOUR_API_KEY"
              ```


              Example response using `select`:


              ```json

              {
                "projectId": "coreproj____::001",
                "title": "OpenAIRE Advancing Open Scholarship",
                "acronym": "OpenAIRE-Advance",
                "startDate": "2018-01-01",
                "endDate": "2021-02-28"
              }

              ```


              #### Responses


              | **Status** | **Description**                                         |

              | ---------- | ------------------------------------------------------- |

              | `200`      | Projects record was returned successfully.              |

              | `400`      | Projects identifier or `select` expression is invalid.  |

              | `401`      | Authentication credentials are missing or invalid.      |

              | `404`      | No Projects record exists for the supplied `projectId`. |

              | `429`      | API request limit has been exceeded.                    |

              | `500`      | An unexpected server error occurred.                    |
          - divider: false
            border: false
            id: projects-api-search-projects
            title: Search Projects
            descriptionAbout: >-
              Searches, filters, orders, facets, counts, and paginates Projects
              records.


              Projects search is available through `GET` and `POST`:


              | **Method** | **API endpoint**                            |

              | ---------- | ------------------------------------------- |

              | `GET`      | <https://api.core.ac.uk/v4/search/projects> |

              | `POST`     | <https://api.core.ac.uk/v4/search/projects> |


              Both methods use the same CORE query language and return the same Projects search-response structure.


              Projects search supports textual keyword search and structured queries. Vector search, hybrid search, and semantic reranking are not supported for this entity.


              #### GET and POST search parameters


              ##### GET query parameters


              | **Parameter** | **Type** | **Required** | **Default**                   | **Description**                                                                                                                   |

              | ------------- | -------- | ------------ | ----------------------------- | --------------------------------------------------------------------------------------------------------------------------------- |

              | `q`           | string   | No           | `*`                           | CORE query expression supporting textual search, field lookup, Boolean operators, grouping, range queries, and existence queries. |

              | `orderby`     | string   | No           | Relevance for textual queries | Comma-separated ordering directives in `field:direction` format.                                                                  |

              | `select`      | string   | No           | All retrievable fields        | Comma-separated list of Projects fields to include in each result.                                                                |

              | `facets`      | string   | No           | —                             | Comma-separated list of facetable fields for which value buckets and counts should be returned.                                   |

              | `count`       | boolean  | No           | `false`                       | Indicates whether the total number of matching Projects records should be included.                                               |

              | `limit`       | integer  | No           | `10`                          | Maximum number of Projects records to return.                                                                                     |

              | `offset`      | integer  | No           | `0`                           | Number of matching Projects records to skip.                                                                                      |


              ##### POST request body


              | **Property** | **Type**  | **Required** | **Default**                   | **Description**                                                                                                                   |

              | ------------ | --------- | ------------ | ----------------------------- | --------------------------------------------------------------------------------------------------------------------------------- |

              | `q`          | string    | No           | `*`                           | CORE query expression supporting textual search, field lookup, Boolean operators, grouping, range queries, and existence queries. |

              | `orderby`    | string\[] | No           | Relevance for textual queries | Ordered list of sorting directives in `field:direction` format.                                                                   |

              | `select`     | string\[] | No           | All retrievable fields        | List of Projects fields to include in each result.                                                                                |

              | `facets`     | string\[] | No           | —                             | List of facetable fields for which value buckets and counts should be returned.                                                   |

              | `count`      | boolean   | No           | `false`                       | Indicates whether the total number of matching Projects records should be included.                                               |

              | `limit`      | integer   | No           | `10`                          | Maximum number of Projects records to return.                                                                                     |

              | `offset`     | integer   | No           | `0`                           | Number of matching Projects records to skip.                                                                                      |


              ##### GET and POST parameter mapping


              | **GET query parameter**                            | **POST body property**                                                |

              | -------------------------------------------------- | --------------------------------------------------------------------- |

              | `q=callIdentifier:H2020-EINFRA-2017`               | `"q": "callIdentifier:H2020-EINFRA-2017"`                             |

              | `orderby=startDate:desc`                           | `"orderby": ["startDate:desc"]`                                       |

              | `select=projectId,title,acronym,startDate,endDate` | `"select": ["projectId", "title", "acronym", "startDate", "endDate"]` |

              | `facets=fundings.jurisdiction,granted.currency`    | `"facets": ["fundings.jurisdiction", "granted.currency"]`             |

              | `count=true`                                       | `"count": true`                                                       |

              | `limit=10`                                         | `"limit": 10`                                                         |

              | `offset=0`                                         | `"offset": 0`                                                         |


              The `GET` method represents `orderby`, `select`, and `facets` as comma-separated strings. The `POST` method represents them as JSON arrays.
          - divider: false
            border: false
            id: projects-api-search-examples
            title: Search examples
            descriptionAbout: >-
              #### Search by title


              GET:


              ```http

              GET /v4/search/projects?q=title:"OpenAIRE Advancing Open Scholarship"

              ```


              Equivalent POST body:


              ```json

              {
                "q": "title:\"OpenAIRE Advancing Open Scholarship\""
              }

              ```


              A broader free-text query may also be used:


              ```http

              GET /v4/search/projects?q="Open Scholarship"

              ```


              A broad textual query searches the following fields:


              * `acronym`

              * `title`

              * `summary`

              * `keywords`

              * `subjects`

              * `fundings.name`

              * `fundings.shortName`

              * `fundings.fundingStream.description`

              * `h2020Programmes.description`


              When a textual query is supplied and `orderby` is omitted, results are ordered by relevance.


              #### Retrieve a Projects record by OpenAIRE identifier


              GET:


              ```http

              GET /v4/search/projects?q=openaireId:"corda__h2020::70ea22400fd890c5033cb31642c4ae68"

              ```


              Equivalent POST body:


              ```json

              {
                "q": "openaireId:\"corda__h2020::70ea22400fd890c5033cb31642c4ae68\""
              }

              ```


              #### Retrieve a Projects record by code


              ```http

              GET /v4/search/projects?q=code:777541

              ```


              #### Retrieve Projects records for a funding call


              ```http

              GET /v4/search/projects?q=callIdentifier:H2020-EINFRA-2017

              ```


              #### Search by funding organisation


              ```http

              GET /v4/search/projects?q=fundings.name:"European Commission"

              ```


              #### Retrieve Projects records by funding stream


              ```http

              GET /v4/search/projects?q=fundings.fundingStream.id:"EC::H2020::RIA"

              ```


              #### Retrieve Projects records with a publication open-access mandate


              ```http

              GET /v4/search/projects?q=openAccessMandateForPublications:true

              ```


              #### Retrieve Projects records active on a particular date


              ```http

              GET /v4/search/projects?q=startDate<=2020-06-01 AND endDate>=2020-06-01

              ```


              This query returns Projects records whose recorded date range includes 1 June 2020. Projects records with a missing `startDate` or `endDate` are not matched by both clauses.


              #### Retrieve Projects records above a funding threshold


              ```http

              GET /v4/search/projects?q=granted.currency:EUR AND granted.fundedAmount>=1000000&orderby=granted.fundedAmount:desc

              ```


              The currency condition is essential when comparing monetary values from multiple currencies.


              #### Combined search, selection, and ordering


              The following request:


              * Searches for Projects records concerning open science

              * Restricts results to Projects records funded within the EU jurisdiction

              * Requires a publication open-access mandate

              * Orders results by start date in descending order

              * Returns selected fields and the total matching result count


              GET:


              ```http

              GET /v4/search/projects
                  ?q="open science" AND fundings.jurisdiction:EU AND openAccessMandateForPublications:true
                  &orderby=startDate:desc,projectId:asc
                  &select=projectId,code,acronym,title,startDate,endDate,openAccessMandateForPublications
                  &count=true
                  &limit=10
                  &offset=0
              ```


              Equivalent POST request:


              ```bash

              curl --request POST \
                --url "https://api.core.ac.uk/v4/search/projects" \
                --header "Authorization: Bearer YOUR_API_KEY" \
                --header "Content-Type: application/json" \
                --data '{
                  "q": "\"open science\" AND fundings.jurisdiction:EU AND openAccessMandateForPublications:true",
                  "orderby": [
                    "startDate:desc",
                    "projectId:asc"
                  ],
                  "select": [
                    "projectId",
                    "code",
                    "acronym",
                    "title",
                    "startDate",
                    "endDate",
                    "openAccessMandateForPublications"
                  ],
                  "count": true,
                  "limit": 10,
                  "offset": 0
                }'
              ```


              Example search response:


              ```json

              {
                "totalHits": 1,
                "count": 1,
                "limit": 10,
                "offset": 0,
                "results": [
                  {
                    "projectId": "coreproj____::001",
                    "code": "777541",
                    "acronym": "OpenAIRE-Advance",
                    "title": "OpenAIRE Advancing Open Scholarship",
                    "startDate": "2018-01-01",
                    "endDate": "2021-02-28",
                    "openAccessMandateForPublications": true
                  }
                ]
              }

              ```


              #### Ordering Projects results


              Only fields configured as sortable may be used with `orderby`.


              ##### Order by title


              ```http

              GET /v4/search/projects?orderby=title:asc

              ```


              ##### Order by start date


              ```http

              GET /v4/search/projects?orderby=startDate:desc

              ```


              ##### Order by awarded amount


              ```http

              GET /v4/search/projects?q=granted.currency:EUR&orderby=granted.fundedAmount:desc

              ```


              ##### Order by multiple fields


              GET:


              ```http

              GET /v4/search/projects?orderby=startDate:desc,projectId:asc

              ```


              POST representation:


              ```json

              {
                "orderby": [
                  "startDate:desc",
                  "projectId:asc"
                ]
              }

              ```


              Results are first ordered by start date. Projects records with the same start date are then ordered by their CORE identifiers.


              #### Facets


              The `facets` option returns value buckets and counts for fields configured as facetable.


              GET:


              ```http

              GET /v4/search/projects?q=*&facets=fundings.jurisdiction,fundings.fundingStream.id,granted.currency,openAccessMandateForPublications&count=true&limit=0

              ```


              Equivalent POST body:


              ```json

              {
                "q": "*",
                "facets": [
                  "fundings.jurisdiction",
                  "fundings.fundingStream.id",
                  "granted.currency",
                  "openAccessMandateForPublications"
                ],
                "count": true,
                "limit": 0
              }

              ```


              Example facet response:


              ```json

              {
                "totalHits": 75000,
                "count": 0,
                "limit": 0,
                "offset": 0,
                "facets": {
                  "fundings.jurisdiction": [
                    {
                      "value": "EU",
                      "count": 42000
                    },
                    {
                      "value": "GB",
                      "count": 6500
                    }
                  ],
                  "fundings.fundingStream.id": [
                    {
                      "value": "EC::H2020::RIA",
                      "count": 8200
                    },
                    {
                      "value": "EC::H2020::CSA",
                      "count": 4900
                    }
                  ],
                  "granted.currency": [
                    {
                      "value": "EUR",
                      "count": 51000
                    },
                    {
                      "value": "GBP",
                      "count": 6200
                    }
                  ],
                  "openAccessMandateForPublications": [
                    {
                      "value": true,
                      "count": 38000
                    },
                    {
                      "value": false,
                      "count": 9000
                    }
                  ]
                },
                "results": []
              }

              ```


              Facet counts describe the complete matching result set. Setting `limit=0` returns facet buckets and counts without returning Projects records.


              #### Result count


              Set `count=true` to include the total number of matching Projects records.


              ```http

              GET /v4/search/projects?q=fundings.jurisdiction:EU&count=true

              ```


              When `count` is omitted or set to `false`, `totalHits` may be omitted from the response. The response-level `count` is the number of records returned on the current page.


              #### Pagination


              Use `limit` and `offset` to paginate Projects results. A deterministic `orderby` expression should be used when retrieving multiple pages.


              First page:


              ```http

              GET /v4/search/projects?q=openAccessMandateForPublications:true&orderby=startDate:desc,projectId:asc&limit=20&offset=0

              ```


              Second page:


              ```http

              GET /v4/search/projects?q=openAccessMandateForPublications:true&orderby=startDate:desc,projectId:asc&limit=20&offset=20

              ```


              The offset is calculated as:


              ```text

              offset = page size × number of previous pages

              ```


              #### Search responses


              | **Status** | **Description**                                                                                                 |

              | ---------- | --------------------------------------------------------------------------------------------------------------- |

              | `200`      | The Projects search was completed successfully.                                                                 |

              | `400`      | The request contains an invalid query, unsupported field, invalid facet, or invalid response-control parameter. |

              | `401`      | Authentication credentials are missing or invalid.                                                              |

              | `413`      | The `POST` request body exceeds the permitted size.                                                             |

              | `429`      | The API request limit has been exceeded.                                                                        |

              | `500`      | An unexpected server error occurred.                                                                            |


              An empty search returns `200 OK` with an empty `results` array. Nullable fields remain present with a JSON `null` value unless they are omitted through `select` or the API's general response conventions specify otherwise.
          - divider: false
            border: false
            id: projects-api-relationship-oriented-endpoints
            title: Relationship-oriented endpoints
            descriptionAbout: >-
              
              Relationship-oriented endpoints provide convenient access to entities directly connected to a Projects record. They return related records rather than embedding those records in the Projects response.


              The examples below assume that the relationship is indexed through a filterable identifier on the related entity or implemented through an internal join. The exact storage direction does not need to be exposed to API clients.


              #### Works for a Projects record


              ```http

              GET /v4/projects/{projectId}/works

              ```


              Retrieves Works produced by, funded by, or otherwise associated with the Projects record.


              Example request:


              The `projectId` value must be URL-encoded when it contains reserved characters.


              ```http

              GET /v4/projects/coreproj____%3A%3A001/works?select=workId,title,doi,yearPublished&orderby=yearPublished:desc&count=true&limit=10&offset=0

              ```


              If Works expose a filterable `projectIds` field, the equivalent search is:


              ```http

              GET /v4/search/works?q=projectIds:"coreproj____::001"

              ```


              The reverse convenience endpoint may be exposed as:


              ```http

              GET /v4/works/{workId}/projects

              ```


              #### Grants for a Projects record


              ```http

              GET /v4/projects/{projectId}/grants

              ```


              Retrieves Grants that fund or otherwise support the Projects record.


              Example request:


              ```http

              GET /v4/projects/coreproj____%3A%3A001/grants?select=grantId,code,title,fundedAmount,currency&count=true&limit=10&offset=0

              ```


              If Grants expose a filterable `projectIds` field, the equivalent search is:


              ```http

              GET /v4/search/grants?q=projectIds:"coreproj____::001"

              ```


              The reverse convenience endpoint may be exposed as:


              ```http

              GET /v4/grants/{grantId}/projects

              ```


              An existing Projects record with no related records returns `200 OK` with an empty `results` array. If the supplied Projects record does not exist, the relationship endpoint returns `404 Not Found`.
      - item: Grants
        sections:
          - divider: false
            border: false
            id: grants-api-introduction
            title: Introduction
            descriptionAbout: >-
              The Grants entity represents funding awards associated with
              scholarly research. A Grants record may contain canonical and
              source-specific identifiers, funder information, award metadata,
              funding amounts, investigators, funded Works, dates, provenance,
              and links to source records.


              Unlike the Projects entity, which represents research activities, programmes, or initiatives, the Grants entity represents the funding award or agreement that supports those activities. A Grants record may support multiple Projects and Works. Multiple Grants records may also support the same Projects record or Work.


              #### Direct entity relationships


              ![Grants direct entity relationships](/images/docs-graph/grants.png)


              | **Relationship**    | **Cardinality** | **Description**                                                                                                                   |

              | ------------------- | --------------- | --------------------------------------------------------------------------------------------------------------------------------- |

              | Institutions–Grants | One-to-many     | A Grants record may have zero or one resolved funding Institution. An Institution may award multiple Grants records.              |

              | Grants–Projects     | Many-to-many    | A Grants record may support multiple Projects records, and a Projects record may be supported by multiple Grants records.         |

              | Grants–Works        | Many-to-many    | A Grants record may support multiple Works, and a Work may acknowledge multiple Grants records.                                   |

              | Authors–Grants      | Many-to-many    | Multiple Authors may participate in a Grants record in different roles, and an Author may participate in multiple Grants records. |
          - divider: false
            border: false
            id: grants-api-data-structure
            title: Data structure
            descriptionAbout: >-
              The following sections describe the top-level fields in the
              planned CORE Graph metadata schema for the Grants entity.


              #### Identifiers


              | **Property**      | **Type**         | **Example value**                    | **Description**                                                              | **Source**              |

              | ----------------- | ---------------- | ------------------------------------ | ---------------------------------------------------------------------------- | ----------------------- |

              | `grantId`         | integer          | `13`                                 | Unique CORE internal canonical identifier for a record in the Grants entity. | CORE                    |

              | `grantOpenalexId` | string | null    | `"https://openalex.org/G5859020988"` | OpenAlex identifier associated with the Grants record.                       | OpenAlex                |

              | `grantDoi`        | string | null    | `"https://doi.org/10.35802/218671"`  | DOI associated with the Grants record, when available.                       | OpenAlex / RIOXX        |

              | `funderAwardId`   | string | null    | `"AH/W007622/1"`                     | Award identifier assigned by the funding organisation.                       | OpenAlex / RIOXX        |

              | `grantIds`        | object\[] | null | See below                            | Structured list of all known identifiers associated with the Grants record.  | CORE / OpenAlex / RIOXX |


              ##### `grantIds` fields


              | **Property** | **Type**      | **Example value**                    | **Description**                                                     |

              | ------------ | ------------- | ------------------------------------ | ------------------------------------------------------------------- |

              | `scheme`     | string        | `"openalex"`                         | Identifier scheme represented as a stable controlled value.         |

              | `value`      | string        | `"G5859020988"`                      | Identifier value in the form supplied or normalised for the scheme. |

              | `uri`        | string | null | `"https://openalex.org/G5859020988"` | Resolvable URI for the identifier, when available.                  |


              #### Award metadata


              | **Property**       | **Type**      | **Example value**                                               | **Description**                                                     | **Source**      |

              | ------------------ | ------------- | --------------------------------------------------------------- | ------------------------------------------------------------------- | --------------- |

              | `grantName`        | string | null | `"AI methods for biomedical discovery"`                         | Preferred title selected by CORE for the Grants record.             | CORE / OpenAlex |

              | `grantDescription` | string | null | `"Funding for research on AI methods in biomedical discovery."` | Description of the funding award or the activity it supports.       | OpenAlex        |

              | `fundingType`      | string | null | `"grant"`                                                       | Type of funding award.                                              | OpenAlex        |

              | `funderScheme`     | string | null | `"Horizon Europe"`                                              | Funding scheme, programme, or stream associated with the award.     | OpenAlex        |

              | `provenance`       | string | null | `"funder registry"`                                             | Source or provenance statement associated with the Grants metadata. | OpenAlex        |


              #### Funder information


              | **Property** | **Type**      | **Example value**                        | **Description**                                                                                      | **Source**         |

              | ------------ | ------------- | ---------------------------------------- | ---------------------------------------------------------------------------------------------------- | ------------------ |

              | `funderId`   | string | null | `"https://ror.org/0505m1554"`            | Globally unique identifier for the funding organisation, preferably a ROR, ISNI, or FundRef DOI URI. | RIOXX / OpenAlex   |

              | `funderName` | string | null | `"Arts and Humanities Research Council"` | Canonical or source-preferred name of the funding organisation.                                      | RIOXX / OpenAlex   |

              | `funderDoi`  | string | null | `"10.13039/501100000267"`                | FundRef DOI associated with the funding organisation, when available.                                | OpenAlex / FundRef |

              | `funder`     | object | null | See below                                | Structured representation of the funding organisation.                                               | OpenAlex / RIOXX   |


              ##### `funder` fields


              | **Property** | **Type**      | **Example value**                        | **Description**                                                       |

              | ------------ | ------------- | ---------------------------------------- | --------------------------------------------------------------------- |

              | `id`         | string | null | `"https://ror.org/0505m1554"`            | Source or global identifier associated with the funding organisation. |

              | `name`       | string | null | `"Arts and Humanities Research Council"` | Name of the funding organisation.                                     |

              | `doi`        | string | null | `"10.13039/501100000267"`                | FundRef DOI associated with the funding organisation.                 |


              If `funder.id` contains a ROR identifier, the relationship to the Institutions entity can be resolved by matching it to `Institutions.rorId`. A canonical CORE relationship may instead use a separate integer `institutionId` if direct identifier-based traversal is required.


              #### Funding amount


              | **Property** | **Type**      | **Example value** | **Description**                                                 | **Source** |

              | ------------ | ------------- | ----------------- | --------------------------------------------------------------- | ---------- |

              | `amount`     | number | null | `250000.00`       | Funding amount awarded in the currency specified by `currency`. | OpenAlex   |

              | `currency`   | string | null | `"GBP"`           | ISO 4217 currency code associated with `amount`.                | OpenAlex   |


              The amount must always be interpreted together with its currency. A missing amount must not be treated as zero, and amounts in different currencies should not be directly compared without conversion.


              #### Dates


              | **Property** | **Type**       | **Example value** | **Description**                                                 | **Source** |

              | ------------ | -------------- | ----------------- | --------------------------------------------------------------- | ---------- |

              | `startDate`  | string | null  | `"2023-01-01"`    | Start date of the funding award, formatted as an ISO 8601 date. | OpenAlex   |

              | `endDate`    | string | null  | `"2026-12-31"`    | End date of the funding award, formatted as an ISO 8601 date.   | OpenAlex   |

              | `startYear`  | integer | null | `2023`            | Calendar year in which the funding award begins.                | OpenAlex   |

              | `endYear`    | integer | null | `2026`            | Calendar year in which the funding award ends.                  | OpenAlex   |


              `startYear` and `endYear` provide convenient year-level filtering. When complete dates are available, their values should remain consistent with `startDate` and `endDate`.


              #### Investigators


              | **Property**         | **Type**         | **Example value** | **Description**                                                   | **Source** |

              | -------------------- | ---------------- | ----------------- | ----------------------------------------------------------------- | ---------- |

              | `leadInvestigator`   | object | null    | See below         | Principal or lead investigator associated with the Grants record. | OpenAlex   |

              | `coLeadInvestigator` | object | null    | See below         | Co-lead investigator associated with the Grants record.           | OpenAlex   |

              | `investigators`      | object\[] | null | See below         | Other investigators associated with the Grants record.            | OpenAlex   |


              ##### Investigator object


              The following proposed structure can be used consistently for `leadInvestigator`, `coLeadInvestigator`, and items in `investigators`.


              | **Property**  | **Type**       | **Example value**                    | **Description**                                                      | **Source**       |

              | ------------- | -------------- | ------------------------------------ | -------------------------------------------------------------------- | ---------------- |

              | `authorId`    | integer | null | `67890`                              | CORE identifier of the related Authors record, when resolved.        | CORE             |

              | `openalexId`  | string | null  | `"https://openalex.org/A5048491430"` | OpenAlex Author identifier, when available.                          | OpenAlex         |

              | `orcidId`     | string | null  | `"0000-0003-1613-5981"`              | ORCID identifier, when available.                                    | OpenAlex / ORCID |

              | `displayName` | string | null  | `"Alice Smith"`                      | Display name of the investigator.                                    | OpenAlex         |

              | `role`        | string | null  | `"lead"`                             | Role performed by the investigator in relation to the Grants record. | OpenAlex / CORE  |


              Recommended controlled values for `role` include:


              * `lead`

              * `co-lead`

              * `investigator`


              The role is relationship-specific and does not become a permanent property of the Authors record.


              #### Funded Works


              | **Property**         | **Type**         | **Example value**                                               | **Description**                                                                                                                    | **Source** |

              | -------------------- | ---------------- | --------------------------------------------------------------- | ---------------------------------------------------------------------------------------------------------------------------------- | ---------- |

              | `fundedOutputs`      | string\[] | null | `["https://openalex.org/W1234567890"]`                          | OpenAlex Work identifiers associated with the Grants record. Despite the property name, these values do not identify CORE Outputs. | OpenAlex   |

              | `fundedOutputsCount` | integer | null   | `12`                                                            | Number of source Works associated with the Grants record.                                                                          | OpenAlex   |

              | `worksApiUrl`        | string | null    | `"https://api.openalex.org/works?filter=grants.id:G5859020988"` | OpenAlex API URL for Works associated with the Grants record.                                                                      | OpenAlex   |


              `fundedOutputsCount` is a source-derived snapshot and may change as the source identifies additional funded Works.


              #### Web and source lifecycle


              | **Property**       | **Type**      | **Example value**                           | **Description**                                                                                | **Source** |

              | ------------------ | ------------- | ------------------------------------------- | ---------------------------------------------------------------------------------------------- | ---------- |

              | `landingPageUrl`   | string | null | `"https://example.org/grants/AH-W007622-1"` | Landing page associated with the funding award.                                                | OpenAlex   |

              | `grantCreatedDate` | string | null | `"2023-12-25"`                              | Date on which the source record was created, formatted as an ISO 8601 date.                    | OpenAlex   |

              | `grantUpdatedDate` | string | null | `"2024-11-07T05:31:56Z"`                    | Date and time at which the source record was last updated, formatted as an ISO 8601 timestamp. | OpenAlex   |


              `grantCreatedDate` and `grantUpdatedDate` describe the lifecycle of the source record. They do not represent the creation and update dates of the canonical CORE Grants record. If CORE record-management dates are needed, they should be represented separately, for example as `createdDate` and `updatedDate`.


              Example Grants record:


              ```json

              {
                "grantId": 13,
                "grantOpenalexId": "https://openalex.org/G5859020988",
                "grantDoi": "https://doi.org/10.35802/218671",
                "funderAwardId": "AH/W007622/1",
                "grantIds": [
                  {
                    "scheme": "openalex",
                    "value": "G5859020988",
                    "uri": "https://openalex.org/G5859020988"
                  },
                  {
                    "scheme": "doi",
                    "value": "10.35802/218671",
                    "uri": "https://doi.org/10.35802/218671"
                  },
                  {
                    "scheme": "funder_award_id",
                    "value": "AH/W007622/1",
                    "uri": null
                  }
                ],
                "grantName": "AI methods for biomedical discovery",
                "grantDescription": "Funding for research on AI methods in biomedical discovery.",
                "fundingType": "grant",
                "funderScheme": "Horizon Europe",
                "provenance": "funder registry",
                "funderId": "https://ror.org/0505m1554",
                "funderName": "Arts and Humanities Research Council",
                "funderDoi": "10.13039/501100000267",
                "funder": {
                  "id": "https://ror.org/0505m1554",
                  "name": "Arts and Humanities Research Council",
                  "doi": "10.13039/501100000267"
                },
                "amount": 250000.00,
                "currency": "GBP",
                "startDate": "2023-01-01",
                "endDate": "2026-12-31",
                "startYear": 2023,
                "endYear": 2026,
                "leadInvestigator": {
                  "authorId": 67890,
                  "openalexId": "https://openalex.org/A5048491430",
                  "orcidId": "0000-0003-1613-5981",
                  "displayName": "Alice Smith",
                  "role": "lead"
                },
                "coLeadInvestigator": null,
                "investigators": [
                  {
                    "authorId": 67912,
                    "openalexId": "https://openalex.org/A5061122334",
                    "orcidId": null,
                    "displayName": "David Jones",
                    "role": "investigator"
                  }
                ],
                "fundedOutputs": [
                  "https://openalex.org/W1234567890"
                ],
                "fundedOutputsCount": 12,
                "worksApiUrl": "https://api.openalex.org/works?filter=grants.id:G5859020988",
                "landingPageUrl": "https://example.org/grants/AH-W007622-1",
                "grantCreatedDate": "2023-12-25",
                "grantUpdatedDate": "2024-11-07T05:31:56Z"
              }

              ```

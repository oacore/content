          - divider: false
            border: false
            id: grants-api-grants-endpoints
            title: Grants endpoints
            descriptionAbout: >-
              #### Available endpoints


              | **Operation**                           | **Method** | **Endpoint**                         |

              | --------------------------------------- | ---------- | ------------------------------------ |

              | Get a single Grants record              | `GET`      | `/v4/grants/{grantId}`               |

              | Search Grants using URL parameters      | `GET`      | `/v4/search/grants`                  |

              | Search Grants using a JSON request body | `POST`     | `/v4/search/grants`                  |

              | Retrieve Works for a Grants record      | `GET`      | `/v4/grants/{grantId}/works`         |

              | Retrieve Projects for a Grants record   | `GET`      | `/v4/grants/{grantId}/projects`      |

              | Retrieve the funding Institution        | `GET`      | `/v4/grants/{grantId}/funder`        |

              | Retrieve investigators                  | `GET`      | `/v4/grants/{grantId}/investigators` |


              #### Get a single Grants record


              Retrieves one Grants record using its CORE identifier.


              ```http

              GET https://api.core.ac.uk/v4/grants/{grantId}

              ```


              ##### Authorization


              | **Parameter**   | **Location** | **Type** | **Required** | **Description**                                           |

              | --------------- | ------------ | -------- | ------------ | --------------------------------------------------------- |

              | `Authorization` | Header       | string   | Yes          | CORE API authentication token supplied as a Bearer token. |


              ##### Path parameters


              | **Parameter** | **Type** | **Required** | **Description**                              |

              | ------------- | -------- | ------------ | -------------------------------------------- |

              | `grantId`     | integer  | Yes          | Unique CORE identifier of the Grants record. |


              ##### Query parameters


              | **Parameter** | **Type** | **Required** | **Description**                                                                                                                              |

              | ------------- | -------- | ------------ | -------------------------------------------------------------------------------------------------------------------------------------------- |

              | `select`      | string   | No           | Comma-separated list of top-level Grants fields to return. Example: `select=grantId,grantName,funderName,amount,currency,startDate,endDate`. |


              Example request:


              ```bash

              curl --request GET \
                --url "https://api.core.ac.uk/v4/grants/13" \
                --header "Authorization: Bearer YOUR_API_KEY"
              ```


              Example response:


              ```json

              {
                "grantId": 13,
                "grantOpenalexId": "https://openalex.org/G5859020988",
                "grantDoi": "https://doi.org/10.35802/218671",
                "funderAwardId": "AH/W007622/1",
                "grantName": "AI methods for biomedical discovery",
                "fundingType": "grant",
                "funderScheme": "Horizon Europe",
                "funderId": "https://ror.org/0505m1554",
                "funderName": "Arts and Humanities Research Council",
                "amount": 250000.00,
                "currency": "GBP",
                "startDate": "2023-01-01",
                "endDate": "2026-12-31",
                "fundedOutputsCount": 12
              }

              ```


              Example request using `select`:


              ```bash

              curl --request GET \
                --url "https://api.core.ac.uk/v4/grants/13?select=grantId,grantName,funderName,amount,currency,startDate,endDate" \
                --header "Authorization: Bearer YOUR_API_KEY"
              ```


              Example response using `select`:


              ```json

              {
                "grantId": 13,
                "grantName": "AI methods for biomedical discovery",
                "funderName": "Arts and Humanities Research Council",
                "amount": 250000.00,
                "currency": "GBP",
                "startDate": "2023-01-01",
                "endDate": "2026-12-31"
              }

              ```


              #### Responses


              | **Status** | **Description**                                           |

              | ---------- | --------------------------------------------------------- |

              | `200`      | The Grants record was returned successfully.              |

              | `400`      | The supplied `grantId` or `select` expression is invalid. |

              | `401`      | Authentication credentials are missing or invalid.        |

              | `404`      | No Grants record exists for the supplied `grantId`.       |

              | `429`      | The API request limit has been exceeded.                  |

              | `500`      | An unexpected server error occurred.                      |
          - divider: false
            border: false
            id: grants-api-search-grants
            title: Search Grants
            descriptionAbout: >-
              Searches, filters, orders, facets, counts, and paginates Grants
              records.


              Grants search is available through `GET` and `POST`:


              | **Method** | **API endpoint**                          |

              | ---------- | ----------------------------------------- |

              | `GET`      | <https://api.core.ac.uk/v4/search/grants> |

              | `POST`     | <https://api.core.ac.uk/v4/search/grants> |


              Both methods use the same CORE query language and return the same Grants search-response structure.


              Grants search supports textual keyword search and structured queries. Vector search, hybrid search, and semantic reranking are not supported for this entity.


              #### GET and POST search parameters


              ##### GET query parameters


              | **Parameter** | **Type** | **Required** | **Default**                   | **Description**                                                                                                                   |

              | ------------- | -------- | ------------ | ----------------------------- | --------------------------------------------------------------------------------------------------------------------------------- |

              | `q`           | string   | No           | `*`                           | CORE query expression supporting textual search, field lookup, Boolean operators, grouping, range queries, and existence queries. |

              | `orderby`     | string   | No           | Relevance for textual queries | Comma-separated ordering directives in `field:direction` format.                                                                  |

              | `select`      | string   | No           | All retrievable fields        | Comma-separated list of Grants fields to include in each result.                                                                  |

              | `facets`      | string   | No           | —                             | Comma-separated list of facetable fields for which value buckets and counts should be returned.                                   |

              | `count`       | boolean  | No           | `false`                       | Indicates whether the total number of matching Grants records should be included.                                                 |

              | `limit`       | integer  | No           | `10`                          | Maximum number of Grants records to return.                                                                                       |

              | `offset`      | integer  | No           | `0`                           | Number of matching Grants records to skip.                                                                                        |


              ##### POST request body


              | **Property** | **Type**  | **Required** | **Default**                   | **Description**                                                                                                                   |

              | ------------ | --------- | ------------ | ----------------------------- | --------------------------------------------------------------------------------------------------------------------------------- |

              | `q`          | string    | No           | `*`                           | CORE query expression supporting textual search, field lookup, Boolean operators, grouping, range queries, and existence queries. |

              | `orderby`    | string\[] | No           | Relevance for textual queries | Ordered list of sorting directives in `field:direction` format.                                                                   |

              | `select`     | string\[] | No           | All retrievable fields        | List of Grants fields to include in each result.                                                                                  |

              | `facets`     | string\[] | No           | —                             | List of facetable fields for which value buckets and counts should be returned.                                                   |

              | `count`      | boolean   | No           | `false`                       | Indicates whether the total number of matching Grants records should be included.                                                 |

              | `limit`      | integer   | No           | `10`                          | Maximum number of Grants records to return.                                                                                       |

              | `offset`     | integer   | No           | `0`                           | Number of matching Grants records to skip.                                                                                        |


              ##### GET and POST parameter mapping


              | **GET query parameter**                               | **POST body property**                                                   |

              | ----------------------------------------------------- | ------------------------------------------------------------- |

              | `q=currency:GBP`                                      | `"q": "currency:GBP"`                                                    |

              | `orderby=startDate:desc`                              | `"orderby": ["startDate:desc"]`                                          |

              | `select=grantId,grantName,funderName,amount,currency` | `"select": ["grantId", "grantName", "funderName", "amount", "currency"]` |

              | `facets=fundingType,funderScheme,currency,startYear`  | `"facets": ["fundingType", "funderScheme", "currency", "startYear"]`     |

              | `count=true`                                          | `"count": true`                                                          |

              | `limit=10`                                            | `"limit": 10`                                                            |

              | `offset=0`                                            | `"offset": 0`                                                            |


              The `GET` method represents `orderby`, `select`, and `facets` as comma-separated strings. The `POST` method represents them as JSON arrays.
          - divider: false
            border: false
            id: grants-api-search-examples
            title: Search examples
            descriptionAbout: >-
              #### Search by name


              GET:


              ```http

              GET /v4/search/grants?q=grantName:"AI methods for biomedical discovery"

              ```


              Equivalent POST body:


              ```json

              {
                "q": "grantName:\"AI methods for biomedical discovery\""
              }

              ```


              A broader free-text query may also be used:


              ```http

              GET /v4/search/grants?q="biomedical discovery"

              ```


              A broad textual query searches the following fields:


              * `grantName`

              * `grantDescription`

              * `funderScheme`

              * `provenance`

              * `funderName`

              * `funder.name`

              * `leadInvestigator.displayName`

              * `coLeadInvestigator.displayName`

              * `investigators.displayName`


              When a textual query is supplied and `orderby` is omitted, results are ordered by relevance.


              #### Retrieve a Grants record by OpenAlex identifier


              ```http

              GET /v4/search/grants?q=grantOpenalexId:"https://openalex.org/G5859020988"

              ```


              #### Retrieve a Grants record by DOI


              ```http

              GET /v4/search/grants?q=grantDoi:"https://doi.org/10.35802/218671"

              ```


              #### Retrieve a Grants record by funder award identifier


              GET:


              ```http

              GET /v4/search/grants?q=funderAwardId:"AH/W007622/1"

              ```


              Equivalent POST body:


              ```json

              {
                "q": "funderAwardId:\"AH/W007622/1\""
              }

              ```


              #### Search by funding organisation


              ```http

              GET /v4/search/grants?q=funderName:"Arts and Humanities Research Council"

              ```


              The global funder identifier should be used when exact identity matching is required:


              ```http

              GET /v4/search/grants?q=funderId:"https://ror.org/0505m1554"

              ```


              #### Retrieve Grants records by funding scheme


              ```http

              GET /v4/search/grants?q=funderScheme:"Horizon Europe"

              ```


              #### Retrieve Grants records within an amount range


              ```http

              GET /v4/search/grants?q=currency:GBP AND amount>=100000 AND amount<=500000&orderby=amount:desc

              ```


              The currency clause is essential when comparing monetary values.


              #### Retrieve Grants records active on a particular date


              ```http

              GET /v4/search/grants?q=startDate<=2025-06-01 AND endDate>=2025-06-01

              ```


              This query returns Grants records whose recorded date range includes 1 June 2025. Records with a missing `startDate` or `endDate` are not matched by both clauses.


              #### Search by investigator


              ```http

              GET /v4/search/grants?q=leadInvestigator.authorId:67890 OR coLeadInvestigator.authorId:67890 OR investigators.authorId:67890

              ```


              An investigator name may also be searched textually:


              ```http

              GET /v4/search/grants?q=investigators.displayName:"David Jones"

              ```


              #### Retrieve Grants records associated with an OpenAlex Work


              ```http

              GET /v4/search/grants?q=fundedOutputs:"https://openalex.org/W1234567890"

              ```


              This query uses the source-specific OpenAlex Work identifier. A canonical CORE Works relationship should instead use a CORE `workId` when available.


              #### Combined search, selection, and ordering


              The following request:


              * Searches for Grants records concerning biomedical discovery

              * Restricts results to GBP awards of at least 100,000

              * Restricts results to awards starting in or after 2020

              * Orders results by funding amount in descending order

              * Returns selected fields and the total matching result count


              GET:


              ```http

              GET /v4/search/grants
                  ?q="biomedical discovery" AND currency:GBP AND amount>=100000 AND startYear>=2020
                  &orderby=amount:desc,grantId:asc
                  &select=grantId,grantName,funderName,amount,currency,startDate,endDate
                  &count=true
                  &limit=10
                  &offset=0
              ```


              Equivalent POST request:


              ```bash

              curl --request POST \
                --url "https://api.core.ac.uk/v4/search/grants" \
                --header "Authorization: Bearer YOUR_API_KEY" \
                --header "Content-Type: application/json" \
                --data '{
                  "q": "\"biomedical discovery\" AND currency:GBP AND amount>=100000 AND startYear>=2020",
                  "orderby": [
                    "amount:desc",
                    "grantId:asc"
                  ],
                  "select": [
                    "grantId",
                    "grantName",
                    "funderName",
                    "amount",
                    "currency",
                    "startDate",
                    "endDate"
                  ],
                  "count": true,
                  "limit": 10,
                  "offset": 0
                }'
              ```


              Example search response:


              ```json

              {
                "totalHits": 1,
                "count": 1,
                "limit": 10,
                "offset": 0,
                "results": [
                  {
                    "grantId": 13,
                    "grantName": "AI methods for biomedical discovery",
                    "funderName": "Arts and Humanities Research Council",
                    "amount": 250000.00,
                    "currency": "GBP",
                    "startDate": "2023-01-01",
                    "endDate": "2026-12-31"
                  }
                ]
              }

              ```


              #### Ordering Grants results


              Only fields configured as sortable may be used with `orderby`.


              ##### Order by preferred name


              ```http

              GET /v4/search/grants?orderby=grantName:asc

              ```


              ##### Order by start date


              ```http

              GET /v4/search/grants?orderby=startDate:desc

              ```


              ##### Order by amount within one currency


              ```http

              GET /v4/search/grants?q=currency:GBP&orderby=amount:desc

              ```


              ##### Order by multiple fields


              GET:


              ```http

              GET /v4/search/grants?orderby=startDate:desc,grantId:asc

              ```


              POST representation:


              ```json

              {
                "orderby": [
                  "startDate:desc",
                  "grantId:asc"
                ]
              }

              ```


              Results are first ordered by start date. Records with the same start date are then ordered by their CORE identifiers.


              #### Facets


              The `facets` option returns value buckets and counts for fields configured as facetable.


              GET:


              ```http

              GET /v4/search/grants?q=*&facets=fundingType,funderScheme,currency,startYear&count=true&limit=0

              ```


              Equivalent POST body:


              ```json

              {
                "q": "*",
                "facets": [
                  "fundingType",
                  "funderScheme",
                  "currency",
                  "startYear"
                ],
                "count": true,
                "limit": 0
              }

              ```


              Example facet response:


              ```json

              {
                "totalHits": 125000,
                "count": 0,
                "limit": 0,
                "offset": 0,
                "facets": {
                  "fundingType": [
                    {
                      "value": "grant",
                      "count": 104000
                    },
                    {
                      "value": "contract",
                      "count": 12500
                    }
                  ],
                  "funderScheme": [
                    {
                      "value": "Horizon Europe",
                      "count": 18500
                    },
                    {
                      "value": "Horizon 2020",
                      "count": 16300
                    }
                  ],
                  "currency": [
                    {
                      "value": "EUR",
                      "count": 57000
                    },
                    {
                      "value": "GBP",
                      "count": 21000
                    }
                  ],
                  "startYear": [
                    {
                      "value": 2023,
                      "count": 9400
                    },
                    {
                      "value": 2022,
                      "count": 8800
                    }
                  ]
                },
                "results": []
              }

              ```


              Facet counts describe the complete matching result set. Setting `limit=0` returns facet buckets and counts without returning Grants records.


              #### Result count


              Set `count=true` to include the total number of matching Grants records.


              ```http

              GET /v4/search/grants?q=funderScheme:"Horizon Europe"&count=true

              ```


              When `count` is omitted or set to `false`, `totalHits` may be omitted from the response. The response-level `count` is the number of records returned on the current page.


              #### Pagination


              Use `limit` and `offset` to paginate Grants results. A deterministic `orderby` expression should be used when retrieving multiple pages.


              First page:


              ```http

              GET /v4/search/grants?q=currency:GBP&orderby=startDate:desc,grantId:asc&limit=20&offset=0

              ```


              Second page:


              ```http

              GET /v4/search/grants?q=currency:GBP&orderby=startDate:desc,grantId:asc&limit=20&offset=20

              ```


              The offset is calculated as:


              ```text

              offset = page size × number of previous pages

              ```


              #### Search responses


              | **Status** | **Description**                                                                                                 |

              | ---------- | --------------------------------------------------------------------------------------------------------------- |

              | `200`      | The Grants search was completed successfully.                                                                   |

              | `400`      | The request contains an invalid query, unsupported field, invalid facet, or invalid response-control parameter. |

              | `401`      | Authentication credentials are missing or invalid.                                                              |

              | `413`      | The `POST` request body exceeds the permitted size.                                                             |

              | `429`      | The API request limit has been exceeded.                                                                        |

              | `500`      | An unexpected server error occurred.                                                                            |


              An empty search returns `200 OK` with an empty `results` array. Nullable fields remain present with a JSON `null` value unless they are omitted through `select` or the API's general response conventions specify otherwise.
          - divider: false
            border: false
            id: grants-api-relationship-oriented-endpoints
            title: Relationship-oriented endpoints
            descriptionAbout: >-
              
              Relationship-oriented endpoints provide convenient access to entities directly connected to a Grants record. They return related records rather than embedding complete related entities in the Grants response.


              #### Works funded by a Grants record


              ```http

              GET /v4/grants/{grantId}/works

              ```


              Retrieves canonical Works associated with the Grants record. Source-specific OpenAlex Work identifiers in `fundedOutputs` must be resolved against the Works entity's external identifiers.


              Example request:


              ```http

              GET /v4/grants/13/works?select=workId,title,doi,yearPublished&orderby=yearPublished:desc&count=true&limit=10&offset=0

              ```


              If Works expose a filterable `grantIds` field, the equivalent search is:


              ```http

              GET /v4/search/works?q=grantIds:13

              ```


              The reverse convenience endpoint may be exposed as:


              ```http

              GET /v4/works/{workId}/grants

              ```


              #### Projects supported by a Grants record


              ```http

              GET /v4/grants/{grantId}/projects

              ```


              Retrieves Projects records supported by the Grants record.


              Example request:


              ```http

              GET /v4/grants/13/projects?select=projectId,code,acronym,title,startDate,endDate&count=true&limit=10&offset=0

              ```


              If Projects expose a filterable `grantIds` field, the equivalent search is:


              ```http

              GET /v4/search/projects?q=grantIds:13

              ```


              The reverse convenience endpoint is:


              ```http

              GET /v4/projects/{projectId}/grants

              ```


              #### Funding Institution


              ```http

              GET /v4/grants/{grantId}/funder

              ```


              Retrieves the Institutions record resolved from `funderId`, `funder.id`, or `funderDoi`.


              Example request:


              ```http

              GET /v4/grants/13/funder

              ```


              If the identifier is a ROR URI, the equivalent Institutions search is:


              ```http

              GET /v4/search/institutions?q=rorId:"https://ror.org/0505m1554"

              ```


              The reverse convenience endpoint may be exposed as:


              ```http

              GET /v4/institutions/{institutionId}/grants

              ```


              #### Investigators


              ```http

              GET /v4/grants/{grantId}/investigators

              ```


              Retrieves distinct Authors records referenced by `leadInvestigator.authorId`, `coLeadInvestigator.authorId`, and `investigators.authorId`. The relationship response should retain each investigator's role.


              Example response:


              ```json

              {
                "totalHits": 2,
                "results": [
                  {
                    "authorId": 67890,
                    "displayName": "Alice Smith",
                    "orcidId": "0000-0003-1613-5981",
                    "role": "lead"
                  },
                  {
                    "authorId": 67912,
                    "displayName": "David Jones",
                    "orcidId": null,
                    "role": "investigator"
                  }
                ]
              }

              ```


              The reverse convenience endpoint may be exposed as:


              ```http

              GET /v4/authors/{authorId}/grants

              ```


              An existing Grants record with no related records returns `200 OK` with an empty `results` array. If the supplied Grants record does not exist, a collection relationship endpoint returns `404 Not Found`.


              If the funding Institution cannot be resolved, `/v4/grants/{grantId}/funder` returns either `404 Not Found` or the API's documented null-relationship response.
      - item: Funders
        sections:
          - divider: false
            border: false
            id: funders-api-introduction
            title: Introduction
            descriptionAbout: >-
              The Funders entity represents organisations or funding bodies that
              provide financial support for research. A Funders record contains
              the organisation's canonical CORE identifier, names, external
              identifiers, jurisdiction, and source-provenance information.
              Source metadata may also associate a Funders record with awards,
              Grants, Projects, Works, or clinical trials.


              The Funders entity represents the funding organisation itself. Award-specific information belongs primarily in the Grants entity, research-activity information belongs in the Projects entity, and research-result information belongs in the Works or Outputs entities.


              #### Entity relationships


              ![Funders entity relationships](/images/docs-graph/funders.png)


              | **Relationship**        | **Type**            | **Description**                                                                                                                                                                         |

              | ----------------------- | ------------------- | --------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- |

              | Funders–Grants          | Direct, one-to-many | A Funders record may award multiple Grants records. A Grants record may have zero or one resolved Funders record.                                                                       |

              | Funders–Projects        | Normally indirect   | Projects records are normally connected to Funders through Grants. A direct source association may be retained when no Grants record can be resolved.                                   |

              | Funders–Works           | Normally indirect   | Works are normally connected to Funders through Grants. A direct funding assertion may be retained when source metadata identifies a funding organisation but no award can be resolved. |

              | Funders–clinical trials | Contextual          | Clinical-trial identifiers describe the funded research context. They are not stable properties of the funding organisation itself.                                                     |
          - divider: false
            border: false
            id: funders-api-data-structure
            title: Data structure
            descriptionAbout: >-
              The following sections describe the fields in the planned CORE
              Graph metadata schema for the Funders entity. All CORE entity
              identifiers, including `funderId`, `grantId`, `projectId`, and
              `workId`, use the `integer` type.


              #### Identifiers and names


              | **Property**       | **Type**         | **Example value**        | **Description**                                                                                    | **Source**                             |

              | ------------------ | ---------------- | ------------------------ | -------------------------------------------------------------------------------------------------- | -------------------------------------- |

              | `funderId`         | integer          | `501`                    | Unique CORE internal canonical identifier for a record in the Funders entity.                      | CORE                                   |

              | `name`             | string | null    | `"Wellcome Trust"`       | Preferred name selected by CORE for the Funders record.                                            | CORE / Crossref / OpenAlex / OpenAIRE  |

              | `shortName`        | string | null    | `"Wellcome"`             | Short or abbreviated name associated with the Funders record.                                      | OpenAIRE                               |

              | `alternativeNames` | string\[] | null | `["The Wellcome Trust"]` | Alternative, historical, or source-provided names associated with the Funders record.              | RIOXX / OpenAIRE / Crossref / OpenAlex |

              | `funderDoi`        | string | null    | `"10.13039/100004440"`   | Crossref Funder Registry DOI associated with the Funders record.                                   | Crossref / RIOXX / OpenAIRE            |

              | `funderIds`        | string\[] | null | `["100004440"]`          | Source-provided external identifiers for the Funders record. These are not CORE `funderId` values. | RIOXX / OpenAIRE / Crossref            |

              | `identifiers`      | object\[]        | See below                | Structured list of all known external identifiers associated with the Funders record.              | CORE                                   |


              ##### `identifiers` fields


              | **Property** | **Type**      | **Example value**      | **Description**                                  |

              | ------------ | ------------- | ---------------------- | ------------------------------------------------ |

              | `scheme`     | string        | `"FUNDER_DOI"`         | Identifier scheme or classification.             |

              | `value`      | string        | `"10.13039/100004440"` | Identifier value.                                |

              | `assertedBy` | string | null | `"Crossref"`           | Source that supplied or asserted the identifier. |


              Recommended controlled values for `scheme` may include:


              * `FUNDER_DOI`

              * `ROR`

              * `ISNI`

              * `OFR`

              * `OPENALEX_ID`

              * `OPENAIRE_ID`


              `funderId` is the canonical CORE integer identifier. Values in `funderIds` and `identifiers` are external identifiers and therefore remain strings.


              #### Award and Grants context


              | **Property**    | **Type**       | **Example value**                       | **Description**                                                  | **Source**                            |

              | --------------- | -------------- | --------------------------------------- | ---------------------------------------------------------------- | ------------------------------------- |

              | `awardNumber`   | string | null  | `"WT123456"`                            | Award number associated with this source funding assertion.      | OpenAIRE / Crossref / OpenAlex        |

              | `awardUri`      | string | null  | `"https://example.org/grants/WT123456"` | URI associated with the award number.                            | OpenAIRE                              |

              | `awardTitle`    | string | null  | `"AI methods for biomedical discovery"` | Title of the associated award or Grants record.                  | OpenAIRE                              |

              | `fundingStream` | string | null  | `"Biomedical Research"`                 | Funding stream or programme through which the award was made.    | OpenAIRE                              |

              | `projectId`     | integer | null | `12034`                                 | CORE identifier of an associated Projects record, when resolved. | CORE resolution from RIOXX / OpenAIRE |


              These properties describe one award or Projects association. If a Funders record can be associated with multiple awards or Projects records, they should not be treated as single-valued permanent properties of the organisation.


              Prefer relationships such as:


              ```text

              Funders.funderId → Grants.funderId

              Grants.projectIds → Projects.projectId

              ```


              #### Funders context and identifier provenance


              | **Property**    | **Type**      | **Example value** | **Description**                                                                                                                 | **Source** |

              | --------------- | ------------- | ----------------- | ------------------------------------------------------------------------------------------------------------------------------- | ---------- |

              | `jurisdiction`  | string | null | `"GB"`            | Jurisdiction or country associated with the Funders record. Use an ISO 3166-1 alpha-2 code when the value represents a country. | OpenAIRE   |

              | `doiAssertedBy` | string | null | `"publisher"`     | Source that asserted `funderDoi`.                                                                                               | Crossref   |

              | `idAssertedBy`  | string | null | `"publisher"`     | Source that asserted an external identifier for the Funders record.                                                             | Crossref   |


              `doiAssertedBy` and `idAssertedBy` overlap with `identifiers.assertedBy`. If the structured `identifiers` collection is authoritative, the top-level assertion fields may be retained only as compatibility aliases.


              #### Project validation


              | **Property**               | **Type**       | **Example value** | **Description**                                                                                             | **Source** |

              | -------------------------- | -------------- | ----------------- | ----------------------------------------------------------------------------------------------------------- | ---------- |

              | `projectValidatedDate`     | string | null  | `"2023-06-14"`    | Date on which the associated Projects or funding record was validated, formatted as an ISO 8601 date.       | OpenAIRE   |

              | `projectValidatedByFunder` | boolean | null | `true`            | Indicates whether the associated Projects or funding information was validated by the funding organisation. | OpenAIRE   |


              These values describe a particular Projects or funding association. A `null` validation flag means that the source did not provide enough information to determine validation status; it must not be interpreted as `false`.


              #### Clinical-trial context


              | **Property**                    | **Type**         | **Example value**                      | **Description**                                                                                | **Source**                     |

              | ------------------------------- | ---------------- | -------------------------------------- | ---------------------------------------------------------------------------------------------- | ------------------------------ |

              | `clinicalTrialNumbers`          | string\[] | null | `["NCT04512345", "ISRCTN12345678"]`    | Clinical-trial identifiers associated with the funded Work, Grants record, or Projects record. | Repository metadata / Crossref |

              | `clinicalTrialNumberRegistries` | string\[] | null | `["clinicaltrials.gov", "isrctn"]`     | Registries associated with the clinical-trial identifiers.                                     | Repository metadata / Crossref |

              | `clinicalTrialNumberTypes`      | string\[] | null | `["pre-registration", "post-results"]` | Types or categories associated with the clinical-trial identifiers.                            | Repository metadata / Crossref |


              When the arrays are used, values at the same array position must describe the same clinical trial. For example, index `0` across the three arrays describes `NCT04512345`, its registry, and its type.


              Example Funders record:


              ```json

              {
                "funderId": 501,
                "name": "Wellcome Trust",
                "shortName": "Wellcome",
                "alternativeNames": [
                  "The Wellcome Trust"
                ],
                "funderDoi": "10.13039/100004440",
                "funderIds": [
                  "100004440"
                ],
                "identifiers": [
                  {
                    "scheme": "FUNDER_DOI",
                    "value": "10.13039/100004440",
                    "assertedBy": "Crossref"
                  },
                  {
                    "scheme": "OFR",
                    "value": "100004440",
                    "assertedBy": "Crossref"
                  }
                ],
                "awardNumber": "WT123456",
                "awardUri": "https://example.org/grants/WT123456",
                "awardTitle": "AI methods for biomedical discovery",
                "fundingStream": "Biomedical Research",
                "projectId": 12034,
                "jurisdiction": "GB",
                "doiAssertedBy": "publisher",
                "idAssertedBy": "publisher",
                "projectValidatedDate": "2023-06-14",
                "projectValidatedByFunder": true,
                "clinicalTrialNumbers": [
                  "NCT04512345",
                  "ISRCTN12345678"
                ],
                "clinicalTrialNumberRegistries": [
                  "clinicaltrials.gov",
                  "isrctn"
                ],
                "clinicalTrialNumberTypes": [
                  "pre-registration",
                  "post-results"
                ]
              }

              ```
          - divider: false
            border: false
            id: funders-api-supported-field-operations
            title: Supported field operations
            descriptionAbout: >-
              
              The following table describes the proposed field operations for the Funders entity.


              | Attribute | Searchable | Filterable | Sortable | Facetable |

              | --- | --- | --- | --- | --- |

              | `funderId` | No | Yes | Yes | No |

              | `name` | Yes | No | Yes | No |

              | `shortName` | Yes | No | No | No |

              | `alternativeNames` | Yes | No | No | No |

              | `funderDoi` | No | Yes | No | No |

              | `funderIds` | No | Yes | No | No |

              | `identifiers.scheme` | No | Yes | No | Yes |

              | `identifiers.value` | No | Yes | No | No |

              | `identifiers.assertedBy` | No | Yes | No | Yes |

              | `awardNumber` | No | Yes | No | No |

              | `awardUri` | No | No | No | No |

              | `awardTitle` | Yes | No | No | No |

              | `fundingStream` | Yes | Yes | No | Yes |

              | `projectId` | No | Yes | No | No |

              | `jurisdiction` | No | Yes | No | Yes |

              | `doiAssertedBy` | No | Yes | No | Yes |

              | `idAssertedBy` | No | Yes | No | Yes |

              | `projectValidatedDate` | No | Yes | Yes | No |

              | `projectValidatedByFunder` | No | Yes | No | Yes |

              | `clinicalTrialNumbers` | No | Yes | No | No |

              | `clinicalTrialNumberRegistries` | No | Yes | No | Yes |

              | `clinicalTrialNumberTypes` | No | Yes | No | Yes |
          - divider: false
            border: false
            id: funders-api-funders-endpoints
            title: Funders endpoints
            descriptionAbout: >-
              #### Available endpoints


              | **Operation**                                   | **Method** | **Endpoint**                      |

              | ----------------------------------------------- | ---------- | --------------------------------- |

              | Get a single Funders record                     | `GET`      | `/v4/funders/{funderId}`          |

              | Search Funders using URL parameters             | `GET`      | `/v4/search/funders`              |

              | Search Funders using a JSON request body        | `POST`     | `/v4/search/funders`              |

              | Retrieve Grants awarded by a Funders record     | `GET`      | `/v4/funders/{funderId}/grants`   |

              | Retrieve Projects supported by a Funders record | `GET`      | `/v4/funders/{funderId}/projects` |

              | Retrieve Works supported by a Funders record    | `GET`      | `/v4/funders/{funderId}/works`    |


              #### Get a single Funders record


              Retrieves one Funders record using its CORE identifier.


              ```http

              GET https://api.core.ac.uk/v4/funders/{funderId}

              ```


              ##### Authorization


              | **Parameter**   | **Location** | **Type** | **Required** | **Description**                                           |

              | --------------- | ------------ | -------- | ------------ | --------------------------------------------------------- |

              | `Authorization` | Header       | string   | Yes          | CORE API authentication token supplied as a Bearer token. |


              ##### Path parameters


              | **Parameter** | **Type** | **Required** | **Description**                               |

              | ------------- | -------- | ------------ | --------------------------------------------- |

              | `funderId`    | integer  | Yes          | Unique CORE identifier of the Funders record. |


              ##### Query parameters


              | **Parameter** | **Type** | **Required** | **Description**                                                                                                               |

              | ------------- | -------- | ------------ | ----------------------------------------------------------------------------------------------------------------------------- |

              | `select`      | string   | No           | Comma-separated list of top-level Funders fields to return. Example: `select=funderId,name,shortName,funderDoi,jurisdiction`. |


              Example request:


              ```bash

              curl --request GET \
                --url "https://api.core.ac.uk/v4/funders/501" \
                --header "Authorization: Bearer YOUR_API_KEY"
              ```


              Example response:


              ```json

              {
                "funderId": 501,
                "name": "Wellcome Trust",
                "shortName": "Wellcome",
                "alternativeNames": [
                  "The Wellcome Trust"
                ],
                "funderDoi": "10.13039/100004440",
                "identifiers": [
                  {
                    "scheme": "FUNDER_DOI",
                    "value": "10.13039/100004440",
                    "assertedBy": "Crossref"
                  }
                ],
                "jurisdiction": "GB"
              }

              ```


              Example request using `select`:


              ```bash

              curl --request GET \
                --url "https://api.core.ac.uk/v4/funders/501?select=funderId,name,shortName,funderDoi,jurisdiction" \
                --header "Authorization: Bearer YOUR_API_KEY"
              ```


              Example response using `select`:


              ```json

              {
                "funderId": 501,
                "name": "Wellcome Trust",
                "shortName": "Wellcome",
                "funderDoi": "10.13039/100004440",
                "jurisdiction": "GB"
              }

              ```


              #### Responses


              | **Status** | **Description**                                            |

              | ---------- | ---------------------------------------------------------- |

              | `200`      | The Funders record was returned successfully.              |

              | `400`      | The supplied `funderId` or `select` expression is invalid. |

              | `401`      | Authentication credentials are missing or invalid.         |

              | `404`      | No Funders record exists for the supplied `funderId`.      |

              | `429`      | The API request limit has been exceeded.                   |

              | `500`      | An unexpected server error occurred.                       |
  - item: Search
    children:
      - item: null
        sections:
          - divider: false
            border: false
            id: search-overview
            title: Overview
            descriptionAbout: >-
              The CORE Graph API provides a common search interface across graph
              entities.


              Search operations support:


              * free-text search;

              * field-specific search;

              * Boolean conditions;

              * range conditions;

              * existence checks;

              * keyword and phrase matching;

              * field selection;

              * ordering;

              * facets;

              * result counting;

              * pagination.


              Works and Outputs additionally support:


              * Vector-based semantic search;

              * Hybrid search combining keyword and vector relevance;

              * User-generated embedding vectors through POST.


              Search is available through GET and POST:


              ```http

              GET /v4/search/{entityType}


              POST /v4/search/{entityType}

              ```


              The POST operation is read-only. It does not create or modify entity records.


              #### Supported entities


              The `entityType` path value identifies the entity to search.


              | **Entity**     | **Search endpoint**         |

              | -------------- | --------------------------- |

              | Works          | `/v4/search/works`          |

              | Outputs        | `/v4/search/outputs`        |

              | Authors        | `/v4/search/authors`        |

              | Authorships    | `/v4/search/authorships`    |

              | Affiliations   | `/v4/search/affiliations`   |

              | Institutions   | `/v4/search/institutions`   |

              | Journals       | `/v4/search/journals`       |

              | Data Providers | `/v4/search/data-providers` |

              | Publishers     | `/v4/search/publishers`     |


              ##### Search capability matrix


              Based on the current Graph API design:


              | **Entity**     | **Keyword search** | **Structured conditions** | **Facets** | **Vector search** | **Hybrid search** | **Explicit vector** |

              | -------------- | ------------------ | ------------------------- | ---------- | ----------------- | ----------------- | ------------------- |

              | Works          | Yes                | Yes                       | Yes        | Yes               | Yes               | POST                |

              | Outputs        | Yes                | Yes                       | Yes        | Yes               | Yes               | POST                |

              | Authors        | Yes                | Yes                       | Yes        | No                | No                | No                  |

              | Authorships    | Yes                | Yes                       | Yes        | No                | No                | No                  |

              | Affiliations   | Yes                | Yes                       | Yes        | No                | No                | No                  |

              | Institutions   | Yes                | Yes                       | Yes        | No                | No                | No                  |

              | Journals       | Yes                | Yes                       | Yes        | No                | No                | No                  |

              | Data Providers | Yes                | Yes                       | Yes        | No                | No                | No                  |

              | Publishers     | Yes                | Yes                       | Yes        | No                | No                | No                  |


              > Vector and hybrid search are described only for entities whose search indexes contain vector fields.
          - divider: false
            border: false
            id: search-core-api-query-language
            title: CORE API query language
            descriptionAbout: >-
              
              The `q` parameter contains a CORE query expression.


              The query language supports:


              - Free-text queries

              - Field lookup

              - Boolean operators

              - Ranges

              - Grouping

              - Existence checks


              #### Operators


              | Operation | Canonical syntax | Description |

              | --- | --- | --- |

              | AND | `condition AND condition` | Returns records matching all conditions. |

              | OR | `condition OR condition` | Returns records matching at least one condition. |

              | NOT | `NOT condition` | Excludes records matching the condition. |

              | Negation shorthand | `!condition` | Short form of a negative condition, where supported. |

              | Grouping | `( ... )` | Groups query expressions and controls evaluation order. |

              | Field lookup | `field:value` | Applies a query to a specific field. |

              | Greater than | `field>value` | Matches values greater than the supplied value. |

              | Greater than or equal | `field>=value` | Matches values greater than or equal to the supplied value. |

              | Less than | `field<value` | Matches values less than the supplied value. |

              | Less than or equal | `field<=value` | Matches values less than or equal to the supplied value. |

              | Exists | `_exists_:field` | Matches records in which the field has a value. |


              The documentation uses explicit `AND`, `OR`, and `NOT` operators in all examples.


              Aliases such as `+` or whitespace-as-`AND` may be retained for backwards compatibility. However, they are not the recommended v4 syntax because whitespace can make complex queries ambiguous.


              #### Free-text search


              When no field is specified, the query searches all fields marked as searchable for the selected entity.


              ```http

              GET /v4/search/works?q=scientometrics

              ```


              For Works, this may search fields such as:


              - `title`

              - `abstract`

              - `fullText`

              - Searchable reference fields

              - Searchable contributor fields


              The exact fields searched depend on the entity’s supported-field-operations table.


              For example:


              ```http

              GET /v4/search/institutions?q="Open University"

              ```


              This may search fields such as:


              - `displayName`

              - `acronym`

              - `altNames`

              - `formerNames`

              - `names.value`


              #### Field lookup


              Use `field:value` to search or filter a specific field.


              ```http

              GET /v4/search/works?q=title:"Machine Learning"

              GET /v4/search/institutions?q=countryCode:GB

              GET /v4/search/outputs?q=sdg.type:SDG04

              ```


              A field lookup can be used only when the field supports the relevant operation:


              - Searchable fields support textual field lookup.

              - Filterable fields support exact values, ranges, and existence checks.

              - Facetable fields support facet requests.

              - Sortable fields support `orderby`.


              #### Keyword and phrase matching


              ##### Keyword search


              Unquoted text is analysed by the search engine.


              ```http

              GET /v4/search/works?q=title:attention is all you need

              ```


              The terms may be tokenised and matched independently. Word order is not necessarily preserved.


              The exact handling of punctuation, hyphens, stemming, case, and stop words depends on the analyser configured for the field.


              The documentation should avoid statements such as “any or all words will match” unless the implementation defines the default term operator precisely.


              ##### Phrase search


              Use double quotation marks to request phrase matching.


              ```http

              GET /v4/search/works?q=title:"Attention is all you need"

              ```


              This searches for the words as a phrase and preserves their order.


              A phrase query is not necessarily the same as an exact complete-field match. It may still match a longer title containing the phrase.


              For example, the following title may match the phrase query:


              ```text

              An analysis of “Attention is all you need”

              ```


              Phrase query:


              ```text

              "Attention is all you need"

              ```


              If exact complete-field equality is required, the API would need a separate keyword or normalised exact-match field.


              #### Boolean queries


              ##### AND


              Retrieve Works that satisfy all conditions:


              ```http

              GET /v4/search/works?q=documentType:"research article" AND yearPublished>=2020

              ```


              ##### OR


              Retrieve Works whose titles contain either phrase:


              ```http

              GET /v4/search/works?q=title:"Artificial Intelligence" OR title:"Machine Learning"

              ```


              ##### NOT


              Retrieve open-access Outputs that are not disabled:


              ```http

              GET /v4/search/outputs?q=accessRights.isOpenAccess:true AND NOT disabled:true

              ```


              #### Grouping


              Use parentheses when combining operators:


              ```http

              GET /v4/search/works?q=(title:"Artificial Intelligence" OR title:"Machine Learning") AND yearPublished>2020

              ```


              Without parentheses, operator precedence may produce a different result.


              The API should document its precedence order. The recommended order is:


              1. Parentheses

              2. `NOT`

              3. `AND`

              4. `OR`


              #### Range queries


              Range queries can be applied to numeric and date fields marked as filterable.


              ##### Numeric ranges


              ```http

              GET /v4/search/works?q=yearPublished>2018

              GET /v4/search/outputs?q=sdg.score>=0.8

              ```


              ##### Date ranges


              ```http

              GET /v4/search/affiliations?q=startDate>="2020-01-01"

              GET /v4/search/journals?q=createdDate>="2025-01-01"

              ```


              Dates and date-times should use ISO 8601 notation.


              #### Exists queries


              Use `_exists_` to find records in which a field has a value.


              ```http

              GET /v4/search/works?q=_exists_:fullText

              GET /v4/search/authors?q=_exists_:orcidId

              GET /v4/search/outputs?q=_exists_:sdg

              ```


              Negate an existence query to find records without a value:


              ```http

              GET /v4/search/journals?q=NOT _exists_:discontinuedDate

              ```


              If shorthand negation is supported, the equivalent query is:


              ```http

              GET /v4/search/journals?q=!_exists_:discontinuedDate

              ```


              The canonical documentation should use one form consistently. The recommended canonical form is `NOT _exists_:field`.


              #### Array fields


              A field lookup against an array matches when at least one array value satisfies the condition.


              For example:


              ```http

              GET /v4/search/authors?q=countries:GB

              ```


              This matches Authors whose `countries` collection contains `GB`.


              ```http

              GET /v4/search/works?q=documentType:"research article"

              ```


              This matches Works whose `documentType` collection contains `research article`.


              #### Structured collections


              Some fields contain arrays of objects, including:


              - `externalIdentifiers`

              - `dates`

              - `accessRights`

              - `identifiers`

              - `relationships`

              - `topics`

              - `yearlyMetrics`

              - `sdg`

              - `apcMax`


              When multiple conditions target the same structured collection, they must apply to the same collection item.


              For example:


              ```text

              externalIdentifiers.type:DOI AND externalIdentifiers.identifier:"10.1000/xyz"

              ```


              This must match one identifier object containing both:


              - `type = DOI`

              - `identifier = 10.1000/xyz`


              Similarly:


              ```text

              sdg.type:SDG04 AND sdg.score>=0.8

              ```


              This must match one SDG object where:


              - `type = SDG04`

              - `score >= 0.8`


              The query must not combine the `type` from one SDG object with the `score` from another.


              This rule should be documented once in the common Search section rather than repeated on every entity page.
          - divider: false
            border: false
            id: search-search-request
            title: Search request
            descriptionAbout: >-
              Search requests can be submitted using either `GET` or `POST`.


              #### Searching using GET


              ##### Endpoint


              ```http

              GET /v4/search/{entityType}

              ```


              ##### Query parameters


              | **Parameter** | **Type** | **Required** | **Default**                | **Description**                                                                                       |

              | ------------- | -------- | ------------ | -------------------------- | ----------------------------------------------------------------------------------------------------- |

              | `q`           | string   | No           | `*`                        | CORE query expression.                                                                                |

              | `searchMode`  | string   | No           | `keyword`                  | Search mode: `keyword`, `vector`, or `hybrid`. Vector modes are supported only for selected entities. |

              | `vectorTopK`  | integer  | No           | Implementation-defined     | Number of nearest vector candidates considered for vector or hybrid retrieval.                        |

              | `orderby`     | string   | No           | Relevance, when applicable | Comma-separated ordering expressions using `field:direction`.                                         |

              | `select`      | string   | No           | All retrievable fields     | Comma-separated fields to return.                                                                     |

              | `facets`      | string   | No           | —                          | Comma-separated facetable fields.                                                                     |

              | `count`       | boolean  | No           | `false`                    | Includes the total number of matches.                                                                 |

              | `limit`       | integer  | No           | `10`                       | Maximum number of records to return.                                                                  |

              | `offset`      | integer  | No           | `0`                        | Number of records to skip.                                                                            |


              Example:


              ```bash

              curl --request GET \
                --url 'https://api.core.ac.uk/v4/search/works?q=documentType:"research%20article"%20AND%20yearPublished>=2020&orderby=yearPublished:desc&select=workId,title,yearPublished,doi&count=true&limit=10&offset=0' \
                --header "Authorization: Bearer YOUR_API_KEY"
              ```


              Readable form:


              ```http

              GET /v4/search/works
                  ?q=documentType:"research article" AND yearPublished>=2020
                  &orderby=yearPublished:desc
                  &select=workId,title,yearPublished,doi
                  &count=true
                  &limit=10
                  &offset=0
              ```


              > Examples in the documentation may be shown in readable form, but clients must URL-encode spaces and reserved characters.


              #### Searching using POST


              ##### Endpoint


              ```http

              POST /v4/search/{entityType}

              ```


              `POST` search is functionally equivalent to `GET` search, except that parameters are supplied in a JSON request body.


              `POST` is recommended for:


              * Long query expressions

              * Complex, dynamically generated searches

              * Many selected fields

              * Many requested facets

              * Explicit embedding vectors

              * Requests that exceed practical URL limits


              ##### Request body


              | **Property** | **Type**  | **Required** | **Default**                | **Description**                                                         |

              | ------------ | --------- | ------------ | -------------------------- | ----------------------------------------------------------------------- |

              | `q`          | string    | No           | `*`                        | CORE query expression.                                                  |

              | `searchMode` | string    | No           | `keyword`                  | Search mode: `keyword`, `vector`, or `hybrid`.                          |

              | `vector`     | number\[] | No           | —                          | Client-generated embedding. Supported only for vector-enabled entities. |

              | `vectorTopK` | integer   | No           | Implementation-defined     | Number of nearest vector candidates considered.                         |

              | `orderby`    | string\[] | No           | Relevance, when applicable | Ordered list of sorting expressions.                                    |

              | `select`     | string\[] | No           | All retrievable fields     | Fields to include in each result.                                       |

              | `facets`     | string\[] | No           | —                          | Facetable fields for which buckets and counts should be returned.       |

              | `count`      | boolean   | No           | `false`                    | Includes the total number of matches.                                   |

              | `limit`      | integer   | No           | `10`                       | Maximum number of records to return.                                    |

              | `offset`     | integer   | No           | `0`                        | Number of records to skip.                                              |


              Example:


              ```bash

              curl --request POST \
                --url "https://api.core.ac.uk/v4/search/works" \
                --header "Authorization: Bearer YOUR_API_KEY" \
                --header "Content-Type: application/json" \
                --data '{
                  "q": "documentType:\"research article\" AND yearPublished>=2020",
                  "orderby": [
                    "yearPublished:desc"
                  ],
                  "select": [
                    "workId",
                    "title",
                    "yearPublished",
                    "doi"
                  ],
                  "count": true,
                  "limit": 10,
                  "offset": 0
                }'
              ```


              #### GET and POST equivalence


              | **GET query parameter**        | **POST request-body property**           |

              | ------------------------------ | ---------------------------------------- |

              | `q=countries:GB`               | `"q": "countries:GB"`                    |

              | `searchMode=hybrid`            | `"searchMode": "hybrid"`                 |

              | `vectorTopK=100`               | `"vectorTopK": 100`                      |

              | Not supported through `GET`    | `"vector": [0.012, -0.084, ...]`         |

              | `orderby=displayName:asc`      | `"orderby": ["displayName:asc"]`         |

              | `select=authorId,displayName`  | `"select": ["authorId", "displayName"]`  |

              | `facets=countries,careerStage` | `"facets": ["countries", "careerStage"]` |

              | `count=true`                   | `"count": true`                          |

              | `limit=10`                     | `"limit": 10`                            |

              | `offset=0`                     | `"offset": 0`                            |
          - divider: false
            border: false
            id: search-vector-and-hybrid-search
            title: Vector and hybrid search
            descriptionAbout: >-
              
              Vector and hybrid search are supported for canonical Works and source-specific Outputs.



              For general scholarly discovery, use Work vector search:


              ```http

              GET /v4/search/works

              POST /v4/search/works

              ```


              Works are canonical and deduplicated.


              Output vector search is available through:


              ```http

              GET /v4/search/outputs

              POST /v4/search/outputs

              ```


              Outputs represent source-specific manifestations and may contain near-duplicate records supplied by different Data Providers.


              #### Search modes


              | Mode | Description |

              | --- | --- |

              | `keyword` | Uses standard keyword relevance and structured conditions. |

              | `vector` | Uses semantic similarity between the query embedding and indexed entity vectors. |

              | `hybrid` | Combines keyword relevance and vector similarity. |


              The default mode is `keyword`. When searchMode is omitted, the request uses standard keyword and structured search.



              #### Text-based vector search


              In text-based vector search, CORE creates an embedding from the textual part of `q`.


              ##### Works example


              ```http

              GET /v4/search/works?q="text and data mining"&searchMode=vector

              ```


              Equivalent `POST` request:


              ```http

              POST /v4/search/works

              ```


              ```json

              {
                "q": "\"text and data mining\"",
                "searchMode": "vector",
                "limit": 10
              }

              ```


              ##### Outputs example


              ```http

              GET /v4/search/outputs?q="climate adaptation strategies"&searchMode=vector

              ```


              Equivalent `POST` request:


              ```http

              POST /v4/search/outputs

              ```


              ```json

              {
                "q": "\"climate adaptation strategies\"",
                "searchMode": "vector",
                "limit": 10
              }

              ```


              Vector search may retrieve semantically related records that do not contain the exact query terms.


              #### Vector search with structured conditions


              Textual vector retrieval can be combined with field conditions.


              ```http

              GET /v4/search/works
                  ?q="text and data mining" AND yearPublished>=2020 AND documentType:"research article"
                  &searchMode=vector
              ```


              Equivalent `POST` request:


              ```http

              POST /v4/search/works

              ```


              ```json

              {
                "q": "\"text and data mining\" AND yearPublished>=2020 AND documentType:\"research article\"",
                "searchMode": "vector",
                "select": [
                  "workId",
                  "title",
                  "abstract",
                  "yearPublished",
                  "documentType"
                ],
                "limit": 10
              }

              ```


              In this example:


              - The textual clause is converted into an embedding.

              - Semantic similarity is used to retrieve candidate Works.

              - Publication year and document type are applied as structured conditions.


              #### Hybrid search


              Hybrid search combines keyword relevance and vector similarity.


              ```http

              GET /v4/search/works?q="text and data mining"&searchMode=hybrid

              ```


              Equivalent `POST` request:


              ```http

              POST /v4/search/works

              ```


              ```json

              {
                "q": "\"text and data mining\"",
                "searchMode": "hybrid",
                "limit": 10
              }

              ```


              > The API documentation should explain how keyword and vector scores are combined.


              #### User-generated vectors


              Users may provide a compatible embedding through `POST`.


              ```http

              POST /v4/search/works

              ```


              ```json

              {
                "vector": [
                  0.012,
                  -0.084,
                  0.031,
                  0.107
                ],
                "searchMode": "vector",
                "q": "yearPublished>=2020",
                "vectorTopK": 100,
                "select": [
                  "workId",
                  "title",
                  "abstract",
                  "yearPublished"
                ],
                "limit": 10
              }

              ```


              > The example vector is shortened for readability.


              The complete API documentation must specify:


              - The compatible embedding model

              - The required number of vector dimensions

              - The accepted numeric format

              - Whether vectors must be normalised

              - The maximum vector length

              - The maximum request-body size


              A vector should be rejected when:


              - `searchMode` is `keyword`.

              - The vector is empty.

              - The vector has the wrong number of dimensions.

              - The vector contains non-numeric values.

              - The vector is incompatible with the selected entity index.


              #### Embedding-generation endpoint


              If CORE exposes an endpoint that converts text into compatible vectors, it should be documented in the common Search section rather than under Works or Outputs.


              A possible design is:


              ```http

              POST /v4/embeddings

              ```


              Request:


              ```json

              {
                "input": "text and data mining"
              }

              ```


              Response:


              ```json

              {
                "model": "CORE_EMBEDDING_MODEL",
                "dimensions": 1536,
                "vector": [
                  0.012,
                  -0.084,
                  0.031
                ]
              }

              ```




              #### Vector candidate count


              `vectorTopK` controls the number of nearest vector candidates considered before final result processing.


              ```json

              {
                "q": "\"scholarly document classification\"",
                "searchMode": "vector",
                "vectorTopK": 100,
                "limit": 10
              }

              ```


              In this example:


              - Up to 100 nearest vector candidates are considered.

              - At most 10 records are returned.


              Therefore, `vectorTopK` is not equivalent to `limit`.


              The API documentation must define the default, minimum, and maximum values for `vectorTopK`.


              #### Relevance and ordering


              When `orderby` is omitted, the default ordering depends on the type of search.


              | Search type | Default order |

              | --- | --- |

              | Keyword query | Keyword relevance |

              | Vector query | Vector similarity |

              | Hybrid query | Combined relevance |

              | Structured query without text | Implementation-defined; clients should supply `orderby` |


              An explicit `orderby` expression may replace relevance ordering.


              ```http

              GET /v4/search/works
                  ?q="machine learning"
                  &searchMode=vector
                  &orderby=yearPublished:desc
              ```


              This orders the semantically matching Works by publication year rather than vector similarity.


              Clients should omit `orderby` when relevance should determine the result order.


              #### Relevance scores


              Search results may include a relevance score:


              ```json

              {
                "workId": 323030168,
                "title": "Semantic retrieval for scholarly repositories",
                "relevanceScore": 0.873
              }

              ```


              `relevanceScore` is search-result metadata. It is not a persistent Work or Output property.


              The response documentation should state whether the score represents:


              - Keyword relevance

              - Vector similarity

              - Hybrid relevance


              Scores produced by different search modes should not be treated as directly comparable.
          - divider: false
            border: false
            id: search-result-control
            title: Result control
            descriptionAbout: >-
              
              This page describes the generic controls applied after or alongside retrieval.


              #### Field selection


              Use `select` to limit the fields returned in each result.


              GET:


              ```http

              GET /v4/search/works
                  ?q=yearPublished:2025
                  &select=workId,title,doi,yearPublished
              ```


              POST:


              ```json

              {
                "q": "yearPublished:2025",
                "select": [
                  "workId",
                  "title",
                  "doi",
                  "yearPublished"
                ]
              }

              ```


              #### Ordering


              Use `orderby` to order results by fields marked as sortable.


              GET:


              ```http

              GET /v4/search/works?orderby=yearPublished:desc,title:asc

              ```


              POST:


              ```json

              {
                "orderby": [
                  "yearPublished:desc",
                  "title:asc"
                ]
              }

              ```


              Supported directions are:


              - `asc`

              - `desc`


              Results are ordered using the directives in the order supplied.


              The API should also define:


              - How `null` values are ordered

              - Whether string ordering is case-sensitive

              - Whether a stable identifier is automatically added as a final tie-breaker


              #### Result counting


              Set `count=true` to include `totalHits` in the response.


              GET:


              ```http

              GET /v4/search/institutions?q=countryCode:GB&count=true

              ```


              POST:


              ```json

              {
                "q": "countryCode:GB",
                "count": true
              }

              ```


              When `count` is omitted or set to `false`, `totalHits` may be omitted.


              For vector search, the meaning of `totalHits` must be defined. It may represent:


              - All records satisfying the structured conditions

              - The vector candidate count

              - Records above a minimum similarity threshold


              #### Pagination


              Use `limit` and `offset` to paginate results.


              First page:


              ```http

              GET /v4/search/institutions
                  ?q=types:education
                  &orderby=displayName:asc
                  &limit=20
                  &offset=0
              ```

              Second page:


              ```http

              GET /v4/search/institutions
                  ?q=types:education
                  &orderby=displayName:asc
                  &limit=20
                  &offset=20
              ```


              The offset is calculated as:


              ```text

              offset = page size × number of previous pages

              ```


              A deterministic `orderby` expression should be used for keyword and structured searches.


              For vector and hybrid pagination, clients should keep the following unchanged between pages:


              - Query

              - Search mode

              - Explicit vector

              - `vectorTopK`

              - Structured conditions

              - Index version


              Vector results may change when the search index is updated between requests.
          - divider: false
            border: false
            id: search-facets-and-agrregation
            title: Facets and aggregation
            descriptionAbout: >-
              #### Facets and aggregation


              The Graph API uses facets as part of the standard search endpoint rather than introducing a separate aggregation endpoint.


              This replaces the v3 pattern:


              ```http

              POST /v3/search/{entityType}/aggregate

              ```


              with:


              ```http

              GET /v4/search/{entityType}?facets=field1,field2

              POST /v4/search/{entityType}

              ```


              GET facet example:


              ```http

              GET /v4/search/outputs
                  ?q=accessRights.isOpenAccess:true
                  &facets=documentType,yearPublished,sdg.type
                  &count=true
                  &limit=0
              ```


              POST facet example:


              ```http

              POST /v4/search/outputs

              ```


              ```json

              {
                "q": "accessRights.isOpenAccess:true",
                "facets": [
                  "documentType",
                  "yearPublished",
                  "sdg.type"
                ],
                "count": true,
                "limit": 0
              }

              ```


              Example response:


              ```json

              {
                "totalHits": 180000000,
                "facets": {
                  "documentType": [
                    {
                      "value": "research article",
                      "count": 95000000
                    },
                    {
                      "value": "thesis",
                      "count": 13000000
                    }
                  ],
                  "sdg.type": [
                    {
                      "value": "SDG04",
                      "count": 485000
                    },
                    {
                      "value": "SDG13",
                      "count": 318000
                    }
                  ]
                },
                "results": []
              }

              ```


              Only fields marked as facetable in the entity documentation can be requested.


              Setting `limit=0` returns facet information without returning entity records.


              #### Vector facet semantics


              For vector and hybrid searches, the API documentation must define whether facet counts are calculated over:


              - The complete filtered index

              - The vector candidate set

              - The final ranked result set


              This behaviour must be defined explicitly because each interpretation produces different facet counts.
          - divider: false
            border: false
            id: search-responses
            title: Responses
            descriptionAbout: >-
              A standard search response may contain:


              ```json

              {
                "totalHits": 245,
                "limit": 10,
                "offset": 0,
                "searchMode": "hybrid",
                "facets": {
                  "documentType": [
                    {
                      "value": "research article",
                      "count": 180
                    }
                  ]
                },
                "results": [
                  {
                    "workId": 323030168,
                    "title": "Semantic retrieval for scholarly repositories",
                    "yearPublished": 2025,
                    "relevanceScore": 0.873
                  }
                ]
              }

              ```


              #### Response properties


              | **Property**     | **Type**  | **Description**                                        |

              | ---------------- | --------- | ------------------------------------------------------ |

              | `totalHits`      | integer   | Total number of matching records when `count=true`.    |

              | `limit`          | integer   | Maximum number of results requested.                   |

              | `offset`         | integer   | Number of matching records skipped.                    |

              | `searchMode`     | string    | Search mode used, when returned by the implementation. |

              | `facets`         | object    | Requested facet buckets and their counts.              |

              | `results`        | object\[] | Matching entity records.                               |

              | `relevanceScore` | number    | Search-result relevance metadata, when exposed.        |


              Field names should follow the v4 `camelCase` convention rather than v3 names such as `total_hits`.


              Timing and diagnostic fields, such as `tookMs` or `searchId`, may be included. These fields should be optional and consistently defined.


              #### Error responses


              | **Status** | **Description**                                                                                   |

              | ---------- | ------------------------------------------------------------------------------------------------- |

              | `200`      | Search completed successfully.                                                                    |

              | `400`      | Invalid query, field, sort expression, facet, search mode, vector, or response-control parameter. |

              | `401`      | Authentication credentials are missing or invalid.                                                |

              | `413`      | The `POST` request body exceeds the permitted size.                                               |

              | `429`      | The API request limit has been exceeded.                                                          |

              | `500`      | An unexpected server error occurred.                                                              |


              Example validation response:


              ```json

              {
                "status": 400,
                "message": "The vector property can only be used when searchMode is vector or hybrid."
              }

              ```

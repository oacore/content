          - divider: false
            border: false
            id: citations-api-citations-endpoints
            title: Citations endpoints
            descriptionAbout: >-
              #### Available endpoints


              | **Operation**                         | **Method** | **Endpoint**                             |

              | ------------------------------------- | ---------- | ---------------------------------------- |

              | Get a single Citation                 | `GET`      | `/v4/citations/{citationId}`             |

              | Search Citations using URL parameters | `GET`      | `/v4/search/citations`                   |

              | Search Citations using a JSON body    | `POST`     | `/v4/search/citations`                   |

              | Retrieve citations made by a Work     | `GET`      | `/v4/works/{workId}/citations`           |

              | Retrieve Works citing a Work          | `GET`      | `/v4/works/{workId}/cited-by`            |

              | Retrieve the citing Work              | `GET`      | `/v4/citations/{citationId}/citing-work` |

              | Retrieve the cited Work               | `GET`      | `/v4/citations/{citationId}/cited-work`  |


              #### Get a single Citation


              Retrieves one Citation relationship using its canonical CORE Citation identifier.


              ##### API endpoint


              ```http

              GET https://api.core.ac.uk/v4/citations/{citationId}

              ```


              ##### Authorization


              | Parameter       | Location | Type   | Required | Description                                               |

              | --------------- | -------- | ------ | -------- | --------------------------------------------------------- |

              | `Authorization` | Header   | string | Yes      | CORE API authentication token supplied as a Bearer token. |


              ##### Path parameters


              | Parameter    | Type    | Required | Description                                          |

              | ------------ | ------- | -------- | ---------------------------------------------------- |

              | `citationId` | integer | Yes      | Unique CORE identifier of the Citation relationship. |


              ##### Query parameters


              | Parameter | Type   | Required | Description                                                  |

              | --------- | ------ | -------- | ------------------------------------------------------------ |

              | `select`  | string | No       | Comma-separated list of top-level Citation fields to return. |


              Example request:


              ```bash

              curl --request GET \
                --url "https://api.core.ac.uk/v4/citations/1256789" \
                --header "Authorization: Bearer YOUR_API_KEY"
              ```


              Example using `select`:


              ```bash

              curl --request GET \
                --url "https://api.core.ac.uk/v4/citations/1256789?select=citationId,openCitationId,citingWorkId,citedWorkId,citingDoi,citedDoi" \
                --header "Authorization: Bearer YOUR_API_KEY"
              ```


              Example response:


              ```json

              {
                "citationId": 1256789,
                "openCitationId": "oci:0610200888-0613012615",
                "citingWorkId": 345678,
                "citedWorkId": 23456,
                "citingDoi": "10.1000/xyz123",
                "citedDoi": "10.1000/abc456"
              }

              ```
          - divider: false
            border: false
            id: citations-api-search-citations
            title: Search citations
            descriptionAbout: >-
              Searches, filters, orders, facets, counts, and paginates Citation
              records.


              Citation search is available through `GET` and `POST`:


              | **Method** | **API endpoint**                             |

              | ---------- | -------------------------------------------- |

              | `GET`      | <https://api.core.ac.uk/v4/search/citations> |

              | `POST`     | <https://api.core.ac.uk/v4/search/citations> |


              Both methods use the same CORE query language and return the same response structure.


              Citation search supports:


              * Field-specific lookup

              * Free-text search of bibliographic reference fields

              * Boolean conditions

              * Numeric and date ranges

              * Existence queries

              * Ordering

              * Field selection

              * Facets

              * Result counting

              * Pagination


              Vector and hybrid search are not currently supported for Citations.


              For the complete query syntax and search behaviour, see the common [Search](search.md) documentation.


              #### GET and POST search parameters


              ##### GET query parameters


              | **Parameter** | **Type** | **Required** | **Default**                   | **Description**                                                                                                                   |

              | ------------- | -------- | ------------ | ----------------------------- | --------------------------------------------------------------------------------------------------------------------------------- |

              | `q`           | string   | No           | `*`                           | CORE query expression supporting textual search, field lookup, Boolean operators, grouping, range queries, and existence queries. |

              | `orderby`     | string   | No           | Relevance for textual queries | Comma-separated ordering directives in `field:direction` format.                                                                  |

              | `select`      | string   | No           | All retrievable fields        | Comma-separated list of Citation fields to include in each result.                                                                |

              | `facets`      | string   | No           | —                             | Comma-separated list of facetable Citation fields for which value buckets and counts should be returned.                          |

              | `count`       | boolean  | No           | `false`                       | Indicates whether the total number of matching Citation records should be included.                                               |

              | `limit`       | integer  | No           | `10`                          | Maximum number of Citation records to return.                                                                                     |

              | `offset`      | integer  | No           | `0`                           | Number of matching Citation records to skip.                                                                                      |


              ##### POST request body


              | **Property** | **Type**  | **Required** | **Default**                   | **Description**                                                                                                                   |

              | ------------ | --------- | ------------ | ----------------------------- | --------------------------------------------------------------------------------------------------------------------------------- |

              | `q`          | string    | No           | `*`                           | CORE query expression supporting textual search, field lookup, Boolean operators, grouping, range queries, and existence queries. |

              | `orderby`    | string\[] | No           | Relevance for textual queries | Ordered list of sorting directives in `field:direction` format.                                                                   |

              | `select`     | string\[] | No           | All retrievable fields        | List of Citation fields to include in each result.                                                                                |

              | `facets`     | string\[] | No           | —                             | List of facetable Citation fields for which value buckets and counts should be returned.                                          |

              | `count`      | boolean   | No           | `false`                       | Indicates whether the total number of matching Citation records should be included.                                               |

              | `limit`      | integer   | No           | `10`                          | Maximum number of Citation records to return.                                                                                     |

              | `offset`     | integer   | No           | `0`                           | Number of matching Citation records to skip.                                                                                      |


              #### GET and POST parameter mapping


              | GET query parameter                                             | POST body property                                                        |

              | --------------------------------------------------------------- | ------------------------------------------------------------------------- |

              | `q=citedDoi:"10.1000/abc456"`                                   | `"q": "citedDoi:\"10.1000/abc456\""`                                      |

              | `orderby=creationDate:desc`                                     | `"orderby": ["creationDate:desc"]`                                        |

              | `select=citationId,citingWorkId,citedWorkId`                    | `"select": ["citationId", "citingWorkId", "citedWorkId"]`                 |

              | `facets=metrics.authorSelfCitation,metrics.journalSelfCitation` | `"facets": ["metrics.authorSelfCitation", "metrics.journalSelfCitation"]` |

              | `count=true`                                                    | `"count": true`                                                           |

              | `limit=10`                                                      | `"limit": 10`                                                             |

              | `offset=0`                                                      | `"offset": 0`                                                             |


              The `GET` method represents `orderby`, `select`, and `facets` as comma-separated strings. The `POST` method represents them as JSON arrays.
          - divider: false
            border: false
            id: citations-api-search-examples
            title: Search examples
            descriptionAbout: >-
              #### Retrieve citations made by a Work


              Retrieves Citation records in which the specified Work is the citing Work.


              GET:


              ```http

              GET /v4/search/citations?q=citingWorkId:345678

              ```


              Equivalent POST:


              ```json

              {
                "q": "citingWorkId:345678"
              }

              ```


              #### Retrieve citations to a Work


              Retrieves Citation records in which the specified Work is the cited Work.


              GET:


              ```http

              GET /v4/search/citations?q=citedWorkId:23456

              ```


              Equivalent POST:


              ```json

              {
                "q": "citedWorkId:23456"
              }

              ```


              #### Search by Open Citation Identifier


              GET:


              ```http

              GET /v4/search/citations?q=openCitationId:"oci:0610200888-0613012615"

              ```


              Equivalent POST:


              ```json

              {
                "q": "openCitationId:\"oci:0610200888-0613012615\""
              }

              ```


              #### Search by citing DOI


              GET:


              ```http

              GET /v4/search/citations?q=citingDoi:"10.1000/xyz123"

              ```


              Equivalent POST:


              ```json

              {
                "q": "citingDoi:\"10.1000/xyz123\""
              }

              ```


              #### Search by cited DOI


              GET:


              ```http

              GET /v4/search/citations?q=citedDoi:"10.1000/abc456"

              ```


              Equivalent POST:


              ```json

              {
                "q": "citedDoi:\"10.1000/abc456\""
              }

              ```


              #### Search unresolved citations


              Retrieves Citation records that have not been resolved to a canonical cited Work.


              GET:


              ```http

              GET /v4/search/citations?q=NOT _exists_:citedWorkId

              ```


              Equivalent POST:


              ```json

              {
                "q": "NOT _exists_:citedWorkId"
              }

              ```


              This query may be useful for:


              * Reference resolution

              * Metadata enrichment

              * Citation-linking research


              #### Search bibliographic reference titles


              GET:


              ```http

              GET /v4/search/citations?q=reference.articleTitle:"Quantum effects"

              ```


              Equivalent POST:


              ```json

              {
                "q": "reference.articleTitle:\"Quantum effects\""
              }

              ```


              #### Search unstructured references


              GET:


              ```http

              GET /v4/search/citations?q=reference.unstructured:"quantum materials"

              ```


              Equivalent POST:


              ```json

              {
                "q": "reference.unstructured:\"quantum materials\""
              }

              ```


              A broad textual query may also be used:


              ```http

              GET /v4/search/citations?q="quantum materials"

              ```


              Broad textual queries search the Citation fields configured as searchable, including:


              * `reference.articleTitle`

              * `reference.unstructured`

              * Other searchable bibliographic reference fields


              When a textual query is supplied and `orderby` is omitted, results are ordered by relevance.


              #### Retrieve author self-citations


              GET:


              ```http

              GET /v4/search/citations?q=metrics.authorSelfCitation:true

              ```


              Equivalent POST:


              ```json

              {
                "q": "metrics.authorSelfCitation:true"
              }

              ```


              #### Retrieve journal self-citations


              GET:


              ```http

              GET /v4/search/citations?q=metrics.journalSelfCitation:true

              ```


              Equivalent POST:


              ```json

              {
                "q": "metrics.journalSelfCitation:true"
              }

              ```


              #### Retrieve Citations created after a particular date


              GET:


              ```http

              GET /v4/search/citations?q=creationDate>="2022-01-01"

              ```


              Equivalent POST:


              ```json

              {
                "q": "creationDate>=\"2022-01-01\""
              }

              ```


              #### Combined search, selection, and ordering


              The following request:


              * Retrieves citations made by Work `345678`

              * Restricts the results to citations created on or after 1 January 2022

              * Restricts the results to resolved citations

              * Orders the results by creation date, with the most recent first

              * Returns selected fields

              * Includes the total result count

              * Returns a maximum of ten records


              GET:


              ```bash

              curl --request GET \
                --url 'https://api.core.ac.uk/v4/search/citations?q=citingWorkId%3A345678%20AND%20creationDate%3E%3D%222022-01-01%22%20AND%20_exists_%3AcitedWorkId&orderby=creationDate%3Adesc&select=citationId%2CopenCitationId%2CcitingWorkId%2CcitedWorkId%2CcitingDoi%2CcitedDoi%2CcreationDate&count=true&limit=10&offset=0' \
                --header 'Authorization: Bearer YOUR_API_KEY'
              ```


              Readable form:


              ```http

              GET /v4/search/citations
                  ?q=citingWorkId:345678 AND creationDate>="2022-01-01" AND _exists_:citedWorkId
                  &orderby=creationDate:desc
                  &select=citationId,openCitationId,citingWorkId,citedWorkId,citingDoi,citedDoi,creationDate
                  &count=true
                  &limit=10
                  &offset=0
              ```


              Equivalent POST:


              ```bash

              curl --request POST \
                --url 'https://api.core.ac.uk/v4/search/citations' \
                --header 'Authorization: Bearer YOUR_API_KEY' \
                --header 'Content-Type: application/json' \
                --data '{
                  "q": "citingWorkId:345678 AND creationDate>=\"2022-01-01\" AND _exists_:citedWorkId",
                  "orderby": [
                    "creationDate:desc"
                  ],
                  "select": [
                    "citationId",
                    "openCitationId",
                    "citingWorkId",
                    "citedWorkId",
                    "citingDoi",
                    "citedDoi",
                    "creationDate"
                  ],
                  "count": true,
                  "limit": 10,
                  "offset": 0
                }'
              ```


              Example search response:


              ```json

              {
                "totalHits": 1,
                "results": [
                  {
                    "citationId": 7865,
                    "openCitationId": "oci:0610200888-0613012615",
                    "citingWorkId": 345678,
                    "citedWorkId": 23456,
                    "citingDoi": "10.1000/xyz123",
                    "citedDoi": "10.1000/abc456",
                    "creationDate": "2023-06-15"
                  }
                ]
              }

              ```


              #### Ordering Citation results


              #### Order by creation date


              Returns the most recently created Citation records first.


              GET:


              ```http

              GET /v4/search/citations?orderby=creationDate:desc

              ```


              POST representation:


              ```json

              {
                "orderby": [
                  "creationDate:desc"
                ]
              }

              ```


              #### Order by multiple fields


              GET:


              ```http

              GET /v4/search/citations?orderby=citingWorkId:asc,creationDate:desc

              ```


              POST representation:


              ```json

              {
                "orderby": [
                  "citingWorkId:asc",
                  "creationDate:desc"
                ]
              }

              ```


              Only Citation fields configured as sortable may be used with `orderby`.


              #### Facets


              The `facets` option returns value buckets and counts for Citation fields configured as facetable.


              The following example groups Citation records by author and journal self-citation status.


              GET:


              ```bash

              curl --request GET \
                --url 'https://api.core.ac.uk/v4/search/citations?q=%2A&facets=metrics.authorSelfCitation%2Cmetrics.journalSelfCitation&count=true&limit=0' \
                --header 'Authorization: Bearer YOUR_API_KEY'
              ```


              Equivalent POST:


              ```bash

              curl --request POST \
                --url 'https://api.core.ac.uk/v4/search/citations' \
                --header 'Authorization: Bearer YOUR_API_KEY' \
                --header 'Content-Type: application/json' \
                --data '{
                  "q": "*",
                  "facets": [
                    "metrics.authorSelfCitation",
                    "metrics.journalSelfCitation"
                  ],
                  "count": true,
                  "limit": 0
                }'
              ```


              Example facet response:


              ```json

              {
                "totalHits": 25000000,
                "facets": {
                  "metrics.authorSelfCitation": [
                    {
                      "value": true,
                      "count": 1750000
                    },
                    {
                      "value": false,
                      "count": 23250000
                    }
                  ],
                  "metrics.journalSelfCitation": [
                    {
                      "value": true,
                      "count": 3200000
                    },
                    {
                      "value": false,
                      "count": 21800000
                    }
                  ]
                },
                "results": []
              }

              ```


              Facet counts describe the complete matching result set.


              #### Result count


              Set `count=true` to include the total number of matching Citation records.


              GET:


              ```http

              GET /v4/search/citations?q=citedWorkId:23456&count=true

              ```


              Equivalent POST:


              ```json

              {
                "q": "citedWorkId:23456",
                "count": true
              }

              ```


              When `count` is omitted or set to `false`, `totalHits` may be omitted from the response.


              #### Pagination


              Use `limit` and `offset` to paginate through Citation results.


              A deterministic `orderby` expression should be used when retrieving multiple pages.


              ##### First page using GET


              ```http

              GET /v4/search/citations?q=citingWorkId:345678&orderby=creationDate:desc&limit=20&offset=0

              ```


              ##### Second page using GET


              ```http

              GET /v4/search/citations?q=citingWorkId:345678&orderby=creationDate:desc&limit=20&offset=20

              ```


              ##### First page using POST


              ```json

              {
                "q": "citingWorkId:345678",
                "orderby": [
                  "creationDate:desc"
                ],
                "limit": 20,
                "offset": 0
              }

              ```


              ##### Second page using POST


              ```json

              {
                "q": "citingWorkId:345678",
                "orderby": [
                  "creationDate:desc"
                ],
                "limit": 20,
                "offset": 20
              }

              ```


              The offset is calculated as:


              ```text

              offset = page size × number of previous pages

              ```


              #### Responses


              | **Status** | **Description**                                                                                                 |

              | ---------- | --------------------------------------------------------------------------------------------------------------- |

              | `200`      | The Citation search was completed successfully.                                                                 |

              | `400`      | The request contains an invalid query, unsupported field, invalid facet, or invalid response-control parameter. |

              | `401`      | Authentication credentials are missing or invalid.                                                              |

              | `413`      | The `POST` request body exceeds the permitted size.                                                             |

              | `429`      | The API request limit has been exceeded.                                                                        |

              | `500`      | An unexpected server error occurred.                                                                            |
          - divider: false
            border: false
            id: citations-api-relationship-oriented-endpoints
            title: Relationship-oriented endpoints
            descriptionAbout: >-
              
              #### Citations made by a Work


              ```http

              GET /v4/works/{workId}/citations

              ```


              Retrieves Citation entities representing references made by the specified Work. The returned Citations satisfy:


              ```text

              citation.citingWorkId = workId

              ```


              Equivalent Citation search:


              ```http

              GET /v4/search/citations?q=citingWorkId:{workId}

              ```


              Example request:


              ```http

              GET /v4/works/345678/citations

              ```


              Example response:


              ```json

              {
                "totalHits": 2,
                "results": [
                  {
                    "citationId": 1256789,
                    "citingWorkId": 345678,
                    "citedWorkId": 23456,
                    "citedDoi": "10.1000/abc456"
                  },
                  {
                    "citationId": 1256790,
                    "citingWorkId": 345678,
                    "citedWorkId": 87654,
                    "citedDoi": "10.1000/def789"
                  }
                ]
              }

              ```


              #### Works citing a Work


              ```http

              GET /v4/works/{workId}/cited-by

              ```


              Retrieves Works that cite the specified Work. The underlying Citation relationships satisfy:


              ```text

              citation.citedWorkId = workId

              ```


              Example request:


              ```http

              GET /v4/works/23456/cited-by

              ```


              Example response:


              ```json

              {
                "totalHits": 2,
                "results": [
                  {
                    "workId": 345678,
                    "title": "Applications of quantum effects"
                  },
                  {
                    "workId": 456789,
                    "title": "Recent developments in quantum materials"
                  }
                ]
              }

              ```


              To retrieve the Citation entities rather than the citing Works, use:


              ```http

              GET /v4/search/citations?q=citedWorkId:{workId}

              ```


              For example:


              ```http

              GET /v4/search/citations?q=citedWorkId:23456

              ```


              #### Citing Work of a Citation


              ```http

              GET /v4/citations/{citationId}/citing-work

              ```


              Retrieves the Work identified by the Citation’s `citingWorkId`:


              ```text

              Citation.citingWorkId
                      ↓
                  Work.workId
              ```


              Every Citation is associated with exactly one citing Work.


              Example request:


              ```http

              GET /v4/citations/1256789/citing-work

              ```


              Example response:


              ```json

              {
                "workId": 345678,
                "title": "Applications of quantum effects"
              }

              ```


              #### Cited Work of a Citation


              ```http

              GET /v4/citations/{citationId}/cited-work

              ```


              Retrieves the canonical Work identified by the Citation’s `citedWorkId`:


              ```text

              Citation.citedWorkId
                      ↓
                  Work.workId
              ```


              Example request:


              ```http

              GET /v4/citations/1256789/cited-work

              ```


              Example response:


              ```json

              {
                "workId": 23456,
                "title": "Quantum effects in materials"
              }

              ```


              A Citation may contain an unresolved bibliographic reference for which `citedWorkId` is `null`. In this case, the endpoint returns:


              ```http

              404 Not Found

              ```


              The unresolved reference metadata remains available through the Citation entity:


              ```http

              GET /v4/citations/{citationId}

              ```
      - item: Topics
        sections:
          - divider: false
            border: false
            id: topics-api-introduction
            title: Introduction
            descriptionAbout: >-
              The Topic entity represents a subject, keyword, concept, or
              classification label associated with scholarly research in CORE.


              Topics provide a structured way of describing what a Work is about. They may originate from source metadata, controlled vocabularies, external scholarly data sources, or CORE machine-learning models.


              A Topic may represent:


              - A research topic or concept

              - A keyword

              - A subject classification

              - A controlled-vocabulary term

              - Spatial subject coverage

              - Temporal subject coverage


              For example, a Work concerning high-energy particle physics may be associated with the following Topic:


              ```text

              Particle physics theoretical and experimental studies

              ```


              This Topic may be placed within a broader hierarchy:


              ```text

              Physical Sciences
                  → Physics and Astronomy
                      → Nuclear and High Energy Physics
                          → Particle physics theoretical and experimental studies
              ```


              Topics may also retain information about:


              - The classification scheme

              - The source of the Topic

              - Provenance information

              - The confidence with which the Topic was assigned
          - divider: false
            border: false
            id: topics-api-data-structure
            title: Data structure
            descriptionAbout: >-
              The following table describes the proposed top-level fields of the
              Topic entity.


              | **Property**   | **Type**  | **Example value**                                         | **Description**                                       | **Source**                                                                                           |                                                     |

              | -------------- | --------- | --------------------------------------------------------- | ----------------------------------------------------- | ---------------------------------------------------------------------------------------------------- | --------------------------------------------------- |

              | `id`           | string    | `"core-topic-12345"`                                      | CORE internal identifier for the Topic entity.        | CORE                                                                                                 |                                                     |

              | `label`        | string    | `"Particle physics theoretical and experimental studies"` | Preferred label describing the Topic.                 | CORE                                                                                                 |                                                     |

              | `altLabels`    | string\[] | null                                                      | `["Particle physics"]`                                | Alternative labels, synonyms, or variants associated with the Topic.                                 | CORE / OpenAlex / OpenAIRE / Dublin Core / Crossref |

              | `type`         | string    | null                                                      | `"topic"`                                             | General classification of the subject entity.                                                        | CORE                                                |

              | `language`     | string    | null                                                      | `"en"`                                                | Language of the Topic label, where available.                                                        | QDC / Dublin Core Terms                             |

              | `source`       | string\[] | `["OpenAlex", "OpenAIRE"]`                                | Source systems contributing information to the Topic. | CORE                                                                                                 |                                                     |

              | `scheme`       | string    | null                                                      | `"DDC"`                                               | Subject or classification scheme associated with the Topic.                                          | DataCite / Dublin Core Terms / OpenAIRE / CORE      |

              | `schemeUri`    | string    | null                                                      | `"http://dewey.info/"`                                | URI identifying the classification scheme.                                                           | DataCite / OpenAIRE                                 |

              | `spatial`      | string    | null                                                      | `"Scotland"`                                          | Spatial subject coverage associated with the Topic.                                                  | QDC                                                 |

              | `temporal`     | string    | null                                                      | `"19th century"`                                      | Temporal subject coverage associated with the Topic.                                                 | QDC                                                 |

              | `topicId`      | integer   | null                                                      | `12345`                                               | CORE Topic identifier, where available.                                                              | CORE                                                |

              | `score`        | number    | null                                                      | `0.91`                                                | Relevance score associated with the Topic.                                                           | CORE                                                |

              | `domainId`     | string    | null                                                      | `"1"`                                                 | Identifier of the broader research domain.                                                           | CORE                                                |

              | `domainName`   | string    | null                                                      | `"Physical Sciences"`                                 | Name of the broader research domain.                                                                 | CORE                                                |

              | `fieldId`      | string    | null                                                      | `"12"`                                                | Identifier of the research field.                                                                    | CORE                                                |

              | `fieldName`    | string    | null                                                      | `"Physics and Astronomy"`                             | Name of the research field.                                                                          | CORE                                                |

              | `subfieldId`   | string    | null                                                      | `"1206"`                                              | Identifier of the research subfield.                                                                 | CORE                                                |

              | `subfieldName` | string    | null                                                      | `"Nuclear and High Energy Physics"`                   | Name of the research subfield.                                                                       | CORE                                                |

              | `provenance`   | string    | null                                                      | `"inferred by CORE"`                                  | Statement describing how the Topic or classification was assigned.                                   | CORE                                                |

              | `trustScore`   | number    | null                                                      | `0.85`                                                | Confidence or trust score associated with the Topic assignment.                                      | CORE                                                |

              | `isControlled` | boolean   | null                                                      | `true`                                                | Indicates whether the Topic originates from a controlled vocabulary or formal classification scheme. | CORE                                                |


              #### Topic labels


              ##### Preferred label


              The `label` property contains the preferred human-readable representation of the Topic.


              ```json

              {
                "label": "Particle physics theoretical and experimental studies"
              }

              ```


              The preferred label may be selected or normalised by CORE from source classifications or machine-learning output.


              ##### Alternative labels


              The `altLabels` property contains alternative representations of the same Topic.


              ```json

              {
                "altLabels": [
                  "Particle physics",
                  "Experimental particle physics"
                ]
              }

              ```


              Alternative labels may include:


              * Synonyms

              * Abbreviated forms

              * Normalised labels

              * Labels contributed by other source systems


              #### Topic type


              The `type` property identifies the general kind of subject information represented by the record.


              ```json

              {
                "type": "topic"
              }

              ```


              Possible values may include:


              | **Value**        | **Description**                                           |

              | ---------------- | --------------------------------------------------------- |

              | `topic`          | General scholarly research topic or concept.              |

              | `keyword`        | Keyword associated with a scholarly resource.             |

              | `classification` | Term belonging to a formal subject-classification scheme. |

              | `spatial`        | Geographic or spatial subject coverage.                   |

              | `temporal`       | Temporal or historical subject coverage.                  |


              > The final controlled vocabulary should be defined before implementation.


              #### Language


              The `language` property identifies the language of the preferred Topic label.


              ```json

              {
                "language": "en"
              }

              ```


              Example values include:


              * `en`

              * `fr`

              * `de`

              * `es`


              The value should follow a recognised language-code convention. The exact ISO language-code standard should be specified before public release.


              ## Classification scheme


              A Topic may originate from a formal subject-classification or controlled-vocabulary scheme.


              ```json

              {
                "scheme": "DDC",
                "schemeUri": "http://dewey.info/"
              }

              ```


              | **Property** | **Type** | **Description** |                                                  |

              | ------------ | -------- | --------------- | ------------------------------------------------ |

              | `scheme`     | string   | null            | Name or identifier of the classification scheme. |

              | `schemeUri`  | string   | null            | URI identifying or describing the scheme.        |


              Examples may include schemes supplied through DataCite, OpenAIRE, Dublin Core Terms, or CORE.


              The value should not be assumed to be controlled unless `isControlled=true` or CORE otherwise recognises the scheme.


              #### Spatial and temporal coverage


              Topics may represent non-disciplinary subject information.


              ##### Spatial coverage


              ```json

              {
                "type": "spatial",
                "spatial": "Scotland"
              }

              ```


              The `spatial` property describes geographic subject coverage.


              ##### Temporal coverage


              ```json

              {
                "type": "temporal",
                "temporal": "19th century"
              }

              ```


              The `temporal` property describes a historical or temporal period associated with the subject.


              If `spatial` and `temporal` are retained as fields on the same Topic structure, their relationship with `type` should be defined. For example:


              ```text

              type = spatial  → spatial may contain a value

              type = temporal → temporal may contain a value

              ```


              #### Topic hierarchy


              CORE Topics may be organised within a research-classification hierarchy consisting of domain, field, subfield, and Topic levels.


              ```text

              Physical Sciences
                  → Physics and Astronomy
                      → Nuclear and High Energy Physics
                          → Particle physics theoretical and experimental studies
              ```


              The corresponding representation is:


              ```json

              {
                "domainId": "1",
                "domainName": "Physical Sciences",
                "fieldId": "12",
                "fieldName": "Physics and Astronomy",
                "subfieldId": "1206",
                "subfieldName": "Nuclear and High Energy Physics",
                "topicId": 12345,
                "label": "Particle physics theoretical and experimental studies"
              }

              ```


              ##### Hierarchy properties


              | **Property**   | **Type** | **Description** |                                                                                       |

              | -------------- | -------- | --------------- | ------------------------------------------------------------------------------------- |

              | `domainId`     | string               | Identifier of the broadest research domain.                                           |

              | `domainName`   | string               | Human-readable name of the domain.                                                    |

              | `fieldId`      | string               | Identifier of the research field.                                                     |

              | `fieldName`    | string               | Human-readable name of the field.                                                     |

              | `subfieldId`   | string               | Identifier of the research subfield.                                                  |

              | `subfieldName` | string               | Human-readable name of the subfield.                                                  |

              | `topicId`      | integer              | Identifier of the Topic at the most specific level represented by the classification. |


              #### Provenance and confidence


              Topics may originate from several sources or may be inferred by CORE.


              ```json

              {
                "source": [
                  "CORE",
                  "OpenAIRE"
                ],
                "provenance": "inferred by CORE",
                "score": 0.91,
                "trustScore": 0.85,
                "isControlled": true
              }

              ```


              ##### Source


              The `source` collection identifies systems that contributed information to the Topic entity.


              ```json

              {
                "source": [
                  "CORE",
                  "OpenAlex",
                  "OpenAIRE"
                ]
              }

              ```


              A Topic may contain multiple sources when the same concept is reconciled across systems.


              ##### Provenance


              The `provenance` property describes how the Topic was obtained or assigned.


              Examples may include:


              * `inferred by CORE`

              * `supplied by source`

              * `inferred by OpenAIRE`

              * `mapped from controlled vocabulary`


              The final vocabulary should be defined before implementation if clients are expected to query this field programmatically.


              ##### Controlled vocabulary


              The `isControlled` property indicates whether the Topic originates from a recognised classification or controlled vocabulary.


              ```json

              {
                "isControlled": true
              }

              ```


              `true` indicates that the value is associated with a controlled scheme.


              `false` may indicate a free-text keyword, automatically inferred concept, or another non-controlled label.


              #### Topic relevance and confidence


              The proposed model contains both `score` and `trustScore`.


              ##### Relevance score


              ```json

              {
                "score": 0.91
              }

              ```


              `score` represents how strongly a Topic relates to a scholarly object.


              For example, a Topic classifier may determine that a Work is strongly related to:


              ```text

              Particle physics theoretical and experimental studies

              ```


              With:


              ```text

              score = 0.91

              ```


              ##### Trust score


              ```json

              {
                "trustScore": 0.85
              }

              ```


              `trustScore` represents the confidence or trust associated with the Topic assignment.


              The semantic distinction between these values should be made explicit before implementation. A recommended interpretation is:


              | **Property** | **Meaning**                                                       |

              | ------------ | ----------------------------------------------------------------- |

              | `score`      | How strongly the Topic relates to the scholarly object.           |

              | `trustScore` | How confident CORE is that the assignment or mapping is reliable. |


              For example:


              ```json

              {
                "score": 0.91,
                "trustScore": 0.85
              }

              ```


              This indicates that the Topic is highly relevant and that CORE has high confidence in the classification.


              If CORE does not make this distinction internally, the two fields should be consolidated.


              Example Topic record:


              ```json

              {
                "id": "core-topic-12345",
                "label": "Particle physics theoretical and experimental studies",
                "altLabels": [
                  "Particle physics"
                ],
                "type": "topic",
                "language": "en",
                "source": [
                  "CORE",
                  "OpenAIRE"
                ],
                "scheme": "CORE",
                "schemeUri": null,
                "spatial": null,
                "temporal": null,
                "topicId": 12345,
                "score": 0.91,
                "domainId": "1",
                "domainName": "Physical Sciences",
                "fieldId": "12",
                "fieldName": "Physics and Astronomy",
                "subfieldId": "1206",
                "subfieldName": "Nuclear and High Energy Physics",
                "provenance": "inferred by OpenAIRE",
                "trustScore": 0.85,
                "isControlled": true
              }

              ```
          - divider: false
            border: false
            id: topics-api-supported-field-operations
            title: Supported field operations
            descriptionAbout: >
              The following table presents the recommended search configuration
              based on the semantics of the proposed Topic fields.


              | **Attribute**  | **Searchable** | **Filterable** | **Sortable** | **Facetable** |

              | -------------- | -------------- | -------------- | ------------ | ------------- |

              | `id`           | No             | Yes            | No           | No            |

              | `label`        | Yes            | No             | Yes          | No            |

              | `altLabels`    | Yes            | No             | No           | No            |

              | `type`         | No             | Yes            | No           | Yes           |

              | `language`     | No             | Yes            | No           | Yes           |

              | `source`       | No             | Yes            | No           | Yes           |

              | `scheme`       | No             | Yes            | No           | Yes           |

              | `schemeUri`    | No             | Yes            | No           | No            |

              | `spatial`      | Yes            | Yes            | No           | Yes           |

              | `temporal`     | Yes            | Yes            | No           | Yes           |

              | `topicId`      | No             | Yes            | Yes          | No            |

              | `score`        | No             | Yes            | Yes          | No            |

              | `domainId`     | No             | Yes            | No           | Yes           |

              | `domainName`   | Yes            | Yes            | No           | Yes           |

              | `fieldId`      | No             | Yes            | No           | Yes           |

              | `fieldName`    | Yes            | Yes            | No           | Yes           |

              | `subfieldId`   | No             | Yes            | No           | Yes           |

              | `subfieldName` | Yes            | Yes            | No           | Yes           |

              | `provenance`   | No             | Yes            | No           | Yes           |

              | `trustScore`   | No             | Yes            | Yes          | No            |

              | `isControlled` | No             | Yes            | No           | Yes           |


              The field-operation settings have the following meanings:


              * Searchable fields participate in text search.

              * Filterable fields can be used in field lookup, Boolean conditions, ranges, and existence queries.

              * Sortable fields can be used with `orderby`.

              * Facetable fields can be requested using `facets`.
          - divider: false
            border: false
            id: topics-api-topics-endpoints
            title: Topics endpoints
            descriptionAbout: >-
              #### Available endpoints


              | **Operation**                           | **Method** | **Endpoint**                 |

              | --------------------------------------- | ---------- | ---------------------------- |

              | Get a single Topic                      | `GET`      | `/v4/topics/{topicId}`       |

              | Search Topics using URL parameters      | `GET`      | `/v4/search/topics`          |

              | Search Topics using a JSON request body | `POST`     | `/v4/search/topics`          |

              | Retrieve Works associated with a Topic  | `GET`      | `/v4/topics/{topicId}/works` |


              A reverse relationship may also be exposed:


              ```http

              GET /v4/works/{workId}/topics

              ```


              The `POST` search method is read-only. It does not create or modify Topic records.


              #### Get a single Topic


              Retrieves one Topic using its CORE Topic identifier.


              ##### API endpoint


              ```http

              GET https://api.core.ac.uk/v4/topics/{topicId}

              ```


              ##### Authorization


              | **Parameter**   | **Location** | **Type** | **Required** | **Description**                                           |

              | --------------- | ------------ | -------- | ------------ | --------------------------------------------------------- |

              | `Authorization` | Header       | string   | Yes          | CORE API authentication token supplied as a Bearer token. |


              ##### Path parameters


              | **Parameter** | **Type** | **Required** | **Description**                      |

              | ------------- | -------- | ------------ | ------------------------------------ |

              | `topicId`     | integer  | Yes          | Unique CORE identifier of the Topic. |


              ##### Query parameters


              | **Parameter** | **Type** | **Required** | **Description**                                 |

              | ------------- | -------- | ------------ | ----------------------------------------------- |

              | `select`      | string   | No           | Comma-separated list of Topic fields to return. |


              Example request:


              ```bash

              curl --request GET \
                --url "https://api.core.ac.uk/v4/topics/12345" \
                --header "Authorization: Bearer YOUR_API_KEY"
              ```


              Example using `select`:


              ```bash

              curl --request GET \
                --url "https://api.core.ac.uk/v4/topics/12345?select=topicId,label,domainName,fieldName,subfieldName" \
                --header "Authorization: Bearer YOUR_API_KEY"
              ```


              Example response:


              ```json

              {
                "topicId": 12345,
                "label": "Particle physics theoretical and experimental studies",
                "domainName": "Physical Sciences",
                "fieldName": "Physics and Astronomy",
                "subfieldName": "Nuclear and High Energy Physics"
              }

              ```
          - divider: false
            border: false
            id: topics-api-search-examples
            title: Search examples
            descriptionAbout: >-
              #### Search Topics by label


              GET:


              ```http

              GET /v4/search/topics?q=label:"particle physics"

              ```


              Equivalent POST:


              ```json

              {
                "q": "label:\"particle physics\""
              }

              ```


              #### Free-text Topic search


              ```http

              GET /v4/search/topics?q="particle physics"

              ```


              This searches fields marked as searchable, including `label` and `altLabels`.


              #### Retrieve Topics belonging to a domain


              GET:


              ```http

              GET /v4/search/topics?q=domainName:"Physical Sciences"

              ```


              Equivalent POST:


              ```json

              {
                "q": "domainName:\"Physical Sciences\""
              }

              ```


              #### Retrieve Topics belonging to a field


              GET:


              ```http

              GET /v4/search/topics?q=fieldName:"Physics and Astronomy"

              ```


              Equivalent POST:


              ```json

              {
                "q": "fieldName:\"Physics and Astronomy\""
              }

              ```


              #### Retrieve Topics belonging to a subfield


              GET:


              ```http

              GET /v4/search/topics?q=subfieldName:"Nuclear and High Energy Physics"

              ```


              Equivalent POST:


              ```json

              {
                "q": "subfieldName:\"Nuclear and High Energy Physics\""
              }

              ```


              #### Retrieve controlled Topics


              GET:


              ```http

              GET /v4/search/topics?q=isControlled:true

              ```


              Equivalent POST:


              ```json

              {
                "q": "isControlled:true"
              }

              ```


              #### Retrieve Topics from a particular source


              GET:


              ```http

              GET /v4/search/topics?q=source:OpenAIRE

              ```


              Equivalent POST:


              ```json

              {
                "q": "source:OpenAIRE"
              }

              ```


              #### Retrieve Topics from a classification scheme


              GET:


              ```http

              GET /v4/search/topics?q=scheme:DDC

              ```


              Equivalent POST:


              ```json

              {
                "q": "scheme:DDC"
              }

              ```


              #### Retrieve Topics above a confidence threshold


              GET:


              ```http

              GET /v4/search/topics?q=trustScore>=0.8

              ```


              Equivalent POST:


              ```json

              {
                "q": "trustScore>=0.8"
              }

              ```


              #### Retrieve Topics by relevance


              GET:


              ```http

              GET /v4/search/topics?q=score>=0.9

              ```


              Equivalent POST:


              ```json

              {
                "q": "score>=0.9"
              }

              ```


              #### Retrieve Topics in a particular language


              GET:


              ```http

              GET /v4/search/topics?q=language:en

              ```


              Equivalent POST:


              ```json

              {
                "q": "language:en"
              }

              ```


              #### Retrieve Topics with spatial coverage


              GET:


              ```http

              GET /v4/search/topics?q=_exists_:spatial

              ```


              Equivalent POST:


              ```json

              {
                "q": "_exists_:spatial"
              }

              ```


              #### Facets


              Fields configured as facetable can be used to summarise the Topic collection.


              GET:


              ```http

              GET /v4/search/topics
                  ?q=*
                  &facets=type,language,scheme,source,domainName,fieldName,subfieldName,isControlled
                  &count=true
                  &limit=0
              ```


              Equivalent POST:


              ```json

              {
                "q": "*",
                "facets": [
                  "type",
                  "language",
                  "scheme",
                  "source",
                  "domainName",
                  "fieldName",
                  "subfieldName",
                  "isControlled"
                ],
                "count": true,
                "limit": 0
              }

              ```


              This could support questions such as:


              * How many Topics occur in each research domain

              * How many Topics belong to each field or subfield

              * Which classification schemes contribute Topics

              * How many Topics are controlled versus inferred

              * Which source systems contribute Topic data


              #### Ordering


              Topics may be ordered by fields configured as sortable.


              #### Alphabetically by label


              ```http

              GET /v4/search/topics?orderby=label:asc

              ```


              ##### Highest relevance score first


              ```http

              GET /v4/search/topics?orderby=score:desc

              ```


              #### Search Topics responses


              | **Status** | **Description**                                                                                  |

              | ---------- | ------------------------------------------------------------------------------------------------ |

              | `200`      | Topic search was completed successfully.                                                         |

              | `400`      | Request contains an invalid query, field, facet, sort expression, or response-control parameter. |

              | `401`      | Authentication credentials are missing or invalid.                                               |

              | `413`      | `POST` request body exceeds the permitted size.                                                  |

              | `429`      | API request limit has been exceeded.                                                             |

              | `500`      | An unexpected server error occurred.                                                             |

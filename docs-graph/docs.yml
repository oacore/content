          - divider: false
            border: false
            id: institutions-api-institutions-endpoints
            title: Institutions endpoints
            descriptionAbout: >-
              #### Available endpoints


              | **Operation**                                 | **Method** | **Endpoint**                       |

              | --------------------------------------------- | ---------- | ---------------------------------- |

              | Get a single Institution                      | GET        | `/v4/institutions/{institutionId}` |

              | Search Institutions                           | GET        | `/v4/search/institutions`          |

              | Search Institutions using a JSON request body | POST       | `/v4/search/institutions`          |


              Related records may also be retrieved through relationship-oriented endpoints:


              | **Operation**                              | **Method** | **Endpoint**                                     |

              | ------------------------------------------ | ---------- | ------------------------------------------------ |

              | Retrieve Affiliations for an Institution   | GET        | `/v4/institutions/{institutionId}/affiliations`  |

              | Retrieve Data Providers for an Institution | GET        | `/v4/institutions/{institutionId}/dataProviders` |

              | Retrieve Topics for an Institution         | GET        | `/v4/institutions/{institutionId}/topics`        |


              #### Get a single Institution


              Retrieves a single Institution record using its unique CORE Institution identifier.


              ##### API endpoint


              ```

              GET https://api.core.ac.uk/v4/institutions/{institutionId}

              ```


              ##### Authorization


              | **Parameter** | **Location** | **Type** | **Required** | **Description**                                           |

              | ------------- | ------------ | -------- | ------------ | --------------------------------------------------------- |

              | Authorization | Header       | string   | Yes          | CORE API authentication token supplied as a Bearer token. |


              ##### Path parameters


              | **Parameter** | **Type** | **Required** | **Description**                                   |

              | ------------- | -------- | ------------ | ------------------------------------------------- |

              | institutionId | integer  | Yes          | Unique CORE identifier of the Institution record. |


              ##### Query parameters


              | **Parameter** | **Type** | **Required** | **Description**                                                                                                                 |

              | ------------- | -------- | ------------ | ------------------------------------------------------------------------------------------------------------------------------- |

              | select        | string   | No           | Comma-separated list of top-level Institution fields to return. Example: `select=institutionId,rorId,displayName,types,status`. |


              Example request:


              ```

              curl --request GET \
                --url "https://api.core.ac.uk/v4/institutions/1256" \
                --header "Authorization: Bearer YOUR_API_KEY"
              ```


              E﻿xample response:


              ```

              {
                "institutionId": 1256,
                "rorId": "https://ror.org/05mzfcs16",
                "openalexId": "https://openalex.org/I123456789",
                "displayName": "The Open University",
                "acronym": "OU",
                "countryCode": "GB",
                "countryName": "United Kingdom",
                "city": "Milton Keynes",
                "websiteUrl": "https://www.open.ac.uk/",
                "domains": [
                  "open.ac.uk"
                ],
                "types": [
                  "education",
                  "funder"
                ],
                "status": "active",
                "establishedYear": 1966
              }

              ```


              E﻿xample req using request `select:`


              ```

              curl --request GET \
                --url "https://api.core.ac.uk/v4/institutions/1256?select=institutionId,rorId,displayName,countryCode,types,status" \
                --header "Authorization: Bearer YOUR_API_KEY"
              ```


              E﻿xample response using `select:`


              ```

              {
                "institutionId": 1256,
                "rorId": "https://ror.org/05mzfcs16",
                "displayName": "The Open University",
                "countryCode": "GB",
                "types": [
                  "education",
                  "funder"
                ],
                "status": "active"
              }

              ```


              #### R﻿esponses


              | **Status** | **Description**                                                      |

              | ---------- | -------------------------------------------------------------------- |

              | `200`      | The Institution record was retrieved successfully.                   |

              | `400`      | The request contains an invalid parameter or unsupported field name. |

              | `401`      | Authentication credentials are missing or invalid.                   |

              | `404`      | No Institution record was found for the supplied identifier.         |

              | `429`      | The API request limit has been exceeded.                             |

              | `500`      | An unexpected server error occurred.                                 |
          - divider: false
            border: false
            id: institutions-api-search-institutions
            title: Search institutions
            descriptionAbout: >-
              Searches, filters, orders, facets, and paginates Institution
              records.


              #### API endpoints


              ```

              GET https://api.core.ac.uk/v4/search/institutions

              ```


              ```

              POST https://api.core.ac.uk/v4/search/institutions

              ```


              The endpoint uses the CORE API query language through the `q` parameter. Additional parameters such as `orderby`, `select`, `facets`, `count`, `limit`, and `offset` control how the results are returned.


              #### GET and POST search parameters


              ##### GET query parameters


              | **Parameter** | **Type** | **Required** | **Default**                   | **Description**                                                                                                                   |

              | ------------- | -------- | ------------ | ----------------------------- | --------------------------------------------------------------------------------------------------------------------------------- |

              | q             | string   | No           | `*`                           | CORE query expression supporting textual search, field lookup, Boolean operators, grouping, range queries, and existence queries. |

              | orderby       | string   | No           | Relevance for textual queries | Comma-separated ordering directives in `field:direction` format.                                                                  |

              | select        | string   | No           | All retrievable fields        | Comma-separated list of fields to include in each result.                                                                         |

              | facets        | string   | No           | —                             | Comma-separated list of facetable fields for which value buckets and counts should be returned.                                   |

              | count         | boolean  | No           | `false`                       | Indicates whether the total number of matching Institution records should be included.                                            |

              | limit         | integer  | No           | `10`                          | Maximum number of Institution records to return.                                                                                  |

              | offset        | integer  | No           | `0`                           | Number of matching Institution records to skip.                                                                                   |


              ##### POST request body


              | **Property** | **Type**  | **Required** | **Default**                   | **Description**                                                                                                                   |

              | ------------ | --------- | ------------ | ----------------------------- | --------------------------------------------------------------------------------------------------------------------------------- |

              | q            | string    | No           | `*`                           | CORE query expression supporting textual search, field lookup, Boolean operators, grouping, range queries, and existence queries. |

              | orderby      | string\[] | No           | Relevance for textual queries | Ordered list of sorting directives in `field:direction` format.                                                                   |

              | select       | string\[] | No           | All retrievable fields        | List of Institution fields to include in each result.                                                                             |

              | facets       | string\[] | No           | —                             | List of facetable fields for which value buckets and counts should be returned.                                                   |

              | count        | boolean   | No           | `false`                       | Indicates whether the total number of matching Institution records should be included.                                            |

              | limit        | integer   | No           | `10`                          | Maximum number of Institution records to return.                                                                                  |

              | offset       | integer   | No           | `0`                           | Number of matching Institution records to skip.                                                                                   |


              #### GET and POST parameter mapping


              | **GET query parameter**                   | **POST body property**                                 |

              | ----------------------------------------- | ------------------------------------------------------ |

              | `q=types:education`                       | `"q": "types:education"`                               |

              | `orderby=displayName:asc`                 | `"orderby": ["displayName:asc"]`                       |

              | `select=institutionId,displayName,status` | `"select": ["institutionId", "displayName", "status"]` |

              | `facets=types,status,countryCode`         | `"facets": ["types", "status", "countryCode"]`         |

              | `count=true`                              | `"count": true`                                        |

              | `limit=10`                                | `"limit": 10`                                          |

              | `offset=0`                                | `"offset": 0`                                          |


              The GET method represents `orderby`, `select`, and `facets` as comma-separated strings. The POST method represents them as JSON arrays.
          - divider: false
            border: false
            id: institutions-api-search-examples
            title: Search examples
            descriptionAbout: >-
              #### Search by Institution name


              Search a specific Institution name using the `displayName` field:


              ```

              GET /v4/search/institutions?q=displayName:"The Open University"

              ```


              A free-text query searches all searchable Institution fields:


              ```

              GET /v4/search/institutions?q="Open University"

              ```


              This query may match `displayName`, `acronym`, or `altNames`.


              Equivalent POST request:


              ```

              {
                "q": "displayName:\"The Open University\""
              }

              ```


              A broad textual query searches searchable Institution fields, including:


              * `displayName`

              * `acronym`

              * `altNames`

              * `formerNames`

              * `names.value`

              * Location names

              * Related Institution names

              * Topic names

              * Data Provider names


              When a textual query is supplied and `orderby` is omitted, results are ordered by relevance.


              #### Retrieve an Institution by ROR identifier


              GET request:


              ```

              GET /v4/search/institutions?q=rorId:"https://ror.org/05mzfcs16"

              ```


              Equivalent POST request:


              ```

              {
                "q": "rorId:\"https://ror.org/05mzfcs16\""
              }

              ```


              #### Search by domain


              GET request:


              ```

              GET /v4/search/institutions?q=domains:"open.ac.uk"

              ```


              Equivalent POST request:


              ```

              {
                "q": "domains:\"open.ac.uk\""
              }

              ```


              #### Retrieve Institutions by type and country


              GET request:


              ```

              GET /v4/search/institutions?q=types:education AND countryCode:GB

              ```


              Equivalent POST request:


              ```

              {
                "q": "types:education AND countryCode:GB"
              }

              ```


              #### Retrieve active Institutions


              GET request:


              ```

              GET /v4/search/institutions?q=status:active

              ```


              Equivalent POST request:


              ```

              {
                "q": "status:active"
              }

              ```


              #### Retrieve Institutions established after 2000


              GET request:


              ```

              GET /v4/search/institutions?q=establishedYear>2000

              ```


              Equivalent POST request:


              ```

              {
                "q": "establishedYear>2000"
              }

              ```


              #### Retrieve Institutions with Data Providers


              GET request:


              ```

              GET /v4/search/institutions?q=_exists_:dataProviderIds

              ```


              Equivalent POST request:


              ```

              {
                "q": "_exists_:dataProviderIds"
              }

              ```


              #### Search by Topic


              GET request:


              ```

              GET /v4/search/institutions?q=topics.topicId:"23"

              ```


              Equivalent POST request:


              ```

              {
                "q": "topics.topicId:\"23\""
              }

              ```


              A textual Topic search may use:


              ```

              GET /v4/search/institutions?q=topics.displayName:"Particle physics"

              ```


              #### Retrieve Institutions by yearly metrics


              The following query retrieves Institutions with more than 10,000 Works in 2024.


              GET request:


              ```

              GET /v4/search/institutions?q=yearlyMetrics.year:2024 AND yearlyMetrics.worksCount>10000

              ```


              Equivalent POST request:


              ```

              {
                "q": "yearlyMetrics.year:2024 AND yearlyMetrics.worksCount>10000"
              }

              ```


              Both conditions must apply to the same `yearlyMetrics` entry.


              #### Search using multiple conditions


              GET request:


              ```

              GET /v4/search/institutions
                  ?q=displayName:"Open" AND types:education AND countryCode:GB
                  &orderby=displayName:asc
                  &select=institutionId,rorId,displayName,countryCode,types,status
                  &limit=10
                  &offset=0
              ```


              This request:


              * Searches for `Open` in `displayName`.

              * Restricts results to educational Institutions.

              * Restricts results to Institutions in the United Kingdom.

              * Orders results alphabetically.

              * Returns only the selected fields.

              * Returns a maximum of ten records.


              Equivalent POST request:


              ```

              curl --request POST \
                --url "https://api.core.ac.uk/v4/search/institutions" \
                --header "Authorization: Bearer YOUR_API_KEY" \
                --header "Content-Type: application/json" \
                --data '{
                  "q": "displayName:\"Open\" AND types:education AND countryCode:GB",
                  "orderby": [
                    "displayName:asc"
                  ],
                  "select": [
                    "institutionId",
                    "rorId",
                    "displayName",
                    "countryCode",
                    "types",
                    "status"
                  ],
                  "count": true,
                  "limit": 10,
                  "offset": 0
                }'
              ```


              Example search response:


              ```

              {
                "totalHits": 1,
                "results": [
                  {
                    "institutionId": 1256,
                    "rorId": "https://ror.org/05mzfcs16",
                    "displayName": "The Open University",
                    "countryCode": "GB",
                    "types": [
                      "education",
                      "funder"
                    ],
                    "status": "active"
                  }
                ]
              }

              ```


              #### Ordering Institution results


              ##### Order alphabetically


              GET request:


              ```

              GET /v4/search/institutions?q=types:education&orderby=displayName:asc

              ```


              POST representation:


              ```

              {
                "q": "types:education",
                "orderby": [
                  "displayName:asc"
                ]
              }

              ```


              ##### Order by established year


              GET request:


              ```

              GET /v4/search/institutions?orderby=establishedYear:asc

              ```


              POST representation:


              ```

              {
                "orderby": [
                  "establishedYear:asc"
                ]
              }

              ```


              ##### Order by multiple fields


              The following request would require `countryCode` to be sortable:


              ```

              GET /v4/search/institutions?orderby=countryCode:asc,displayName:asc

              ```


              Under the current supported field operations, `countryCode` is not sortable. Filter by `countryCode` and order by `displayName` instead:


              ```

              GET /v4/search/institutions?q=countryCode:GB&orderby=displayName:asc

              ```


              ##### Order by most recently updated


              GET request:


              ```

              GET /v4/search/institutions?orderby=updatedAt:desc

              ```


              POST representation:


              ```

              {
                "orderby": [
                  "updatedAt:desc"
                ]
              }

              ```


              #### Facets


              The `facets` option returns value buckets and counts for fields configured as facetable.


              GET request:


              ```

              curl --request GET \
                --url "https://api.core.ac.uk/v4/search/institutions?q=status:active&facets=types,status,countryCode&count=true&limit=0" \
                --header "Authorization: Bearer YOUR_API_KEY"
              ```


              Equivalent POST request:


              ```

              curl --request POST \
                --url "https://api.core.ac.uk/v4/search/institutions" \
                --header "Authorization: Bearer YOUR_API_KEY" \
                --header "Content-Type: application/json" \
                --data '{
                  "q": "status:active",
                  "facets": [
                    "types",
                    "status",
                    "countryCode"
                  ],
                  "count": true,
                  "limit": 0
                }'
              ```


              Example facet response:


              ```

              {
                "totalHits": 12034,
                "facets": {
                  "types": [
                    {
                      "value": "education",
                      "count": 8102
                    },
                    {
                      "value": "funder",
                      "count": 1730
                    },
                    {
                      "value": "healthcare",
                      "count": 1204
                    }
                  ],
                  "status": [
                    {
                      "value": "active",
                      "count": 12034
                    }
                  ],
                  "countryCode": [
                    {
                      "value": "US",
                      "count": 2415
                    },
                    {
                      "value": "GB",
                      "count": 1183
                    }
                  ]
                },
                "results": []
              }

              ```


              Facet counts describe the complete matching result set. Setting `limit` to `0` returns facet buckets and counts without returning Institution records.


              #### Result count


              Set `count=true` to include the total number of matching Institution records.


              GET request:


              ```

              GET /v4/search/institutions?q=types:education&count=true

              ```


              Equivalent POST request:


              ```

              {
                "q": "types:education",
                "count": true
              }

              ```


              When `count` is omitted or set to `false`, `totalHits` may be omitted from the response.


              #### Pagination


              Use `limit` and `offset` to paginate Institution results. A deterministic `orderby` expression should be used when retrieving multiple pages.


              ##### First page using GET


              ```

              GET /v4/search/institutions?q=types:education&orderby=displayName:asc&limit=20&offset=0

              ```


              ##### Second page using GET


              ```

              GET /v4/search/institutions?q=types:education&orderby=displayName:asc&limit=20&offset=20

              ```


              ##### First page using POST


              ```

              {
                "q": "types:education",
                "orderby": [
                  "displayName:asc"
                ],
                "limit": 20,
                "offset": 0
              }

              ```


              ##### Second page using POST


              ```

              {
                "q": "types:education",
                "orderby": [
                  "displayName:asc"
                ],
                "limit": 20,
                "offset": 20
              }

              ```


              The offset is calculated as:


              ```

              offset = page size × number of previous pages

              ```




              #### R﻿esponses


              | Status | Description |

              | --- | --- |

              | `200` | The Institution search was completed successfully. |

              | `400` | The request contains an invalid query, unsupported field, invalid facet, or invalid response-control parameter. |

              | `401` | Authentication credentials are missing or invalid. |

              | `413` | The POST request body exceeds the permitted size. |

              | `429` | The API request limit has been exceeded. |

              | `500` | An unexpected server error occurred. |
          - divider: false
            border: false
            id: institutions-api-relationship-oriented-endpoints
            title: Relationship-oriented endpoints
            descriptionAbout: >-
              Relationship-oriented endpoints provide convenient access to
              records connected to an Institution.


              They do not introduce a different Institution representation. Internally, they traverse the corresponding CORE Graph relationships.


              #### Affiliations for an Institution


              ```

              GET /v4/institutions/{institutionId}/affiliations

              ```


              Retrieves Affiliation records linked to the Institution.


              Equivalent GET search:


              ```

              GET /v4/search/affiliations?q=institutionId:{institutionId}

              ```


              Equivalent POST search:


              ```

              {
                "q": "institutionId:{institutionId}"
              }

              ```


              Example request:


              ```

              curl --request GET \
                --url "https://api.core.ac.uk/v4/institutions/1256/affiliations?count=true&limit=10&offset=0" \
                --header "Authorization: Bearer YOUR_API_KEY"
              ```


              Example response:


              ```

              {
                "totalHits": 2,
                "results": [
                  {
                    "affiliationId": 901,
                    "authorId": 67890,
                    "rawAffiliation": "School of Computing and Communications, The Open University",
                    "department": "School of Computing and Communications",
                    "institutionId": 1256,
                    "institutionName": "The Open University",
                    "isCurrent": true,
                    "startDate": "2022-01-01",
                    "endDate": null
                  },
                  {
                    "affiliationId": 902,
                    "authorId": 67891,
                    "rawAffiliation": "Knowledge Media Institute, The Open University",
                    "department": "Knowledge Media Institute",
                    "institutionId": 1256,
                    "institutionName": "The Open University",
                    "isCurrent": true,
                    "startDate": null,
                    "endDate": null
                  }
                ]
              }

              ```


              An existing Institution with no linked Affiliations returns `200` with an empty `results` array.


              #### Data Providers for an Institution


              ```

              GET /v4/institutions/{institutionId}/dataProviders

              ```


              Retrieves complete CORE Data Provider records associated with the Institution.


              The endpoint returns complete Data Provider objects rather than only the convenience fields `dataProviderIds` and `dataProviderNames`.


              Example request:


              ```

              curl --request GET \
                --url "https://api.core.ac.uk/v4/institutions/1256/dataProviders?count=true&limit=10&offset=0" \
                --header "Authorization: Bearer YOUR_API_KEY"
              ```


              Example response:


              ```

              {
                "totalHits": 1,
                "results": [
                  {
                    "dataProviderId": 86,
                    "name": "Open Research Online",
                    "type": "institutional repository",
                    "homepageUrl": "https://oro.open.ac.uk/",
                    "oaiPmhUrl": "https://oro.open.ac.uk/cgi/oai2",
                    "institutionId": 1256
                  }
                ]
              }

              ```


              An existing Institution with no associated Data Providers returns `200` with an empty `results` array.


              #### Topics for an Institution


              ```

              GET /v4/institutions/{institutionId}/topics

              ```


              Retrieves research Topics associated with the Institution.


              The endpoint returns the Topic objects represented in the Institution’s `topics` collection.


              Example request:


              ```

              curl --request GET \
                --url "https://api.core.ac.uk/v4/institutions/1256/topics?count=true&limit=10&offset=0" \
                --header "Authorization: Bearer YOUR_API_KEY"
              ```


              Example response:


              ```

              {
                "totalHits": 1,
                "results": [
                  {
                    "topicId": "23",
                    "displayName": "Particle physics theoretical and experimental studies",
                    "count": 6107,
                    "score": 1,
                    "subfieldId": "67",
                    "subfieldName": "Nuclear and High Energy Physics",
                    "fieldId": "96",
                    "fieldName": "Physics and Astronomy",
                    "domainId": "56",
                    "domainName": "Physical Sciences"
                  }
                ]
              }

              ```


              An existing Institution with no associated Topics returns `200` with an empty `results` array.
      - item: Authorships
        sections:
          - id: authorships-api-introduction
            title: Introduction
            descriptionAbout: >-
              An Authorship record describes how an Author appears on a
              particular scholarly Work. It contains Work-specific information
              such as the Author's position in the author list, numeric rank,
              corresponding-Author status, and source-provided name.
              Affiliations used by the Author on the Work are connected to the
              Authorship through the Authorship_Affiliation bridge entity.


              Unlike the Author entity, which represents a persistent researcher identity across multiple works, Authorship represents an author's association with one specific Work. The diagram below represents the entity relationships between Works, Authorships and Authors.
            images:
              - file: /images/docs-graph/works-citations-outputs1.png
            subTitle: null
            subDescription: A Work may have multiple Authorship records, and an Author may
              appear in multiple Authorship records. Each Authorship record
              links exactly one Work to exactly one Author. An Authorship may be
              linked to zero or more Affiliation records through
              `Authorship_Affiliation`.
          - id: authorships-api-data-structure
            title: Data structure
            descriptionAbout: >-
              The table below describes the top-level fields in the CORE Graph
              metadata schema for the Authorship entity, including their types,
              example values, descriptions, and sources.


              | **Property**        | **Type**   | **Example value**       | **Description**                                                                                                                                                                                                                                                                                                                            | **Source**          |

              | ------------------- | ---------- | ----------------------- | ------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------ | ------------------- |

              | authorshipId        | integer    | 234                     | CORE identifier for the authorship                                                                                                                                                                                                                                                                                                         | CORE                |

              | workId              | integer    | 23456                   | CORE identifier of the associated work.                                                                                                                                                                                                                                                                                                    | CORE                |

              | authorId            | integer    | 12                      | CORE identifier of the associated author.                                                                                                                                                                                                                                                                                                  | CORE                |

              | rawName             | string     | Smith, Alice            | Verbatim author name string as supplied in the source metadata for this work.                                                                                                                                                                                                                                                              | OAI-PMH / Crossref  |

              | sequence*           | string     | first                   | Author order classification within the work, such as first or additional.                                                                                                                                                                                                                                                                  | Crossref / OpenAlex |

              | rank*               | integer    | 1                       | Numeric rank of the author in the author list.                                                                                                                                                                                                                                                                                             | OpenAIRE / OpenAlex |

              | isFirstNamedAuthor* | boolean    | true                    | Indicates whether the author is the first-listed author on the work.                                                                                                                                                                                                                                                                       | Derived by CORE     |

              | isCorresponding     | boolean    | false                   | Indicates whether the author is the corresponding author or not. **true:** the author is explicitly identified as a corresponding author. **false:** the source explicitly indicates that the author is not a corresponding author. **null:** the source does not provide sufficient information to determine corresponding-author status. |                     |

              | sourceOutputIds     | integer\[] | \[216874849, 216874850] | CORE Output identifiers from which evidence for this Authorship was derived.                                                                                                                                                                                                                                                               | CORE                |

              | createdDate         | string     | "2026-06-15T10:30:00Z"  | Date and time when the authorship record was created in CORE.                                                                                                                                                                                                                                                                              | CORE                |

              | updatedDate         | string     | 2023-11-07T05:31:56Z    | Date and time when the authorship record was last updated in CORE.                                                                                                                                                                                                                                                                         | CORE                |


              \* - See the Author position section below.


              #### Author position


              The fields `rank`, `sequence`, and `isFirstNamedAuthor` describe the Author's position in the author list for the specific work.


              For example:


              | **Author position** | **rank** | **sequence** | **isFirstNamedAuthor** |

              | ------------------- | -------- | ------------ | ---------------------- |

              | First author        | 1        | "first"      | true                   |

              | Middle author       | 2        | "additional" | false                  |

              | Final author        | 5        | "last"       | false                  |


              The `rank` property provides the exact numeric position of the Author.


              The `sequence` property provides a simplified classification of that position.


              For a single-author Work, the recommended representation is:


              ```json

              {
                "rank": 1,
                "sequence": "first",
                "isFirstNamedAuthor": true
              }

              ```


              Example Authorship record:


              ```json

              {
                "authorshipId": 987654,
                "workId": 12345,
                "authorId": 67890,
                "rawName": "Smith, Alice",
                "sequence": "first",
                "rank": 1,
                "isFirstNamedAuthor": true,
                "isCorresponding": true,
                "sourceOutputIds": [
                  216874849,
                  216874850
                ],
                "createdDate": "2026-06-15T10:30:00Z",
                "updatedDate": "2026-07-01T14:20:00Z"
              }

              ```
          - id: authorships-api-authorship-affiliation-relationship
            title: Authorship–Affiliation relationship
            descriptionAbout: >
              Affiliations used by an Author on a particular Work are
              represented through the `authorship_affiliation` bridge entity.
              The bridge contains the identifiers of the connected Authorship
              and Affiliation records.


              | Property | Type | Example value | Description | Source |

              | --- | --- | --- | --- | --- |

              | authorshipId | integer | 987654 | CORE identifier of the Authorship participating in the relationship. | CORE |

              | affiliationId | integer | 901 | CORE identifier of the Affiliation participating in the relationship. | CORE |


              Example bridge records:


              ```json

              [
                {
                  "authorshipId": 987654,
                  "affiliationId": 901
                },
                {
                  "authorshipId": 987654,
                  "affiliationId": 902
                }
              ]

              ```


              These records indicate that Authorship 987654 is associated with Affiliations 901 and 902.


              The bridge is used because:


              - one Authorship may be linked to multiple Affiliations;

              - one Affiliation may be linked to multiple Authorship records representing different Works;

              - Authorship contains only Work-specific Author information;

              - Affiliation remains an independently addressable and reusable entity.
            images:
              - file: /images/docs-graph/works-citations-outputs2.png
            subTitle: null
            subDescription: null
          - id: authorships-api-supported-field-operations
            title: Supported field operations
            descriptionAbout: >
              The table below describes which Authorship properties can be
              searched, queried through field lookups, ordered, or used as
              facets.


              | Attribute | Searchable | Filterable | Sortable | Facetable |

              | --- | --- | --- | --- | --- |

              | authorshipId | No | Yes | No | No |

              | workId | No | Yes | Yes | No |

              | authorId | No | Yes | Yes | No |

              | rawName | Yes | No | No | No |

              | sequence | No | Yes | Yes | Yes |

              | rank | No | Yes | Yes | Yes |

              | isFirstNamedAuthor | No | Yes | No | Yes |

              | isCorresponding | No | Yes | No | Yes |

              | sourceOutputIds | No | Yes | No | No |

              | createdDate | No | Yes | Yes | No |

              | updatedDate | No | Yes | Yes | No |


              The field-operation settings have the following meanings:


              - **Searchable** fields can participate in textual queries through `q`.

              - **Filterable** fields can be used in field lookups, Boolean conditions, range expressions, and existence queries through `q`.

              - **Sortable** fields can be used with `orderby`.

              - **Facetable** fields can be used with `facets`.


              Refer to the common CORE API Query Language documentation for the complete query syntax.


              ## Boolean query syntax


              The examples in this document use explicit Boolean operators:


              ```

              workId:12345 AND isCorresponding:true

              ```


              Commas are not used as an alternative to `AND` inside `q`.


              In executable URLs, spaces should be URL-encoded:


              ```

              workId:12345%20AND%20isCorresponding:true

              ```


              Readable examples may show the unencoded form for clarity.
          - id: authorships-api-authorships-endpoints
            title: Authorships endpoints
            descriptionAbout: >-
              | Operation                                    | Method |
              Endpoint                                      |

              | -------------------------------------------- | ------ | --------------------------------------------- |

              | Get a single Authorship                      | GET    | `/v4/authorships/{authorshipId}`              |

              | Search Authorships using URL parameters      | GET    | `/v4/search/authorships`                      |

              | Search Authorships using a JSON request body | POST   | `/v4/search/authorships`                      |

              | Retrieve Affiliations for an Authorship      | GET    | `/v4/authorships/{authorshipId}/affiliations` |


              Authorship records may also be retrieved through relationship-oriented endpoints:


              * `GET /v4/works/{workId}/authorships`

              * `GET /v4/authors/{authorId}/authorships`


              The Author relationship endpoint should only be exposed in a version that provides the Author entity.


              #### Get a single Authorship


              Retrieves a single Authorship record using its unique CORE Authorship identifier.


              The POST search method is not an alternative single-record retrieval endpoint. It searches the Authorship collection using a JSON request body.


              ##### API endpoint


              ```

              GET https://api.core.ac.uk/v4/authorships/{authorshipId}

              ```


              ##### Authorization


              | Parameter     | Location | Type   | Required | Description                                               |

              | ------------- | -------- | ------ | -------- | --------------------------------------------------------- |

              | Authorization | Header   | string | Yes      | CORE API authentication token supplied as a Bearer token. |


              ##### Path parameters


              | Parameter    | Type    | Required | Description                                      |

              | ------------ | ------- | -------- | ------------------------------------------------ |

              | authorshipId | integer | Yes      | Unique CORE identifier of the Authorship record. |


              ##### Query parameters


              | Parameter | Type   | Required | Description                                                                                                    |

              | --------- | ------ | -------- | -------------------------------------------------------------------------------------------------------------- |

              | select    | string | No       | Comma-separated list of top-level Authorship fields to return. Example: `select=authorshipId,workId,authorId`. |


              ##### Example request


              ```bash

              curl --request GET \
                --url "https://api.core.ac.uk/v4/authorships/987654" \
                --header "Authorization: Bearer YOUR_API_KEY"
              ```


              ##### Example response


              ```json

              {
                "authorshipId": 987654,
                "workId": 12345,
                "authorId": 67890,
                "rawName": "Smith, Alice",
                "sequence": "first",
                "rank": 1,
                "isFirstNamedAuthor": true,
                "isCorresponding": true,
                "sourceOutputIds": [
                  216874849,
                  216874850
                ],
                "createdDate": "2026-06-15T10:30:00Z",
                "updatedDate": "2026-07-01T14:20:00Z"
              }

              ```


              ##### Example request using select


              ```bash

              curl --request GET \
                --url "https://api.core.ac.uk/v4/authorships/987654?select=authorshipId,workId,authorId,rank,isCorresponding" \
                --header "Authorization: Bearer YOUR_API_KEY"
              ```


              ##### Example response using select


              ```json

              {
                "authorshipId": 987654,
                "workId": 12345,
                "authorId": 67890,
                "rank": 1,
                "isCorresponding": true
              }

              ```


              #### Retrieve Affiliations for an Authorship


              Retrieves the Affiliation records connected to an Authorship through the `Athorship_Affiliation` bridge.


              ##### API endpoint


              ```

              GET https://api.core.ac.uk/v4/authorships/{authorshipId}/affiliations

              ```


              ##### Path parameters


              | Parameter    | Type    | Required | Description                                                               |

              | ------------ | ------- | -------- | ------------------------------------------------------------------------- |

              | authorshipId | integer | Yes      | CORE identifier of the Authorship whose Affiliations should be retrieved. |


              ##### Example request


              ```bash

              curl --request GET \
                --url "https://api.core.ac.uk/v4/authorships/987654/affiliations" \
                --header "Authorization: Bearer YOUR_API_KEY"
              ```


              ##### Example response


              ```json

              {
                "totalHits": 2,
                "results": [
                  {
                    "affiliationId": 901,
                    "authorId": 67890,
                    "rawAffiliation": "Department of Computer Science, University of Oxford, UK",
                    "department": "Department of Computer Science",
                    "institutionId": 3201,
                    "institutionName": "University of Oxford"
                  },
                  {
                    "affiliationId": 902,
                    "authorId": 67890,
                    "rawAffiliation": "Oxford Internet Institute, University of Oxford, UK",
                    "department": "Oxford Internet Institute",
                    "institutionId": 3201,
                    "institutionName": "University of Oxford"
                  }
                ]
              }

              ```


              This endpoint returns Affiliation records, not `authorship_affiliation` bridge records.


              ## Responses


              ### Get a single Authorship


              | Status | Description                                                          |

              | ------ | -------------------------------------------------------------------- |

              | 200    | The Authorship record was retrieved successfully.                    |

              | 400    | The request contains an invalid parameter or unsupported field name. |

              | 401    | Authentication credentials are missing or invalid.                   |

              | 404    | No Authorship record was found for the supplied identifier.          |

              | 429    | The API request limit has been exceeded.                             |

              | 500    | An unexpected server error occurred.                                 |


              ### Search Authorships


              | Status | Description                                                                                                   |

              | ------ | ------------------------------------------------------------------------------------------------------------- |

              | 200    | The Authorship search was completed successfully.                                                             |

              | 400    | The request contains an invalid query, unsupported field, invalid facet, or invalid result-control parameter. |

              | 401    | Authentication credentials are missing or invalid.                                                            |

              | 413    | The POST request body exceeds the permitted size.                                                             |

              | 429    | The API request limit has been exceeded.                                                                      |

              | 500    | An unexpected server error occurred.                                                                          |
          - id: authorships-api-search-authorships
            title: Search Authorships
            descriptionAbout: >
              Searches, filters, orders, facets, counts, and paginates
              Authorship records.


              Authorship search is available through GET and POST:


              - `GET https://api.core.ac.uk/v4/search/authorships`

              - `POST https://api.core.ac.uk/v4/search/authorships`


              Both methods use the same CORE query language and return the same response structure.


              ## GET and POST search parameters


              ### GET query parameters


              | Parameter | Type | Required | Default | Description |

              | --- | --- | --- | --- | --- |

              | q | string | No | * | CORE query expression supporting free-text search, field lookup, Boolean operators, grouping, range queries, and existence queries. |

              | orderby | string | No | Relevance for textual queries | Comma-separated ordering directives in `field:direction` format. |

              | select | string | No | All retrievable fields | Comma-separated list of fields to include in each result. |

              | facets | string | No | — | Comma-separated list of facetable fields for which value buckets and counts should be returned. |

              | count | boolean | No | false | Indicates whether the total number of matching Authorship records should be included. |

              | limit | integer | No | 10 | Maximum number of Authorship records to return. |

              | offset | integer | No | 0 | Number of matching Authorship records to skip. |


              ### POST request body


              | Property | Type | Required | Default | Description |

              | --- | --- | --- | --- | --- |

              | q | string | No | * | CORE query expression supporting free-text search, field lookup, Boolean operators, grouping, range queries, and existence queries. |

              | orderby | string[] | No | Relevance for textual queries | Ordered list of sorting directives in `field:direction` format. |

              | select | string[] | No | All retrievable fields | List of fields to include in each result. |

              | facets | string[] | No | — | List of facetable fields for which value buckets and counts should be returned. |

              | count | boolean | No | false | Indicates whether the total number of matching Authorship records should be included. |

              | limit | integer | No | 10 | Maximum number of Authorship records to return. |

              | offset | integer | No | 0 | Number of matching Authorship records to skip. |


              ### GET and POST parameter mapping


              | GET query parameter | POST body property |

              | --- | --- |

              | `q=workId:12345` | `"q": "workId:12345"` |

              | `orderby=rank:asc` | `"orderby": ["rank:asc"]` |

              | `select=authorshipId,authorId,rank` | `"select": ["authorshipId", "authorId", "rank"]` |

              | `facets=sequence,isCorresponding` | `"facets": ["sequence", "isCorresponding"]` |

              | `count=true` | `"count": true` |

              | `limit=10` | `"limit": 10` |

              | `offset=0` | `"offset": 0` |
          - id: authorships-api-search-examples
            title: Search examples
            descriptionAbout: >-
              #### Search by raw Author name


              The `rawName` property is the principal searchable field in the Authorship entity.


              GET


              ```bash

              curl --request GET \
                --url 'https://api.core.ac.uk/v4/search/authorships?q=rawName:"Smith"' \
                --header "Authorization: Bearer YOUR_API_KEY"
              ```


              A broader free-text query may also be used:


              ```bash

              curl --request GET \
                --url "https://api.core.ac.uk/v4/search/authorships?q=Smith" \
                --header "Authorization: Bearer YOUR_API_KEY"
              ```


              Equivalent POST


              ```bash

              curl --request POST \
                --url "https://api.core.ac.uk/v4/search/authorships" \
                --header "Authorization: Bearer YOUR_API_KEY" \
                --header "Content-Type: application/json" \
                --data '{
                  "q": "rawName:\"Smith\""
                }'
              ```


              Because `rawName` is the principal searchable Authorship field, a broad textual query will primarily search source-provided Author names.


              When a textual query is supplied and `orderby` is omitted, matching results are ordered by relevance.


              #### Retrieve Authorships for a Work


              GET


              ```bash

              curl --request GET \
                --url "https://api.core.ac.uk/v4/search/authorships?q=workId:12345&orderby=rank:asc" \
                --header "Authorization: Bearer YOUR_API_KEY"
              ```


              Equivalent POST


              ```bash

              curl --request POST \
                --url "https://api.core.ac.uk/v4/search/authorships" \
                --header "Authorization: Bearer YOUR_API_KEY" \
                --header "Content-Type: application/json" \
                --data '{
                  "q": "workId:12345",
                  "orderby": [
                    "rank:asc"
                  ]
                }'
              ```


              This retrieves Authorship records associated with Work 12345, ordered by Author rank.


              It is also functionally equivalent to:


              ```

              GET /v4/works/12345/authorships

              ```


              #### Retrieve Authorships for an Author


              GET


              ```bash

              curl --request GET \
                --url "https://api.core.ac.uk/v4/search/authorships?q=authorId:67890" \
                --header "Authorization: Bearer YOUR_API_KEY"
              ```


              Equivalent POST


              ```bash

              curl --request POST \
                --url "https://api.core.ac.uk/v4/search/authorships" \
                --header "Authorization: Bearer YOUR_API_KEY" \
                --header "Content-Type: application/json" \
                --data '{
                  "q": "authorId:67890"
                }'
              ```


              This retrieves Authorship records associated with Author 67890.


              When the Author entity and relationship endpoint are available, it is also functionally equivalent to:


              ```

              GET /v4/authors/67890/authorships

              ```


              #### Retrieve corresponding Authorships for a Work


              GET


              ```bash

              curl --request GET \
                --url "https://api.core.ac.uk/v4/search/authorships?q=workId:12345%20AND%20isCorresponding:true" \
                --header "Authorization: Bearer YOUR_API_KEY"
              ```


              Readable form:


              ```

              GET /v4/search/authorships?q=workId:12345 AND isCorresponding:true

              ```


              Equivalent POST


              ```bash

              curl --request POST \
                --url "https://api.core.ac.uk/v4/search/authorships" \
                --header "Authorization: Bearer YOUR_API_KEY" \
                --header "Content-Type: application/json" \
                --data '{
                  "q": "workId:12345 AND isCorresponding:true",
                  "orderby": [
                    "rank:asc"
                  ]
                }'
              ```


              A Work may have more than one corresponding Author, so the response may contain multiple Authorship records.


              #### Retrieve first or last Authorships


              GET


              ```bash

              curl --request GET \
                --url "https://api.core.ac.uk/v4/search/authorships?q=(sequence:first%20OR%20sequence:last)" \
                --header "Authorization: Bearer YOUR_API_KEY"
              ```


              Readable form:


              ```

              GET /v4/search/authorships?q=(sequence:first OR sequence:last)

              ```


              Equivalent POST


              ```json

              {
                "q": "(sequence:first OR sequence:last)"
              }

              ```


              This returns Authorship records where `sequence` is either `first` or `last`.


              #### Combined search, selection, and ordering


              The following request:


              * searches for Smith in `rawName`;

              * restricts results to Work 12345;

              * orders matching records by rank;

              * returns only selected fields;

              * includes the total result count;

              * returns a maximum of ten records.


              GET


              ```bash

              curl --request GET \
                --url 'https://api.core.ac.uk/v4/search/authorships?q=rawName:"Smith"%20AND%20workId:12345&orderby=rank:asc&select=authorshipId,authorId,rawName,rank,isCorresponding&count=true&limit=10&offset=0' \
                --header "Authorization: Bearer YOUR_API_KEY"
              ```


              Readable form:


              ```

              GET /v4/search/authorships
                  ?q=rawName:"Smith" AND workId:12345
                  &orderby=rank:asc
                  &select=authorshipId,authorId,rawName,rank,isCorresponding
                  &count=true
                  &limit=10
                  &offset=0
              ```


              Equivalent POST


              ```bash

              curl --request POST \
                --url "https://api.core.ac.uk/v4/search/authorships" \
                --header "Authorization: Bearer YOUR_API_KEY" \
                --header "Content-Type: application/json" \
                --data '{
                  "q": "rawName:\"Smith\" AND workId:12345",
                  "orderby": [
                    "rank:asc"
                  ],
                  "select": [
                    "authorshipId",
                    "authorId",
                    "rawName",
                    "rank",
                    "isCorresponding"
                  ],
                  "count": true,
                  "limit": 10,
                  "offset": 0
                }'
              ```


              E﻿xample search response


              ```json

              {
                "totalHits": 2,
                "results": [
                  {
                    "authorshipId": 987654,
                    "authorId": 67890,
                    "rawName": "Smith, Alice",
                    "rank": 1,
                    "isCorresponding": true
                  },
                  {
                    "authorshipId": 987655,
                    "authorId": 67891,
                    "rawName": "Smith, Robert",
                    "rank": 2,
                    "isCorresponding": false
                  }
                ]
              }

              ```


              ### Ordering Authorship results


              #### Order by Author rank


              G﻿ET


              ```

              GET /v4/search/authorships?q=workId:12345&orderby=rank:asc

              ```


              E﻿quivalent POST


              ```bash

              curl --request POST \
                --url "https://api.core.ac.uk/v4/search/authorships" \
                --header "Authorization: Bearer YOUR_API_KEY" \
                --header "Content-Type: application/json" \
                --data '{
                  "q": "rawName:\"Smith\" AND workId:12345",
                  "orderby": [
                    "rank:asc"
                  ],
                  "select": [
                    "authorshipId",
                    "authorId",
                    "rawName",
                    "rank",
                    "isCorresponding"
                  ],
                  "count": true,
                  "limit": 10,
                  "offset": 0
                }'
              ```


              #### Order by multiple fields


              G﻿ET


              ```

              GET /v4/search/authorships?orderby=workId:asc,rank:asc

              ```


              POST representation:


              ```json

              {
                "orderby": [
                  "workId:asc",
                  "rank:asc"
                ]
              }

              ```


              Results are first ordered by `workId`. Authorship records associated with the same Work are then ordered by rank.


              #### Order by update date


              ```

              GET /v4/search/authorships?orderby=updatedDate:desc

              ```


              POST representation:


              ```json

              {
                "orderby": [
                  "updatedDate:desc"
                ]
              }

              ```


              This returns the most recently updated Authorship records first.


              ### F﻿acets


              The `facets` option returns value buckets and counts for fields configured as facetable.


              GET


              ```bash

              curl --request GET \
                --url "https://api.core.ac.uk/v4/search/authorships?q=workId:12345&facets=sequence,isCorresponding&count=true&limit=0" \
                --header "Authorization: Bearer YOUR_API_KEY"
              ```


              Equivalent POST


              ```bash

              curl --request POST \
                --url "https://api.core.ac.uk/v4/search/authorships" \
                --header "Authorization: Bearer YOUR_API_KEY" \
                --header "Content-Type: application/json" \
                --data '{
                  "q": "workId:12345",
                  "facets": [
                    "sequence",
                    "isCorresponding"
                  ],
                  "count": true,
                  "limit": 0
                }'
              ```


              E﻿xample facet response


              ```json

              {
                "totalHits": 4,
                "facets": {
                  "sequence": [
                    {
                      "value": "first",
                      "count": 1
                    },
                    {
                      "value": "additional",
                      "count": 2
                    },
                    {
                      "value": "last",
                      "count": 1
                    }
                  ],
                  "isCorresponding": [
                    {
                      "value": true,
                      "count": 1
                    },
                    {
                      "value": false,
                      "count": 3
                    }
                  ]
                },
                "results": []
              }

              ```


              Facet counts describe the complete matching result set, not only the records returned in the current page.


              Setting the `limit` to `0` returns facet buckets and counts without returning Authorship records.


              A separate endpoint such as the following is not required:


              ```

              POST /v4/search/authorships/aggregate

              ```


              ### R﻿esult count


              Set `count=true` to include the total number of matching Authorship records.


              GET


              ```

              GET /v4/search/authorships?q=authorId:67890&count=true

              ```


              Equivalent POST


              ```json

              {
                "q": "authorId:67890",
                "count": true
              }

              ```


              When `count` is omitted or set to `false`, `totalHits` may be omitted from the response.




              ### P﻿agination


              Use `limit` and `offset` to paginate through Authorship results.


              A deterministic `orderby` expression should be used when retrieving multiple pages.


              First page using GET:


              ```

              GET /v4/search/authorships?q=authorId:67890&orderby=workId:asc&limit=20&offset=0

              ```


              Second page using GET:


              ```

              GET /v4/search/authorships?q=authorId:67890&orderby=workId:asc&limit=20&offset=20

              ```


              First page using POST:


              ```json

              {
                "q": "authorId:67890",
                "orderby": [
                  "workId:asc"
                ],
                "limit": 20,
                "offset": 0
              }

              ```


              Second page using POST:


              ```json

              {
                "q": "authorId:67890",
                "orderby": [
                  "workId:asc"
                ],
                "limit": 20,
                "offset": 20
              }

              ```


              The offset is calculated as:


              ```

              offset = page size × number of previous pages

              ```
          - id: authorships-api-relationship-endpoints
            title: Relationship-oriented endpoints
            descriptionAbout: >
              Relationship-oriented endpoints provide convenient access to
              Authorship records through related graph entities.


              They do not introduce a different Authorship representation. Internally, they apply the appropriate relationship condition to the Authorship collection.


              ## Authorships for a Work


              ```

              GET /v4/works/{workId}/authorships

              ```


              Retrieves the Authorship records associated with a Work.


              By default, records should be ordered by:


              ```

              rank:asc

              ```


              Equivalent GET search:


              ```

              GET /v4/search/authorships?q=workId:{workId}&orderby=rank:asc

              ```


              Equivalent POST search:


              ```json

              {
                "q": "workId:{workId}",
                "orderby": [
                  "rank:asc"
                ]
              }

              ```


              This relationship endpoint is documented under the Works entity.


              ## Authorships for an Author


              ```

              GET /v4/authors/{authorId}/authorships

              ```


              Retrieves all Authorship records associated with an Author.


              Equivalent GET search:


              ```

              GET /v4/search/authorships?q=authorId:{authorId}

              ```


              Equivalent POST search:


              ```json

              {
                "q": "authorId:{authorId}"
              }

              ```


              ## Affiliations for an Authorship


              ```

              GET /v4/authorships/{authorshipId}/affiliations

              ```


              This relationship is resolved through `authorship_affiliation`.


              ## Authorships for an Affiliation


              ```

              GET /v4/affiliations/{affiliationId}/authorships

              ```


              This relationship is also resolved through `authorship_affiliation`.
      - item: Affiliations
        sections:
          - divider: false
            border: false
            id: affiliations-api-introduction
            title: Introduction
            descriptionAbout: >-
              The Affiliation entity represents the relationship between an
              Author and an Institution over time. Each Affiliation record
              connects one Author to one Institution and may include temporal
              information such as the start date, end date, and whether the
              affiliation is current.


              An Affiliation may be obtained directly from an authoritative source such as ORCID or derived by CORE from affiliation metadata associated with scholarly Works.


              Unlike Authorship, which describes how an Author appears on one specific Work, Affiliation represents a potentially longer-term relationship between an Author and an Institution.


              Affiliations used on individual Works are connected to Authorship records through the Authorship_Affiliation bridge entity.


              The diagram below represents the relationships between Authors, Affiliations, and Institutions.


              ![](/images/docs-graph/affiliations.png)




              An Author may have multiple Affiliation records over time. An Institution may be associated with multiple Authors.


              Each Affiliation record:


              * links exactly one Author;

              * may link to zero or one resolved Institution;

              * may be connected to multiple Authorship records through `Authorship_Affiliation`;

              * may contain one or more Works that provide evidence for the relationship.
          - divider: false
            border: false
            id: affiliations-api-data-structure
            title: Data structure
            descriptionAbout: >-
              The table below describes the top-level fields in the CORE Graph
              metadata schema for the Affiliation entity, including their types,
              example values, descriptions, and sources.


              | **Property**     | **Type**   | **Example value**                                                  | **Description**                                                                                                                                                                                                                                                                                      | **Source**                                    |

              | ---------------- | ---------- | ------------------------------------------------------------------ | ---------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- | --------------------------------------------- |

              | affiliationId    | integer    | `901`                                                              | Unique CORE identifier for the Affiliation record.                                                                                                                                                                                                                                                   | CORE                                          |

              | authorId         | integer    | `67890`                                                            | CORE identifier of the Author associated with the Affiliation.                                                                                                                                                                                                                                       | CORE                                          |

              | rawAffiliation   | string     | `"Department of Computer Science, University of Oxford, UK"`       | Verbatim affiliation string supplied in the source metadata.                                                                                                                                                                                                                                         | OAI-PMH / Crossref / OpenAlex / OpenAIRE      |

              | department       | string     | `"Department of Computer Science"`                                 | Department, faculty, school, laboratory, or other organisational subunit associated with the Affiliation.                                                                                                                                                                                            | ORCID / Crossref / OpenAIRE / Derived by CORE |

              | institutionId    | integer    | `3201`                                                             | CORE identifier of the associated Institution, when the Institution has been resolved.                                                                                                                                                                                                               | CORE                                          |

              | institutionName  | string     | `"University of Oxford"`                                           | Name of the affiliated Institution as supplied by the source or derived during institution resolution.                                                                                                                                                                                               | ORCID / Crossref / OpenAlex / OpenAIRE / CORE |

              | isCurrent        | boolean    | `true`                                                             | Indicates whether the Affiliation is identified as current. `true`: explicitly identified or confidently derived as current. `false`: explicitly identified or confidently derived as no longer current. `null`: available metadata is insufficient to determine whether the Affiliation is current. | ORCID / Derived by CORE                       |

              | startDate        | string     | `"2021-01-01"`                                                     | Start date of the Affiliation, when available. Follows ISO 8601 standards.                                                                                                                                                                                                                           | ORCID                                         |

              | endDate          | string     | `"2023-12-31"`                                                     | End date of the Affiliation, when available. A current Affiliation may have a null end date. Follows ISO 8601 standards.                                                                                                                                                                             | ORCID                                         |

              | evidenceWorkIds* | integer\[] | `[1234, 428765]`                                                   | CORE Work identifiers that provide evidence for the relationship between the Author and Institution.                                                                                                                                                                                                 | CORE                                          |

              | externalIds      | object\[]  | `[{"type": "orcid-put-code", "value": "123456"}]`                  | External identifiers associated with the Affiliation record or its source representation. Each entry identifies the identifier type and value.                                                                                                                                                       | ORCID / Other source systems                  |

              | address          | object     | `{"city": "Oxford", "region": "Oxfordshire", "countryCode": "GB"}` | Source-provided location information for the organisation associated with the Affiliation. Contains the city or locality; region, state, province, or other country subdivision; and the ISO 3166-1 alpha-2 country code associated with the Affiliation.                                            | ORCID                                         |

              | url              | string     | `"https://www.cs.ox.ac.uk/"`                                       | URL supplied by the source for the Affiliation, department, or associated organisation.                                                                                                                                                                                                              | ORCID                                         |

              | createdDate      | string     | `"2026-06-15T10:30:00Z"`                                           | Date and time when the Affiliation record was created in CORE.                                                                                                                                                                                                                                       | CORE                                          |

              | updatedDate      | string     | `"2026-07-01T14:20:00Z"`                                           | Date and time when the Affiliation record was last updated in CORE.                                                                                                                                                                                                                                  | CORE                                          |


              \*More information is available in the following sections.


              #### Evidence Works


              The evidenceWorkIds property identifies Works whose metadata supports the Author–Institution relationship.


              ```

              {
                "evidenceWorkIds": [
                  1234,
                  428765
                ]
              }

              ```


              \

              This implies that those Works contain evidence associating the Author with the Institution.


              Evidence Works may be used to:


              * trace the source of a derived Affiliation;

              * validate institution resolution;

              * identify when an Affiliation appeared in publication metadata;

              * support temporal inference.

              *


              #### Evidence Works and the Authorship bridge


              The `evidenceWorkIds` property and the `Authorship_Affiliation` bridge serve related but different purposes.


              | Mechanism              | Purpose                                                                        |

              | ---------------------- | ------------------------------------------------------------------------------ |

              | evidenceWorkIds        | Provides an aggregated list of Works whose metadata supports the Affiliation.  |

              | authorship_affiliation | Connects the Affiliation to the exact Authorship records on which it was used. |


              For example:


              ```

              {
                "affiliationId": 901,
                "evidenceWorkIds": [
                  1234,
                  428765
                ]
              }

              ```


              \

              The corresponding bridge records may be:


              ```

              [
                {
                  "authorshipId": 987654,
                  "affiliationId": 901
                },
                {
                  "authorshipId": 987700,
                  "affiliationId": 901
                }
              ]

              ```


              The bridge records provide the exact Work-specific Author relationships. The `evidenceWorkIds` field provides convenient Work-level provenance.


              #### Raw Affiliation and structured fields


              The rawAffiliation property preserves the original source text:


              ```

              {
                "rawAffiliation": "Dept of CS, Univ Oxford, Oxford, UK"
              }

              ```


              Structured fields may be extracted or resolved from that value:


              ```

              {
                "department": "Department of Computer Science",
                "institutionId": 3201,
                "institutionName": "University of Oxford",
                "address": {
                  "city": "Oxford",
                  "countryCode": "GB"
                }
              }

              ```


              The raw value is retained even when structured extraction succeeds, because it preserves provenance and allows future reprocessing.


              E﻿xample Affiliations record:


              ```

              {
                "affiliationId": 901,
                "authorId": 67890,
                "rawAffiliation": "Department of Computer Science, University of Oxford, UK",
                "department": "Department of Computer Science",
                "institutionId": 3201,
                "institutionName": "University of Oxford",
                "isCurrent": false,
                "startDate": "2018-01-01",
                "endDate": "2021-12-31",
                "evidenceWorkIds": [
                  1234,
                  428765
                ],
                "externalIds": [
                  {
                    "type": "orcid-put-code",
                    "value": "123456"
                  }
                ],
                "address": {
                  "city": "Oxford",
                  "region": "Oxfordshire",
                  "countryCode": "GB"
                },
                "url": "https://www.cs.ox.ac.uk/",
                "createdDate": "2026-06-15T10:30:00Z",
                "updatedDate": "2026-07-01T14:20:00Z"
              }

              ```


              #### Authorship–Affiliation relationship


              Affiliations used by an Author on a particular Work are connected to Authorship records through the Authorship_Affiliation bridge entity.


              | Property      | Type    | Example value | Description                                                           | Source |

              | ------------- | ------- | ------------- | --------------------------------------------------------------------- | ------ |

              | authorshipId  | integer | `987654`      | CORE identifier of the Authorship participating in the relationship.  | CORE   |

              | affiliationId | integer | `901`         | CORE identifier of the Affiliation participating in the relationship. | CORE   |




              Example bridge records:


              ```

              [
                {
                  "authorshipId": 987654,
                  "affiliationId": 901
                },
                {
                  "authorshipId": 987654,
                  "affiliationId": 902
                }
              ]

              ```




              These records indicate that Authorship 987654 is linked to Affiliations 901 and 902.


              The bridge is used because:


              * one Authorship may be linked to multiple Affiliations;

              * one Affiliation may be linked to multiple Authorship records representing different Works;

              * Authorship contains only Work-specific Author information;

              * Affiliation remains an independently addressable and reusable entity.
          - divider: false
            border: false
            id: affiliations-api-supported-field-operations
            title: Supported field operations
            descriptionAbout: >-
              The table below describes which Affiliation properties can be
              searched, filtered, ordered, or used as facets.




              | **Attribute**   | **Searchable** | **Filterable** | **Sortable** | **Facetable** |

              | --------------- | -------------- | -------------- | ------------ | ------------- |

              | affiliationId   | No             | Yes            | No           | No            |

              | authorId        | No             | Yes            | Yes          | No            |

              | rawAffiliation  | Yes            | No             | No           | No            |

              | department      | Yes            | Yes            | No           | Yes           |

              | institutionId   | No             | Yes            | Yes          | Yes           |

              | institutionName | Yes            | No             | No           | No            |

              | isCurrent       | No             | Yes            | No           | Yes           |

              | startDate       | No             | Yes            | Yes          | No            |

              | endDate         | No             | Yes            | Yes          | No            |

              | evidenceWorkIds | No             | Yes            | No           | No            |

              | externalIds     | No             | No             | No           | No            |

              | address         | No             | No             | No           | No            |

              | url             | No             | No             | No           | No            |

              | createdDate     | No             | Yes            | Yes          | No            |

              | updatedDate     | No             | Yes            | Yes          | No            |
          - divider: false
            border: false
            id: affiliations-api-affiliations-endpoints
            title: Affiliations endpoints
            descriptionAbout: >-
              #### Available endpoints


              | Operation                                     | Method | Endpoint                                       |

              | --------------------------------------------- | ------ | ---------------------------------------------- |

              | Get a single Affiliation                      | GET    | `/v4/affiliations/{affiliationId}`             |

              | Search Affiliations using URL parameters      | GET    | `/v4/search/affiliations`                      |

              | Search Affiliations using a JSON request body | POST   | `/v4/search/affiliations`                      |

              | Retrieve Authorships for an Affiliation       | GET    | `/v4/affiliations/{affiliationId}/authorships` |


              Affiliation records may also be retrieved through relationship-oriented endpoints:


              ```

              GET /v4/authorships/{authorshipId}/affiliations

              GET /v4/authors/{authorId}/affiliations

              GET /v4/institutions/{institutionId}/affiliations

              ```


              More details about these endpoints are documented under the Authorships, Authors and Institutions entities.


              #### Get a single Affiliation


              Retrieves a single Affiliation record using its unique CORE Affiliation identifier.


              ##### API endpoint


              ```

              GET https://api.core.ac.uk/v4/affiliations/{affiliationId}

              ```


              ##### **Authorization**


              | **Parameter** | **Location** | **Type** | **Required** | **Description**                                           |

              | ------------- | ------------ | -------- | ------------ | --------------------------------------------------------- |

              | Authorization | Header       | string   | Yes          | CORE API authentication token supplied as a Bearer token. |


              ##### Path parameters


              | **Parameter** | **Type** | **Required** | **Description**                                   |

              | ------------- | -------- | ------------ | ------------------------------------------------- |

              | affiliationId | integer  | Yes          | Unique CORE identifier of the Affiliation record. |


              ##### Query parameters


              | Parameter | Type   | Required | Description                                                                                                                                                                     |

              | --------- | ------ | -------- | ------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- |

              | select    | string | No       | Comma-separated list of top-level Affiliation fields to return. This can be used to reduce the response size. Example: `select=affiliationId,authorId,institutionId,isCurrent`. |


              E﻿xample request:


              ```

              curl --request GET \
                --url "https://api.core.ac.uk/v4/affiliations/901" \
                --header "Authorization: Bearer YOUR_API_KEY"
              ```


              E﻿xample response:


              ```

              {
                "affiliationId": 901,
                "authorId": 67890,
                "rawAffiliation": "Department of Computer Science, University of Oxford, UK",
                "department": "Department of Computer Science",
                "institutionId": 3201,
                "institutionName": "University of Oxford",
                "isCurrent": false,
                "startDate": "2018-01-01",
                "endDate": "2021-12-31",
                "evidenceWorkIds": [
                  1234,
                  428765
                ],
                "externalIds": [
                  {
                    "type": "orcid-put-code",
                    "value": "123456"
                  }
                ],
                "address": {
                  "city": "Oxford",
                  "region": "Oxfordshire",
                  "countryCode": "GB"
                },
                "url": "https://www.cs.ox.ac.uk/",
                "createdDate": "2026-06-15T10:30:00Z",
                "updatedDate": "2026-07-01T14:20:00Z"
              }

              ```


              Example request using `select`:


              ```

              curl --request GET \
                --url "https://api.core.ac.uk/v4/affiliations/901?select=affiliationId,authorId,institutionId,institutionName,isCurrent" \
                --header "Authorization: Bearer YOUR_API_KEY"
              ```


              Example response:


              ```

              {
                "affiliationId": 901,
                "authorId": 67890,
                "institutionId": 3201,
                "institutionName": "University of Oxford",
                "isCurrent": false
              }

              ```


              #### R﻿esponses


              | **Status** | **Description**                                                      |

              | ---------- | -------------------------------------------------------------------- |

              | 200        | The Affiliation record was retrieved successfully.                   |

              | 400        | The request contains an invalid parameter or unsupported field name. |

              | 401        | Authentication credentials are missing or invalid.                   |

              | 404        | No Affiliation record was found for the supplied identifier.         |

              | 429        | The API request limit has been exceeded.                             |

              | 500        | An unexpected server error occurred.                                 |
          - divider: false
            border: false
            id: affiliations-api-search-affiliations
            title: Search Affiliations
            descriptionAbout: >+
              Searches, filters, orders, facets, counts, and paginates
              Affiliation records.


              Affiliation search is available through GET and POST:


              ```

              GET https://api.core.ac.uk/v4/search/affiliations

              POST https://api.core.ac.uk/v4/search/affiliations

              ```


              Both methods use the same CORE query language and return the same response structure.


              #### GET and POST search parameters


              ##### GET query parameters


              | **Parameter** | **Type** | **Required** | **Default**                   | **Description**                                                                                                                     |

              | ------------- | -------- | ------------ | ----------------------------- | ----------------------------------------------------------------------------------------------------------------------------------- |

              | q             | string   | No           | `*`                           | CORE query expression supporting free-text search, field lookup, Boolean operators, grouping, range queries, and existence queries. |

              | orderby       | string   | No           | Relevance for textual queries | Comma-separated ordering directives in `field:direction` format.                                                                    |

              | select        | string   | No           | All retrievable fields        | Comma-separated list of fields to include in each result.                                                                           |

              | facets        | string   | No           | —                             | Comma-separated list of facetable fields for which value buckets and counts should be returned.                                     |

              | count         | boolean  | No           | `false`                       | Indicates whether the total number of matching Affiliation records should be included.                                              |

              | limit         | integer  | No           | `10`                          | Maximum number of Affiliation records to return.                                                                                    |

              | offset        | integer  | No           | `0`                           | Number of matching Affiliation records to skip.                                                                                     |


              POST request body


              | **Property** | **Type**  | **Required** | **Default**                   | **Description**                                                                                                                     |

              | ------------ | --------- | ------------ | ----------------------------- | ----------------------------------------------------------------------------------------------------------------------------------- |

              | q            | string    | No           | `*`                           | CORE query expression supporting free-text search, field lookup, Boolean operators, grouping, range queries, and existence queries. |

              | orderby      | string\[] | No           | Relevance for textual queries | Ordered list of sorting directives in `field:direction` format.                                                                     |

              | select       | string\[] | No           | All retrievable fields        | List of fields to include in each result.                                                                                           |

              | facets       | string\[] | No           | —                             | List of facetable fields for which value buckets and counts should be returned.                                                     |

              | count        | boolean   | No           | `false`                       | Indicates whether the total number of matching Affiliation records should be included.                                              |

              | limit        | integer   | No           | `10`                          | Maximum number of Affiliation records to return.                                                                                    |

              | offset       | integer   | No           | `0`                           | Number of matching Affiliation records to skip.                                                                                     |




              ##### GET and POST parameter mapping




              | **GET query parameter**                        | **POST body property**                                      |

              | ---------------------------------------------- | ----------------------------------------------------------- |

              | `q=authorId:67890`                             | `"q": "authorId:67890"`                                     |

              | `orderby=startDate:asc`                        | `"orderby": ["startDate:asc"]`                              |

              | `select=affiliationId,institutionId,isCurrent` | `"select": ["affiliationId", "institutionId", "isCurrent"]` |

              | `facets=isCurrent,institutionId`               | `"facets": ["isCurrent", "institutionId"]`                  |

              | `count=true`                                   | `"count": true`                                             |

              | `limit=10`                                     | `"limit": 10`                                               |

              | `offset=0`                                     | `"offset": 0`                                               |


          - divider: false
            border: false
            id: affiliations-api-search-examples
            title: Search examples
            descriptionAbout: >-
              #### Search by raw Affiliation


              GET


              The rawAffiliation property is searchable using a field lookup:


              ```

              curl --request GET \
                --url 'https://api.core.ac.uk/v4/search/affiliations?q=rawAffiliation:"Department%20of%20Computer%20Science%20Oxford"' \
                --header "Authorization: Bearer YOUR_API_KEY"
              ```


              Readable form:


              ```

              GET /v4/search/affiliations?q=rawAffiliation:"Department of Computer Science Oxford"

              ```


              A broader free-text query may also be used:


              ```

              curl --request GET \
                --url "https://api.core.ac.uk/v4/search/affiliations?q=University%20of%20Oxford" \
                --header "Authorization: Bearer YOUR_API_KEY"
              ```


              This searches across all searchable Affiliation fields, including `rawAffiliation`, `department`, and `institutionName`.


              Equivalent POST


              ```

              curl --request POST \
                --url "https://api.core.ac.uk/v4/search/affiliations" \
                --header "Authorization: Bearer YOUR_API_KEY" \
                --header "Content-Type: application/json" \
                --data '{
                  "q": "rawAffiliation:\"Department of Computer Science Oxford\""
                }'
              ```


              A broad textual query searches all searchable Affiliation fields, including:


              * `rawAffiliation`;

              * `department`;

              * `institutionName`.


              When a textual query is supplied and orderby is omitted, results are ordered by relevance.


              #### Search by Institution name


              **GET**


              ```

              curl --request GET \ --url 'https://api.core.ac.uk/v4/search/affiliations?q=institutionName:"University%20of%20Oxford"' \ --header "Authorization: Bearer YOUR_API_KEY"

              ```


              Readable form:


              ```

              GET /v4/search/affiliations?q=institutionName:"University of Oxford"

              ```


              \

              This performs keyword search against the source-provided or resolved Institution name.


              Equivalent POST


              ```

              {
                "q": "institutionName:\"University of Oxford\""
              }

              ```


              When a canonical Institution identifier is already known, an exact institutionId lookup is preferred.


              #### Retrieve Affiliations for an Author


              GET


              ```

              curl --request GET \
                --url "https://api.core.ac.uk/v4/search/affiliations?q=authorId:67890&orderby=startDate:asc" \
                --header "Authorization: Bearer YOUR_API_KEY"
              ```


              This retrieves the known Affiliation history for Author 67890, ordered by start date.


              Equivalent POST


              ```

              {
                "q": "authorId:67890",
                "orderby": [
                  "startDate:asc"
                ]
              }

              ```


              This retrieves the known Affiliation history associated with Author 67890.


              This request is also functionally equivalent to:


              ```

              GET /v4/authors/67890/affiliations

              ```


              #### Retrieve current Affiliations for an Author


              GET


              ```

              curl --request GET \
                --url "https://api.core.ac.uk/v4/search/affiliations?q=authorId:67890%20AND%20isCurrent:true" \
                --header "Authorization: Bearer YOUR_API_KEY"
              ```


              \

              Readable form:


              ```

              GET /v4/search/affiliations?q=authorId:67890 AND isCurrent:true

              ```


              Equivalent POST:


              ```

              {
                "q": "authorId:67890 AND isCurrent:true"
              }

              ```


              An Author may have more than one current Affiliation.


              #### Retrieve previous Affiliations for an Author


              GET


              ```

              curl --request GET \ --url "https://api.core.ac.uk/v4/search/affiliations?q=authorId:67890%20AND%20isCurrent:false&orderby=endDate:desc" \ --header "Authorization: Bearer YOUR_API_KEY"

              ```


              Readable form:


              ```

              GET /v4/search/affiliations?q=authorId:67890 AND isCurrent:false&orderby=endDate:desc

              ```


              Equivalent POST:


              ```

              {
                "q": "authorId:67890 AND isCurrent:false",
                "orderby": [
                  "endDate:desc"
                ]
              }

              ```


              This returns Affiliation records explicitly identified as no longer current, ordered by the most recent end date.


              Records where `isCurrent` is null are not included because their current status is unknown.


              #### Retrieve Affiliations for an Institution


              GET


              ```

              curl --request GET \
                --url "https://api.core.ac.uk/v4/search/affiliations?q=institutionId:3201" \
                --header "Authorization: Bearer YOUR_API_KEY"
              ```


              Equivalent POST


              ```

              {
                "q": "institutionId:3201"
              }

              ```


              This is functionally equivalent to:


              ```

              GET /v4/institutions/3201/affiliations

              ```


              Depending on the Institution, this query may return a large result set and should be paginated.


              #### Retrieve current Affiliations for an Institution


              GET


              ```

              curl --request GET \
                --url "https://api.core.ac.uk/v4/search/affiliations?q=institutionId:3201%20AND%20isCurrent:true" \
                --header "Authorization: Bearer YOUR_API_KEY"
              ```


              Readable form:


              ```

              GET /v4/search/affiliations?q=institutionId:3201 AND isCurrent:true

              ```


              Equivalent POST:


              ```

              {
                "q": "institutionId:3201 AND isCurrent:true"
              }

              ```


              This returns current Author–Institution relationships associated with Institution 3201.


              #### Retrieve Affiliations supported by a Work


              GET


              ```

              curl --request GET \
                --url "https://api.core.ac.uk/v4/search/affiliations?q=evidenceWorkIds:1234" \
                --header "Authorization: Bearer YOUR_API_KEY"
              ```


              Equivalent POST:


              ```

              {
                "q": "evidenceWorkIds:1234"
              }

              ```


              This query identifies Author–Institution relationships supported by Work 1234.


              #### Retrieve Affiliations with evidence Works


              GET


              ```

              curl --request GET \
                --url "https://api.core.ac.uk/v4/search/affiliations?q=_exists_:evidenceWorkIds" \
                --header "Authorization: Bearer YOUR_API_KEY"
              ```


              Equivalent POST:


              ```

              {
                "q": "_exists_:evidenceWorkIds"
              }

              ```


              This returns Affiliation records where `evidenceWorkIds` is not empty.


              #### Retrieve resolved Affiliations


              GET


              ```

              curl --request GET \
                --url "https://api.core.ac.uk/v4/search/affiliations?q=_exists_:institutionId" \
                --header "Authorization: Bearer YOUR_API_KEY"
              ```


              Equivalent POST:


              ```

              {
                "q": "_exists_:institutionId"
              }

              ```


              This returns Affiliation records linked to a canonical CORE Institution.


              #### Filter Affiliations by date


              Affiliations that started on or after January 1, 2021:


              GET


              ```

              GET /v4/search/affiliations?q=startDate>="2021-01-01"

              ```


              Equivalent POST:


              ```

              {
                "q": "startDate>=\"2021-01-01\""
              }

              ```


              Affiliations that ended before January 1, 2024:


              GET


              ```

              GET /v4/search/affiliations?q=endDate<"2024-01-01"

              ```


              Equivalent POST:


              ```

              {
                "q": "endDate<\"2024-01-01\""
              }

              ```


              Previous Affiliations for an Author whose known date range overlaps 2018 through 2021:


              GET


              ```

              GET /v4/search/affiliations?q=authorId:67890 AND startDate<="2021-12-31" AND endDate>="2018-01-01"

              ```


              Equivalent POST:


              ```

              {
                "q": "authorId:67890 AND startDate<=\"2021-12-31\" AND endDate>=\"2018-01-01\""
              }

              ```


              #### Search using multiple conditions


              G﻿ET:


              ```

              curl --request GET \
                --url 'https://api.core.ac.uk/v4/search/affiliations?q=institutionName:"Oxford"%20AND%20authorId:67890%20AND%20isCurrent:false&orderby=endDate:desc&select=affiliationId,institutionId,institutionName,department,startDate,endDate&limit=10&offset=0' \
                --header "Authorization: Bearer YOUR_API_KEY"
              ```


              Readable form:


              ```

              GET /v4/search/affiliations
                  ?q=institutionName:"Oxford" AND authorId:67890 AND isCurrent:false
                  &orderby=endDate:desc
                  &select=affiliationId,institutionId,institutionName,department,startDate,endDate
                  &limit=10
                  &offset=0
              ```


              Equivalent POST:


              ```

              curl --request POST \
                --url "https://api.core.ac.uk/v4/search/affiliations" \
                --header "Authorization: Bearer YOUR_API_KEY" \
                --header "Content-Type: application/json" \
                --data '{
                  "q": "institutionName:\"Oxford\" AND authorId:67890 AND isCurrent:false",
                  "orderby": [
                    "endDate:desc"
                  ],
                  "select": [
                    "affiliationId",
                    "institutionId",
                    "institutionName",
                    "department",
                    "startDate",
                    "endDate"
                  ],
                  "count": true,
                  "limit": 10,
                  "offset": 0
                }'
              ```


              This request:


              * searches for Oxford in institutionName;

              * restricts results to Author 67890;

              * returns only previous Affiliations;

              * orders matching records by most recent end date;

              * returns only the selected fields;

              * returns a maximum of ten records.


              Example search response:


              ```

              {
                "totalHits": 1,
                "results": [
                  {
                    "affiliationId": 901,
                    "institutionId": 3201,
                    "institutionName": "University of Oxford",
                    "department": "Department of Computer Science",
                    "startDate": "2018-01-01",
                    "endDate": "2021-12-31"
                  }
                ]
              }

              ```


              #### R﻿esponses


              | **Status** | **Description**                                                                                                 |

              | ---------- | --------------------------------------------------------------------------------------------------------------- |

              | 200        | The Affiliation search was completed successfully.                                                              |

              | 400        | The request contains an invalid query, unsupported field, invalid facet, or invalid response-control parameter. |

              | 401        | Authentication credentials are missing or invalid.                                                              |

              | 413        | The POST request body exceeds the permitted size.                                                               |

              | 429        | The API request limit has been exceeded.                                                                        |

              | 500        | An unexpected server error occurred.                                                                            |




              #### Ordering Affiliation results


              The shared Search documentation defines the complete orderby syntax.


              ##### Order Affiliations chronologically


              ```

              GET /v4/search/affiliations?q=authorId:67890&orderby=startDate:asc

              ```


              \

              P﻿OST representation:


              ```

              {
                "q": "authorId:67890",
                "orderby": [
                  "startDate:asc"
                ]
              }

              ```


              This returns the known Affiliation history for the Author in chronological order.


              #### Order by multiple fields


              ```

              GET /v4/search/affiliations?orderby=authorId:asc,startDate:asc

              ```


              POST representation:


              ```

              {
                "orderby": [
                  "authorId:asc",
                  "startDate:asc"
                ]
              }

              ```


              \

              Results are first ordered by `authorId`. Affiliation records belonging to the same Author are then ordered by `startDate`.


              #### Order by most recently updated


              ```

              GET /v4/search/affiliations?orderby=updatedDate:desc

              ```


              POST representation:


              ```

              {
                "orderby": [
                  "updatedDate:desc"
                ]
              }

              ```


              This returns the most recently updated Affiliation records first.


              #### Return selected fields


              G﻿ET


              ```

              curl --request GET \
                --url "https://api.core.ac.uk/v4/search/affiliations?q=authorId:67890&orderby=startDate:asc&select=affiliationId,institutionId,institutionName,startDate,endDate,isCurrent" \
                --header "Authorization: Bearer YOUR_API_KEY"
              ```


              Example response:


              ```

              {
                "results": [
                  {
                    "affiliationId": 901,
                    "institutionId": 3201,
                    "institutionName": "University of Oxford",
                    "startDate": "2018-01-01",
                    "endDate": "2021-12-31",
                    "isCurrent": false
                  },
                  {
                    "affiliationId": 902,
                    "institutionId": 4501,
                    "institutionName": "Massachusetts Institute of Technology",
                    "startDate": "2022-01-01",
                    "endDate": null,
                    "isCurrent": true
                  }
                ]
              }

              ```


              #### \


              Affiliation facets


              The facets parameter returns value buckets and counts for fields configured as facetable.


              G﻿ET:


              ```

              curl --request GET \
                --url "https://api.core.ac.uk/v4/search/affiliations?q=authorId:67890&facets=isCurrent,institutionId&count=true" \
                --header "Authorization: Bearer YOUR_API_KEY"
              ```


              Equivalent POST:


              ```

              curl --request POST \
                --url "https://api.core.ac.uk/v4/search/affiliations" \
                --header "Authorization: Bearer YOUR_API_KEY" \
                --header "Content-Type: application/json" \
                --data '{
                  "q": "authorId:67890",
                  "facets": [
                    "isCurrent",
                    "institutionId"
                  ],
                  "count": true,
                  "limit": 0
                }'
              ```


              \

              Example response:


              ```

              {
                "totalHits": 3,
                "facets": {
                  "isCurrent": [
                    {
                      "value": false,
                      "count": 2
                    },
                    {
                      "value": true,
                      "count": 1
                    }
                  ],
                  "institutionId": [
                    {
                      "value": 3201,
                      "count": 1
                    },
                    {
                      "value": 4501,
                      "count": 1
                    }
                  ]
                },
                "results": [
                  {
                    "affiliationId": 901,
                    "authorId": 67890,
                    "institutionId": 3201,
                    "institutionName": "University of Oxford",
                    "isCurrent": false
                  }
                ]
              }

              ```


              \

              Faceting by `institutionId` is technically possible, but it may produce a large number of buckets across the full Affiliation index. It is most useful when combined with a narrower filter.


              To return only facet counts without Affiliation records:


              ```

              GET /v4/search/affiliations?q=authorId:67890&facets=isCurrent&count=true&limit=0

              ```


              #### Result count


              Set count=true to include the total number of matching Affiliation records.


              GET:


              ```

              GET /v4/search/affiliations?q=authorId:67890&count=true

              ```


              Equivalent POST:


              ```

              {
                "q": "authorId:67890",
                "count": true
              }

              ```


              When count is omitted or set to false, totalHits may be omitted from the response.


              #### Paginate Affiliation results


              Use `limit` and `offset` to paginate through Affiliation results.


              A deterministic orderby expression should be used when retrieving multiple pages.


              \

              First page using GET:


              ```

              GET /v4/search/affiliations?q=institutionId:3201&orderby=authorId:asc&limit=20&offset=0

              ```


              S﻿econd page using GET:


              ```

              GET /v4/search/affiliations?q=institutionId:3201&orderby=authorId:asc&limit=20&offset=20

              ```


              First page using POST:


              ```

              {
                "q": "institutionId:3201",
                "orderby": [
                  "authorId:asc"
                ],
                "limit": 20,
                "offset": 0
              }

              ```


              Second page using POST:


              ```

              {
                "q": "institutionId:3201",
                "orderby": [
                  "authorId:asc"
                ],
                "limit": 20,
                "offset": 20
              }

              ```


              A deterministic orderby expression should be used when retrieving multiple pages.


              Example Affiliation history response:


              ```

              {
                "totalHits": 2,
                "results": [
                  {
                    "affiliationId": 901,
                    "authorId": 67890,
                    "rawAffiliation": "Dept of CS, University of Oxford",
                    "department": "Department of Computer Science",
                    "institutionId": 3201,
                    "institutionName": "University of Oxford",
                    "isCurrent": false,
                    "startDate": "2018-01-01",
                    "endDate": "2021-12-31",
                    "evidenceWorkIds": [
                      1234,
                      428765
                    ],
                    "externalIds": [
                      {
                        "type": "orcid-put-code",
                        "value": "123456"
                      }
                    ],
                    "address": {
                      "city": "Oxford",
                      "countryCode": "GB"
                    },
                    "url": "https://www.cs.ox.ac.uk/",
                    "createdDate": "2026-06-15T10:30:00Z",
                    "updatedDate": "2026-07-01T14:20:00Z"
                  },
                  {
                    "affiliationId": 902,
                    "authorId": 67890,
                    "rawAffiliation": "Massachusetts Institute of Technology, Cambridge, MA, USA",
                    "department": null,
                    "institutionId": 4501,
                    "institutionName": "Massachusetts Institute of Technology",
                    "isCurrent": true,
                    "startDate": "2022-01-01",
                    "endDate": null,
                    "evidenceWorkIds": [
                      521340
                    ],
                    "externalIds": null,
                    "address": {
                      "city": "Cambridge",
                      "region": "Massachusetts",
                      "countryCode": "US"
                    },
                    "url": null,
                    "createdDate": "2026-06-15T10:30:00Z",
                    "updatedDate": "2026-07-01T14:20:00Z"
                  }
                ]
              }

              ```
          - divider: false
            border: false
            id: affiliations-api-relationship-oriented-endpoints
            title: Relationship-oriented endpoints
            descriptionAbout: >-
              #### Affiliations for an Institution


              ```

              GET /v4/institutions/{institutionId}/affiliations



              ```


              Retrieves Affiliation records linked to an Institution.


              Equivalent GET search:


              ```

              GET /v4/search/affiliations?q=institutionId:{institutionId}



              ```


              Equivalent POST search:


              ```

              {
                "q": "institutionId:{institutionId}"
              }



              ```


              This endpoint may return a large result set and should support:


              #### Authorships for an Affiliation


              ```

              GET /v4/affiliations/{affiliationId}/authorships



              ```


              Retrieves the Authorship records connected to an Affiliation through `Authorship_Affiliation`. 


              Example request:


              ```

              curl --request GET \
                --url "https://api.core.ac.uk/v4/affiliations/901/authorships?count=true&limit=10&offset=0" \
                --header "Authorization: Bearer YOUR_API_KEY"


              ```


              Example response:


              ```

              {
                "totalHits": 2,
                "results": [
                  {
                    "authorshipId": 987654,
                    "workId": 1234,
                    "authorId": 67890,
                    "rawName": "Smith, Alice",
                    "sequence": "first",
                    "rank": 1,
                    "isFirstNamedAuthor": true,
                    "isCorresponding": true
                  },
                  {
                    "authorshipId": 987700,
                    "workId": 428765,
                    "authorId": 67890,
                    "rawName": "Smith, Alice",
                    "sequence": "additional",
                    "rank": 2,
                    "isFirstNamedAuthor": false,
                    "isCorresponding": false
                  }
                ]
              }



              ```


              This endpoint returns Authorship records, not raw `Authorship_Affiliation` bridge records.


              An existing Affiliation with no linked Authorships returns 200 with an empty results array.


              #### Affiliations for an Authorship


              ```

              GET /v4/authorships/{authorshipId}/affiliations



              ```


              Retrieves Affiliation records connected to an Authorship through `Authorship_Affiliation`.


              This endpoint is documented primarily under the Authorship entity.


              #### Affiliations for an Author


              ```

              GET /v4/authors/{authorId}/affiliations



              ```


              Retrieves Affiliation records associated with an Author.
      - item: Authors
        sections:
          - divider: false
            border: false
            id: authors-api-introduction
            title: Introduction
            descriptionAbout: >-
              The Author entity represents a persistent person identity across
              scholarly Works.


              An Author record contains normalised name information, external identifiers, alternative and source-provided names, profile information, research interests, and other attributes associated with the person.


              Unlike Authorship, which represents how an Author appears on one particular Work, the Author entity represents the person across all known Works.


              The diagram below represents the relationships between Authors, Authorships, Works, Affiliations, and Institutions.
            images:
              - file: /images/docs-graph/authors.png
            subDescription: An Author may have multiple Authorship records, be credited on
              multiple Works, have multiple institutional Affiliations over time
              and have multiple external identifiers and name variants.
          - divider: false
            border: false
            id: authors-api-data-structure
            title: Data structure
            descriptionAbout: >-
              The following sections describe the top-level fields in the
              planned CORE Graph metadata schema for the Author entity.


              #### **Identifiers**


              | Property    | Type      | Example value                                | Description                                                         | Source                                 |

              | ----------- | --------- | -------------------------------------------- | ------------------------------------------------------------------- | -------------------------------------- |

              | authorId    | integer   | 67890                                        | Unique CORE internal canonical identifier for the Author entity.    | CORE                                   |

              | orcidId     | string    | `"0000-0002-1825-0097"`                      | ORCID identifier associated with the Author, when available.        | ORCID / Crossref / OpenAIRE / OpenAlex |

              | externalIds | string\[] | `["openaire____::abc123", "rioxx____::x45"]` | Source-specific Author identifiers retained in their original form. | OpenAIRE / RIOXX / Crossref / ORCID    |


              #### **Names**


              | Property    | Type      | Example value                  | Description                                                                                                                  | Source                                                               |

              | ----------- | --------- | ------------------------------ | ---------------------------------------------------------------------------------------------------------------------------- | -------------------------------------------------------------------- |

              | displayName | string    | `"Alice Smith"`                | Preferred display name selected by CORE for the Author.                                                                      | CORE / Crossref / OpenAlex / OpenAIRE / ORCID                        |

              | givenNames  | string\[] | `["Alice"]`                    | Given names or first names associated with the Author. Multiple values may be retained when sources provide different forms. | Crossref / OpenAIRE / ORCID                                          |

              | familyNames | string\[] | `["Smith"]`                    | Family names or last names associated with the Author. Multiple values may be retained when sources provide different forms. | Crossref / OpenAIRE / ORCID                                          |

              | prefixes    | string\[] | `["Dr"]`                       | Name prefixes or honorifics associated with the Author.                                                                      | Crossref / ORCID                                                     |

              | suffixes    | string\[] | `["Jr"]`                       | Name suffixes associated with the Author.                                                                                    | Crossref / ORCID                                                     |

              | altNames    | string\[] | `["Smith, Alice", "A. Smith"]` | Alternative, abbreviated, transliterated, or normalised name forms associated with the Author.                               | Dublin Core / OpenAlex / RIOXX / OpenAIRE / ORCID                    |

              | rawNames    | string\[] | `["Smith, Alice", "A. Smith"]` | Verbatim Author name strings supplied in source metadata.                                                                    | Dublin Core / Qualified Dublin Core / Crossref / OpenAIRE / OpenAlex |


              #### **Profile and career information**


              | Property    | Type      | Example value                                                                | Description                                                                                                                                           | Source          |

              | ----------- | --------- | ---------------------------------------------------------------------------- | ----------------------------------------------------------------------------------------------------------------------------------------------------- | --------------- |

              | biography   | string    | `"Researcher working in information retrieval and scholarly communication."` | Public biographical information about the Author and their research career.                                                                           | ORCID           |

              | countries   | string\[] | `["GB", "US"]`                                                               | ISO 3166-1 alpha-2 country codes derived from the Author’s known institutional Affiliations. This property does not represent nationality.            | OpenAlex / CORE |

              | careerStage | string    | `"early-career"`                                                             | Career-stage classification inferred by CORE from available evidence, such as the time between the Author’s first and most recent known publications. | CORE            |


              Recommended controlled values for careerStage may include:


              | Value        | Description                                                                           |

              | ------------ | ------------------------------------------------------------------------------------- |

              | early-career | Author whose known publication history falls within the defined early-career period.  |

              | mid-career   | Author whose known publication history falls within the defined middle-career period. |

              | experienced  | Author with a longer known publication history.                                       |

              | unknown      | Available evidence is insufficient to classify the Author.                            |


              #### **Links and research interests**


              | Property      | Type      | Example value                                       | Description                                                                                  | Source                          |

              | ------------- | --------- | --------------------------------------------------- | -------------------------------------------------------------------------------------------- | ------------------------------- |

              | authorUrl     | string    | `"https://kmi.open.ac.uk/people/member/petr-knoth"` | URL of a public website or profile associated with the Author.                               | ORCID                           |

              | authorUrlDesc | string    | `"Institutional researcher profile"`                | Source-provided description of the resource identified by `authorUrl`.                       | ORCID                           |

              | email         | string    | `"mark@example.edu"`                                | Public email address associated with the Author, when the source permits its redistribution. | ORCID / Other permitted sources |

              | keywords      | string\[] | `["Artificial Intelligence", "Machine Learning"]`   | Words or phrases describing the Author’s research activities and areas of interest.          | ORCID                           |


              #### **Dates**


              | Property    | Type   | Example value            | Description                                                              | Source |

              | ----------- | ------ | ------------------------ | ------------------------------------------------------------------------ | ------ |

              | createdDate | string | `"2026-06-15T10:30:00Z"` | Date and time when the canonical Author record was created in CORE.      | CORE   |

              | updatedDate | string | `"2026-07-01T14:20:00Z"` | Date and time when the canonical Author record was last updated in CORE. | CORE   |


              #### Example Author record


              ```

              {
                "authorId": 67890,
                "orcidId": "0000-0002-1825-0097",
                "externalIds": [
                  "openaire____::abc123",
                  "rioxx____::x45"
                ],
                "identifiers": [
                  {
                    "scheme": "ORCID",
                    "value": "0000-0002-1825-0097",
                    "preferred": true
                  },
                  {
                    "scheme": "OPENALEX",
                    "value": "https://openalex.org/A5048491430",
                    "preferred": true
                  },
                  {
                    "scheme": "OPENAIRE",
                    "value": "openaire____::abc123",
                    "preferred": null
                  }
                ],
                "displayName": "Alice Smith",
                "givenNames": [
                  "Alice"
                ],
                "familyNames": [
                  "Smith"
                ],
                "prefixes": [
                  "Dr"
                ],
                "suffixes": null,
                "altNames": [
                  "Smith, Alice",
                  "A. Smith"
                ],
                "rawNames": [
                  "SMITH, Alice",
                  "A Smith"
                ],
                "biography": "Researcher working in information retrieval and scholarly communication.",
                "countries": [
                  "GB",
                  "US"
                ],
                "careerStage": "early-career",
                "authorUrl": "https://example.edu/researchers/alice-smith",
                "authorUrlDesc": "Institutional researcher profile",
                "email": null,
                "keywords": [
                  "Artificial Intelligence",
                  "Machine Learning",
                  "Information Retrieval"
                ],
                "createdDate": "2026-06-15T10:30:00Z",
                "updatedDate": "2026-07-01T14:20:00Z"
              }

              ```
            contentBlocks: []
          - divider: false
            border: false
            id: authors-api-supported-field-operations
            title: Supported field operations
            descriptionAbout: >-
              The table below describes the proposed field operations for the
              future Author entity.


              | **Attribute** | **Searchable** | **Filterable** | **Sortable** | **Facetable** |

              | ------------- | -------------- | -------------- | ------------ | ------------- |

              | authorId      | No             | Yes            | No           | No            |

              | orcidId       | No             | Yes            | No           | No            |

              | externalIds   | No             | Yes            | No           | No            |

              | displayName   | Yes            | No             | Yes          | No            |

              | givenNames    | Yes            | No             | No           | No            |

              | familyNames   | Yes            | No             | No           | No            |

              | prefixes      | No             | No             | No           | No            |

              | suffixes      | No             | No             | No           | No            |

              | altNames      | Yes            | No             | No           | No            |

              | rawNames      | Yes            | No             | No           | No            |

              | biography     | Yes            | No             | No           | No            |

              | countries     | No             | Yes            | No           | Yes           |

              | careerStage   | No             | Yes            | No           | Yes           |

              | authorUrl     | No             | No             | No           | No            |

              | authorUrlDesc | No             | No             | No           | No            |

              | email         | No             | No             | No           | No            |

              | keywords      | Yes            | Yes            | No           | Yes           |

              | createdDate   | No             | Yes            | Yes          | No            |

              | updatedDate   | No             | Yes            | Yes          | No            |
          - divider: false
            border: false
            id: authors-api-authors-endpoints
            title: Authors endpoints
            descriptionAbout: >-
              | **Operation**                            | **Method** |
              **Endpoint**                          |

              | ---------------------------------------- | ---------- | ------------------------------------- |

              | Get a single Author                      | GET        | `/v4/authors/{authorId}`              |

              | Search Authors using URL parameters      | GET        | `/v4/search/authors`                  |

              | Search Authors using a JSON request body | POST       | `/v4/search/authors`                  |

              | Retrieve Authorships for an Author       | GET        | `/v4/authors/{authorId}/authorships`  |

              | Retrieve Works for an Author             | GET        | `/v4/authors/{authorId}/works`        |

              | Retrieve Affiliations for an Author      | GET        | `/v4/authors/{authorId}/affiliations` |


              #### Get a single Author


              Retrieves a single Author record using its CORE Author identifier.


              ```

              GET https://api.core.ac.uk/v4/authors/{authorId}

              ```


              #### Authorization


              | **Parameter** | **Location** | **Type** | **Required** | **Description**                                           |

              | ------------- | ------------ | -------- | ------------ | --------------------------------------------------------- |

              | Authorization | Header       | string   | Yes          | CORE API authentication token supplied as a Bearer token. |


              #### P﻿ath parameters


              | **Parameter** | **Type** | **Required** | **Description**                              |

              | ------------- | -------- | ------------ | -------------------------------------------- |

              | authorId      | integer  | Yes          | Unique CORE identifier of the Author record. |


              #### Q﻿uery parameters


              | **Parameter** | **Type** | **Required** | **Description**                                                                                                      |

              | ------------- | -------- | ------------ | -------------------------------------------------------------------------------------------------------------------- |

              | select        | string   | No           | Comma-separated list of top-level Author fields to return. Example: `select=authorId,orcidId,displayName,countries`. |




              E﻿xample request:


              ```

              curl --request GET \
                --url "https://api.core.ac.uk/v4/authors/67890" \
                --header "Authorization: Bearer YOUR_API_KEY"


              ```


              E﻿xample response:


              ```

              {
                "authorId": 67890,
                "orcidId": "0000-0002-1825-0097",
                "displayName": "Alice Smith",
                "givenNames": [
                  "Alice"
                ],
                "familyNames": [
                  "Smith"
                ],
                "altNames": [
                  "Smith, Alice",
                  "A. Smith"
                ],
                "countries": [
                  "GB",
                  "US"
                ],
                "careerStage": "early-career",
                "keywords": [
                  "Artificial Intelligence",
                  "Machine Learning",
                  "Information Retrieval"
                ],
                "createdDate": "2026-06-15T10:30:00Z",
                "updatedDate": "2026-07-01T14:20:00Z"
              }


              ```


              E﻿xample request using  select:


              ```

              curl --request GET \
                --url "https://api.core.ac.uk/v4/authors/67890?select=authorId,orcidId,displayName,countries,keywords" \
                --header "Authorization: Bearer YOUR_API_KEY"

              ```


              E﻿xample response using  select:


              ```

              {
                "authorId": 67890,
                "orcidId": "0000-0002-1825-0097",
                "displayName": "Alice Smith",
                "countries": [
                  "GB",
                  "US"
                ],
                "keywords": [
                  "Artificial Intelligence",
                  "Machine Learning",
                  "Information Retrieval"
                ]
              }

              ```
          - divider: false
            border: false
            id: authors-api-search-authors
            title: Search Authors
            descriptionAbout: >-
              Searches, filters, orders, facets, and paginates Author records.


              #### API endpoints


              ```

              GET https://api.core.ac.uk/v4/search/authors 

              POST https://api.core.ac.uk/v4/search/authors

              ```


              Both methods use the same CORE query language and return the same response structure.


              Additional parameters such as orderby, select, facets, count, limit, and offset control how results are returned.


              #### GET and POST search parameters


              ##### GET query parameters


              | Parameter | Type    | Required | Default                       | Description                                                                                                                       |

              | --------- | ------- | -------- | ----------------------------- | --------------------------------------------------------------------------------------------------------------------------------- |

              | q         | string  | No       | `*`                           | CORE query expression supporting textual search, field lookup, Boolean operators, grouping, range queries, and existence queries. |

              | orderby   | string  | No       | Relevance for textual queries | Comma-separated ordering directives in `field:direction` format.                                                                  |

              | select    | string  | No       | All retrievable fields        | Comma-separated list of fields to include in each result.                                                                         |

              | facets    | string  | No       | —                             | Comma-separated list of facetable fields for which value buckets and counts should be returned.                                   |

              | count     | boolean | No       | `false`                       | Indicates whether the total number of matching Author records should be included.                                                 |

              | limit     | integer | No       | `10`                          | Maximum number of Author records to return.                                                                                       |

              | offset    | integer | No       | `0`                           | Number of matching Author records to skip.                                                                                        |


              #### POST request body


              | Property | Type      | Required | Default                       | Description                                                                                                                       |

              | -------- | --------- | -------- | ----------------------------- | --------------------------------------------------------------------------------------------------------------------------------- |

              | q        | string    | No       | `*`                           | CORE query expression supporting textual search, field lookup, Boolean operators, grouping, range queries, and existence queries. |

              | orderby  | string\[] | No       | Relevance for textual queries | Ordered list of sorting directives in `field:direction` format.                                                                   |

              | select   | string\[] | No       | All retrievable fields        | List of Author fields to include in each result.                                                                                  |

              | facets   | string\[] | No       | —                             | List of facetable fields for which value buckets and counts should be returned.                                                   |

              | count    | boolean   | No       | `false`                       | Indicates whether the total number of matching Author records should be included.                                                 |

              | limit    | integer   | No       | `10`                          | Maximum number of Author records to return.                                                                                       |

              | offset   | integer   | No       | `0`                           | Number of matching Author records to skip.                                                                                        |


              #### GET and POST parameter mapping




              | GET query parameter                     | POST body property                                   |

              | --------------------------------------- | ---------------------------------------------------- |

              | `q=countries:GB`                        | `"q": "countries:GB"`                                |

              | `orderby=displayName:asc`               | `"orderby": ["displayName:asc"]`                     |

              | `select=authorId,displayName,countries` | `"select": ["authorId", "displayName", "countries"]` |

              | `facets=countries,careerStage,keywords` | `"facets": ["countries", "careerStage", "keywords"]` |

              | `count=true`                            | `"count": true`                                      |

              | `limit=10`                              | `"limit": 10`                                        |

              | `offset=0`                              | `"offset": 0`                                        |
          - divider: false
            border: false
            id: authors-api-search-examples
            title: Search examples
            descriptionAbout: >-
              GET


              ```

              curl --request GET \
                --url 'https://api.core.ac.uk/v4/search/authors?q=displayName:"Alice%20Smith"' \
                --header "Authorization: Bearer YOUR_API_KEY"
              ```


              Readable form:


              ```

              GET /v4/search/authors?q=displayName:"Alice Smith"

              ```


              A broader free-text query may also be used:


              ```

              GET /v4/search/authors?q="Alice Smith"

              ```


              P﻿OST


              ```

              curl --request POST \
                --url "https://api.core.ac.uk/v4/search/authors" \
                --header "Authorization: Bearer YOUR_API_KEY" \
                --header "Content-Type: application/json" \
                --data '{
                  "q": "displayName:\"Alice Smith\""
                }'
              ```


              A broad textual query searches searchable Author fields, including:


              * displayName;

              * givenNames;

              * familyNames;

              * altNames;

              * rawNames;

              * biography;

              * keywords.


              When a textual query is supplied and orderby is omitted, results are ordered by relevance.


              #### **Retrieve an Author by ORCID**


              G﻿ET


              ```

              GET /v4/search/authors?q=orcidId:"0000-0002-1825-0097"

              ```


              P﻿OST


              ```

              {
                "q": "orcidId:\"0000-0002-1825-0097\""
              }

              ```


              #### Search by research keyword


              G﻿ET


              ```

              GET /v4/search/authors?q=keywords:"Machine Learning"



              ```


              P﻿OST


              ```

              {
                "q": "keywords:\"Machine Learning\""
              }



              ```


              #### Retrieve Authors associated with a country


              G﻿ET


              ```

              GET /v4/search/authors?q=countries:GB



              ```


              P﻿OST


              ```

              {
                "q": "countries:GB"
              }

              ```


              This query uses countries derived from known Affiliations and does not imply nationality.


              #### **Retrieve Authors by career stage**


              G﻿ET


              ```

              GET /v4/search/authors?q=careerStage:early-career



              ```


              P﻿OST


              ```

              { 
                "q": "careerStage:early-career" 
              }



              ```


              #### **Retrieve Authors with ORCID identifiers**


              G﻿ET


              ```

              GET /v4/search/authors?q=_exists_:orcidId



              ```


              P﻿OST


              ```

              {
                "q": "_exists_:orcidId"
              }



              ```


              #### Combined search, selection, and ordering




              The following request:


              * searches for Authors with the keyword Machine Learning;

              * restricts results to Authors associated with an Affiliation in the United Kingdom;

              * orders results by preferred display name;

              * returns selected fields;

              * includes the total result count;

              * returns a maximum of ten records.


              G﻿ET


              ```

              curl --request GET \
                --url 'https://api.core.ac.uk/v4/search/authors?q=keywords:"Machine%20Learning"%20AND%20countries:GB&orderby=displayName:asc&select=authorId,orcidId,displayName,countries,careerStage,keywords&count=true&limit=10&offset=0' \
                --header "Authorization: Bearer YOUR_API_KEY"


              ```


              R﻿eadable form:


              ```

              GET /v4/search/authors
                  ?q=keywords:"Machine Learning" AND countries:GB
                  &orderby=displayName:asc
                  &select=authorId,orcidId,displayName,countries,careerStage,keywords
                  &count=true
                  &limit=10
                  &offset=0
              ```


              P﻿OST


              ```

              curl --request POST \
                --url "https://api.core.ac.uk/v4/search/authors" \
                --header "Authorization: Bearer YOUR_API_KEY" \
                --header "Content-Type: application/json" \
                --data '{
                  "q": "keywords:\"Machine Learning\" AND countries:GB",
                  "orderby": [
                    "displayName:asc"
                  ],
                  "select": [
                    "authorId",
                    "orcidId",
                    "displayName",
                    "countries",
                    "careerStage",
                    "keywords"
                  ],
                  "count": true,
                  "limit": 10,
                  "offset": 0
                }'


              ```


              Example search response:


              ```

              {
                "totalHits": 1,
                "results": [
                  {
                    "authorId": 67890,
                    "orcidId": "0000-0002-1825-0097",
                    "displayName": "Alice Smith",
                    "countries": [
                      "GB",
                      "US"
                    ],
                    "careerStage": "early-career",
                    "keywords": [
                      "Artificial Intelligence",
                      "Machine Learning",
                      "Information Retrieval"
                    ]
                  }
                ]
              }



              ```


              #### Ordering Author results


              ##### Order by display name


              G﻿ET


              ```

              GET /v4/search/authors?orderby=displayName:asc



              ```


              P﻿OST


              ```

              {
                "orderby": [
                  "displayName:asc"
                ]
              }



              ```


              ##### Order by creation date


              G﻿ET


              ```

              GET /v4/search/authors?orderby=createdDate:asc



              ```


              P﻿OST


              ```

              {
                "orderby": [
                  "createdDate:asc"
                ]
              }



              ```


              ##### Order by update date


              G﻿ET


              ```

              GET /v4/search/authors?orderby=updatedDate:desc



              ```


              P﻿OST


              ```

              {
                "orderby": [
                  "updatedDate:desc"
                ]
              }



              ```


              ##### Order by multiple fields


              G﻿ET


              ```

              GET /v4/search/authors?orderby=displayName:asc,updatedDate:desc



              ```


              P﻿OST


              ```

              {
                "orderby": [
                  "displayName:asc",
                  "updatedDate:desc"
                ]
              }



              ```


              Results are first ordered by displayName. Records with the same display name are then ordered by updatedDate.




              #### **Facets**


              The facets option returns value buckets and counts for fields configured as facetable.


              G﻿ET


              ```

              curl --request GET \
                --url "https://api.core.ac.uk/v4/search/authors?q=*&facets=countries,careerStage,keywords&count=true&limit=0" \
                --header "Authorization: Bearer YOUR_API_KEY"


              ```


              P﻿OST


              ```

              curl --request POST \
                --url "https://api.core.ac.uk/v4/search/authors" \
                --header "Authorization: Bearer YOUR_API_KEY" \
                --header "Content-Type: application/json" \
                --data '{
                  "q": "*",
                  "facets": [
                    "countries",
                    "careerStage",
                    "keywords"
                  ],
                  "count": true,
                  "limit": 0
                }'
              ```




              E﻿xample facet response:


              ```

              {
                "totalHits": 2500000,
                "facets": {
                  "countries": [
                    {
                      "value": "US",
                      "count": 710000
                    },
                    {
                      "value": "GB",
                      "count": 245000
                    }
                  ],
                  "careerStage": [
                    {
                      "value": "early-career",
                      "count": 540000
                    },
                    {
                      "value": "mid-career",
                      "count": 430000
                    },
                    {
                      "value": "experienced",
                      "count": 390000
                    }
                  ],
                  "keywords": [
                    {
                      "value": "Machine Learning",
                      "count": 165000
                    },
                    {
                      "value": "Artificial Intelligence",
                      "count": 153000
                    }
                  ]
                },
                "results": []
              }



              ```


              Facet counts describe the complete matching result set.


              Setting limit to 0 returns facet buckets and counts without returning Author records.


              #### R﻿esult count


              Set count=true to include the total number of matching Author records.


              G﻿ET


              ```

              GET /v4/search/authors?q=countries:GB&count=true



              ```


              \

              P﻿OST


              ```

              {
                "q": "countries:GB",
                "count": true
              }



              ```


              When count is omitted or set to false, totalHits may be omitted from the response.


              #### Pagination


              Use limit and offset to paginate Author results.


              A deterministic orderby expression should be used when retrieving multiple pages.


              F﻿irst page using GET


              ```

              GET /v4/search/authors?q=keywords:"Artificial Intelligence"&orderby=displayName:asc&limit=20&offset=0



              ```


              Second page using GET


              ```

              GET /v4/search/authors?q=keywords:"Artificial Intelligence"&orderby=displayName:asc&limit=20&offset=20

              ```


              First page using POST


              ```

              {
                "q": "keywords:\"Artificial Intelligence\"",
                "orderby": [
                  "displayName:asc"
                ],
                "limit": 20,
                "offset": 0
              }



              ```


              \

              Second page using POST


              ```

              {
                "q": "keywords:\"Artificial Intelligence\"",
                "orderby": [
                  "displayName:asc"
                ],
                "limit": 20,
                "offset": 20
              }



              ```


              The offset is calculated as:


              offset = page size × number of previous pages
          - divider: false
            border: false
            id: authors-api-relationship-oriented-endpoints
            title: Relationship-oriented endpoints
            descriptionAbout: >-
              Relationship-oriented endpoints provide convenient access to
              records connected to an Author.


              They do not embed those records in the Author entity. Internally, each endpoint queries the related entity using authorId.


              #### Authorships for an Author


              ```

              GET /v4/authors/{authorId}/authorships



              ```


              Retrieves Authorship records associated with the Author.\

              Equivalent GET search:


              ```

              GET /v4/search/authorships?q=authorId:{authorId}



              ```


              Equivalent POST search:


              ```

              {
                "q": "authorId:{authorId}"
              }



              ```


              E﻿xample request


              ```

              curl --request GET \
                --url "https://api.core.ac.uk/v4/authors/67890/authorships?orderby=workId:asc&count=true&limit=10&offset=0" \
                --header "Authorization: Bearer YOUR_API_KEY"


              ```


              E﻿xample response


              ```

              {
                "totalHits": 2,
                "results": [
                  {
                    "authorshipId": 987654,
                    "workId": 12345,
                    "authorId": 67890,
                    "rawName": "Smith, Alice",
                    "sequence": "first",
                    "rank": 1,
                    "isFirstNamedAuthor": true,
                    "isCorresponding": true
                  },
                  {
                    "authorshipId": 987700,
                    "workId": 428765,
                    "authorId": 67890,
                    "rawName": "A. Smith",
                    "sequence": "additional",
                    "rank": 2,
                    "isFirstNamedAuthor": false,
                    "isCorresponding": false
                  }
                ]
              }



              ```


              #### Works for an Author


              ```

              GET /v4/authors/{authorId}/works



              ```


              Retrieves Works connected to the Author through Authorship records.


              E﻿xample request


              ```

              curl --request GET \
                --url "https://api.core.ac.uk/v4/authors/67890/works?select=workId,title,yearPublished,doi&orderby=yearPublished:desc&count=true&limit=10&offset=0" \
                --header "Authorization: Bearer YOUR_API_KEY"
              ```


              E﻿xample response


              ```

              {
                "totalHits": 2,
                "results": [
                  {
                    "workId": 428765,
                    "title": "Machine learning for scholarly information retrieval",
                    "yearPublished": 2025,
                    "doi": "10.1234/example.2025.1"
                  },
                  {
                    "workId": 12345,
                    "title": "Open research infrastructure and discovery",
                    "yearPublished": 2023,
                    "doi": "10.1234/example.2023.7"
                  }
                ]
              }



              ```


              \

              An existing Author with no connected Works returns 200 with an empty results array.


              #### Affiliations for an Author


              ```

              GET /v4/authors/{authorId}/affiliations



              ```


              Retrieves Affiliation records whose authorId matches the Author.


              Equivalent GET search:


              ```

              GET /v4/search/affiliations?q=authorId:{authorId}&orderby=startDate:asc



              ```


              Equivalent POST search:


              ```

              {
                "q": "authorId:{authorId}",
                "orderby": [
                  "startDate:asc"
                ]
              }



              ```


              E﻿xample request


              ```

              curl --request GET \
                --url "https://api.core.ac.uk/v4/authors/67890/affiliations?orderby=startDate:asc&count=true&limit=10&offset=0" \
                --header "Authorization: Bearer YOUR_API_KEY"


              ```


              E﻿xample response


              ```

              {
                "totalHits": 2,
                "results": [
                  {
                    "affiliationId": 901,
                    "authorId": 67890,
                    "rawAffiliation": "Department of Computer Science, University of Oxford, UK",
                    "department": "Department of Computer Science",
                    "institutionId": 3201,
                    "institutionName": "University of Oxford",
                    "isCurrent": false,
                    "startDate": "2018-01-01",
                    "endDate": "2021-12-31"
                  },
                  {
                    "affiliationId": 902,
                    "authorId": 67890,
                    "rawAffiliation": "Massachusetts Institute of Technology, Cambridge, MA, USA",
                    "department": null,
                    "institutionId": 4501,
                    "institutionName": "Massachusetts Institute of Technology",
                    "isCurrent": true,
                    "startDate": "2022-01-01",
                    "endDate": null
                  }
                ]
              }



              ```


              An existing Author with no connected Affiliations returns 200 with an empty results array.
      - item: Citations
        sections:
          - divider: false
            border: false
            id: citations-api-introduction
            title: Introduction
            descriptionAbout: >+
              The Citation entity represents a directed bibliographic
              relationship between a citing Work and a cited Work or
              bibliographic reference.

              A citation connects citing and cited works:

            images:
              - file: /images/docs-graph/citations.png
            subDescription: >-
              The Citation entity may contain:


              - CORE identifiers for the citing and cited Works

              - External identifiers such as DOI, PMID, OMID, and OCI

              - Bibliographic metadata describing the cited item

              - Information about when the citation relationship was created or established

              - Indicators describing properties of the citation relationship, such as author or journal self-citation

              - Citation-related metrics supplied by external sources


              Citation information may be derived from multiple scholarly sources, including OpenCitations, OpenAlex, OpenAIRE Graph, Crossref, and reference metadata available to CORE.


              A Citation is directional. A relationship from Work A to Work B is distinct from a relationship from Work B to Work A.


              ```text

              A → B ≠ B → A

              ```


              #### Entity scope


              Citation is a relationship entity because it connects two scholarly Works and may contain information describing that relationship.


              ```text

              WORKS
                ↓ citing
              CITATIONS
                ↓ cited
              WORKS

              ```


              A Work may:


              - Cite zero or more other Works

              - Be cited by zero or more other Works


              The Citation entity enables navigation in both directions:


              ```text

              Work
                → citations
                → cited Works
              ```


              And:


              ```text

              Work
                → cited-by
                → citing Works
              ```


              #### Unresolved cited Works


              Where a cited bibliographic item cannot be resolved to a canonical CORE Work, the Citation may still retain its external identifiers and structured or unstructured reference metadata.


              For example:


              ```json

              {
                "citedWorkId": null,
                "citedDoi": "10.1000/abc456",
                "reference": {
                  "articleTitle": "Quantum effects in materials",
                  "author": [
                    "Smith J",
                    "Lee B"
                  ]
                }
              }

              ```


              This allows unresolved references to remain represented without requiring every cited item to have a corresponding CORE Work.
          - divider: false
            border: false
            id: citations-api-data-structure
            title: Data structure
            descriptionAbout: >-
              The following table describes the proposed top-level fields of the
              Citation entity.


              | **Property**     | **Type** | **Example value** | **Description**                                                 | **Source**                                                                                       |                                     

              | ---------------- | -------- | ----------------- | --------------------------------------------------------------- | ------------------------------------------------------------------------------------------------ |

              | `citationId`     | integer  | `1256789`         | Unique CORE canonical identifier for the Citation relationship. | CORE                                                                                             |                                     

              | `openCitationId` | string                | `"oci:0610200888-0613012615"`                                   | Open Citation Identifier (OCI) identifying the citation relationship, when available.            | OpenCitations                       |

              | `citingWorkId`   | integer                | `345678`                                                        | CORE identifier of the Work containing the citation.                                             | CORE                                |

              | `citedWorkId`    | integer                | `23456`                                                         | CORE identifier of the cited Work, when resolved.                                                | CORE                                |

              | `citingOmid`     | string                 | `"omid:br/0610200888"`                                          | OpenCitations Meta Identifier of the citing bibliographic resource.                              | OpenCitations                       |

              | `citingDoi`      | string                 | `"10.1000/xyz123"`                                              | DOI of the citing Work.                                                                          | OpenCitations / Crossref            |

              | `citingPmid`     | string                 | `"12345678"`                                                    | PMID of the citing Work.                                                                         | OpenCitations                       |

              | `citedOmid`      | string                | `"omid:br/0613012615"`                                          | OpenCitations Meta Identifier of the cited bibliographic resource.                               | OpenCitations                       |

              | `citedDoi`       | string                 | `"10.1000/abc456"`                                              | DOI of the cited Work or unresolved bibliographic item.                                          | OpenCitations / Crossref            |

              | `citedPmid`      | string                 | `"87654321"`                                                    | PMID of the cited Work or bibliographic item.                                                    | OpenCitations                       |

              | `creationDate`   | string                 | `"2022-06-14"`                                                  | Date associated with the creation of the citation relationship, where supplied by the source.    | OpenCitations                       |

              | `timespan`       | string                 | `"P2Y"`                                                         | Time interval associated with the citation, represented as an ISO 8601 duration where available. | OpenCitations                       |

              | `reference`*     | object                 | `{...}`                                                         | Structured bibliographic description of the cited item.                                          | Crossref / OpenAIRE                 |

              | `metrics`*       | object                 | `{...}`                                                         | Citation indicators and metrics supplied by external sources.                                    | OpenCitations / OpenAIRE / OpenAlex |


              \* More information is provided in the following sections.


              #### Citation identifiers


              A Citation contains identifiers for both sides of the directed relationship.


              ```json

              {
                "citationId": 1256789,
                "openCitationId": "oci:0610200888-0613012615",
                "citingWorkId": 345678,
                "citedWorkId": 23456,
                "citingOmid": "omid:br/0610200888",
                "citingDoi": "10.1000/xyz123",
                "citingPmid": "12345678",
                "citedOmid": "omid:br/0613012615",
                "citedDoi": "10.1000/abc456",
                "citedPmid": "87654321"
              }

              ```


              #### CORE identifiers


              `citingWorkId` identifies the Work containing the bibliographic reference.


              `citedWorkId` identifies the Work to which the citation resolves.


              ```text

              citingWorkId
                    ↓
                 Citation
                    ↓
               citedWorkId
              ```


              `citedWorkId` may be `null` when CORE has not resolved the bibliographic reference to a canonical Work.


              The canonical relationship uses CORE `workId` values where resolution is available. External identifiers provide interoperability and allow unresolved references to remain represented.


              #### Reference


              The `reference` object preserves the bibliographic description of the cited item.


              This is particularly useful when a reference cannot be resolved to a canonical CORE Work.


              ```json

              {
                "reference": {
                  "type": "journal-article",
                  "key": "ref-12",
                  "author": [
                    "Smith J",
                    "Lee B"
                  ],
                  "articleTitle": "Quantum effects in materials",
                  "journalTitle": "Physical Review Letters",
                  "volume": "50",
                  "issue": "3",
                  "startPage": "101",
                  "endPage": "118",
                  "pages": "101-118",
                  "citedDoi": "10.1000/abc456",
                  "unstructured": "Smith J. Quantum effects in materials. Phys Rev Lett. 2022;50(3):101-118."
                }
              }

              ```


              ##### Reference fields


              | **Property**         | **Type**  | **Example value**                 | **Description**                                                        | **Source**                   |     

              | -------------------- | --------- | --------------------------------- | ---------------------------------------------------------------------- | ---------------------------- | 

              | `type`               | string    | `"journal-article"`               | Type of the cited bibliographic item.                                  | Crossref                     |     

              | `key`                | string    | `"ref-12"`                        | Source-specific identifier for the reference within the citing record. | Crossref                     |     

              | `author`             | string\[] | `["Smith J", "Lee B"]`            | Author names as supplied in the reference.                             | Crossref / OpenAIRE          |     

              | `articleTitle`       | string    | `"Quantum effects in materials"`  | Title of the cited article or resource.                                | Crossref                     |     

              | `journalTitle`       | string    | `"Physical Review Letters"`       | Journal title associated with the cited item.                          | Crossref                     |     

              | `seriesTitle`        | string    | `"Lecture Notes in Physics"`      | Series title, when applicable.                                         | Crossref                     |     

              | `volumeTitle`        | string    | `"Collected Papers on Radiation"` | Title of the containing volume.                                        | Crossref                     |     

              | `volume`             | string    | `"50"`                            | Volume number.                                                         | Crossref / OpenAIRE          |     

              | `issue`              | string    | `"3"`                             | Issue number.                                                          | Crossref / OpenAIRE          |     

              | `edition`            | string    | `"2"`                             | Edition of the cited resource.                                         | Crossref / OpenAIRE          |     

              | `startPage`          | string    | `"101"`                           | Starting page of the cited item.                                       | OpenAIRE / Crossref          |     

              | `endPage`            | string    | `"118"`                           | Ending page of the cited item.                                         | OpenAIRE / Crossref          |     

              | `pages`              | string    | `"101-118"`                       | Page extent as supplied by the source.                                 | Dublin Core Terms / Crossref |     

              | `conferenceLocation` | string    | `"Glasgow, UK"`                   | Conference location, when applicable.                                  | OpenAIRE                     |     

              | `conferenceDate`     | string    | `"2023-09-12"`                    | Conference date or year, when applicable.                              | OpenAIRE / Crossref          |     

              | `issn`               | string\[] | `["1234-5678"]`                   | ISSNs associated with the cited publication venue.                     | Crossref                     |     

              | `issnType`           | string\[] | `["print"]`                       | Types associated with the corresponding ISSNs.                         | Crossref                     |     

              | `isbn`               | string\[] | `["9781234567890"]`               | ISBNs associated with the cited resource.                              | Crossref                     |     

              | `isbnType`           | string\[] | `["electronic"]`                  | Types associated with the corresponding ISBNs.                         | Crossref                     |     

              | `citedDoi`           | string    | `"10.1000/abc456"`                | DOI of the cited bibliographic item.                                   | Crossref / OpenCitations     |     

              | `doiAssertedBy`      | string    | `"publisher"`                     | Source asserting the cited DOI.                                        | Crossref                     |     

              | `component`          | string    | `"chapter"`                       | Component of a larger cited resource.                                  | Crossref                     |     

              | `standardDesignator` | string    | `"ISO 9001:2015"`                 | Formal standard designation, when applicable.                          | Crossref                     |     

              | `standardsBody`      | string    | `"ISO"`                           | Organisation responsible for the cited standard.                       | Crossref                     |     

              | `unstructured`       | string    | `"Smith J. Quantum effects..."`   | Original unstructured citation text supplied by the source.            | Crossref                     |     


              #### Structured and unstructured references


              The Citation entity may contain both structured fields and the original unstructured reference.


              ```json

              {
                "articleTitle": "Quantum effects in materials",
                "journalTitle": "Physical Review Letters",
                "volume": "50",
                "issue": "3",
                "pages": "101-118",
                "unstructured": "Smith J. Quantum effects in materials. Phys Rev Lett. 2022;50(3):101-118."
              }

              ```


              The structured properties support:


              * Identifier resolution

              * Bibliographic matching

              * Filtering and search

              * Citation reconciliation


              The `unstructured` field preserves the citation as it was supplied by the source.


              This provenance is particularly important when structured extraction is incomplete or uncertain.


              #### Metrics


              The proposed `metrics` object contains citation-related indicators and usage statistics supplied by external systems.


              ```json

              {
                "metrics": {
                  "citationCount": 256,
                  "normalisedPercentileValue": 0.94,
                  "isInTopOnePercent": false,
                  "isInTopTenPercent": true,
                  "influence": 0.74,
                  "influenceClass": "high",
                  "citationClass": "highly_cited",
                  "popularity": 0.63,
                  "popularityClass": "medium",
                  "impulse": 0.41,
                  "impulseClass": "medium",
                  "downloads": 1250,
                  "views": 9810,
                  "citedByApiUrl": "https://api.openalex.org/works?...",
                  "journalSelfCitation": false,
                  "authorSelfCitation": true,
                  "venueCitationCount": 14,
                  "referenceCount": 38
                }
              }

              ```


              ##### Metric fields


              | **Property**                | **Type** | **Example value**                      | **Description**                                                                                      | **Source**    |

              | --------------------------- | -------- | -------------------------------------- | ---------------------------------------------------------------------------------------------------- | ------------- |

              | `citationCount`             | integer  | `256`                                  | Citation count supplied for the associated record.                                                   | OpenCitations |

              | `normalisedPercentileValue` | number   | `0.94`                                 | Normalised citation percentile value.                                                                | OpenAIRE      |

              | `isInTopOnePercent`         | boolean  | `false`                                | Indicates whether the citation target belongs to the top one percent according to the source metric. | OpenAIRE      |

              | `isInTopTenPercent`         | boolean  | `true`                                 | Indicates whether the citation target belongs to the top ten percent according to the source metric. | OpenAIRE      |

              | `influence`                 | number   | `0.74`                                 | Influence score supplied by the source.                                                              | OpenAIRE      |

              | `influenceClass`            | string   | `"high"`                               | Influence classification supplied by the source.                                                     | OpenAIRE      |

              | `citationClass`             | string   | `"highly_cited"`                       | Citation-impact classification supplied by the source.                                               | OpenAIRE      |

              | `popularity`                | number   | `0.63`                                 | Popularity score supplied by the source.                                                             | OpenAIRE      |

              | `popularityClass`           | string   | `"medium"`                             | Popularity classification supplied by the source.                                                    | OpenAIRE      |

              | `impulse`                   | number   | `0.41`                                 | Impulse score supplied by the source.                                                                | OpenAIRE      |

              | `impulseClass`              | string   | `"medium"`                             | Impulse classification supplied by the source.                                                       | OpenAIRE      |

              | `downloads`                 | integer  | `1250`                                 | Download count supplied for the associated resource.                                                 | OpenAIRE      |

              | `views`                     | integer  | `9810`                                 | View count supplied for the associated resource.                                                     | OpenAIRE      |

              | `citedByApiUrl`             | string   | `"https://api.openalex.org/works?..."` | External API URL providing cited-by information, where supplied.                                     | OpenAlex      |

              | `journalSelfCitation`       | boolean  | `false`                                | Indicates whether the relationship is a journal self-citation, where derivable.                      | OpenCitations |

              | `authorSelfCitation`        | boolean  | `true`                                 | Indicates whether the relationship is an author self-citation, where derivable.                      | OpenCitations |

              | `venueCitationCount`        | integer  | `14`                                   | Venue-level citation count supplied by the source.                                                   | OpenCitations |

              | `referenceCount`            | integer  | `38`                                   | Number of references associated with the relevant record, where available.                           | OpenCitations |


              > The precise meaning and calculation method for source-derived scores such as `influence`, `popularity`, and `impulse` should be documented before public release.


              #### Self-citation indicators


              Two of the supplied metric properties describe the citation relationship itself.


              ##### Author self-citation


              ```json

              {
                "authorSelfCitation": true
              }

              ```


              Indicates that the citing and cited Works share an Author according to the source or CORE derivation.


              ##### Journal self-citation


              ```json

              {
                "journalSelfCitation": false
              }

              ```


              Indicates whether the citing and cited Works are associated with the same Journal or publication venue according to the source definition.


              The precise derivation criteria should be documented because different data providers may use different definitions of self-citation.


              Example Citation record:


              ```json

              {
                "citationId": 1256789,
                "openCitationId": "oci:0610200888-0613012615",
                "citingWorkId": 345678,
                "citedWorkId": 23456,
                "citingOmid": "omid:br/0610200888",
                "citingDoi": "10.1000/xyz123",
                "citingPmid": "12345678",
                "citedOmid": "omid:br/0613012615",
                "citedDoi": "10.1000/abc456",
                "citedPmid": "87654321",
                "creationDate": "2022-06-14",
                "timespan": "P2Y",
                "reference": {
                  "type": "journal-article",
                  "key": "ref-12",
                  "author": [
                    "Smith J",
                    "Lee B"
                  ],
                  "articleTitle": "Quantum effects in materials",
                  "journalTitle": "Physical Review Letters",
                  "seriesTitle": null,
                  "volumeTitle": null,
                  "volume": "50",
                  "issue": "3",
                  "edition": null,
                  "startPage": "101",
                  "endPage": "118",
                  "pages": "101-118",
                  "conferenceLocation": null,
                  "conferenceDate": null,
                  "issn": [
                    "1234-5678"
                  ],
                  "issnType": [
                    "print"
                  ],
                  "isbn": null,
                  "isbnType": null,
                  "citedDoi": "10.1000/abc456",
                  "doiAssertedBy": "publisher",
                  "component": null,
                  "standardDesignator": null,
                  "standardsBody": null,
                  "unstructured": "Smith J. Quantum effects in materials. Phys Rev Lett. 2022;50(3):101-118."
                },
                "metrics": {
                  "citationCount": 256,
                  "normalisedPercentileValue": 0.94,
                  "isInTopOnePercent": false,
                  "isInTopTenPercent": true,
                  "influence": 0.74,
                  "influenceClass": "high",
                  "citationClass": "highly_cited",
                  "popularity": 0.63,
                  "popularityClass": "medium",
                  "impulse": 0.41,
                  "impulseClass": "medium",
                  "downloads": 1250,
                  "views": 9810,
                  "citedByApiUrl": "https://api.openalex.org/works?...",
                  "journalSelfCitation": false,
                  "authorSelfCitation": true,
                  "venueCitationCount": 14,
                  "referenceCount": 38
                }
              }

              ```

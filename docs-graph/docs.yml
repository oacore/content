            id: journals-api-journals-endpoints
            title: Journals endpoints
            descriptionAbout: >-
              #### Available endpoints


              | **Operation**                             | **Method** | **Endpoint**                       |

              | ----------------------------------------- | ---------- | ---------------------------------- |

              | Get a single Journal                      | `GET`      | `/v4/journals/{journalId}`         |

              | Search Journals using URL parameters      | `GET`      | `/v4/search/journals`              |

              | Search Journals using a JSON request body | `POST`     | `/v4/search/journals`              |

              | Retrieve Outputs for a Journal            | `GET`      | `/v4/journals/{journalId}/outputs` |


              Related Journals may also be retrieved through reverse relationship endpoints:


              | **Operation**                                    | **Method** | **Endpoint**                                   |

              | ------------------------------------------------ | ---------- | ---------------------------------------------- |

              | Retrieve Journals supplied by a Data Provider    | `GET`      | `/v4/data-providers/{dataProviderId}/journals` |

              | Retrieve Journals associated with an Institution | `GET`      | `/v4/institutions/{institutionId}/journals`    |


              A Publisher relationship endpoint should be introduced only after the Journal model contains a canonical `publisherId`.


              #### Get a single Journal


              Retrieves a single Journal record using its CORE Journal identifier.


              ##### API endpoint


              ```http

              GET https://api.core.ac.uk/v4/journals/{journalId}

              ```


              The POST search method is not an alternative single-record retrieval endpoint. It searches the Journal collection using a JSON request body.


              ##### Authorization


              | **Parameter**   | **Location** | **Type** | **Required** | **Description**                                           |

              | --------------- | ------------ | -------- | ------------ | --------------------------------------------------------- |

              | `Authorization` | Header       | string   | Yes          | CORE API authentication token supplied as a Bearer token. |


              ##### Path parameters


              | **Parameter** | **Type** | **Required** | **Description**                               |

              | ------------- | -------- | ------------ | --------------------------------------------- |

              | `journalId`   | integer  | Yes          | Unique CORE identifier of the Journal record. |


              ##### Query parameters


              | **Parameter** | **Type** | **Required** | **Description**                                                                                                         |

              | ------------- | -------- | ------------ | ----------------------------------------------------------------------------------------------------------------------- |

              | `select`      | string   | No           | Comma-separated list of top-level Journal fields to return. Example: `select=journalId,title,issns,publisher,language`. |


              Example request:


              ```bash

              curl --request GET \
                --url "https://api.core.ac.uk/v4/journals/12345" \
                --header "Authorization: Bearer YOUR_API_KEY"
              ```


              Example response:


              ```json

              {
                "journalId": 12345,
                "doajId": "1234567890",
                "issns": [
                  "1744-9081",
                  "1744-909X"
                ],
                "eissn": "1744-909X",
                "pissn": "1744-9081",
                "title": "Journal of Open Science",
                "alternativeTitle": "J Open Sci",
                "language": "en",
                "publisher": "Springer Nature",
                "publisherCountry": "GB",
                "institutionId": 3201,
                "institutionName": "University of Oxford",
                "hasApc": true,
                "hasWaiver": true,
                "createdDate": "2025-05-21T06:18:18Z",
                "updatedDate": "2026-05-21T06:18:18Z"
              }

              ```


              Example request using `select`:


              ```bash

              curl --request GET \
                --url "https://api.core.ac.uk/v4/journals/12345?select=journalId,title,issns,publisher,language,hasApc" \
                --header "Authorization: Bearer YOUR_API_KEY"
              ```


              Example response using `select`:


              ```json

              {
                "journalId": 12345,
                "title": "Journal of Open Science",
                "issns": [
                  "1744-9081",
                  "1744-909X"
                ],
                "publisher": "Springer Nature",
                "language": "en",
                "hasApc": true
              }

              ```


              #### Responses


              | **Status** | **Description**                                                      |

              | ---------- | -------------------------------------------------------------------- |

              | `200`      | The Journal record was retrieved successfully.                       |

              | `400`      | The request contains an invalid parameter or unsupported field name. |

              | `401`      | Authentication credentials are missing or invalid.                   |

              | `404`      | No Journal record was found for the supplied identifier.             |

              | `429`      | The API request limit has been exceeded.                             |

              | `500`      | An unexpected server error occurred.                                 |
          - divider: false
            border: false
            id: journals-api-search-journals
            title: Search Journals
            descriptionAbout: >-
              Searches, filters, orders, facets, counts, and paginates Journal
              records.


              Journal search is available through `GET` and `POST`:


              ```http

              GET https://api.core.ac.uk/v4/search/journals

              POST https://api.core.ac.uk/v4/search/journals

              ```


              Both methods use the same CORE query language and return the same response structure.


              #### GET and POST search parameters


              ##### GET query parameters


              | **Parameter** | **Type** | **Required** | **Default**                   | **Description**                                                                                                            |

              | ------------- | -------- | ------------ | ----------------------------- | -------------------------------------------------------------------------------------------------------------------------- |

              | `q`           | string   | No           | `*`                           | CORE query expression supporting textual search, field lookup, Boolean operators, grouping, ranges, and existence queries. |

              | `orderby`     | string   | No           | Relevance for textual queries | Comma-separated ordering directives in `field:direction` format.                                                           |

              | `select`      | string   | No           | All retrievable fields        | Comma-separated list of fields to include in each result.                                                                  |

              | `facets`      | string   | No           | —                             | Comma-separated list of facetable fields for which value buckets and counts should be returned.                            |

              | `count`       | boolean  | No           | `false`                       | Indicates whether the total number of matching Journal records should be included.                                         |

              | `limit`       | integer  | No           | `10`                          | Maximum number of Journal records to return.                                                                               |

              | `offset`      | integer  | No           | `0`                           | Number of matching Journal records to skip.                                                                                |


              ##### POST request body


              | **Property** | **Type**  | **Required** | **Default**                   | **Description**                                                                                                            |

              | ------------ | --------- | ------------ | ----------------------------- | -------------------------------------------------------------------------------------------------------------------------- |

              | `q`          | string    | No           | `*`                           | CORE query expression supporting textual search, field lookup, Boolean operators, grouping, ranges, and existence queries. |

              | `orderby`    | string\[] | No           | Relevance for textual queries | Ordered list of sorting directives in `field:direction` format.                                                            |

              | `select`     | string\[] | No           | All retrievable fields        | List of Journal fields to include in each result.                                                                          |

              | `facets`     | string\[] | No           | —                             | List of facetable fields for which value buckets and counts should be returned.                                            |

              | `count`      | boolean   | No           | `false`                       | Indicates whether the total number of matching Journal records should be included.                                         |

              | `limit`      | integer   | No           | `10`                          | Maximum number of Journal records to return.                                                                               |

              | `offset`     | integer   | No           | `0`                           | Number of matching Journal records to skip.                                                                                |


              #### GET and POST parameter mapping


              | **GET query parameter**                | **POST body property**                              |

              | -------------------------------------- | --------------------------------------------------- |

              | `q=language:en`                        | `"q": "language:en"`                                |

              | `orderby=title:asc`                    | `"orderby": ["title:asc"]`                          |

              | `select=journalId,title,issns`         | `"select": ["journalId", "title", "issns"]`         |

              | `facets=language,hasApc,licenses.type` | `"facets": ["language", "hasApc", "licenses.type"]` |

              | `count=true`                           | `"count": true`                                     |

              | `limit=10`                             | `"limit": 10`                                       |

              | `offset=0`                             | `"offset": 0`                                       |


              The `GET` method represents `orderby`, `select`, and `facets` as comma-separated strings. The `POST` method represents them as JSON arrays.
          - divider: false
            border: false
            id: journals-api-search-examples
            title: Search examples
            descriptionAbout: >-
              
              #### Search by Journal title


              GET request:


              ```bash

              curl --request GET \
                --url 'https://api.core.ac.uk/v4/search/journals?q=title:"Journal%20of%20Open%20Science"' \
                --header "Authorization: Bearer YOUR_API_KEY"
              ```


              Readable form:


              ```http

              GET /v4/search/journals?q=title:"Journal of Open Science"

              ```


              A broader free-text query may also be used:


              ```http

              GET /v4/search/journals?q="Open Science"

              ```


              Equivalent POST request:


              ```bash

              curl --request POST \
                --url "https://api.core.ac.uk/v4/search/journals" \
                --header "Authorization: Bearer YOUR_API_KEY" \
                --header "Content-Type: application/json" \
                --data '{
                  "q": "title:\"Journal of Open Science\""
                }'
              ```


              A broad textual query searches searchable Journal fields, including:


              - `title`

              - `alternativeTitle`

              - `subjects.term`

              - `keywords`

              - `publisher`

              - `institutionName`

              - `reviewProcesses`

              - `nationalLibraries`


              When a textual query is supplied and `orderby` is omitted, results are ordered by relevance.


              #### Retrieve a Journal by ISSN


              GET request:


              ```http

              GET /v4/search/journals?q=issns:"1744-9081"

              ```


              Equivalent POST request:


              ```json

              {
                "q": "issns:\"1744-9081\""
              }

              ```


              #### Retrieve a Journal by electronic ISSN


              GET request:


              ```http

              GET /v4/search/journals?q=eissn:"1744-909X"

              ```


              Equivalent POST request:


              ```json

              {
                "q": "eissn:\"1744-909X\""
              }

              ```


              #### Retrieve a Journal by DOAJ identifier


              GET request:


              ```http

              GET /v4/search/journals?q=doajId:"1234567890"

              ```


              Equivalent POST request:


              ```json

              {
                "q": "doajId:\"1234567890\""
              }

              ```


              #### Search by Publisher


              GET request:


              ```http

              GET /v4/search/journals?q=publisher:"Springer Nature"

              ```


              Equivalent POST request:


              ```json

              {
                "q": "publisher:\"Springer Nature\""
              }

              ```


              #### Retrieve Journals by language and subject


              GET request:


              ```http

              GET /v4/search/journals?q=language:en AND subjects.term:"Computer Science"

              ```


              Equivalent POST request:


              ```json

              {
                "q": "language:en AND subjects.term:\"Computer Science\""
              }

              ```


              #### Retrieve Journals without APCs


              GET request:


              ```http

              GET /v4/search/journals?q=hasApc:false

              ```


              Equivalent POST request:


              ```json

              {
                "q": "hasApc:false"
              }

              ```


              Records where `hasApc` is `null` are not included because their APC status is unknown.


              #### Retrieve Journals with APC waivers


              GET request:


              ```http

              GET /v4/search/journals?q=hasApc:true AND hasWaiver:true

              ```


              Equivalent POST request:


              ```json

              {
                "q": "hasApc:true AND hasWaiver:true"
              }

              ```


              #### Retrieve Journals by APC amount


              The following query retrieves Journals whose maximum reported GBP APC is no more than 1,500:


              GET request:


              ```http

              GET /v4/search/journals?q=apcMax.currency:GBP AND apcMax.price<=1500

              ```


              Equivalent POST request:


              ```json

              {
                "q": "apcMax.currency:GBP AND apcMax.price<=1500"
              }

              ```


              Both conditions must apply to the same `apcMax` entry.


              #### Retrieve Journals by licence


              GET request:


              ```http

              GET /v4/search/journals?q=licenses.type:"CC BY 4.0"

              ```


              Equivalent POST request:


              ```json

              {
                "q": "licenses.type:\"CC BY 4.0\""
              }

              ```


              #### Retrieve Journals with preservation arrangements


              GET request:


              ```http

              GET /v4/search/journals?q=hasPreservation:true

              ```


              Equivalent POST request:


              ```json

              {
                "q": "hasPreservation:true"
              }

              ```


              A specific preservation service may be queried using:


              ```http

              GET /v4/search/journals?q=preservationServices:CLOCKSS

              ```


              #### Retrieve Journals using DOI identifiers


              GET request:


              ```http

              GET /v4/search/journals?q=pidSchemes:DOI

              ```


              Equivalent POST request:


              ```json

              {
                "q": "pidSchemes:DOI"
              }

              ```


              #### Retrieve Journals associated with a Data Provider


              GET request:


              ```http

              GET /v4/search/journals?q=dataProviderId:86

              ```


              Equivalent POST request:


              ```json

              {
                "q": "dataProviderId:86"
              }

              ```


              This query is functionally equivalent to:


              ```http

              GET /v4/data-providers/86/journals

              ```


              #### Retrieve Journals associated with an Institution


              GET request:


              ```http

              GET /v4/search/journals?q=institutionId:3201

              ```


              Equivalent POST request:


              ```json

              {
                "q": "institutionId:3201"
              }

              ```


              This query is functionally equivalent to:


              ```http

              GET /v4/institutions/3201/journals

              ```


              #### Retrieve active Journal records


              A Journal can be treated as not discontinued when `discontinuedDate` is absent.


              GET request:


              ```http

              GET /v4/search/journals?q=!_exists_:discontinuedDate

              ```


              Equivalent POST request:


              ```json

              {
                "q": "!_exists_:discontinuedDate"
              }

              ```


              This represents the absence of a known discontinuation date. It does not independently confirm that the Journal is actively publishing.


              #### Combined search, selection, and ordering


              The following request:


              - Searches for Journals related to open science.

              - Restricts results to English-language Journals.

              - Restricts results to Journals that do not charge APCs.

              - Orders results alphabetically.

              - Returns selected fields.

              - Includes the total result count.

              - Returns a maximum of ten records.


              GET request:


              ```bash

              curl --request GET \
                --url 'https://api.core.ac.uk/v4/search/journals?q=keywords:"Open%20Science"%20AND%20language:en%20AND%20hasApc:false&orderby=title:asc&select=journalId,title,issns,publisher,language,hasApc,licenses&count=true&limit=10&offset=0' \
                --header "Authorization: Bearer YOUR_API_KEY"
              ```


              Readable form:


              ```http

              GET /v4/search/journals
                  ?q=keywords:"Open Science" AND language:en AND hasApc:false
                  &orderby=title:asc
                  &select=journalId,title,issns,publisher,language,hasApc,licenses
                  &count=true
                  &limit=10
                  &offset=0
              ```


              Equivalent POST request:


              ```bash

              curl --request POST \
                --url "https://api.core.ac.uk/v4/search/journals" \
                --header "Authorization: Bearer YOUR_API_KEY" \
                --header "Content-Type: application/json" \
                --data '{
                  "q": "keywords:\"Open Science\" AND language:en AND hasApc:false",
                  "orderby": [
                    "title:asc"
                  ],
                  "select": [
                    "journalId",
                    "title",
                    "issns",
                    "publisher",
                    "language",
                    "hasApc",
                    "licenses"
                  ],
                  "count": true,
                  "limit": 10,
                  "offset": 0
                }'
              ```


              Example search response:


              ```json

              {
                "totalHits": 1,
                "results": [
                  {
                    "journalId": 12345,
                    "title": "Journal of Open Science",
                    "issns": [
                      "1744-9081",
                      "1744-909X"
                    ],
                    "publisher": "Springer Nature",
                    "language": "en",
                    "hasApc": false,
                    "licenses": [
                      {
                        "type": "CC BY 4.0",
                        "url": "https://creativecommons.org/licenses/by/4.0/"
                      }
                    ]
                  }
                ]
              }

              ```


              #### Ordering Journal results


              ##### Order alphabetically


              GET request:


              ```http

              GET /v4/search/journals?orderby=title:asc

              ```


              POST representation:


              ```json

              {
                "orderby": [
                  "title:asc"
                ]
              }

              ```


              ##### Order by open-access start year


              GET request:


              ```http

              GET /v4/search/journals?orderby=oaStartYear:asc

              ```


              POST representation:


              ```json

              {
                "orderby": [
                  "oaStartYear:asc"
                ]
              }

              ```


              ##### Order by publication time


              GET request:


              ```http

              GET /v4/search/journals?orderby=publicationTimeWeeks:asc

              ```


              POST representation:


              ```json

              {
                "orderby": [
                  "publicationTimeWeeks:asc"
                ]
              }

              ```


              ##### Order by most recently updated


              GET request:


              ```http

              GET /v4/search/journals?orderby=updatedDate:desc

              ```


              POST representation:


              ```json

              {
                "orderby": [
                  "updatedDate:desc"
                ]
              }

              ```


              ##### Order by multiple fields


              GET request:


              ```http

              GET /v4/search/journals?orderby=title:asc,updatedDate:desc

              ```


              POST representation:


              ```json

              {
                "orderby": [
                  "title:asc",
                  "updatedDate:desc"
                ]
              }

              ```


              #### Facets


              The `facets` option returns value buckets and counts for fields configured as facetable.


              GET request:


              ```bash

              curl --request GET \
                --url "https://api.core.ac.uk/v4/search/journals?q=*&facets=language,hasApc,hasWaiver,licenses.type,publisherCountry&count=true&limit=0" \
                --header "Authorization: Bearer YOUR_API_KEY"
              ```


              Equivalent POST request:


              ```bash

              curl --request POST \
                --url "https://api.core.ac.uk/v4/search/journals" \
                --header "Authorization: Bearer YOUR_API_KEY" \
                --header "Content-Type: application/json" \
                --data '{
                  "q": "*",
                  "facets": [
                    "language",
                    "hasApc",
                    "hasWaiver",
                    "licenses.type",
                    "publisherCountry"
                  ],
                  "count": true,
                  "limit": 0
                }'
              ```


              Example facet response:


              ```json

              {
                "totalHits": 20000,
                "facets": {
                  "language": [
                    {
                      "value": "en",
                      "count": 12400
                    },
                    {
                      "value": "es",
                      "count": 2100
                    }
                  ],
                  "hasApc": [
                    {
                      "value": false,
                      "count": 11800
                    },
                    {
                      "value": true,
                      "count": 6200
                    }
                  ],
                  "hasWaiver": [
                    {
                      "value": true,
                      "count": 5100
                    },
                    {
                      "value": false,
                      "count": 1600
                    }
                  ],
                  "licenses.type": [
                    {
                      "value": "CC BY 4.0",
                      "count": 7800
                    },
                    {
                      "value": "CC BY-NC 4.0",
                      "count": 2900
                    }
                  ],
                  "publisherCountry": [
                    {
                      "value": "GB",
                      "count": 3100
                    },
                    {
                      "value": "US",
                      "count": 2800
                    }
                  ]
                },
                "results": []
              }

              ```


              Facet counts describe the complete matching result set.


              Setting `limit` to `0` returns facet buckets and counts without returning Journal records.


              A separate aggregation endpoint is not required:


              ```http

              POST /v4/search/journals/aggregate

              ```


              Faceting is part of the standard Journal search operation.


              #### Result count


              Set `count=true` to include the total number of matching Journal records.


              GET request:


              ```http

              GET /v4/search/journals?q=hasApc:false&count=true

              ```


              Equivalent POST request:


              ```json

              {
                "q": "hasApc:false",
                "count": true
              }

              ```


              When `count` is omitted or set to `false`, `totalHits` may be omitted from the response.


              #### Pagination


              Use `limit` and `offset` to paginate Journal results.


              A deterministic `orderby` expression should be used when retrieving multiple pages.


              ##### First page using GET


              ```http

              GET /v4/search/journals?q=language:en&orderby=title:asc&limit=20&offset=0

              ```


              ##### Second page using GET


              ```http

              GET /v4/search/journals?q=language:en&orderby=title:asc&limit=20&offset=20

              ```


              ##### First page using POST


              ```json

              {
                "q": "language:en",
                "orderby": [
                  "title:asc"
                ],
                "limit": 20,
                "offset": 0
              }

              ```


              ##### Second page using POST


              ```json

              {
                "q": "language:en",
                "orderby": [
                  "title:asc"
                ],
                "limit": 20,
                "offset": 20
              }

              ```


              The offset is calculated as:


              ```text

              offset = page size × number of previous pages

              ```


              #### Responses


              | Status | Description |

              | --- | --- |

              | `200` | The Journal search was completed successfully. |

              | `400` | The request contains an invalid query, unsupported field, invalid facet, or invalid response-control parameter. |

              | `401` | Authentication credentials are missing or invalid. |

              | `413` | The POST request body exceeds the permitted size. |

              | `429` | The API request limit has been exceeded. |

              | `500` | An unexpected server error occurred. |
          - divider: false
            border: false
            id: journals-api-relationship-oriented-endpoints
            title: Relationship-oriented endpoints
            descriptionAbout: >-
              
              Relationship-oriented endpoints provide convenient access to graph entities connected to a Journal.


              Related entity records are not embedded in the standard Journal response.


              #### Outputs for a Journal


              ```http

              GET /v4/journals/{journalId}/outputs

              ```


              Retrieves Output records published in or associated with the Journal.


              Equivalent Output search:


              ```http

              GET /v4/search/outputs?q=journalId:{journalId}

              ```


              Equivalent POST search:


              ```json

              {
                "q": "journalId:{journalId}"
              }

              ```


              Example request:


              ```bash

              curl --request GET \
                --url "https://api.core.ac.uk/v4/journals/12345/outputs?select=coreId,title,yearPublished,doi&orderby=yearPublished:desc&count=true&limit=10&offset=0" \
                --header "Authorization: Bearer YOUR_API_KEY"
              ```


              Example response:


              ```json

              {
                "totalHits": 2,
                "results": [
                  {
                    "coreId": 216874849,
                    "title": "Advances in Open Science Infrastructure",
                    "yearPublished": 2025,
                    "doi": "10.1234/example.5678"
                  },
                  {
                    "coreId": 216874850,
                    "title": "Repositories and scholarly communication",
                    "yearPublished": 2024,
                    "doi": "10.1234/example.9123"
                  }
                ]
              }

              ```


              An existing Journal with no associated Outputs returns a `200` response with an empty `results` array.


              #### Journals for a Data Provider


              ```http

              GET /v4/data-providers/{dataProviderId}/journals

              ```


              Retrieves Journals supplied by or associated with a Data Provider.


              Equivalent Journal search:


              ```http

              GET /v4/search/journals?q=dataProviderId:{dataProviderId}

              ```


              Equivalent POST search:


              ```json

              {
                "q": "dataProviderId:{dataProviderId}"
              }

              ```


              This endpoint should be documented primarily under the Data Provider entity.


              #### Journals for an Institution


              ```http

              GET /v4/institutions/{institutionId}/journals

              ```


              Retrieves Journals associated with or hosted by an Institution.


              Equivalent Journal search:


              ```http

              GET /v4/search/journals?q=institutionId:{institutionId}

              ```


              Equivalent POST search:


              ```json

              {
                "q": "institutionId:{institutionId}"
              }

              ```


              This endpoint should be documented primarily under the Institution entity.
      - item: Institutions
        sections:
          - divider: false
            border: false
            id: institutions-api-introduction
            title: Introduction
            descriptionAbout: >-
              The Institution entity represents universities, research
              organisations, healthcare organisations, companies, government
              bodies, funders, archives, and other organisations participating
              in the scholarly communication graph.


              Institutions may be associated with:


              * Authors through Affiliation records;

              * Data Providers that they operate or host;

              * other Institutions through hierarchical, historical, or related-organisation relationships;

              * Works, Projects, Grants, and other graph entities through their respective relationship entities.


              Institution metadata is primarily sourced from the Research Organization Registry (ROR). It may be enriched with identifiers, names, hierarchy information, publication metrics, and other information from other data sources.


              The diagram below illustrates the principal Institution relationships.
            images:
              - file: /images/docs-graph/institutions.png
            subTitle: An Institution may employ or host multiple Authors through Affiliation
              records. An Institution may also operate multiple Data Providers,
              such as institutional repositories or journal platforms.
          - divider: false
            border: false
            id: institutions-api-data-structure
            title: Data structure
            descriptionAbout: >-
              The tables below describe the top-level fields in the CORE Graph
              metadata schema for the Institution entity.


              #### Identifiers


              The identifiers properties contain the internal CORE identifier for the Institution entity and identifiers from external organisation identifier systems.


              | **Attribute** | **Type**  | **Example value**                   | **Description**                                                                                                   | **Source**     |

              | ------------- | --------- | ----------------------------------- | ----------------------------------------------------------------------------------------------------------------- | -------------- |

              | institutionId | integer   | `1256`                              | CORE internal identifier for the Institution entity.                                                              | CORE           |

              | rorId         | string    | `"https://ror.org/05mzfcs16"`       | ROR identifier for the Institution, when available.                                                               | ROR            |

              | openalexId    | string    | `"https://openalex.org/I123456789"` | OpenAlex identifier for the Institution, when available.                                                          | OpenAlex       |

              | gridId        | string\[] | `["grid.10837.3d"]`                 | GRID identifiers associated with the Institution, when available.                                                 | ROR            |

              | isniId        | string\[] | `["0000 0000 9606 9301"]`           | ISNI identifiers associated with the Institution, when available.                                                 | ROR            |

              | wikidataId    | string\[] | `["Q2413375"]`                      | Wikidata identifiers associated with the Institution, when available.                                             | ROR            |

              | ofrId         | string\[] | `["100008509"]`                     | Crossref Open Funder Registry identifiers associated with the Institution. Formerly known as FundRef identifiers. | ROR / Crossref |


              #### Names


              Names for the organisation include acronyms, alternative names, former names, and the preferred display name. Name variants may include a two-letter ISO 639 language code when the language is known.


              | **Attribute**   | **Type**  | **Example value**                           | **Description**                                                                                                               | **Source**     |

              | --------------- | --------- | ------------------------------------------- | ----------------------------------------------------------------------------------------------------------------------------- | -------------- |

              | displayName     | string    | `"The Open University"`                     | Preferred display name for the Institution.                                                                                   | ROR / OpenAlex |

              | displayNameLang | string    | `"en"`                                      | ISO 639 language code for the preferred display name, when known.                                                             | ROR            |

              | acronym         | string    | `"OU"`                                      | Preferred acronym or short name for the Institution, when available.                                                          | ROR            |

              | altNames        | string\[] | `["Y Brifysgol Agored", "Open University"]` | Alternative names, multilingual labels, aliases, former names, and other non-preferred names associated with the Institution. | ROR            |


              #### Location


              Location information may include continent, country, country subdivision, coordinates, and city. ROR location information is derived from GeoNames.


              | **Attribute** | **Type** | **Example value**  | **Description**                                                                            | **Source** |

              | ------------- | -------- | ------------------ | ------------------------------------------------------------------------------------------ | ---------- |

              | countryCode   | string   | `"GB"`             | ISO 3166-1 alpha-2 country code for the Institution.                                       | ROR        |

              | countryName   | string   | `"United Kingdom"` | Human-readable country name corresponding to `countryCode`.                                | ROR        |

              | continentCode | string   | `"EU"`             | Code representing the continent in which the Institution is located.                       | ROR        |

              | continentName | string   | `"Europe"`         | Human-readable name of the continent in which the Institution is located.                  | ROR        |

              | city          | string   | `"Milton Keynes"`  | City associated with the Institution, when known.                                          | OpenAlex   |

              | regionCode    | string   | `"ENG"`            | Code associated with the first-level country subdivision.                                  | ROR        |

              | region        | string   | `"England"`        | Region, state, province, or other first-level subdivision associated with the Institution. | OpenAlex   |

              | latitude      | number   | `52.04172`         | Latitude of the Institution’s location, when available.                                    | ROR        |

              | longitude     | number   | `-0.75583`         | Longitude of the Institution’s location, when available.                                   | ROR        |


              #### Links


              The Institution record may include its primary website, recognised domains, and additional external links.


              | **Attribute**   | **Type**  | **Example value**                                                                       | **Description**                                                               | **Source** |

              | --------------- | --------- | --------------------------------------------------------------------------------------- | ----------------------------------------------------------------------------- | ---------- |

              | websiteUrl      | string    | `"https://www.open.ac.uk/"`                                                             | Official website URL of the Institution.                                      | ROR        |

              | domains         | string\[] | `["open.ac.uk"]`                                                                        | Internet domains known to belong to the Institution.                          | ROR        |

              | additionalLinks | object\[] | `[{"type": "wikipedia", "value": "https://en.wikipedia.org/wiki/The_Open_University"}]` | Additional links associated with the Institution, such as its Wikipedia page. | ROR        |


              #### Repositories


              Repositories hosted by the Institution are represented using information from the CORE Data Provider entity.


              | **Property**            | **Type**  | **Example value**           | **Description**                                                                        | **Source** |

              | ----------------------- | --------- | --------------------------- | -------------------------------------------------------------------------------------- | ---------- |

              | dataProviderId          | integer   | `86`                        | Unique CORE identifier for the Data Provider.                                          | CORE       |

              | dataProviderName        | string    | `"Open Research Online"`    | Name of the repository or Data Provider.                                               | CORE       |

              | hostOrganisationId      | string    | `"1256"`                    | CORE identifier of the hosting Institution.                                            | CORE       |

              | hostOrganisationName    | string    | `"The Open University, UK"` | Name of the hosting Institution.                                                       | CORE       |

              | hostOrganisationLineage | string\[] | `["1256"]`                  | Ordered identifiers representing the hierarchical lineage of the hosting organisation. | CORE       |


              #### Institution type and status


              These properties describe the Institution’s classifications and operational state.


              | **Property** | **Type**  | **Example value**         | **Description**                                                                               | **Source** |

              | ------------ | --------- | ------------------------- | --------------------------------------------------------------------------------------------- | ---------- |

              | types        | string\[] | `["education", "funder"]` | One or more normalised Institution types obtained from ROR or predicted by the CORE ML model. | ROR / CORE |

              | status       | string    | `"active"`                | Current status of the Institution: `active`, `inactive`, or `withdrawn`.                      | ROR        |


              Supported Institution types may include:


              | **Value**  | **Description**                                         |

              | ---------- | ------------------------------------------------------- |

              | education  | University, college, or other educational organisation. |

              | funder     | Organisation that funds research.                       |

              | healthcare | Hospital, healthcare provider, or medical organisation. |

              | company    | Commercial organisation.                                |

              | archive    | Archive, library, museum, or similar organisation.      |

              | nonprofit  | Nonprofit organisation.                                 |

              | government | Government organisation or agency.                      |

              | facility   | Research facility or research infrastructure.           |

              | other      | Organisation not represented by another category.       |


              #### Relationships


              An Institution may have one or more relationships with other organisations. Supported relationships include parent, child, related, predecessor, and successor.


              | **Property**     | **Type**  | **Example value**                | **Description**                                                    | **Source**     |

              | ---------------- | --------- | -------------------------------- | ------------------------------------------------------------------ | -------------- |

              | institutionId    | integer   | `1256`                           | CORE identifier of the related Institution, when resolved.         | CORE           |

              | rorId            | string    | `"https://ror.org/01c3xc117"`    | ROR identifier of the related Institution.                         | OpenAlex / ROR |

              | displayName      | string    | `"University of Michigan–Flint"` | Display name of the related Institution.                           | OpenAlex / ROR |

              | countryCode      | string    | `"US"`                           | ISO 3166-1 alpha-2 country code of the related Institution.        | OpenAlex       |

              | types            | string\[] | `["education", "funder"]`        | Types assigned to the related Institution.                         | OpenAlex       |

              | relationshipType | string    | `"related"`                      | Type of relationship between the current and related Institutions. | OpenAlex / ROR |


              Supported relationship types are:


              | **Value**   | **Description**                                                                           | **Source** |

              | ----------- | ----------------------------------------------------------------------------------------- | ---------- |

              | parent      | The related Institution is a parent organisation of the current Institution.              | ROR        |

              | child       | The related Institution is a child or subsidiary organisation of the current Institution. | ROR        |

              | related     | The Institutions have a non-hierarchical relationship.                                    | ROR        |

              | predecessor | The related Institution historically preceded the current Institution.                    | ROR        |

              | successor   | The related Institution succeeded or replaced the current Institution.                    | ROR        |


              #### Dates


              These properties describe when the record was created or modified and when the Institution was established.


              | **Property**    | **Type** | **Example value** | **Description**                                             | **Source** |

              | --------------- | -------- | ----------------- | ----------------------------------------------------------- | ---------- |

              | createdAt       | string   | `"2018-11-14"`    | Date when the Institution record was originally created.    | CORE       |

              | updatedAt       | string   | `"2024-12-11"`    | Date when the Institution record was most recently updated. | CORE       |

              | establishedYear | integer  | `1966`            | Year in which the Institution was established.              | ROR        |


              ### Topics


              Topics describe the research areas associated with the Institution. Each topic may include its position within a topic classification hierarchy.


              | **Property** | **Type** | **Example value**                                         | **Description**                                                                | **Source**      |

              | ------------ | -------- | --------------------------------------------------------- | ------------------------------------------------------------------------------ | --------------- |

              | topicId      | string   | `"23"`                                                    | CORE identifier for the topic.                                                 | CORE            |

              | displayName  | string   | `"Particle physics theoretical and experimental studies"` | Display name of the topic.                                                     | CORE            |

              | count        | integer  | `6107`                                                    | Number of works or associations contributing to the topic for the Institution. | CORE            |

              | score        | number   | `1`                                                       | Relevance score for the topic’s association with the Institution.              | CORE            |

              | subfieldId   | string   | `"67"`                                                    | Identifier of the subfield to which the topic belongs.                         | CORE            |

              | subfieldName | string   | `"Nuclear and High Energy Physics"`                       | Name of the subfield associated with the topic.                                | CORE / OpenAlex |

              | fieldId      | string   | `"96"`                                                    | CORE identifier for the broader field.                                         | CORE            |

              | fieldName    | string   | `"Physics and Astronomy"`                                 | Name of the broader field associated with the topic.                           | CORE / OpenAlex |

              | domainId     | string   | `"56"`                                                    | CORE identifier for the highest-level domain.                                  | CORE            |

              | domainName   | string   | `"Physical Sciences"`                                     | Name of the highest-level domain associated with the topic.                    | CORE / OpenAlex |


              #### Citation metrics


              Citation metrics provide yearly publication and citation statistics for the Institution.


              | **Property** | **Type** | **Example value** | **Description**                                                                       | **Source** |

              | ------------ | -------- | ----------------- | ------------------------------------------------------------------------------------- | ---------- |

              | year         | integer  | `2024`            | Year for which the metrics are reported.                                              | OpenAlex   |

              | worksCount   | integer  | `24125`           | Total number of Works associated with the Institution in that year.                   | OpenAlex   |

              | oaWorksCount | integer  | `16994`           | Number of open-access Works associated with the Institution in that year.             | OpenAlex   |

              | citedByCount | integer  | `123548`          | Total number of citations received by the Institution’s Works published in that year. | OpenAlex   |




              Example Institution record:


              ```

              {
                "institutionId": 1256,
                "rorId": "https://ror.org/05mzfcs16",
                "openalexId": "https://openalex.org/I123456789",
                "gridId": [
                  "grid.10837.3d"
                ],
                "isniId": [
                  "0000 0000 9606 9301"
                ],

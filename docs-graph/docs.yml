items:
  - item: Overview
    children:
      - item: null
        sections:
          - id: core-graph-api
            title: CORE Graph API
            descriptionAbout: >-
              The CORE Graph API provides structured access to CORE’s global
              scholarly knowledge graph. It connects research works with their
              manifestations, creators, organisations, publication venues,
              funding, projects, topics, and citation relationships.


              CORE aggregates metadata and full text from a global network of repositories, journals, and other scholarly sources. Records collected from these sources are normalised, enriched, and linked to create consistent entities and relationships.


              Rather than exposing scholarly metadata only as isolated search records, the Graph API makes these connections directly accessible.


              The Graph API exposes this information through three complementary forms of access:


              | **Access pattern**      | **Description**                                                                                                                 |

              | ----------------------- | ------------------------------------------------------------------------------------------------------------------------------- |

              | Entity retrieval        | Retrieves a specific entity using its canonical CORE identifier.                                                                |

              | Relationship navigation | Retrieves entities connected to a specific resource.                                                                            |

              | Search and discovery    | Discovers entities using keyword search, structured conditions, facets, vector search, hybrid search, ordering, and pagination. |


              Example endpoints:


              ```http

              GET /v4/works/{workId}

              GET /v4/works/{workId}/outputs

              GET /v4/works/{workId}/authorships

              GET /v4/authors/{authorId}/affiliations

              GET /v4/institutions/{institutionId}/data-providers

              GET /v4/search/works

              POST /v4/search/works

              ```


              The API is graph-oriented, but it is exposed through REST operations rather than requiring clients to submit GraphQL queries.


              #### Why a Graph API?


              Scholarly information is inherently interconnected.


              A research Work may:


              * have several source-specific manifestations collected from different Data Providers;

              * be attributed to several Authors;

              * associate those Authors with Institutions through Affiliations;

              * be published in a Journal by a Publisher;

              * result from a Project or Grant;

              * acknowledge one or more Funders;

              * be associated with several research Topics;

              * cite, or be cited by, other Works.


              Representing this information as one flattened record creates duplication and makes it difficult to distinguish canonical information from source-specific evidence.


              For example, the same research article may be available from an institutional repository, a subject repository, and a Journal platform. Each source may supply different titles, Author-name forms, dates, URLs, licences, or access information. Combining all of these values into one record can obscure their provenance and create repeated or conflicting metadata.


              The CORE Graph API instead separates the major concepts:


              Canonical Work


              * represented by one or more Outputs

              *  connected to Authors through Authorships

              *  connected to Institutions through Affiliations

              *  published through Journals and Publishers

              *  associated with Topics, Projects and Grants

              *  connected to other Works through Citations


              This model allows users to retrieve a canonical Work while still navigating to the source records and relationships that support it.




              #### What makes the CORE Graph API distinctive?


              The Graph API combines CORE’s global repository network and full-text collection with metadata and identifiers from trusted scholarly sources such as ROR, Crossref, OpenCitations, DOAJ etc.


              Its distinctive features include:


              * Works and Outputs are modelled separately. A Work represents the deduplicated scholarly work, while Outputs represent the individual manifestations collected from repositories, journals and other data providers.

              * Provenance is preserved. Canonical entities remain connected to the source Outputs and Data Providers from which their information was derived.

              * Authorship is a first-class entity. The relationship between an Author and a Work can carry its own information, including author order, corresponding-author status, raw names and supporting source Outputs.

              * Affiliations are modelled independently. Authors can be connected to Institutions through resolved or unresolved affiliation records, while retaining the affiliation text supplied by the source. It also provides the employment history of authors over a period of time.

              * External scholarly identifiers are reconciled. CORE entities can be linked to established identifiers such as DOI, ORCID, ROR, ISSN and identifiers supplied by Crossref, DataCite and other sources.

              * Search and graph navigation are both supported. Users can discover entities through search endpoints and follow explicit relationships through entity and relationship endpoints.

              * Metadata and full text are brought together. CORE’s aggregated metadata is connected with its large collection of openly available research full text.


              The API is designed for applications including scholarly search, discovery, bibliometric analysis, research intelligence, institutional analytics, citation analysis, metadata enrichment and machine-learning research.
            subTitle: null
            subDescription: null
          - divider: false
            border: false
            id: "#core-graph-design-principles"
            title: Design principles
            descriptionAbout: >-
              ##### Canonical entities and source records are separated


              Works and Outputs are modelled independently.


              A Work represents the canonical, deduplicated scholarly research object. An Output represents one source-specific record or manifestation harvested from a Data Provider.


              This separation allows CORE to provide deduplicated discovery through Works while preserving the original metadata, access information, and provenance of each Output.


              ##### Provenance is preserved


              Canonical records remain connected to the Outputs and Data Providers from which their information was derived.


              Source-specific values such as the following remain available through Output and Data Provider relationships:


              * Raw identifiers

              * Source-provided URLs

              * Access rights

              * Licence information

              * Deposit dates

              * Full-text locations


              ##### Relationships can contain their own metadata


              Some relationships are represented as first-class entities because the relationship itself contains important information.


              For example, Authorship is not represented as a simple list of Author identifiers. It may include:


              * The Author’s position in the Author list

              * The raw name supplied by the source

              * Whether the Author is corresponding

              * Whether the Author is first named

              * The source Outputs supporting the relationship


              Similarly, an Affiliation may include:


              * The original affiliation string

              * A resolved Institution

              * Department information

              * Start and end dates

              * Whether the Affiliation is current

              * The Works providing evidence for the association


              #### Resolved and unresolved information can coexist


              The Graph API retains source-provided values even when they cannot be resolved to canonical entities.


              For example, an Affiliation may contain a `rawAffiliation` value without an `institutionId`. This preserves the original evidence and allows the record to be resolved later as CORE’s matching systems improve.


              ##### External identifiers are reconciled


              CORE entities may be connected to identifiers from established scholarly systems.


              | **Entity**             | **Example identifiers**                                              |

              | ---------------------- | -------------------------------------------------------------------- |

              | Works and Outputs      | DOI, OAI identifier, arXiv ID, PMID, PMCID, OpenAlex ID, OpenAIRE ID |

              | Authors                | ORCID, OpenAlex Author ID, OpenAIRE Author ID                        |

              | Institutions           | ROR ID, OpenAlex Institution ID, GRID ID, ISNI, Wikidata ID          |

              | Journals               | ISSN, electronic ISSN, print ISSN, DOAJ ID                           |

              | Publishers and Funders | Crossref and DataCite identifiers                                    |


              Frequently used identifiers may be exposed as top-level convenience fields, while the complete identifier set is retained in structured identifier collections.


              ##### Metadata and full text are connected


              CORE combines structured scholarly metadata with its collection of openly available research full text.


              Where available, Works and Outputs may provide:


              * Titles

              * Inverted abstracts

              * Full text

              * Identifiers

              * Dates

              * Publication types

              * Access information

              * Language

              * Subject classifications

              * Sustainable Development Goal classifications

              * Links to source and CORE resources


              This supports metadata-based discovery, full-text search, semantic retrieval, and machine-learning applications.
          - divider: false
            border: false
            id: "#core-graph-core-data-model"
            title: CORE data model
            descriptionAbout: >-
              The CORE Graph API data model contains the following principal
              entities.


              | **Entity**     | **Description**                                                                                                                                          |

              | -------------- | -------------------------------------------------------------------------------------------------------------------------------------------------------- |

              | Works          | Canonical, deduplicated, and harmonised representations of scholarly research, independent of individual source manifestations.                          |

              | Outputs        | Source-specific records or manifestations of Works collected from repositories, Journals, Publisher platforms, and other Data Providers.                 |

              | Authors        | Canonical representations of people associated with scholarly Works.                                                                                     |

              | Authorships    | Relationships connecting Authors to Works, including Author order, corresponding-Author status, raw names, and source evidence.                          |

              | Affiliations   | Associations between Authors and Institutions, retaining resolved Institution information and the original source-provided affiliation text.             |

              | Institutions   | Research organisations normalised using sources such as ROR and OpenAlex.                                                                                |

              | Citations      | Directed relationships connecting a citing Work to a cited Work, enriched using sources such as OpenCitations where available.                           |

              | Topics         | Research subjects or concepts assigned to Works, Outputs, Institutions, or other entities.                                                               |

              | Projects       | Research projects associated with Works, Grants, Funders, Authors, or Institutions.                                                                      |

              | Grants         | Funding awards associated with Works, Projects, Funders, Authors, or Institutions.                                                                       |

              | Funders        | Organisations that provide research funding, normalised using sources including Crossref and other funding registries.                                   |

              | Publishers     | Organisations responsible for publishing or hosting Journals and scholarly Outputs.                                                                      |

              | Journals       | Scholarly publication venues in which Outputs are published.                                                                                             |

              | Data Providers | Sources from which CORE collects Outputs, including institutional repositories, subject repositories, preprint servers, Journals, and other collections. |
          - border: false
            descriptionAbout: The following diagram presents a simplified view of the main
              graph relationships.
            title: Principal relationships
            images:
              - file: /images/docs-graph/data-model.png
            subTitle: ""
            divider: false
            id: core-graph-principal-relationships
            subDescription: The diagram shows principal relationships only. Complete fields,
              cardinalities, and relationship endpoints are documented on the
              relevant entity pages.
            contentBlocks: []
          - divider: false
            border: false
            id: core-graph-resource-and-endpoint-patterns
            title: Resource and endpoint patterns
            descriptionAbout: >-
              
              The Graph API uses consistent resource patterns.


              #### Single entity


              Retrieves a single entity using its canonical CORE identifier.


              ```http

              GET /v4/{entity}/{id}

              ```


              Examples:


              ```http

              GET /v4/works/323030168

              GET /v4/outputs/216874849

              GET /v4/institutions/1256

              ```


              #### Search


              Searches and discovers entities using either `GET` or `POST`.


              ```http

              GET /v4/search/{entity}

              POST /v4/search/{entity}

              ```


              Examples:


              ```http

              GET /v4/search/works

              POST /v4/search/outputs

              GET /v4/search/institutions

              ```


              #### Relationship navigation


              Retrieves entities connected to a specific resource.


              ```http

              GET /v4/{entity}/{id}/{relatedEntity}

              ```


              Examples:


              ```http

              GET /v4/works/323030168/outputs

              GET /v4/works/323030168/authorships

              GET /v4/authors/67890/affiliations

              GET /v4/institutions/1256/data-providers

              ```


              Relationship endpoints are convenience operations over graph connections. Where possible, the equivalent search query is documented alongside the endpoint.
          - divider: false
            border: false
            id: graph-api-common-response-conventions
            title: Common response conventions
            descriptionAbout: >-
              The CORE Graph API uses consistent response structures for
              single-entity and collection operations. Individual endpoint pages
              document any additional response properties specific to that
              operation.


              #### Single-entity responses


              An operation that retrieves one entity returns the entity directly.


              ```http

              GET /v4/works/323030168

              ```


              ```json

              {
                "workId": 323030168,
                "title": "High energy particle interactions",
                "yearPublished": 2025
              }

              ```


              If no entity exists for the supplied canonical identifier, the API returns an error response rather than an empty object. See the Errors documentation for the applicable HTTP status codes and response structure.


              #### Collection responses


              Search and relationship operations that return collections use a `results` array:


              ```json

              {
                "totalHits": 15482,
                "results": [
                  {
                    "workId": 323030168,
                    "title": "High energy particle interactions",
                    "yearPublished": 2025
                  },
                  {
                    "workId": 323030169,
                    "title": "Experimental studies in particle physics",
                    "yearPublished": 2024
                  }
                ]
              }

              ```


              Some operations may add properties such as facets or grouped results. These are documented on the relevant endpoint or Search page.


              #### Counting and pagination


              The following properties and parameters control the number and position of the results returned:


              | **Name**    | **Location** | **Type**  | **Default** | **Description**                                                                                                          |

              | ----------- | ------------ | --------- | ----------- | ------------------------------------------------------------------------------------------------------------------------ |

              | `results`   | Response     | object\[] | —           | Contains the entities returned for the current request. The array is always present in a successful collection response. |

              | `totalHits` | Response     | integer   | —           | Total number of matching entities before `limit` and `offset` are applied. Returned when `count=true`.                   |

              | `count`     | Request      | boolean   | `false`     | Determines whether `totalHits` is included in the response.                                                              |

              | `limit`     | Request      | integer   | `10`        | Maximum number of results to return. A response may contain fewer results when fewer matches are available.              |

              | `offset`    | Request      | integer   | `0`         | Zero-based number of matching results to skip before returning the current result set.                                   |


              `count`, `limit`, and `offset` are request parameters. They are not repeated as properties in the response.


              For example:


              ```http

              GET /v4/search/works?q="particle physics"&count=true&limit=10&offset=20

              ```


              This request skips the first 20 matching Works and returns up to 10 subsequent results. When `count=true`, `totalHits` represents all matching Works, not only the Works returned in the current response.


              #### Empty results


              A successful collection operation with no matching entities returns HTTP `200 OK` with an empty `results` array.


              When `count=true`:


              ```json

              {
                "totalHits": 0,
                "results": []
              }

              ```


              When `count` is omitted or set to `false`:


              ```json

              {
                "results": []
              }

              ```


              An empty collection is different from an unsuccessful request. Invalid requests and attempts to retrieve a single entity that does not exist return an error response.


              #### Null, empty, and omitted values


              The API distinguishes between `null` values, empty collections, and omitted fields:


              | **Representation** | **Meaning**                                                                                                                                                 |

              | ------------------ | ----------------------------------------------------------------------------------------------------------------------------------------------------------- |

              | `null`             | The field is applicable, but no value is available, known, or resolved.                                                                                     |

              | `[]`               | A multi-valued field was returned but contains no values.                                                                                                   |

              | Field omitted      | The field was excluded using `select`, is not part of that endpoint’s response representation, or is conditionally unavailable as documented for the field. |


              For example, an Affiliation may preserve its original affiliation text even when it has not been resolved to a canonical Institution:


              ```json

              {
                "affiliationId": "A12345",
                "rawAffiliation": "Department of Example Studies, Example University",
                "institutionId": null,
                "evidenceWorkIds": []
              }

              ```


              In this example:


              * `institutionId: null` indicates that no canonical Institution has been resolved.

              * `evidenceWorkIds: []` indicates that the returned evidence collection is empty.
          - divider: false
            border: false
            id: graph-api-naming-conventions
            title: Naming conventions
            descriptionAbout: >-
              The following naming conventions are used throughout the Graph
              API.


              | **Convention**                                                                            | **Example**                                     |

              | ----------------------------------------------------------------------------------------- | ----------------------------------------------- |

              | Data-model entities are written using singular or plural title case according to context. | `Work`, `Works`, `Author`, `Authors`            |

              | Collection resource paths use lowercase plural nouns.                                     | `/works`, `/authors`, `/authorships`            |

              | Multiword resource paths use hyphens.                                                     | `/data-providers`                               |

              | Search endpoints follow `/search/{entity}`.                                               | `/search/works`                                 |

              | Canonical identifiers use the singular entity name followed by `Id`.                      | `workId`, `authorId`, `institutionId`           |

              | Relationship endpoints use nested resource paths.                                         | `/works/{workId}/authorships`                   |

              | Field names use camel case.                                                               | `displayName`, `isCorresponding`, `createdDate` |

              | Boolean properties normally begin with `is`, `has`, or `can`.                             | `isCurrent`, `hasApc`, `canDownload`            |

              | Fields containing multiple values are represented as arrays.                              | `countries`, `keywords`, `coreIds`              |

              | Date and date-time values use ISO 8601 notation.                                          | `2026-07-01T14:20:00Z`                          |

              | External identifiers retain recognised source terminology where appropriate.              | `doi`, `orcidId`, `rorId`, `issns`              |


              #### Identifier naming


              The canonical identifier of each Graph entity uses a dedicated CORE field:


              | **Entity**    | **Canonical identifier** |

              | ------------- | ------------------------ |

              | Work          | `workId`                 |

              | Output        | `coreId`                 |

              | Author        | `authorId`               |

              | Authorship    | `authorshipId`           |

              | Affiliation   | `affiliationId`          |

              | Institution   | `institutionId`          |

              | Journal       | `journalId`              |

              | Publisher     | `publisherId`            |

              | Data Provider | `dataProviderId`         |


              External identifiers are separate from canonical CORE identifiers.


              #### Terminology and definitions


              | **Term**              | **Definition**                                                                                                                                  |

              | --------------------- | ----------------------------------------------------------------------------------------------------------------------------------------------- |

              | API                   | The complete interface through which clients access CORE Graph data.                                                                            |

              | Graph                 | A data model consisting of entities and typed relationships between them.                                                                       |

              | Entity                | A distinct concept represented in the graph, such as a Work, Author, Output, or Institution.                                                    |

              | Canonical entity      | A normalised CORE representation that reconciles information from one or more sources.                                                          |

              | Source record         | A record supplied by an external Data Provider. Outputs are source records.                                                                     |

              | Relationship          | A typed connection between entities, such as an Authorship connecting an Author and a Work.                                                     |

              | Relationship entity   | A relationship represented as its own entity because it contains metadata, such as Authorship or Affiliation.                                   |

              | Resource              | The API representation of an entity or collection.                                                                                              |

              | Endpoint              | An API path that exposes a resource or operation, such as `/v4/works/{workId}`.                                                                 |

              | Path                  | The URL component that identifies an endpoint.                                                                                                  |

              | HTTP method           | The action applied to an endpoint, such as `GET` or `POST`.                                                                                     |

              | Operation             | The combination of an HTTP method and an endpoint.                                                                                              |

              | Parameter             | A value supplied in a path, query string, header, or request body to control an operation.                                                      |

              | Request               | The HTTP message sent by a client to an API operation.                                                                                          |

              | Response              | The result returned by an operation, including an HTTP status code and optionally a body.                                                       |

              | Search endpoint       | An endpoint used to discover entities through keyword search, structured conditions, vector search, ordering, facets, or pagination.            |

              | Relationship endpoint | An endpoint used to retrieve resources connected to a particular entity.                                                                        |

              | Field                 | A named property contained in an entity or response.                                                                                            |

              | Facet                 | A value bucket and count used to summarise search results by a supported field.                                                                 |

              | Vector search         | Search based on semantic similarity between embedding vectors.                                                                                  |

              | Hybrid search         | Search that combines keyword relevance and vector similarity.                                                                                   |

              | Provenance            | Information describing the source records, Data Providers, and evidence from which data was obtained.                                           |

              | Function              | A client-library or application-level term. This documentation describes API behaviour primarily using operations, endpoints, and HTTP methods. |


              #### HTTP methods


              The documentation uses HTTP methods to describe the behaviour of an operation.


              ##### GET


              `GET` retrieves:


              * A single entity

              * A collection of related entities

              * Search results


              A `GET` operation does not create or modify an entity.


              Examples:


              ```http

              GET /v4/works/{workId}

              GET /v4/works/{workId}/outputs

              GET /v4/search/works

              ```


              ##### POST


              `POST` submits a request body to an operation.


              In the Graph API, `POST` may be used for read-only search when a request is too complex or large to represent safely as URL query parameters.


              For example:


              ```http

              POST /v4/search/works

              ```


              ```json

              {
                "q": "\"text and data mining\" AND yearPublished>=2020",
                "searchMode": "hybrid",
                "select": [
                  "workId",
                  "title",
                  "yearPublished"
                ],
                "limit": 10
              }

              ```


              This `POST` operation performs a search. It does not create a Work.


              Whether `POST` creates a resource or performs another action depends on the definition of the endpoint.


              #### Endpoints and operations


              An endpoint is the path alone:


              ```http

              /v4/works/{workId}

              ```


              An operation combines the HTTP method and endpoint:


              ```http

              GET /v4/works/{workId}

              ```


              The endpoint identifies the resource. The HTTP method identifies the action performed on that resource.
          - divider: false
            border: false
            id: "#graph-api-quick-start"
            title: Quick start
            descriptionAbout: >-
              
              This guide shows how to authenticate, search for Works, retrieve a specific Work, and navigate from the canonical Work to its source-specific Outputs.


              > **Development status:** The CORE Graph API v4 is under active development. Some endpoints, fields, and search capabilities may not yet be available for every entity and may change before the stable release.


              #### Before you begin


              To use the CORE Graph API, you need:


              - A [CORE API key](https://core.ac.uk/services/api)

              - An HTTP client such as cURL

              - The Graph API base URL: [https://api.core.ac.uk/v4](https://api.core.ac.uk/v4)


              Include your API key as a Bearer token in the `Authorization` header:


              ```http

              Authorization: Bearer YOUR_API_KEY

              ```


              Replace `YOUR_API_KEY` in the examples below with your API key.


              #### Search for Works


              The following operation searches for canonical Works containing the phrase `particle physics`:


              ```http

              GET /v4/search/works?q="particle physics"&searchMode=keyword&select=workId,title,yearPublished&count=true&limit=2

              ```


              The runnable cURL command uses a percent-encoded URL:


              ```bash

              curl --request GET \
                --url "https://api.core.ac.uk/v4/search/works?q=%22particle%20physics%22&searchMode=keyword&select=workId%2Ctitle%2CyearPublished&count=true&limit=2" \
                --header "Authorization: Bearer YOUR_API_KEY"
              ```


              The request uses the following parameters:


              | Parameter | Description |

              | --- | --- |

              | `q` | Contains the search expression. Quotation marks identify a phrase. |

              | `searchMode` | Selects the retrieval method. This example uses keyword search. |

              | `select` | Limits each result to the specified fields. |

              | `count` | Adds `totalHits` to the response. |

              | `limit` | Sets the maximum number of results returned. |


              An abbreviated response may contain:


              ```json

              {
                "totalHits": 15482,
                "results": [
                  {
                    "workId": 323030168,
                    "title": "High energy particle interactions",
                    "yearPublished": 2025
                  },
                  {
                    "workId": 323030169,
                    "title": "Experimental studies in particle physics",
                    "yearPublished": 2024
                  }
                ]
              }

              ```


              `results` contains the matching canonical Works. When `count=true`, `totalHits` reports the total number of matching Works independently of the requested `limit`.


              Because the CORE Graph is continually updated, result counts and ordering may change.


              #### Retrieve a Work


              Use a `workId` returned by the search operation to retrieve the complete canonical Work:


              ```http

              GET /v4/works/323030168

              ```


              ```bash

              curl --request GET \
                --url "https://api.core.ac.uk/v4/works/323030168" \
                --header "Authorization: Bearer YOUR_API_KEY"
              ```


              A Work is CORE’s deduplicated and harmonised representation of a scholarly research object. It is independent of the individual source records collected from repositories, journals, and other Data Providers.


              #### Retrieve the Work’s Outputs


              A Work may be represented by several source-specific Outputs. Use the relationship endpoint to retrieve them:


              ```http

              GET /v4/works/323030168/outputs

              ```


              ```bash

              curl --request GET \
                --url "https://api.core.ac.uk/v4/works/323030168/outputs" \
                --header "Authorization: Bearer YOUR_API_KEY"
              ```


              Each Output represents an individual manifestation or source record. Outputs may contain different source identifiers, URLs, licences, access information, deposit dates, metadata, and full-text locations.


              This operation allows you to begin with a deduplicated Work and then inspect the source records and provenance supporting it.


              #### Combine text with structured conditions


              Search expressions can combine unfielded text with field-based conditions. The following operation finds Works containing the phrase `text and data mining` that were published from 2020 onwards:


              ```http

              GET /v4/search/works?q="text and data mining" AND yearPublished>=2020&select=workId,title,yearPublished&limit=10

              ```


              In the runnable cURL command, quotation marks, spaces, and comparison operators are percent-encoded:


              ```bash

              curl --request GET \
                --url "https://api.core.ac.uk/v4/search/works?q=%22text%20and%20data%20mining%22%20AND%20yearPublished%3E%3D2020&select=workId%2Ctitle%2CyearPublished&limit=10" \
                --header "Authorization: Bearer YOUR_API_KEY"
              ```


              CORE query syntax uses explicit operators such as `AND`, `OR`, and `NOT`. See the [Search](search.md) documentation for fielded queries, ranges, grouping, existence checks, facets, ordering, and pagination.


              #### Run a hybrid search


              Works and Outputs support hybrid search, which combines keyword relevance with vector similarity. `POST` can be used for read-only searches containing a JSON request body:


              ```http

              POST /v4/search/works

              ```


              ```bash

              curl --request POST \
                --url "https://api.core.ac.uk/v4/search/works" \
                --header "Authorization: Bearer YOUR_API_KEY" \
                --header "Content-Type: application/json" \
                --data '{
                  "q": "\"text and data mining\" AND yearPublished>=2020",
                  "searchMode": "hybrid",
                  "semanticRanking": true,
                  "select": [
                    "workId",
                    "title",
                    "yearPublished"
                  ],
                  "limit": 10
                }'
              ```


              In this example:


              - `"text and data mining"` provides the text used for keyword and vector retrieval.

              - `yearPublished>=2020` is applied as a structured condition.

              - `semanticRanking=true` reranks the candidates produced by hybrid search.

              - `select` limits the fields included in each result.


              `POST` search is read-only and does not create or modify a Work. Vector, hybrid, and semantic search are supported only for the entities identified in the search capability matrix.
  - item: Entities
    children:
      - item: Works
        sections:
          - divider: false
            border: false
            id: works-api-introduction
            title: Introduction
            descriptionAbout: >-
              The Work entity represents a canonical, deduplicated piece of
              scholarly research.


              Works may include:


              * research articles;

              * conference papers;

              * theses and dissertations;

              * preprints;

              * books and book chapters;

              * reports;

              * datasets;

              * other scholarly research outputs.


              A Work combines and enriches metadata from one or more underlying CORE Outputs harvested from repositories, journals, and other Data Providers.


              Unlike an Output, which represents a particular source-specific manifestation of a research item, a Work represents the deduplicated scholarly object across all known manifestations.
            images:
              - file: /images/docs-graph/works_v2.png
            subTitle: ""
            subDescription: >-
              A Work may:


              * be represented by multiple Outputs;

              * have multiple Authorship records;

              * be associated with one or more Journals;

              * be supplied by multiple Data Providers;

              * contain multiple identifiers, dates, references, contributors, and links.


              #### Work and Output separation


              A Work does not embed complete Output records.


              Instead, the `coreIds` property contains the CORE Output identifiers represented by the Work:


              ```json

              {
                "workId": 323030168,
                "coreIds": [
                  216874849,
                  216874850
                ]
              }

              ```


              Complete Output records are retrieved through the relationship endpoint:


              ```http

              GET /v4/works/{workId}/outputs

              ```


              Outputs do not need to contain a `workId` foreign key. The relationship is resolved through the Work’s `coreIds` collection.


              #### Work and Authorship separation


              Author and Authorship data is not embedded directly in the Work record.


              Work-specific Author information is represented through Authorship records, including:


              - Author rank

              - Author sequence

              - Corresponding-Author status

              - Source-provided Author name

              - Affiliations used on the Work


              Authorship records associated with a Work are retrieved through:


              ```http

              GET /v4/works/{workId}/authorships

              ```
          - divider: false
            border: false
            id: works-api-data-structure
            title: Data structure
            descriptionAbout: >-
              The table below describes the top-level properties in the CORE
              Graph Work schema.


              | **Property**          | **Type**   | **Example value**                                                               | **Description**                                                                                         | **Source**                                                       |

              | --------------------- | ---------- | ------------------------------------------------------------------------------- | ------------------------------------------------------------------------------------------------------- | ---------------------------------------------------------------- |

              | `workId`              | integer    | `323030168`                                                                     | Unique CORE canonical identifier for the Work.                                                          | CORE                                                             |

              | `externalIdentifiers` | object\[]  | `[{"type":"DOI","identifier":"10.1109/jiot.2020.2984887"}]`                     | Structured list of CORE and external identifiers associated with the Work.                              | CORE / Crossref / OAI-PMH / OpenAlex / OpenAIRE / PubMed / arXiv |

              | `title`               | string     | `"Intelligent edge computing for scholarly infrastructures"`                    | Preferred title selected for the canonical Work.                                                        | OAI-PMH / Crossref / OpenAlex / OpenAIRE                         |

              | `abstract`            | string     | `"This paper explores..."`                                                      | Preferred abstract or summary of the Work.                                                              | OAI-PMH / Crossref / OpenAlex / OpenAIRE                         |

              | `invertedAbstract`    | object     | `{"This":[0],"paper":[1],"explores":[2]}`                                       | Abstract represented as an inverted index, where each token maps to its positions in the original text. | Derived by CORE                                                  |

              | `fullText`            | string     | `"The rapid growth of scholarly content..."`                                    | Full-text content associated with the Work.                                                             | Extracted from source full text                                  |

              | `doi`                 | string     | `"10.1109/jiot.2020.2984887"`                                                   | Preferred DOI associated with the Work.                                                                 | Crossref / OAI-PMH                                               |

              | `yearPublished`       | integer    | `2022`                                                                          | Preferred publication year selected from available source metadata.                                     | OAI-PMH / Crossref / OpenAlex / OpenAIRE                         |

              | `documentType`        | string\[]  | `["research article"]`                                                          | Normalised types assigned to the Work.                                                                  | OAI-PMH / Crossref / OpenAlex / OpenAIRE / CORE classification   |

              | `downloadUrl`         | string     | `"https://core.ac.uk/download/216874849.pdf"`                                   | Preferred CORE URL from which the Work full text can be downloaded.                                     | CORE                                                             |

              | `coreIds`             | integer\[] | `[216874849,216874850]`                                                         | CORE Output identifiers represented by the canonical Work.                                              | CORE deduplication                                               |

              | `journalIds`          | integer\[] | `[12345]`                                                                       | CORE Journal identifiers associated with the Work.                                                      | CORE / ISSN resolution                                           |

              | `dataProviderIds`     | integer\[] | `[86,144]`                                                                      | CORE Data Provider identifiers associated with the Work’s source Outputs.                               | CORE                                                             |

              | projectIds | integer[] \| null | [11] | CORE identifiers of Projects records associated with the Work. | OpenAIRE / CORE relationship resolution |

              | `dates`               | object\[]  | `[{"type":"published","value":"2022-04-27"}]`                                   | Structured list of publication, deposit, availability, and CORE record-management dates.                | CORE / Crossref / DataCite / OpenAlex / OpenAIRE / OAI-PMH       |

              | `references`          | object\[]  | `[{"citedDoi":"10.1000/abc456","articleTitle":"Quantum effects in materials"}]` | Bibliographic references cited by the Work.                                                             | Crossref / OpenAIRE / Full-text parsing / OpenCitations          |

              | `contributors`        | object\[]  | `[{"name":"Alice Smith","type":"Personal","role":"editor"}]`                    | People or organisations that contributed to the Work in roles other than Authorship.                    | OAI-PMH / RIOXX / DataCite / Crossref / OpenAIRE                 |

              | `links`               | object\[]  | `[{"type":"reader","url":"https://core.ac.uk/works/323030168"}]`                | CORE and source links associated with the Work.                                                         | CORE / Source metadata                                           |

              | `sourceFulltextUrls`  | string\[]  | `["https://repository.example.edu/paper.pdf"]`                                  | Source URLs from which full text is available.                                                          | OAI-PMH / Repository metadata                                    |


              #### External identifiers


              The `externalIdentifiers` collection retains all known identifiers associated with the Work.


              ```json

              {
                "externalIdentifiers": [
                  {
                    "type": "CORE_ID",
                    "identifier": 323030168
                  },
                  {
                    "type": "DOI",
                    "identifier": "10.1109/jiot.2020.2984887"
                  },
                  {
                    "type": "ARXIV_ID",
                    "identifier": "1909.00560"
                  },
                  {
                    "type": "OAI_ID",
                    "identifier": "oai:arxiv.org:1909.00560"
                  },
                  {
                    "type": "OPENALEX_ID",
                    "identifier": "https://openalex.org/W3030303030"
                  },
                  {
                    "type": "MAG_ID",
                    "identifier": "2139460650"
                  },
                  {
                    "type": "PMID",
                    "identifier": "2844484"
                  },
                  {
                    "type": "PMCID",
                    "identifier": "PMC1234567"
                  },
                  {
                    "type": "OPENAIRE_ID",
                    "identifier": "openaire____::123456789"
                  }
                ]
              }

              ```


              | **Property** | **Type** | **Example value** | **Description**                      |                                        |

              | ------------ | -------- | ----------------- | ------------------------------------ | -------------------------------------- |

              | `type`       | string   | `"DOI"`           | Identifier scheme or classification. |                                        |

              | `identifier` | string   | integer           | `"10.1109/jiot.2020.2984887"`        | Identifier value assigned to the Work. |


              Supported identifier types may include:


              | **Value**     | **Description**                      |

              | ------------- | ------------------------------------ |

              | `CORE_ID`     | CORE canonical Work identifier.      |

              | `DOI`         | Digital Object Identifier.           |

              | `OAI_ID`      | OAI-PMH identifier.                  |

              | `ARXIV_ID`    | arXiv identifier.                    |

              | `OPENALEX_ID` | OpenAlex Work identifier.            |

              | `OPENAIRE_ID` | OpenAIRE identifier.                 |

              | `MAG_ID`      | Microsoft Academic Graph identifier. |

              | `PMID`        | PubMed identifier.                   |

              | `PMCID`       | PubMed Central identifier.           |


              #### Inverted abstract


              The `invertedAbstract` property contains an inverted representation of the abstract.


              ```json

              {
                "invertedAbstract": {
                  "This": [
                    0
                  ],
                  "paper": [
                    1
                  ],
                  "explores": [
                    2
                  ]
                }
              }

              ```


              Each property name represents a token, and the corresponding array contains the positions at which the token appears.


              #### Dates


              Dates are represented as a structured collection as shown below.


              ```json

              {
                "dates": [
                  {
                    "type": "published",
                    "value": "2022-04-27"
                  },
                  {
                    "type": "published_online",
                    "value": "2022-04-27"
                  },
                  {
                    "type": "accepted",
                    "value": "2022-03-15"
                  },
                  {
                    "type": "deposited",
                    "value": "2022-04-28T11:42:34Z"
                  },
                  {
                    "type": "updated",
                    "value": "2024-08-16T00:03:23Z"
                  }
                ]
              }

              ```


              | **Property** | **Type** | **Example value** | **Description**                   |

              | ------------ | -------- | ----------------- | --------------------------------- |

              | `type`       | string   | `"published"`     | Classification of the date.       |

              | `value`      | string   | `"2022-04-27"`    | ISO 8601 date or date-time value. |


              Supported date types may include:


              | **Value**          | **Description**                                                     | **Source**                                          |

              | ------------------ | ------------------------------------------------------------------- | --------------------------------------------------- |

              | `published`        | Preferred publication date selected from the best available source. | OAI-PMH / Crossref / DataCite / OpenAlex / OpenAIRE |

              | `published_online` | Online publication date.                                            | Crossref                                            |

              | `published_print`  | Print publication date.                                             | Crossref                                            |

              | `issued`           | Date on which the Work was formally issued.                         | Dublin Core Terms / Crossref                        |

              | `accepted`         | Date on which the Work was accepted.                                | Dublin Core Terms / Crossref                        |

              | `deposited`        | Date on which metadata was deposited with the source.               | Crossref                                            |

              | `created`          | Date on which the source or CORE record was created.                | CORE / Crossref / OpenAlex                          |

              | `updated`          | Date on which the record was last updated.                          | CORE / Crossref / OpenAlex / OpenAIRE               |

              | `indexed`          | Date on which the record was indexed.                               | CORE                                                |

              | `available`        | Date on which the Work became available.                            | DataCite / OAI-PMH                                  |

              | `public_release`   | Date on which the Work was publicly released.                       | RIOXX                                               |

              | `collected`        | Date on which the source record was collected by CORE.              | CORE / OpenAIRE                                     |


              Because `dates` is a collection, ordering Works directly by `dates.value` is ambiguous.


              If ordering by creation or update time is required frequently, top-level fields such as `createdDate` and `updatedDate` should be added.


              #### References


              The `references` collection contains structured descriptions of items cited by the Work.


              ```json

              {
                "references": [
                  {
                    "citationId": 7865,
                    "citedCoreId": 999,
                    "citedDoi": "10.1000/abc456",
                    "articleTitle": "Quantum effects in materials",
                    "author": [
                      "Smith J",
                      "Lee B"
                    ],
                    "journalTitle": "Physical Review Letters",
                    "volume": "50",
                    "issue": "3",
                    "startPage": "101",
                    "endPage": "118",
                    "unstructured": "Smith J. Quantum effects in materials..."
                  }
                ]
              }

              ```


              | **Property**   | **Type**  | **Example value**                | **Description**                                            | **Source**                   |

              | -------------- | --------- | -------------------------------- | ---------------------------------------------------------- | ---------------------------- |

              | `citationId`   | integer   | `7865`                           | CORE Citation identifier for the reference, when resolved. | CORE                         |

              | `citedCoreId`  | integer   | `999`                            | CORE Work identifier of the cited item, when matched.      | CORE                         |

              | `citedDoi`     | string    | `"10.1000/abc456"`               | DOI of the cited item.                                     | Crossref / OpenCitations     |

              | `articleTitle` | string    | `"Quantum effects in materials"` | Title of the cited item.                                   | Crossref / Full-text parsing |

              | `author`       | string\[] | `["Smith J","Lee B"]`            | Authors as provided in the bibliographic reference.        | Crossref / OpenAIRE          |

              | `journalTitle` | string    | `"Physical Review Letters"`      | Journal title of the cited item.                           | Crossref                     |

              | `volume`       | string    | `"50"`                           | Volume of the cited item.                                  | Crossref / OpenAIRE          |

              | `issue`        | string    | `"3"`                            | Issue of the cited item.                                   | Crossref / OpenAIRE          |

              | `startPage`    | string    | `"101"`                          | First page of the cited item.                              | Crossref / OpenAIRE          |

              | `endPage`      | string    | `"118"`                          | Last page of the cited item.                               | Crossref / OpenAIRE          |

              | `unstructured` | string    | `"Smith J. Quantum effects..."`  | Complete unstructured reference string.                    | Crossref / Full-text parsing |


              #### Contributors


              Contributors include people or organisations that contributed to the Work in roles other than canonical Authorship.


              ```json

              {
                "contributors": [
                  {
                    "name": "CiteSeerX",
                    "type": "Organisational",
                    "role": null
                  },
                  {
                    "name": "Alice Smith",
                    "type": "Personal",
                    "role": "editor"
                  },
                  {
                    "name": "國立中興大學應用數學系",
                    "type": "Organisational",
                    "role": "hosting_institution"
                  }
                ]
              }

              ```


              | **Property** | **Type** | **Example value** | **Description**                                                   | **Source**                                       |

              | ------------ | -------- | ----------------- | ----------------------------------------------------------------- | ------------------------------------------------ |

              | `name`       | string   | `"Alice Smith"`   | Name of the contributing person or organisation.                  | OAI-PMH / RIOXX / DataCite / Crossref / OpenAIRE |

              | `type`       | string   | `"Personal"`      | Indicates whether the contributor is a person or an organisation. | DataCite / OpenAIRE                              |

              | `role`       | string   | `"editor"`        | Role performed by the contributor.                                | Crossref / DataCite / OpenAIRE                   |


              Possible roles include `editor`, `translator`, `reviewer`, and `hosting_institution`.


              #### Links


              The `links` property contains links associated with the Work.


              ```json

              {
                "links": [
                  {
                    "type": "reader",
                    "url": "https://core.ac.uk/works/323030168",
                    "contentType": "text/html"
                  },
                  {
                    "type": "download",
                    "url": "https://core.ac.uk/download/216874849.pdf",
                    "contentType": "application/pdf"
                  }
                ]
              }

              ```


              | Property      | Type   | Example value                                 | Description                                   |

              | ------------- | ------ | --------------------------------------------- | --------------------------------------------- |

              | `type`        | string | `"download"`                                  | Classification of the linked resource.        |

              | `url`         | string | `"https://core.ac.uk/download/216874849.pdf"` | URL of the linked resource.                   |

              | `contentType` | string | `"application/pdf"`                           | MIME type of the linked resource, when known. |


              Example Work record:


              ```json

              {
                "workId": 323030168,
                "externalIdentifiers": [
                  {
                    "type": "CORE_ID",
                    "identifier": 323030168
                  },
                  {
                    "type": "DOI",
                    "identifier": "10.1109/jiot.2020.2984887"
                  },
                  {
                    "type": "OPENALEX_ID",
                    "identifier": "https://openalex.org/W3030303030"
                  },
                  {
                    "type": "OAI_ID",
                    "identifier": "oai:example.org:paper/123"
                  }
                ],
                "title": "Intelligent edge computing for scholarly infrastructures",
                "abstract": "This paper explores intelligent edge computing methods for scholarly infrastructure.",
                "invertedAbstract": {
                  "This": [
                    0
                  ],
                  "paper": [
                    1
                  ],
                  "explores": [
                    2
                  ]
                },
                "fullText": "The rapid growth of scholarly content has created...",
                "doi": "10.1109/jiot.2020.2984887",
                "yearPublished": 2022,
                "documentType": [
                  "research article"
                ],
                "downloadUrl": "https://core.ac.uk/download/216874849.pdf",
                "coreIds": [
                  216874849,
                  216874850
                ],
                "journalIds": [
                  12345
                ],
                "dataProviderIds": [
                  86,
                  144
                ],
               ﻿ "projectIds": [
                  11
                ],
                "dates": [
                  {
                    "type": "published",
                    "value": "2022-04-27"
                  },
                  {
                    "type": "accepted",
                    "value": "2022-03-15"
                  },
                  {
                    "type": "updated",
                    "value": "2024-08-16T00:03:23Z"
                  }
                ],
                "references": [
                  {
                    "citationId": 7865,
                    "citedCoreId": 999,
                    "citedDoi": "10.1000/abc456",
                    "articleTitle": "Quantum effects in materials",
                    "author": [
                      "Smith J",
                      "Lee B"
                    ],
                    "journalTitle": "Physical Review Letters",
                    "volume": "50",
                    "issue": "3",
                    "startPage": "101",
                    "endPage": "118",
                    "unstructured": "Smith J. Quantum effects in materials..."
                  }
                ],
                "contributors": [

      - divider: false
        border: false
        id: authors-api-available-endpoints
        title: API endpoints
        descriptionAbout: >-
          | **Operation**                            | **Method** |
          **Endpoint**                          |

          | ---------------------------------------- | ---------- | ------------------------------------- |

          | Get a single Author                      | GET        | `/v4/authors/{authorId}`              |

          | Search Authors using URL parameters      | GET        | `/v4/search/authors`                  |

          | Search Authors using a JSON request body | POST       | `/v4/search/authors`                  |

          | Retrieve Authorships for an Author       | GET        | `/v4/authors/{authorId}/authorships`  |

          | Retrieve Works for an Author             | GET        | `/v4/authors/{authorId}/works`        |

          | Retrieve Affiliations for an Author      | GET        | `/v4/authors/{authorId}/affiliations` |


          #### Get a single Author


          Retrieves a single Author record using its CORE Author identifier.


          ```

          GET https://api.core.ac.uk/v4/authors/{authorId}

          ```


          #### Authorization


          | **Parameter** | **Location** | **Type** | **Required** | **Description**                                           |

          | ------------- | ------------ | -------- | ------------ | --------------------------------------------------------- |

          | Authorization | Header       | string   | Yes          | CORE API authentication token supplied as a Bearer token. |


          #### P﻿ath parameters


          | **Parameter** | **Type** | **Required** | **Description**                              |

          | ------------- | -------- | ------------ | -------------------------------------------- |

          | authorId      | integer  | Yes          | Unique CORE identifier of the Author record. |


          #### Q﻿uery parameters


          | **Parameter** | **Type** | **Required** | **Description**                                                                                                      |

          | ------------- | -------- | ------------ | -------------------------------------------------------------------------------------------------------------------- |

          | select        | string   | No           | Comma-separated list of top-level Author fields to return. Example: `select=authorId,orcidId,displayName,countries`. |




          E﻿xample request:


          ```

          curl --request GET \
            --url "https://api.core.ac.uk/v4/authors/67890" \
            --header "Authorization: Bearer YOUR_API_KEY"


          ```


          E﻿xample response:


          ```

          {
            "authorId": 67890,
            "orcidId": "0000-0002-1825-0097",
            "displayName": "Alice Smith",
            "givenNames": [
              "Alice"
            ],
            "familyNames": [
              "Smith"
            ],
            "altNames": [
              "Smith, Alice",
              "A. Smith"
            ],
            "countries": [
              "GB",
              "US"
            ],
            "careerStage": "early-career",
            "keywords": [
              "Artificial Intelligence",
              "Machine Learning",
              "Information Retrieval"
            ],
            "createdDate": "2026-06-15T10:30:00Z",
            "updatedDate": "2026-07-01T14:20:00Z"
          }


          ```


          E﻿xample request using  select:


          ```

          curl --request GET \
            --url "https://api.core.ac.uk/v4/authors/67890?select=authorId,orcidId,displayName,countries,keywords" \
            --header "Authorization: Bearer YOUR_API_KEY"

          ```


          E﻿xample response using  select:


          ```

          {
            "authorId": 67890,
            "orcidId": "0000-0002-1825-0097",
            "displayName": "Alice Smith",
            "countries": [
              "GB",
              "US"
            ],
            "keywords": [
              "Artificial Intelligence",
              "Machine Learning",
              "Information Retrieval"
            ]
          }

          ```
      - divider: false
        border: false
        id: authors-api-search-authors
        title: Search Authors
        descriptionAbout: >-
          Searches, filters, orders, facets, and paginates Author records.


          #### API endpoints


          ```

          GET https://api.core.ac.uk/v4/search/authors 

          POST https://api.core.ac.uk/v4/search/authors

          ```


          Both methods use the same CORE query language and return the same response structure.


          Additional parameters such as orderby, select, facets, count, limit, and offset control how results are returned.


          #### GET and POST search parameters


          ##### GET query parameters


          | Parameter | Type    | Required | Default                       | Description                                                                                                                       |

          | --------- | ------- | -------- | ----------------------------- | --------------------------------------------------------------------------------------------------------------------------------- |

          | q         | string  | No       | `*`                           | CORE query expression supporting textual search, field lookup, Boolean operators, grouping, range queries, and existence queries. |

          | orderby   | string  | No       | Relevance for textual queries | Comma-separated ordering directives in `field:direction` format.                                                                  |

          | select    | string  | No       | All retrievable fields        | Comma-separated list of fields to include in each result.                                                                         |

          | facets    | string  | No       | —                             | Comma-separated list of facetable fields for which value buckets and counts should be returned.                                   |

          | count     | boolean | No       | `false`                       | Indicates whether the total number of matching Author records should be included.                                                 |

          | limit     | integer | No       | `10`                          | Maximum number of Author records to return.                                                                                       |

          | offset    | integer | No       | `0`                           | Number of matching Author records to skip.                                                                                        |


          #### POST request body


          | Property | Type      | Required | Default                       | Description                                                                                                                       |

          | -------- | --------- | -------- | ----------------------------- | --------------------------------------------------------------------------------------------------------------------------------- |

          | q        | string    | No       | `*`                           | CORE query expression supporting textual search, field lookup, Boolean operators, grouping, range queries, and existence queries. |

          | orderby  | string\[] | No       | Relevance for textual queries | Ordered list of sorting directives in `field:direction` format.                                                                   |

          | select   | string\[] | No       | All retrievable fields        | List of Author fields to include in each result.                                                                                  |

          | facets   | string\[] | No       | —                             | List of facetable fields for which value buckets and counts should be returned.                                                   |

          | count    | boolean   | No       | `false`                       | Indicates whether the total number of matching Author records should be included.                                                 |

          | limit    | integer   | No       | `10`                          | Maximum number of Author records to return.                                                                                       |

          | offset   | integer   | No       | `0`                           | Number of matching Author records to skip.                                                                                        |


          #### GET and POST parameter mapping




          | GET query parameter                     | POST body property                                   |

          | --------------------------------------- | ---------------------------------------------------- |

          | `q=countries:GB`                        | `"q": "countries:GB"`                                |

          | `orderby=displayName:asc`               | `"orderby": ["displayName:asc"]`                     |

          | `select=authorId,displayName,countries` | `"select": ["authorId", "displayName", "countries"]` |

          | `facets=countries,careerStage,keywords` | `"facets": ["countries", "careerStage", "keywords"]` |

          | `count=true`                            | `"count": true`                                      |

          | `limit=10`                              | `"limit": 10`                                        |

          | `offset=0`                              | `"offset": 0`                                        |
      - divider: false
        border: false
        id: authors-api-search-examples
        title: Search examples
        descriptionAbout: >-
          GET


          ```

          curl --request GET \
            --url 'https://api.core.ac.uk/v4/search/authors?q=displayName:"Alice%20Smith"' \
            --header "Authorization: Bearer YOUR_API_KEY"
          ```


          Readable form:


          ```

          GET /v4/search/authors?q=displayName:"Alice Smith"

          ```


          A broader free-text query may also be used:


          ```

          GET /v4/search/authors?q="Alice Smith"

          ```


          P﻿OST


          ```

          curl --request POST \
            --url "https://api.core.ac.uk/v4/search/authors" \
            --header "Authorization: Bearer YOUR_API_KEY" \
            --header "Content-Type: application/json" \
            --data '{
              "q": "displayName:\"Alice Smith\""
            }'
          ```


          A broad textual query searches searchable Author fields, including:


          * displayName;

          * givenNames;

          * familyNames;

          * altNames;

          * rawNames;

          * biography;

          * keywords.


          When a textual query is supplied and orderby is omitted, results are ordered by relevance.


          #### **Retrieve an Author by ORCID**


          G﻿ET


          ```

          GET /v4/search/authors?q=orcidId:"0000-0002-1825-0097"

          ```


          P﻿OST


          ```

          {
            "q": "orcidId:\"0000-0002-1825-0097\""
          }

          ```


          #### Search by research keyword


          G﻿ET


          ```

          GET /v4/search/authors?q=keywords:"Machine Learning"



          ```


          P﻿OST


          ```

          {
            "q": "keywords:\"Machine Learning\""
          }



          ```


          #### Retrieve Authors associated with a country


          G﻿ET


          ```

          GET /v4/search/authors?q=countries:GB



          ```


          P﻿OST


          ```

          {
            "q": "countries:GB"
          }

          ```


          This query uses countries derived from known Affiliations and does not imply nationality.


          #### **Retrieve Authors by career stage**


          G﻿ET


          ```

          GET /v4/search/authors?q=careerStage:early-career



          ```


          P﻿OST


          ```

          { 
            "q": "careerStage:early-career" 
          }



          ```


          #### **Retrieve Authors with ORCID identifiers**


          G﻿ET


          ```

          GET /v4/search/authors?q=_exists_:orcidId



          ```


          P﻿OST


          ```

          {
            "q": "_exists_:orcidId"
          }



          ```


          #### Combined search, selection, and ordering




          The following request:


          * searches for Authors with the keyword Machine Learning;

          * restricts results to Authors associated with an Affiliation in the United Kingdom;

          * orders results by preferred display name;

          * returns selected fields;

          * includes the total result count;

          * returns a maximum of ten records.


          G﻿ET


          ```

          curl --request GET \
            --url 'https://api.core.ac.uk/v4/search/authors?q=keywords:"Machine%20Learning"%20AND%20countries:GB&orderby=displayName:asc&select=authorId,orcidId,displayName,countries,careerStage,keywords&count=true&limit=10&offset=0' \
            --header "Authorization: Bearer YOUR_API_KEY"


          ```


          R﻿eadable form:


          ```

          GET /v4/search/authors
              ?q=keywords:"Machine Learning" AND countries:GB
              &orderby=displayName:asc
              &select=authorId,orcidId,displayName,countries,careerStage,keywords
              &count=true
              &limit=10
              &offset=0
          ```


          P﻿OST


          ```

          curl --request POST \
            --url "https://api.core.ac.uk/v4/search/authors" \
            --header "Authorization: Bearer YOUR_API_KEY" \
            --header "Content-Type: application/json" \
            --data '{
              "q": "keywords:\"Machine Learning\" AND countries:GB",
              "orderby": [
                "displayName:asc"
              ],
              "select": [
                "authorId",
                "orcidId",
                "displayName",
                "countries",
                "careerStage",
                "keywords"
              ],
              "count": true,
              "limit": 10,
              "offset": 0
            }'


          ```


          Example search response:


          ```

          {
            "totalHits": 1,
            "results": [
              {
                "authorId": 67890,
                "orcidId": "0000-0002-1825-0097",
                "displayName": "Alice Smith",
                "countries": [
                  "GB",
                  "US"
                ],
                "careerStage": "early-career",
                "keywords": [
                  "Artificial Intelligence",
                  "Machine Learning",
                  "Information Retrieval"
                ]
              }
            ]
          }



          ```


          #### Ordering Author results


          ##### Order by display name


          G﻿ET


          ```

          GET /v4/search/authors?orderby=displayName:asc



          ```


          P﻿OST


          ```

          {
            "orderby": [
              "displayName:asc"
            ]
          }



          ```


          ##### Order by creation date


          G﻿ET


          ```

          GET /v4/search/authors?orderby=createdDate:asc



          ```


          P﻿OST


          ```

          {
            "orderby": [
              "createdDate:asc"
            ]
          }



          ```


          ##### Order by update date


          G﻿ET


          ```

          GET /v4/search/authors?orderby=updatedDate:desc



          ```


          P﻿OST


          ```

          {
            "orderby": [
              "updatedDate:desc"
            ]
          }



          ```


          ##### Order by multiple fields


          G﻿ET


          ```

          GET /v4/search/authors?orderby=displayName:asc,updatedDate:desc



          ```


          P﻿OST


          ```

          {
            "orderby": [
              "displayName:asc",
              "updatedDate:desc"
            ]
          }



          ```


          Results are first ordered by displayName. Records with the same display name are then ordered by updatedDate.




          #### **Facets**


          The facets option returns value buckets and counts for fields configured as facetable.


          G﻿ET


          ```

          curl --request GET \
            --url "https://api.core.ac.uk/v4/search/authors?q=*&facets=countries,careerStage,keywords&count=true&limit=0" \
            --header "Authorization: Bearer YOUR_API_KEY"


          ```


          P﻿OST


          ```

          curl --request POST \
            --url "https://api.core.ac.uk/v4/search/authors" \
            --header "Authorization: Bearer YOUR_API_KEY" \
            --header "Content-Type: application/json" \
            --data '{
              "q": "*",
              "facets": [
                "countries",
                "careerStage",
                "keywords"
              ],
              "count": true,
              "limit": 0
            }'
          ```




          E﻿xample facet response:


          ```

          {
            "totalHits": 2500000,
            "facets": {
              "countries": [
                {
                  "value": "US",
                  "count": 710000
                },
                {
                  "value": "GB",
                  "count": 245000
                }
              ],
              "careerStage": [
                {
                  "value": "early-career",
                  "count": 540000
                },
                {
                  "value": "mid-career",
                  "count": 430000
                },
                {
                  "value": "experienced",
                  "count": 390000
                }
              ],
              "keywords": [
                {
                  "value": "Machine Learning",
                  "count": 165000
                },
                {
                  "value": "Artificial Intelligence",
                  "count": 153000
                }
              ]
            },
            "results": []
          }



          ```


          Facet counts describe the complete matching result set.


          Setting limit to 0 returns facet buckets and counts without returning Author records.


          #### R﻿esult count


          Set count=true to include the total number of matching Author records.


          G﻿ET


          ```

          GET /v4/search/authors?q=countries:GB&count=true



          ```


          \

          P﻿OST


          ```

          {
            "q": "countries:GB",
            "count": true
          }



          ```


          When count is omitted or set to false, totalHits may be omitted from the response.


          #### Pagination


          Use limit and offset to paginate Author results.


          A deterministic orderby expression should be used when retrieving multiple pages.


          F﻿irst page using GET


          ```

          GET /v4/search/authors?q=keywords:"Artificial Intelligence"&orderby=displayName:asc&limit=20&offset=0



          ```


          Second page using GET


          ```

          GET /v4/search/authors?q=keywords:"Artificial Intelligence"&orderby=displayName:asc&limit=20&offset=20

          ```


          First page using POST


          ```

          {
            "q": "keywords:\"Artificial Intelligence\"",
            "orderby": [
              "displayName:asc"
            ],
            "limit": 20,
            "offset": 0
          }



          ```


          \

          Second page using POST


          ```

          {
            "q": "keywords:\"Artificial Intelligence\"",
            "orderby": [
              "displayName:asc"
            ],
            "limit": 20,
            "offset": 20
          }



          ```


          The offset is calculated as:


          offset = page size × number of previous pages
      - divider: false
        border: false
        id: authors-api-relationship-oriented-endpoints
        title: Relationship-oriented endpoints
        descriptionAbout: >-
          Relationship-oriented endpoints provide convenient access to records
          connected to an Author.


          They do not embed those records in the Author entity. Internally, each endpoint queries the related entity using authorId.


          #### Authorships for an Author


          ```

          GET /v4/authors/{authorId}/authorships



          ```


          Retrieves Authorship records associated with the Author.\

          Equivalent GET search:


          ```

          GET /v4/search/authorships?q=authorId:{authorId}



          ```


          Equivalent POST search:


          ```

          {
            "q": "authorId:{authorId}"
          }



          ```


          E﻿xample request


          ```

          curl --request GET \
            --url "https://api.core.ac.uk/v4/authors/67890/authorships?orderby=workId:asc&count=true&limit=10&offset=0" \
            --header "Authorization: Bearer YOUR_API_KEY"


          ```


          E﻿xample response


          ```

          {
            "totalHits": 2,
            "results": [
              {
                "authorshipId": 987654,
                "workId": 12345,
                "authorId": 67890,
                "rawName": "Smith, Alice",
                "sequence": "first",
                "rank": 1,
                "isFirstNamedAuthor": true,
                "isCorresponding": true
              },
              {
                "authorshipId": 987700,
                "workId": 428765,
                "authorId": 67890,
                "rawName": "A. Smith",
                "sequence": "additional",
                "rank": 2,
                "isFirstNamedAuthor": false,
                "isCorresponding": false
              }
            ]
          }



          ```


          #### Works for an Author


          ```

          GET /v4/authors/{authorId}/works



          ```


          Retrieves Works connected to the Author through Authorship records.


          E﻿xample request


          ```

          curl --request GET \
            --url "https://api.core.ac.uk/v4/authors/67890/works?select=workId,title,yearPublished,doi&orderby=yearPublished:desc&count=true&limit=10&offset=0" \
            --header "Authorization: Bearer YOUR_API_KEY"
          ```


          E﻿xample response


          ```

          {
            "totalHits": 2,
            "results": [
              {
                "workId": 428765,
                "title": "Machine learning for scholarly information retrieval",
                "yearPublished": 2025,
                "doi": "10.1234/example.2025.1"
              },
              {
                "workId": 12345,
                "title": "Open research infrastructure and discovery",
                "yearPublished": 2023,
                "doi": "10.1234/example.2023.7"
              }
            ]
          }



          ```


          \

          An existing Author with no connected Works returns 200 with an empty results array.


          #### Affiliations for an Author


          ```

          GET /v4/authors/{authorId}/affiliations



          ```


          Retrieves Affiliation records whose authorId matches the Author.


          Equivalent GET search:


          ```

          GET /v4/search/affiliations?q=authorId:{authorId}&orderby=startDate:asc



          ```


          Equivalent POST search:


          ```

          {
            "q": "authorId:{authorId}",
            "orderby": [
              "startDate:asc"
            ]
          }



          ```


          E﻿xample request


          ```

          curl --request GET \
            --url "https://api.core.ac.uk/v4/authors/67890/affiliations?orderby=startDate:asc&count=true&limit=10&offset=0" \
            --header "Authorization: Bearer YOUR_API_KEY"


          ```


          E﻿xample response


          ```

          {
            "totalHits": 2,
            "results": [
              {
                "affiliationId": 901,
                "authorId": 67890,
                "rawAffiliation": "Department of Computer Science, University of Oxford, UK",
                "department": "Department of Computer Science",
                "institutionId": 3201,
                "institutionName": "University of Oxford",
                "isCurrent": false,
                "startDate": "2018-01-01",
                "endDate": "2021-12-31"
              },
              {
                "affiliationId": 902,
                "authorId": 67890,
                "rawAffiliation": "Massachusetts Institute of Technology, Cambridge, MA, USA",
                "department": null,
                "institutionId": 4501,
                "institutionName": "Massachusetts Institute of Technology",
                "isCurrent": true,
                "startDate": "2022-01-01",
                "endDate": null
              }
            ]
          }



          ```


          An existing Author with no connected Affiliations returns 200 with an empty results array.
  - item: Affiliations
    children:
      - divider: false
        border: false
        id: "#affiliations-api-introduction"
        title: Introduction
        descriptionAbout: >-
          The Affiliation entity represents the relationship between an Author
          and an Institution over time. Each Affiliation record connects one
          Author to one Institution and may include temporal information such as
          the start date, end date, and whether the affiliation is current.


          An Affiliation may be obtained directly from an authoritative source such as ORCID or derived by CORE from affiliation metadata associated with scholarly Works.


          Unlike Authorship, which describes how an Author appears on one specific Work, Affiliation represents a potentially longer-term relationship between an Author and an Institution.


          Affiliations used on individual Works are connected to Authorship records through the Authorship_Affiliation bridge entity.


          The diagram below represents the relationships between Authors, Affiliations, and Institutions.


          ![](/images/docs-graph/affiliations.png)




          An Author may have multiple Affiliation records over time. An Institution may be associated with multiple Authors.


          Each Affiliation record:


          * links exactly one Author;

          * may link to zero or one resolved Institution;

          * may be connected to multiple Authorship records through `Authorship_Affiliation`;

          * may contain one or more Works that provide evidence for the relationship.
      - divider: false
        border: false
        id: "#affiliations-api-data-structure"
        title: Data structure
        descriptionAbout: >-
          The table below describes the top-level fields in the CORE Graph
          metadata schema for the Affiliation entity, including their types,
          example values, descriptions, and sources.


          | **Property**     | **Type**   | **Example value**                                                  | **Description**                                                                                                                                                                                                                                                                                      | **Source**                                    |

          | ---------------- | ---------- | ------------------------------------------------------------------ | ---------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- | --------------------------------------------- |

          | affiliationId    | integer    | `901`                                                              | Unique CORE identifier for the Affiliation record.                                                                                                                                                                                                                                                   | CORE                                          |

          | authorId         | integer    | `67890`                                                            | CORE identifier of the Author associated with the Affiliation.                                                                                                                                                                                                                                       | CORE                                          |

          | rawAffiliation   | string     | `"Department of Computer Science, University of Oxford, UK"`       | Verbatim affiliation string supplied in the source metadata.                                                                                                                                                                                                                                         | OAI-PMH / Crossref / OpenAlex / OpenAIRE      |

          | department       | string     | `"Department of Computer Science"`                                 | Department, faculty, school, laboratory, or other organisational subunit associated with the Affiliation.                                                                                                                                                                                            | ORCID / Crossref / OpenAIRE / Derived by CORE |

          | institutionId    | integer    | `3201`                                                             | CORE identifier of the associated Institution, when the Institution has been resolved.                                                                                                                                                                                                               | CORE                                          |

          | institutionName  | string     | `"University of Oxford"`                                           | Name of the affiliated Institution as supplied by the source or derived during institution resolution.                                                                                                                                                                                               | ORCID / Crossref / OpenAlex / OpenAIRE / CORE |

          | isCurrent        | boolean    | `true`                                                             | Indicates whether the Affiliation is identified as current. `true`: explicitly identified or confidently derived as current. `false`: explicitly identified or confidently derived as no longer current. `null`: available metadata is insufficient to determine whether the Affiliation is current. | ORCID / Derived by CORE                       |

          | startDate        | string     | `"2021-01-01"`                                                     | Start date of the Affiliation, when available. Follows ISO 8601 standards.                                                                                                                                                                                                                           | ORCID                                         |

          | endDate          | string     | `"2023-12-31"`                                                     | End date of the Affiliation, when available. A current Affiliation may have a null end date. Follows ISO 8601 standards.                                                                                                                                                                             | ORCID                                         |

          | evidenceWorkIds* | integer\[] | `[1234, 428765]`                                                   | CORE Work identifiers that provide evidence for the relationship between the Author and Institution.                                                                                                                                                                                                 | CORE                                          |

          | externalIds      | object\[]  | `[{"type": "orcid-put-code", "value": "123456"}]`                  | External identifiers associated with the Affiliation record or its source representation. Each entry identifies the identifier type and value.                                                                                                                                                       | ORCID / Other source systems                  |

          | address          | object     | `{"city": "Oxford", "region": "Oxfordshire", "countryCode": "GB"}` | Source-provided location information for the organisation associated with the Affiliation. Contains the city or locality; region, state, province, or other country subdivision; and the ISO 3166-1 alpha-2 country code associated with the Affiliation.                                            | ORCID                                         |

          | url              | string     | `"https://www.cs.ox.ac.uk/"`                                       | URL supplied by the source for the Affiliation, department, or associated organisation.                                                                                                                                                                                                              | ORCID                                         |

          | createdDate      | string     | `"2026-06-15T10:30:00Z"`                                           | Date and time when the Affiliation record was created in CORE.                                                                                                                                                                                                                                       | CORE                                          |

          | updatedDate      | string     | `"2026-07-01T14:20:00Z"`                                           | Date and time when the Affiliation record was last updated in CORE.                                                                                                                                                                                                                                  | CORE                                          |


          \*More information is available in the following sections.


          #### Evidence Works


          The evidenceWorkIds property identifies Works whose metadata supports the Author–Institution relationship.


          ```

          {
            "evidenceWorkIds": [
              1234,
              428765
            ]
          }

          ```


          \

          This implies that those Works contain evidence associating the Author with the Institution.


          Evidence Works may be used to:


          * trace the source of a derived Affiliation;

          * validate institution resolution;

          * identify when an Affiliation appeared in publication metadata;

          * support temporal inference.

          *


          #### Evidence Works and the Authorship bridge


          The `evidenceWorkIds` property and the `Authorship_Affiliation` bridge serve related but different purposes.


          | Mechanism              | Purpose                                                                        |

          | ---------------------- | ------------------------------------------------------------------------------ |

          | evidenceWorkIds        | Provides an aggregated list of Works whose metadata supports the Affiliation.  |

          | authorship_affiliation | Connects the Affiliation to the exact Authorship records on which it was used. |


          For example:


          ```

          {
            "affiliationId": 901,
            "evidenceWorkIds": [
              1234,
              428765
            ]
          }

          ```


          \

          The corresponding bridge records may be:


          ```

          [
            {
              "authorshipId": 987654,
              "affiliationId": 901
            },
            {
              "authorshipId": 987700,
              "affiliationId": 901
            }
          ]

          ```


          The bridge records provide the exact Work-specific Author relationships. The `evidenceWorkIds` field provides convenient Work-level provenance.


          #### Raw Affiliation and structured fields


          The rawAffiliation property preserves the original source text:


          ```

          {
            "rawAffiliation": "Dept of CS, Univ Oxford, Oxford, UK"
          }

          ```


          Structured fields may be extracted or resolved from that value:


          ```

          {
            "department": "Department of Computer Science",
            "institutionId": 3201,
            "institutionName": "University of Oxford",
            "address": {
              "city": "Oxford",
              "countryCode": "GB"
            }
          }

          ```


          The raw value is retained even when structured extraction succeeds, because it preserves provenance and allows future reprocessing.


          E﻿xample Affiliations record:


          ```

          {
            "affiliationId": 901,
            "authorId": 67890,
            "rawAffiliation": "Department of Computer Science, University of Oxford, UK",
            "department": "Department of Computer Science",
            "institutionId": 3201,
            "institutionName": "University of Oxford",
            "isCurrent": false,
            "startDate": "2018-01-01",
            "endDate": "2021-12-31",
            "evidenceWorkIds": [
              1234,
              428765
            ],
            "externalIds": [
              {
                "type": "orcid-put-code",
                "value": "123456"
              }
            ],
            "address": {
              "city": "Oxford",
              "region": "Oxfordshire",
              "countryCode": "GB"
            },
            "url": "https://www.cs.ox.ac.uk/",
            "createdDate": "2026-06-15T10:30:00Z",
            "updatedDate": "2026-07-01T14:20:00Z"
          }

          ```


          #### Authorship–Affiliation relationship


          Affiliations used by an Author on a particular Work are connected to Authorship records through the Authorship_Affiliation bridge entity.


          | Property      | Type    | Example value | Description                                                           | Source |

          | ------------- | ------- | ------------- | --------------------------------------------------------------------- | ------ |

          | authorshipId  | integer | `987654`      | CORE identifier of the Authorship participating in the relationship.  | CORE   |

          | affiliationId | integer | `901`         | CORE identifier of the Affiliation participating in the relationship. | CORE   |




          Example bridge records:


          ```

          [
            {
              "authorshipId": 987654,
              "affiliationId": 901
            },
            {
              "authorshipId": 987654,
              "affiliationId": 902
            }
          ]

          ```




          These records indicate that Authorship 987654 is linked to Affiliations 901 and 902.


          The bridge is used because:


          * one Authorship may be linked to multiple Affiliations;

          * one Affiliation may be linked to multiple Authorship records representing different Works;

          * Authorship contains only Work-specific Author information;

          * Affiliation remains an independently addressable and reusable entity.
      - divider: false
        border: false
        id: affiliations-api-supported-field-operations
        title: Supported field operations
        descriptionAbout: >-
          The table below describes which Affiliation properties can be
          searched, filtered, ordered, or used as facets.




          | **Attribute**   | **Searchable** | **Filterable** | **Sortable** | **Facetable** |

          | --------------- | -------------- | -------------- | ------------ | ------------- |

          | affiliationId   | No             | Yes            | No           | No            |

          | authorId        | No             | Yes            | Yes          | No            |

          | rawAffiliation  | Yes            | No             | No           | No            |

          | department      | Yes            | Yes            | No           | Yes           |

          | institutionId   | No             | Yes            | Yes          | Yes           |

          | institutionName | Yes            | No             | No           | No            |

          | isCurrent       | No             | Yes            | No           | Yes           |

          | startDate       | No             | Yes            | Yes          | No            |

          | endDate         | No             | Yes            | Yes          | No            |

          | evidenceWorkIds | No             | Yes            | No           | No            |

          | externalIds     | No             | No             | No           | No            |

          | address         | No             | No             | No           | No            |

          | url             | No             | No             | No           | No            |

          | createdDate     | No             | Yes            | Yes          | No            |

          | updatedDate     | No             | Yes            | Yes          | No            |
      - divider: false
        border: false
        id: affiliations-api-affiliation-endpoints
        title: Affiliation endpoints
        descriptionAbout: >-
          #### Available endpoints


          | Operation                                     | Method | Endpoint                                       |

          | --------------------------------------------- | ------ | ---------------------------------------------- |

          | Get a single Affiliation                      | GET    | `/v4/affiliations/{affiliationId}`             |

          | Search Affiliations using URL parameters      | GET    | `/v4/search/affiliations`                      |

          | Search Affiliations using a JSON request body | POST   | `/v4/search/affiliations`                      |

          | Retrieve Authorships for an Affiliation       | GET    | `/v4/affiliations/{affiliationId}/authorships` |


          Affiliation records may also be retrieved through relationship-oriented endpoints:


          ```

          GET /v4/authorships/{authorshipId}/affiliations

          GET /v4/authors/{authorId}/affiliations

          GET /v4/institutions/{institutionId}/affiliations

          ```


          More details about these endpoints are documented under the Authorships, Authors and Institutions entities.


          #### Get a single Affiliation


          Retrieves a single Affiliation record using its unique CORE Affiliation identifier.


          ##### API endpoint


          ```

          GET https://api.core.ac.uk/v4/affiliations/{affiliationId}

          ```


          ##### **Authorization**


          | **Parameter** | **Location** | **Type** | **Required** | **Description**                                           |

          | ------------- | ------------ | -------- | ------------ | --------------------------------------------------------- |

          | Authorization | Header       | string   | Yes          | CORE API authentication token supplied as a Bearer token. |


          ##### Path parameters


          | **Parameter** | **Type** | **Required** | **Description**                                   |

          | ------------- | -------- | ------------ | ------------------------------------------------- |

          | affiliationId | integer  | Yes          | Unique CORE identifier of the Affiliation record. |


          ##### Query parameters


          | Parameter | Type   | Required | Description                                                                                                                                                                     |

          | --------- | ------ | -------- | ------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- |

          | select    | string | No       | Comma-separated list of top-level Affiliation fields to return. This can be used to reduce the response size. Example: `select=affiliationId,authorId,institutionId,isCurrent`. |


          E﻿xample request:


          ```

          curl --request GET \
            --url "https://api.core.ac.uk/v4/affiliations/901" \
            --header "Authorization: Bearer YOUR_API_KEY"
          ```


          E﻿xample response:


          ```

          {
            "affiliationId": 901,
            "authorId": 67890,
            "rawAffiliation": "Department of Computer Science, University of Oxford, UK",
            "department": "Department of Computer Science",
            "institutionId": 3201,
            "institutionName": "University of Oxford",
            "isCurrent": false,
            "startDate": "2018-01-01",
            "endDate": "2021-12-31",
            "evidenceWorkIds": [
              1234,
              428765
            ],
            "externalIds": [
              {
                "type": "orcid-put-code",
                "value": "123456"
              }
            ],
            "address": {
              "city": "Oxford",
              "region": "Oxfordshire",
              "countryCode": "GB"
            },
            "url": "https://www.cs.ox.ac.uk/",
            "createdDate": "2026-06-15T10:30:00Z",
            "updatedDate": "2026-07-01T14:20:00Z"
          }

          ```


          Example request using `select`:


          ```

          curl --request GET \
            --url "https://api.core.ac.uk/v4/affiliations/901?select=affiliationId,authorId,institutionId,institutionName,isCurrent" \
            --header "Authorization: Bearer YOUR_API_KEY"
          ```


          Example response:


          ```

          {
            "affiliationId": 901,
            "authorId": 67890,
            "institutionId": 3201,
            "institutionName": "University of Oxford",
            "isCurrent": false
          }

          ```


          #### R﻿esponses


          | **Status** | **Description**                                                      |

          | ---------- | -------------------------------------------------------------------- |

          | 200        | The Affiliation record was retrieved successfully.                   |

          | 400        | The request contains an invalid parameter or unsupported field name. |

          | 401        | Authentication credentials are missing or invalid.                   |

          | 404        | No Affiliation record was found for the supplied identifier.         |

          | 429        | The API request limit has been exceeded.                             |

          | 500        | An unexpected server error occurred.                                 |
      - divider: false
        border: false
        id: affiliations-api-search-affiliations
        title: Search Affiliations
        descriptionAbout: >+
          Searches, filters, orders, facets, counts, and paginates Affiliation
          records.


          Affiliation search is available through GET and POST:


          ```

          GET https://api.core.ac.uk/v4/search/affiliations

          POST https://api.core.ac.uk/v4/search/affiliations

          ```


          Both methods use the same CORE query language and return the same response structure.


          #### GET and POST search parameters


          ##### GET query parameters


          | **Parameter** | **Type** | **Required** | **Default**                   | **Description**                                                                                                                     |

          | ------------- | -------- | ------------ | ----------------------------- | ----------------------------------------------------------------------------------------------------------------------------------- |

          | q             | string   | No           | `*`                           | CORE query expression supporting free-text search, field lookup, Boolean operators, grouping, range queries, and existence queries. |

          | orderby       | string   | No           | Relevance for textual queries | Comma-separated ordering directives in `field:direction` format.                                                                    |

          | select        | string   | No           | All retrievable fields        | Comma-separated list of fields to include in each result.                                                                           |

          | facets        | string   | No           | —                             | Comma-separated list of facetable fields for which value buckets and counts should be returned.                                     |

          | count         | boolean  | No           | `false`                       | Indicates whether the total number of matching Affiliation records should be included.                                              |

          | limit         | integer  | No           | `10`                          | Maximum number of Affiliation records to return.                                                                                    |

          | offset        | integer  | No           | `0`                           | Number of matching Affiliation records to skip.                                                                                     |


          POST request body


          | **Property** | **Type**  | **Required** | **Default**                   | **Description**                                                                                                                     |

          | ------------ | --------- | ------------ | ----------------------------- | ----------------------------------------------------------------------------------------------------------------------------------- |

          | q            | string    | No           | `*`                           | CORE query expression supporting free-text search, field lookup, Boolean operators, grouping, range queries, and existence queries. |

          | orderby      | string\[] | No           | Relevance for textual queries | Ordered list of sorting directives in `field:direction` format.                                                                     |

          | select       | string\[] | No           | All retrievable fields        | List of fields to include in each result.                                                                                           |

          | facets       | string\[] | No           | —                             | List of facetable fields for which value buckets and counts should be returned.                                                     |

          | count        | boolean   | No           | `false`                       | Indicates whether the total number of matching Affiliation records should be included.                                              |

          | limit        | integer   | No           | `10`                          | Maximum number of Affiliation records to return.                                                                                    |

          | offset       | integer   | No           | `0`                           | Number of matching Affiliation records to skip.                                                                                     |




          ##### GET and POST parameter mapping




          | **GET query parameter**                        | **POST body property**                                      |

          | ---------------------------------------------- | ----------------------------------------------------------- |

          | `q=authorId:67890`                             | `"q": "authorId:67890"`                                     |

          | `orderby=startDate:asc`                        | `"orderby": ["startDate:asc"]`                              |

          | `select=affiliationId,institutionId,isCurrent` | `"select": ["affiliationId", "institutionId", "isCurrent"]` |

          | `facets=isCurrent,institutionId`               | `"facets": ["isCurrent", "institutionId"]`                  |

          | `count=true`                                   | `"count": true`                                             |

          | `limit=10`                                     | `"limit": 10`                                               |

          | `offset=0`                                     | `"offset": 0`                                               |


      - divider: false
        border: false
        id: affiliations-api-search-examples
        title: Search examples
        descriptionAbout: >-
          #### Search by raw Affiliation


          GET


          The rawAffiliation property is searchable using a field lookup:


          ```

          curl --request GET \
            --url 'https://api.core.ac.uk/v4/search/affiliations?q=rawAffiliation:"Department%20of%20Computer%20Science%20Oxford"' \
            --header "Authorization: Bearer YOUR_API_KEY"
          ```


          Readable form:


          ```

          GET /v4/search/affiliations?q=rawAffiliation:"Department of Computer Science Oxford"

          ```


          A broader free-text query may also be used:


          ```

          curl --request GET \
            --url "https://api.core.ac.uk/v4/search/affiliations?q=University%20of%20Oxford" \
            --header "Authorization: Bearer YOUR_API_KEY"
          ```


          This searches across all searchable Affiliation fields, including `rawAffiliation`, `department`, and `institutionName`.


          Equivalent POST


          ```

          curl --request POST \
            --url "https://api.core.ac.uk/v4/search/affiliations" \
            --header "Authorization: Bearer YOUR_API_KEY" \
            --header "Content-Type: application/json" \
            --data '{
              "q": "rawAffiliation:\"Department of Computer Science Oxford\""
            }'
          ```


          A broad textual query searches all searchable Affiliation fields, including:


          * `rawAffiliation`;

          * `department`;

          * `institutionName`.


          When a textual query is supplied and orderby is omitted, results are ordered by relevance.


          #### Search by Institution name


          **GET**


          ```

          curl --request GET \ --url 'https://api.core.ac.uk/v4/search/affiliations?q=institutionName:"University%20of%20Oxford"' \ --header "Authorization: Bearer YOUR_API_KEY"

          ```


          Readable form:


          ```

          GET /v4/search/affiliations?q=institutionName:"University of Oxford"

          ```


          \

          This performs keyword search against the source-provided or resolved Institution name.


          Equivalent POST


          ```

          {
            "q": "institutionName:\"University of Oxford\""
          }

          ```


          When a canonical Institution identifier is already known, an exact institutionId lookup is preferred.


          #### Retrieve Affiliations for an Author


          GET


          ```

          curl --request GET \
            --url "https://api.core.ac.uk/v4/search/affiliations?q=authorId:67890&orderby=startDate:asc" \
            --header "Authorization: Bearer YOUR_API_KEY"
          ```


          This retrieves the known Affiliation history for Author 67890, ordered by start date.


          Equivalent POST


          ```

          {
            "q": "authorId:67890",
            "orderby": [
              "startDate:asc"
            ]
          }

          ```


          This retrieves the known Affiliation history associated with Author 67890.


          This request is also functionally equivalent to:


          ```

          GET /v4/authors/67890/affiliations

          ```


          #### Retrieve current Affiliations for an Author


          GET


          ```

          curl --request GET \
            --url "https://api.core.ac.uk/v4/search/affiliations?q=authorId:67890%20AND%20isCurrent:true" \
            --header "Authorization: Bearer YOUR_API_KEY"
          ```


          \

          Readable form:


          ```

          GET /v4/search/affiliations?q=authorId:67890 AND isCurrent:true

          ```


          Equivalent POST:


          ```

          {
            "q": "authorId:67890 AND isCurrent:true"
          }

          ```


          An Author may have more than one current Affiliation.


          #### Retrieve previous Affiliations for an Author


          GET


          ```

          curl --request GET \ --url "https://api.core.ac.uk/v4/search/affiliations?q=authorId:67890%20AND%20isCurrent:false&orderby=endDate:desc" \ --header "Authorization: Bearer YOUR_API_KEY"

          ```


          Readable form:


          ```

          GET /v4/search/affiliations?q=authorId:67890 AND isCurrent:false&orderby=endDate:desc

          ```


          Equivalent POST:


          ```

          {
            "q": "authorId:67890 AND isCurrent:false",
            "orderby": [
              "endDate:desc"
            ]
          }

          ```


          This returns Affiliation records explicitly identified as no longer current, ordered by the most recent end date.


          Records where `isCurrent` is null are not included because their current status is unknown.


          #### Retrieve Affiliations for an Institution


          GET


          ```

          curl --request GET \
            --url "https://api.core.ac.uk/v4/search/affiliations?q=institutionId:3201" \
            --header "Authorization: Bearer YOUR_API_KEY"
          ```


          Equivalent POST


          ```

          {
            "q": "institutionId:3201"
          }

          ```


          This is functionally equivalent to:


          ```

          GET /v4/institutions/3201/affiliations

          ```


          Depending on the Institution, this query may return a large result set and should be paginated.


          #### Retrieve current Affiliations for an Institution


          GET


          ```

          curl --request GET \
            --url "https://api.core.ac.uk/v4/search/affiliations?q=institutionId:3201%20AND%20isCurrent:true" \
            --header "Authorization: Bearer YOUR_API_KEY"
          ```


          Readable form:


          ```

          GET /v4/search/affiliations?q=institutionId:3201 AND isCurrent:true

          ```


          Equivalent POST:


          ```

          {
            "q": "institutionId:3201 AND isCurrent:true"
          }

          ```


          This returns current Author–Institution relationships associated with Institution 3201.


          #### Retrieve Affiliations supported by a Work


          GET


          ```

          curl --request GET \
            --url "https://api.core.ac.uk/v4/search/affiliations?q=evidenceWorkIds:1234" \
            --header "Authorization: Bearer YOUR_API_KEY"
          ```


          Equivalent POST:


          ```

          {
            "q": "evidenceWorkIds:1234"
          }

          ```


          This query identifies Author–Institution relationships supported by Work 1234.


          #### Retrieve Affiliations with evidence Works


          GET


          ```

          curl --request GET \
            --url "https://api.core.ac.uk/v4/search/affiliations?q=_exists_:evidenceWorkIds" \
            --header "Authorization: Bearer YOUR_API_KEY"
          ```


          Equivalent POST:


          ```

          {
            "q": "_exists_:evidenceWorkIds"
          }

          ```


          This returns Affiliation records where `evidenceWorkIds` is not empty.


          #### Retrieve resolved Affiliations


          GET


          ```

          curl --request GET \
            --url "https://api.core.ac.uk/v4/search/affiliations?q=_exists_:institutionId" \
            --header "Authorization: Bearer YOUR_API_KEY"
          ```


          Equivalent POST:


          ```

          {
            "q": "_exists_:institutionId"
          }

          ```


          This returns Affiliation records linked to a canonical CORE Institution.


          #### Filter Affiliations by date


          Affiliations that started on or after January 1, 2021:


          GET


          ```

          GET /v4/search/affiliations?q=startDate>="2021-01-01"

          ```


          Equivalent POST:


          ```

          {
            "q": "startDate>=\"2021-01-01\""
          }

          ```


          Affiliations that ended before January 1, 2024:


          GET


          ```

          GET /v4/search/affiliations?q=endDate<"2024-01-01"

          ```


          Equivalent POST:


          ```

          {
            "q": "endDate<\"2024-01-01\""
          }

          ```


          Previous Affiliations for an Author whose known date range overlaps 2018 through 2021:


          GET


          ```

          GET /v4/search/affiliations?q=authorId:67890 AND startDate<="2021-12-31" AND endDate>="2018-01-01"

          ```


          Equivalent POST:


          ```

          {
            "q": "authorId:67890 AND startDate<=\"2021-12-31\" AND endDate>=\"2018-01-01\""
          }

          ```


          #### Search using multiple conditions


          G﻿ET:


          ```

          curl --request GET \
            --url 'https://api.core.ac.uk/v4/search/affiliations?q=institutionName:"Oxford"%20AND%20authorId:67890%20AND%20isCurrent:false&orderby=endDate:desc&select=affiliationId,institutionId,institutionName,department,startDate,endDate&limit=10&offset=0' \
            --header "Authorization: Bearer YOUR_API_KEY"
          ```


          Readable form:


          ```

          GET /v4/search/affiliations
              ?q=institutionName:"Oxford" AND authorId:67890 AND isCurrent:false
              &orderby=endDate:desc
              &select=affiliationId,institutionId,institutionName,department,startDate,endDate
              &limit=10
              &offset=0
          ```


          Equivalent POST:


          ```

          curl --request POST \
            --url "https://api.core.ac.uk/v4/search/affiliations" \
            --header "Authorization: Bearer YOUR_API_KEY" \
            --header "Content-Type: application/json" \
            --data '{
              "q": "institutionName:\"Oxford\" AND authorId:67890 AND isCurrent:false",
              "orderby": [
                "endDate:desc"
              ],
              "select": [
                "affiliationId",
                "institutionId",
                "institutionName",
                "department",
                "startDate",
                "endDate"
              ],
              "count": true,
              "limit": 10,
              "offset": 0
            }'
          ```


          This request:


          * searches for Oxford in institutionName;

          * restricts results to Author 67890;

          * returns only previous Affiliations;

          * orders matching records by most recent end date;

          * returns only the selected fields;

          * returns a maximum of ten records.


          Example search response:


          ```

          {
            "totalHits": 1,
            "results": [
              {
                "affiliationId": 901,
                "institutionId": 3201,
                "institutionName": "University of Oxford",
                "department": "Department of Computer Science",
                "startDate": "2018-01-01",
                "endDate": "2021-12-31"
              }
            ]
          }

          ```


          #### R﻿esponses


          | **Status** | **Description**                                                                                                 |

          | ---------- | --------------------------------------------------------------------------------------------------------------- |

          | 200        | The Affiliation search was completed successfully.                                                              |

          | 400        | The request contains an invalid query, unsupported field, invalid facet, or invalid response-control parameter. |

          | 401        | Authentication credentials are missing or invalid.                                                              |

          | 413        | The POST request body exceeds the permitted size.                                                               |

          | 429        | The API request limit has been exceeded.                                                                        |

          | 500        | An unexpected server error occurred.                                                                            |




          #### Ordering Affiliation results


          The shared Search documentation defines the complete orderby syntax.


          ##### Order Affiliations chronologically


          ```

          GET /v4/search/affiliations?q=authorId:67890&orderby=startDate:asc

          ```


          \

          P﻿OST representation:


          ```

          {
            "q": "authorId:67890",
            "orderby": [
              "startDate:asc"
            ]
          }

          ```


          This returns the known Affiliation history for the Author in chronological order.


          #### Order by multiple fields


          ```

          GET /v4/search/affiliations?orderby=authorId:asc,startDate:asc

          ```


          POST representation:


          ```

          {
            "orderby": [
              "authorId:asc",
              "startDate:asc"
            ]
          }

          ```


          \

          Results are first ordered by `authorId`. Affiliation records belonging to the same Author are then ordered by `startDate`.


          #### Order by most recently updated


          ```

          GET /v4/search/affiliations?orderby=updatedDate:desc

          ```


          POST representation:


          ```

          {
            "orderby": [
              "updatedDate:desc"
            ]
          }

          ```


          This returns the most recently updated Affiliation records first.


          #### Return selected fields


          G﻿ET


          ```

          curl --request GET \
            --url "https://api.core.ac.uk/v4/search/affiliations?q=authorId:67890&orderby=startDate:asc&select=affiliationId,institutionId,institutionName,startDate,endDate,isCurrent" \
            --header "Authorization: Bearer YOUR_API_KEY"
          ```


          Example response:


          ```

          {
            "results": [
              {
                "affiliationId": 901,
                "institutionId": 3201,
                "institutionName": "University of Oxford",
                "startDate": "2018-01-01",
                "endDate": "2021-12-31",
                "isCurrent": false
              },
              {
                "affiliationId": 902,
                "institutionId": 4501,
                "institutionName": "Massachusetts Institute of Technology",
                "startDate": "2022-01-01",
                "endDate": null,
                "isCurrent": true
              }
            ]
          }

          ```


          #### \


          Affiliation facets


          The facets parameter returns value buckets and counts for fields configured as facetable.


          G﻿ET:


          ```

          curl --request GET \
            --url "https://api.core.ac.uk/v4/search/affiliations?q=authorId:67890&facets=isCurrent,institutionId&count=true" \
            --header "Authorization: Bearer YOUR_API_KEY"
          ```


          Equivalent POST:


          ```

          curl --request POST \
            --url "https://api.core.ac.uk/v4/search/affiliations" \
            --header "Authorization: Bearer YOUR_API_KEY" \
            --header "Content-Type: application/json" \
            --data '{
              "q": "authorId:67890",
              "facets": [
                "isCurrent",
                "institutionId"
              ],
              "count": true,
              "limit": 0
            }'
          ```


          \

          Example response:


          ```

          {
            "totalHits": 3,
            "facets": {
              "isCurrent": [
                {
                  "value": false,
                  "count": 2
                },
                {
                  "value": true,
                  "count": 1
                }
              ],
              "institutionId": [
                {
                  "value": 3201,
                  "count": 1
                },
                {
                  "value": 4501,
                  "count": 1
                }
              ]
            },
            "results": [
              {
                "affiliationId": 901,
                "authorId": 67890,
                "institutionId": 3201,
                "institutionName": "University of Oxford",
                "isCurrent": false
              }
            ]
          }

          ```


          \

          Faceting by `institutionId` is technically possible, but it may produce a large number of buckets across the full Affiliation index. It is most useful when combined with a narrower filter.


          To return only facet counts without Affiliation records:


          ```

          GET /v4/search/affiliations?q=authorId:67890&facets=isCurrent&count=true&limit=0

          ```


          #### Result count


          Set count=true to include the total number of matching Affiliation records.


          GET:


          ```

          GET /v4/search/affiliations?q=authorId:67890&count=true

          ```


          Equivalent POST:


          ```

          {
            "q": "authorId:67890",
            "count": true
          }

          ```


          When count is omitted or set to false, totalHits may be omitted from the response.


          #### Paginate Affiliation results


          Use `limit` and `offset` to paginate through Affiliation results.


          A deterministic orderby expression should be used when retrieving multiple pages.


          \

          First page using GET:


          ```

          GET /v4/search/affiliations?q=institutionId:3201&orderby=authorId:asc&limit=20&offset=0

          ```


          S﻿econd page using GET:


          ```

          GET /v4/search/affiliations?q=institutionId:3201&orderby=authorId:asc&limit=20&offset=20

          ```


          First page using POST:


          ```

          {
            "q": "institutionId:3201",
            "orderby": [
              "authorId:asc"
            ],
            "limit": 20,
            "offset": 0
          }

          ```


          Second page using POST:


          ```

          {
            "q": "institutionId:3201",
            "orderby": [
              "authorId:asc"
            ],
            "limit": 20,
            "offset": 20
          }

          ```


          A deterministic orderby expression should be used when retrieving multiple pages.


          Example Affiliation history response:


          ```

          {
            "totalHits": 2,
            "results": [
              {
                "affiliationId": 901,
                "authorId": 67890,
                "rawAffiliation": "Dept of CS, University of Oxford",
                "department": "Department of Computer Science",
                "institutionId": 3201,
                "institutionName": "University of Oxford",
                "isCurrent": false,
                "startDate": "2018-01-01",
                "endDate": "2021-12-31",
                "evidenceWorkIds": [
                  1234,
                  428765
                ],
                "externalIds": [
                  {
                    "type": "orcid-put-code",
                    "value": "123456"
                  }
                ],
                "address": {
                  "city": "Oxford",
                  "countryCode": "GB"
                },
                "url": "https://www.cs.ox.ac.uk/",
                "createdDate": "2026-06-15T10:30:00Z",
                "updatedDate": "2026-07-01T14:20:00Z"
              },
              {
                "affiliationId": 902,
                "authorId": 67890,
                "rawAffiliation": "Massachusetts Institute of Technology, Cambridge, MA, USA",
                "department": null,
                "institutionId": 4501,
                "institutionName": "Massachusetts Institute of Technology",
                "isCurrent": true,
                "startDate": "2022-01-01",
                "endDate": null,
                "evidenceWorkIds": [
                  521340
                ],
                "externalIds": null,
                "address": {
                  "city": "Cambridge",
                  "region": "Massachusetts",
                  "countryCode": "US"
                },
                "url": null,
                "createdDate": "2026-06-15T10:30:00Z",
                "updatedDate": "2026-07-01T14:20:00Z"
              }
            ]
          }

          ```
      - divider: false
        border: false
        id: affiliations-api-relationship-oriented-endpoints
        title: Relationship-oriented endpoints
        descriptionAbout: >-
          #### Affiliations for an Institution


          ```

          GET /v4/institutions/{institutionId}/affiliations



          ```


          Retrieves Affiliation records linked to an Institution.


          Equivalent GET search:


          ```

          GET /v4/search/affiliations?q=institutionId:{institutionId}



          ```


          Equivalent POST search:


          ```

          {
            "q": "institutionId:{institutionId}"
          }



          ```


          This endpoint may return a large result set and should support:


          #### Authorships for an Affiliation


          ```

          GET /v4/affiliations/{affiliationId}/authorships



          ```


          Retrieves the Authorship records connected to an Affiliation through `Authorship_Affiliation`. 


          Example request:


          ```

          curl --request GET \
            --url "https://api.core.ac.uk/v4/affiliations/901/authorships?count=true&limit=10&offset=0" \
            --header "Authorization: Bearer YOUR_API_KEY"


          ```


          Example response:


          ```

          {
            "totalHits": 2,
            "results": [
              {
                "authorshipId": 987654,
                "workId": 1234,
                "authorId": 67890,
                "rawName": "Smith, Alice",
                "sequence": "first",
                "rank": 1,
                "isFirstNamedAuthor": true,
                "isCorresponding": true
              },
              {
                "authorshipId": 987700,
                "workId": 428765,
                "authorId": 67890,
                "rawName": "Smith, Alice",
                "sequence": "additional",
                "rank": 2,
                "isFirstNamedAuthor": false,
                "isCorresponding": false
              }
            ]
          }



          ```


          This endpoint returns Authorship records, not raw `Authorship_Affiliation` bridge records.


          An existing Affiliation with no linked Authorships returns 200 with an empty results array.


          #### Affiliations for an Authorship


          ```

          GET /v4/authorships/{authorshipId}/affiliations



          ```


          Retrieves Affiliation records connected to an Authorship through `Authorship_Affiliation`.


          This endpoint is documented primarily under the Authorship entity.


          #### Affiliations for an Author


          ```

          GET /v4/authors/{authorId}/affiliations



          ```


          Retrieves Affiliation records associated with an Author.
  - item: Institutions
    children:
      - divider: false
        border: false
        id: institutions-api-introduction
        title: Introduction
        descriptionAbout: >-
          The Institution entity represents universities, research
          organisations, healthcare organisations, companies, government bodies,
          funders, archives, and other organisations participating in the
          scholarly communication graph.


          Institutions may be associated with:


          * Authors through Affiliation records;

          * Data Providers that they operate or host;

          * other Institutions through hierarchical, historical, or related-organisation relationships;

          * Works, Projects, Grants, and other graph entities through their respective relationship entities.


          Institution metadata is primarily sourced from the Research Organization Registry (ROR). It may be enriched with identifiers, names, hierarchy information, publication metrics, and other information from other data sources.


          The diagram below illustrates the principal Institution relationships.
        images:
          - file: /images/docs-graph/institutions.png
        subTitle: An Institution may employ or host multiple Authors through Affiliation
          records. An Institution may also operate multiple Data Providers, such
          as institutional repositories or journal platforms.
      - divider: false
        border: false
        id: institutions-api-data-structure
        title: Data structure
        descriptionAbout: >-
          The tables below describe the top-level fields in the CORE Graph
          metadata schema for the Institution entity.


          #### Identifiers


          The identifiers properties contain the internal CORE identifier for the Institution entity and identifiers from external organisation identifier systems.


          | **Attribute** | **Type**  | **Example value**                   | **Description**                                                                                                   | **Source**     |

          | ------------- | --------- | ----------------------------------- | ----------------------------------------------------------------------------------------------------------------- | -------------- |

          | institutionId | integer   | `1256`                              | CORE internal identifier for the Institution entity.                                                              | CORE           |

          | rorId         | string    | `"https://ror.org/05mzfcs16"`       | ROR identifier for the Institution, when available.                                                               | ROR            |

          | openalexId    | string    | `"https://openalex.org/I123456789"` | OpenAlex identifier for the Institution, when available.                                                          | OpenAlex       |

          | gridId        | string\[] | `["grid.10837.3d"]`                 | GRID identifiers associated with the Institution, when available.                                                 | ROR            |

          | isniId        | string\[] | `["0000 0000 9606 9301"]`           | ISNI identifiers associated with the Institution, when available.                                                 | ROR            |

          | wikidataId    | string\[] | `["Q2413375"]`                      | Wikidata identifiers associated with the Institution, when available.                                             | ROR            |

          | ofrId         | string\[] | `["100008509"]`                     | Crossref Open Funder Registry identifiers associated with the Institution. Formerly known as FundRef identifiers. | ROR / Crossref |


          #### Names


          Names for the organisation include acronyms, alternative names, former names, and the preferred display name. Name variants may include a two-letter ISO 639 language code when the language is known.


          | **Attribute**   | **Type**  | **Example value**                           | **Description**                                                                                                               | **Source**     |

          | --------------- | --------- | ------------------------------------------- | ----------------------------------------------------------------------------------------------------------------------------- | -------------- |

          | displayName     | string    | `"The Open University"`                     | Preferred display name for the Institution.                                                                                   | ROR / OpenAlex |

          | displayNameLang | string    | `"en"`                                      | ISO 639 language code for the preferred display name, when known.                                                             | ROR            |

          | acronym         | string    | `"OU"`                                      | Preferred acronym or short name for the Institution, when available.                                                          | ROR            |

          | altNames        | string\[] | `["Y Brifysgol Agored", "Open University"]` | Alternative names, multilingual labels, aliases, former names, and other non-preferred names associated with the Institution. | ROR            |


          #### Location


          Location information may include continent, country, country subdivision, coordinates, and city. ROR location information is derived from GeoNames.


          | **Attribute** | **Type** | **Example value**  | **Description**                                                                            | **Source** |

          | ------------- | -------- | ------------------ | ------------------------------------------------------------------------------------------ | ---------- |

          | countryCode   | string   | `"GB"`             | ISO 3166-1 alpha-2 country code for the Institution.                                       | ROR        |

          | countryName   | string   | `"United Kingdom"` | Human-readable country name corresponding to `countryCode`.                                | ROR        |

          | continentCode | string   | `"EU"`             | Code representing the continent in which the Institution is located.                       | ROR        |

          | continentName | string   | `"Europe"`         | Human-readable name of the continent in which the Institution is located.                  | ROR        |

          | city          | string   | `"Milton Keynes"`  | City associated with the Institution, when known.                                          | OpenAlex   |

          | regionCode    | string   | `"ENG"`            | Code associated with the first-level country subdivision.                                  | ROR        |

          | region        | string   | `"England"`        | Region, state, province, or other first-level subdivision associated with the Institution. | OpenAlex   |

          | latitude      | number   | `52.04172`         | Latitude of the Institution’s location, when available.                                    | ROR        |

          | longitude     | number   | `-0.75583`         | Longitude of the Institution’s location, when available.                                   | ROR        |


          #### Links


          The Institution record may include its primary website, recognised domains, and additional external links.


          | **Attribute**   | **Type**  | **Example value**                                                                       | **Description**                                                               | **Source** |

          | --------------- | --------- | --------------------------------------------------------------------------------------- | ----------------------------------------------------------------------------- | ---------- |

          | websiteUrl      | string    | `"https://www.open.ac.uk/"`                                                             | Official website URL of the Institution.                                      | ROR        |

          | domains         | string\[] | `["open.ac.uk"]`                                                                        | Internet domains known to belong to the Institution.                          | ROR        |

          | additionalLinks | object\[] | `[{"type": "wikipedia", "value": "https://en.wikipedia.org/wiki/The_Open_University"}]` | Additional links associated with the Institution, such as its Wikipedia page. | ROR        |


          #### Repositories


          Repositories hosted by the Institution are represented using information from the CORE Data Provider entity.


          | **Property**            | **Type**  | **Example value**           | **Description**                                                                        | **Source** |

          | ----------------------- | --------- | --------------------------- | -------------------------------------------------------------------------------------- | ---------- |

          | dataProviderId          | integer   | `86`                        | Unique CORE identifier for the Data Provider.                                          | CORE       |

          | dataProviderName        | string    | `"Open Research Online"`    | Name of the repository or Data Provider.                                               | CORE       |

          | hostOrganisationId      | string    | `"1256"`                    | CORE identifier of the hosting Institution.                                            | CORE       |

          | hostOrganisationName    | string    | `"The Open University, UK"` | Name of the hosting Institution.                                                       | CORE       |

          | hostOrganisationLineage | string\[] | `["1256"]`                  | Ordered identifiers representing the hierarchical lineage of the hosting organisation. | CORE       |


          #### Institution type and status


          These properties describe the Institution’s classifications and operational state.


          | **Property** | **Type**  | **Example value**         | **Description**                                                                               | **Source** |

          | ------------ | --------- | ------------------------- | --------------------------------------------------------------------------------------------- | ---------- |

          | types        | string\[] | `["education", "funder"]` | One or more normalised Institution types obtained from ROR or predicted by the CORE ML model. | ROR / CORE |

          | status       | string    | `"active"`                | Current status of the Institution: `active`, `inactive`, or `withdrawn`.                      | ROR        |


          Supported Institution types may include:


          | **Value**  | **Description**                                         |

          | ---------- | ------------------------------------------------------- |

          | education  | University, college, or other educational organisation. |

          | funder     | Organisation that funds research.                       |

          | healthcare | Hospital, healthcare provider, or medical organisation. |

          | company    | Commercial organisation.                                |

          | archive    | Archive, library, museum, or similar organisation.      |

          | nonprofit  | Nonprofit organisation.                                 |

          | government | Government organisation or agency.                      |

          | facility   | Research facility or research infrastructure.           |

          | other      | Organisation not represented by another category.       |


          #### Relationships


          An Institution may have one or more relationships with other organisations. Supported relationships include parent, child, related, predecessor, and successor.


          | **Property**     | **Type**  | **Example value**                | **Description**                                                    | **Source**     |

          | ---------------- | --------- | -------------------------------- | ------------------------------------------------------------------ | -------------- |

          | institutionId    | integer   | `1256`                           | CORE identifier of the related Institution, when resolved.         | CORE           |

          | rorId            | string    | `"https://ror.org/01c3xc117"`    | ROR identifier of the related Institution.                         | OpenAlex / ROR |

          | displayName      | string    | `"University of Michigan–Flint"` | Display name of the related Institution.                           | OpenAlex / ROR |

          | countryCode      | string    | `"US"`                           | ISO 3166-1 alpha-2 country code of the related Institution.        | OpenAlex       |

          | types            | string\[] | `["education", "funder"]`        | Types assigned to the related Institution.                         | OpenAlex       |

          | relationshipType | string    | `"related"`                      | Type of relationship between the current and related Institutions. | OpenAlex / ROR |


          Supported relationship types are:


          | **Value**   | **Description**                                                                           | **Source** |

          | ----------- | ----------------------------------------------------------------------------------------- | ---------- |

          | parent      | The related Institution is a parent organisation of the current Institution.              | ROR        |

          | child       | The related Institution is a child or subsidiary organisation of the current Institution. | ROR        |

          | related     | The Institutions have a non-hierarchical relationship.                                    | ROR        |

          | predecessor | The related Institution historically preceded the current Institution.                    | ROR        |

          | successor   | The related Institution succeeded or replaced the current Institution.                    | ROR        |


          #### Dates


          These properties describe when the record was created or modified and when the Institution was established.


          | **Property**    | **Type** | **Example value** | **Description**                                             | **Source** |

          | --------------- | -------- | ----------------- | ----------------------------------------------------------- | ---------- |

          | createdAt       | string   | `"2018-11-14"`    | Date when the Institution record was originally created.    | CORE       |

          | updatedAt       | string   | `"2024-12-11"`    | Date when the Institution record was most recently updated. | CORE       |

          | establishedYear | integer  | `1966`            | Year in which the Institution was established.              | ROR        |


          ### Topics


          Topics describe the research areas associated with the Institution. Each topic may include its position within a topic classification hierarchy.


          | **Property** | **Type** | **Example value**                                         | **Description**                                                                | **Source**      |

          | ------------ | -------- | --------------------------------------------------------- | ------------------------------------------------------------------------------ | --------------- |

          | topicId      | string   | `"23"`                                                    | CORE identifier for the topic.                                                 | CORE            |

          | displayName  | string   | `"Particle physics theoretical and experimental studies"` | Display name of the topic.                                                     | CORE            |

          | count        | integer  | `6107`                                                    | Number of works or associations contributing to the topic for the Institution. | CORE            |

          | score        | number   | `1`                                                       | Relevance score for the topic’s association with the Institution.              | CORE            |

          | subfieldId   | string   | `"67"`                                                    | Identifier of the subfield to which the topic belongs.                         | CORE            |

          | subfieldName | string   | `"Nuclear and High Energy Physics"`                       | Name of the subfield associated with the topic.                                | CORE / OpenAlex |

          | fieldId      | string   | `"96"`                                                    | CORE identifier for the broader field.                                         | CORE            |

          | fieldName    | string   | `"Physics and Astronomy"`                                 | Name of the broader field associated with the topic.                           | CORE / OpenAlex |

          | domainId     | string   | `"56"`                                                    | CORE identifier for the highest-level domain.                                  | CORE            |

          | domainName   | string   | `"Physical Sciences"`                                     | Name of the highest-level domain associated with the topic.                    | CORE / OpenAlex |


          #### Citation metrics


          Citation metrics provide yearly publication and citation statistics for the Institution.


          | **Property** | **Type** | **Example value** | **Description**                                                                       | **Source** |

          | ------------ | -------- | ----------------- | ------------------------------------------------------------------------------------- | ---------- |

          | year         | integer  | `2024`            | Year for which the metrics are reported.                                              | OpenAlex   |

          | worksCount   | integer  | `24125`           | Total number of Works associated with the Institution in that year.                   | OpenAlex   |

          | oaWorksCount | integer  | `16994`           | Number of open-access Works associated with the Institution in that year.             | OpenAlex   |

          | citedByCount | integer  | `123548`          | Total number of citations received by the Institution’s Works published in that year. | OpenAlex   |





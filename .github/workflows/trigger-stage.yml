name: Trigger Stage Deploy

on:
  push:
    branches:
      - main

jobs:
  trigger-dashboard-stage:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger dashboard::stage deploy
        run: |
          curl -X POST \
            -H "Authorization: token ${{ secrets.GH_PAT }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/oacore/dashboard/dispatches \
            -d '{"event_type": "trigger-stage-deploy"}'

      - name: Trigger about::stage AKS deploy
        run: |
          curl -X POST \
            -H "Authorization: token ${{ secrets.GH_PAT }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/oacore/about/dispatches \
            -d '{"event_type": "CONTENT-repo:cross-repo trigger deployment stage"}'

main:
  - title: 1. Introduction
    id: introduction
    content: >
      CORE: COnnecting REpositories Ltd ("CORE") is a small UK research
      infrastructure organisation dedicated to supporting open science through
      the provision of trusted scholarly data, services and research
      infrastructure.


      CORE is committed to providing a working environment in which all
      individuals are treated fairly, with dignity and respect, regardless of
      sex, gender or other protected characteristics. We believe that equal
      opportunities support better decision-making, strengthen innovation and
      enable us to attract and retain talented people.


      As a small organisation, CORE seeks to ensure that its employment
      practices are fair, transparent and based solely on merit. This Gender
      Equality Plan sets out the principles and measures through which CORE
      promotes equality within the organisation.


      CORE is a small organisation and the measures set out in this plan are
      proportionate to its current size. As the organisation grows, this plan
      will be reviewed and updated to reflect evolving organisational needs and
      good practice.
  - title: 2. Principles
    id: principles
    content: >
      CORE is committed to:


      * providing equal opportunities in recruitment, employment and career
        development;

      * ensuring that employment decisions are based on merit, skills,
        experience and organisational needs;

      * maintaining a respectful, inclusive and professional working
        environment;

      * preventing discrimination, harassment and victimisation;

      * supporting flexible ways of working where operationally appropriate;

      * complying with all applicable equality legislation.
  - title: 3. Recruitment and Career Development
    id: recruitment
    content: >
      CORE aims to recruit the best candidates through fair and transparent
      recruitment processes.


      Where practical, CORE will:


      * advertise vacancies openly;

      * use objective selection criteria;

      * assess candidates consistently against the requirements of each role;

      * encourage applications from suitably qualified individuals from diverse
        backgrounds.


      Appointments, promotions and professional development opportunities will
      be based solely on merit, performance and organisational requirements.
  - title: 4. Working Environment
    id: working-environment
    content: >
      CORE is committed to maintaining a workplace where everyone is treated
      with professionalism and respect.


      The organisation does not tolerate:


      * discrimination;

      * bullying;

      * harassment;

      * victimisation.


      Employees are encouraged to raise concerns at an early stage, and any
      complaints will be considered promptly, fairly and confidentially.
  - title: 5. Work-Life Balance
    id: work-life-balance
    content: >
      Recognising that flexible working arrangements can support equality of
      opportunity, CORE will, where operationally feasible:


      * consider requests for flexible working;

      * support reasonable work-life balance;

      * seek practical solutions that meet both organisational and individual
        needs.
  - title: 6. Leadership and Decision-Making
    id: leadership
    content: >
      CORE aims to ensure that leadership and management decisions are made
      fairly and transparently.


      As the organisation develops, CORE will seek to promote diversity of
      perspectives in leadership, governance and recruitment activities, while
      continuing to appoint individuals based on merit.
  - title: 7. Pay and Employment Conditions
    id: pay
    content: >
      CORE is committed to providing equitable pay and employment conditions for
      employees undertaking comparable work, taking account of:


      * responsibilities;

      * qualifications;

      * experience;

      * performance.


      The organisation will periodically review its employment practices to help
      ensure fairness and consistency.
  - title: 8. Monitoring and Review
    id: monitoring
    content: >
      Given the current size of the organisation, CORE will monitor
      implementation of this plan through periodic management review rather than
      formal statistical reporting.


      As the organisation grows, CORE will consider introducing proportionate
      monitoring measures, including where appropriate:


      * workforce composition;

      * recruitment outcomes;

      * promotion and progression;

      * training participation.


      The plan will be reviewed annually and updated as necessary.
  - title: 9. Responsibility
    id: responsibility
    content: >
      Overall responsibility for implementation of this Gender Equality Plan
      rests with the Chief Executive Officer.


      All employees share responsibility for contributing to an inclusive,
      respectful and professional working environment.
  - title: Approval
    id: approval
    content: >
      Approved by the Board of Directors of CORE: COnnecting REpositories Ltd.


      Version: **1.0**


      Approved: **July 2026**



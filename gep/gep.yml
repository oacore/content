main:
  - title: 1. Introduction
    id: introduction
    content: >
      CORE: COnnecting REpositories Ltd ("CORE") is a UK not-for-profit research
      infrastructure organisation dedicated to supporting open science through
      trusted scholarly data, services and digital infrastructure.


      CORE is committed to providing a working environment in which all
      individuals are treated fairly, with dignity and respect, regardless of
      sex, gender or any other protected characteristic recognised under
      applicable law.


      We believe that equality of opportunity strengthens innovation, supports
      better decision-making and enables us to attract, develop and retain
      talented people.


      As a newly established organisation, CORE's policies and governance
      arrangements are developing alongside its growth. This Gender Equality Plan
      establishes the organisation's commitment to equality and sets out
      proportionate measures appropriate to its current size. The plan will be
      reviewed regularly and updated as the organisation develops.


      Given the nature of CORE's activities as a provider of scholarly research
      infrastructure and digital services, the integration of sex or gender
      analysis into research content is not generally applicable across the
      organisation's activities. Where CORE undertakes or participates in
      research projects for which consideration of sex or gender is scientifically
      relevant, these aspects will be addressed as appropriate within the design
      and conduct of those individual projects and in accordance with applicable
      funder requirements.
  - title: 2. Objectives
    id: objectives
    content: >
      The objectives of this Gender Equality Plan are to:


      * promote equality of opportunity across all employment practices;

      * support fair and transparent recruitment and career development;

      * foster an inclusive, respectful and professional working environment;

      * prevent discrimination, harassment and victimisation;

      * support work-life balance where operationally feasible;

      * monitor implementation of this plan through proportionate data collection
        and review;

      * raise awareness of equality and inclusive working practices across the
        organisation.
  - title: 3. Recruitment and Career Development
    id: recruitment
    content: >
      CORE is committed to recruiting and developing staff solely on the basis of
      merit, skills, experience and organisational requirements.


      Where appropriate, CORE will:


      * advertise vacancies openly;

      * apply objective selection criteria;

      * assess candidates consistently against role requirements;

      * encourage applications from suitably qualified individuals from diverse
        backgrounds;

      * provide equal access to professional development opportunities.


      Appointments, promotions and remuneration decisions will be based on
      objective business considerations and individual merit.
  - title: 4. Inclusive Working Environment
    id: working-environment
    content: >
      CORE is committed to maintaining a workplace in which everyone is treated
      with professionalism, fairness and respect.


      The organisation has zero tolerance for discrimination, bullying,
      harassment, including sexual harassment, victimisation, and any other
      inappropriate conduct.


      Employees are encouraged to raise concerns promptly. Any concerns will be
      handled fairly, confidentially and in accordance with applicable employment
      policies and legislation. Where appropriate, CORE will take reasonable steps
      to prevent recurrence and to promote a safe and respectful working
      environment.
  - title: 5. Work-Life Balance
    id: work-life-balance
    content: >
      CORE recognises that flexible working arrangements can contribute to
      equality of opportunity.


      Subject to operational requirements, the organisation will:


      * consider requests for flexible working;

      * support reasonable work-life balance;

      * seek practical arrangements that accommodate both organisational and
        individual needs.
  - title: 6. Leadership and Decision-Making
    id: leadership
    content: >
      CORE is committed to ensuring that leadership and management decisions are
      made fairly, transparently and objectively.


      As the organisation grows, CORE will seek to promote diversity of
      perspectives within leadership, governance and recruitment activities while
      continuing to appoint individuals on the basis of merit and organisational
      needs.
  - title: 7. Fair Pay and Employment Conditions
    id: pay
    content: >
      CORE is committed to providing equitable employment conditions.


      Pay decisions will take account of:


      * responsibilities;

      * qualifications;

      * experience;

      * performance;

      * market conditions where relevant.


      The organisation will periodically review its employment practices to
      promote fairness and consistency.
  - title: 8. Resources and Responsibility
    id: resources
    content: >
      Responsibility for implementing this Gender Equality Plan rests with the
      Chief Executive Officer.


      The Board of Directors has adopted this plan and supports its
      implementation across the organisation.


      Given CORE's current size, implementation forms part of normal management
      responsibilities and does not require a dedicated organisational unit.
      Appropriate management time and organisational resources will be allocated
      to implementing, monitoring and periodically reviewing the plan.


      Where appropriate, CORE will seek external advice on equality matters to
      support good practice and compliance with applicable legislation.
  - title: 9. Data Collection and Monitoring
    id: monitoring
    content: >
      CORE will monitor implementation of this plan through proportionate data
      collection and management review.


      The organisation will maintain sex-disaggregated information relating to
      its workforce, including, where applicable:


      * recruitment;

      * workforce composition;

      * promotions;

      * departures;

      * participation in training.


      Given the organisation's current size, formal statistical reporting is
      neither practical nor meaningful. Instead, management will review relevant
      information periodically and at least every two years to assess whether any
      actions under this plan require adjustment.


      The Gender Equality Plan itself will be reviewed annually and updated where
      necessary.
  - title: 10. Awareness and Training
    id: awareness
    content: >
      CORE recognises that awareness contributes to maintaining an inclusive
      working environment.


      The organisation will ensure that employees, managers and individuals
      involved in recruitment receive appropriate information or training on
      equality, diversity and inclusive working practices.


      For a small organisation, this may include:


      * induction materials;

      * internal briefings;

      * externally provided guidance or training where appropriate.


      Training will include awareness of fair recruitment practices and
      unconscious bias where relevant.
  - title: 11. Review
    id: review
    content: >
      This Gender Equality Plan will normally be reviewed annually by management
      and formally reviewed by the Board of Directors at least every two years,
      or sooner where organisational growth or changes in legislation make this
      appropriate.


      Updated versions of this plan will be published on the CORE website.
  - title: Approval
    id: approval
    content: >
      Approved by the Board of Directors of CORE: COnnecting REpositories Ltd.


      Version: **1.0**


      Approved: **July 2026**


      Next review: **August 2027**
